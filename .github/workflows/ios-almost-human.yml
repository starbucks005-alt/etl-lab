name: iOS - Almost Human

# See ios-good-company.yml for the full reasoning on every step below --
# same pipeline, just pointed at this app's own folder and secrets.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: almost-human-ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS deps
        run: npm ci

      - name: Sync Capacitor config into the Xcode project
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: almost-human-ios/ios/App
        run: pod install

      - name: Write App Store Connect API key
        run: |
          mkdir -p $HOME/private_keys
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 --decode > $HOME/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.ASC_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ASC_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary-ci-keychain
        run: |
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import $RUNNER_TEMP/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.ASC_PROFILE_ALMOST_HUMAN_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          UUID=$(grep -a -A1 UUID $RUNNER_TEMP/profile.mobileprovision | grep -io '[-A-F0-9]\{36\}')
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Archive
        working-directory: almost-human-ios/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive

      - name: Export IPA
        working-directory: almost-human-ios/ios/App
        # No destination=upload, no -authenticationKeyPath: see
        # ios-good-company.yml's own comment on this step.
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>9HPF7YA3P3</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.emergingtechlab.almosthuman</key>
              <string>Almost Human App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_API_KEY_ISSUER_ID }}

      - name: Upload to App Store Connect via fastlane pilot
        # fastlane pilot's CLI has no --api_key_id/--api_issuer_id flags,
        # and key_filepath is rejected too: see ios-good-company.yml's own
        # comment on this step.
        run: |
          gem install fastlane --no-document
          KEY_ID='${{ secrets.ASC_API_KEY_ID }}' \
          ISSUER_ID='${{ secrets.ASC_API_KEY_ISSUER_ID }}' \
          KEY_PATH="$HOME/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8" \
          OUT_PATH="$RUNNER_TEMP/asc_api_key.json" \
          ruby -rjson -e '
            File.write(ENV["OUT_PATH"], JSON.generate({
              key_id: ENV["KEY_ID"],
              issuer_id: ENV["ISSUER_ID"],
              key: File.read(ENV["KEY_PATH"]),
              in_house: false
            }))
          '
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --ipa "$RUNNER_TEMP/export/App.ipa" \
            --app_identifier "com.emergingtechlab.almosthuman" \
            --skip_waiting_for_build_processing true
