name: iOS - Good Company

# Manual for now, on purpose: this uploads a real build to App Store Connect
# every time it runs, so it should not fire on every push while the pipeline
# is still being proven out. Switch to a push trigger once a first build has
# gone through cleanly.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: good-company-ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS deps
        run: npm ci

      - name: Sync Capacitor config into the Xcode project
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: good-company-ios/ios/App
        run: pod install

      # The App Store Connect API key never touches disk in plain text outside
      # this one step -- written from a secret, used, and nothing else reads
      # it. Same trust boundary as the Android keystore file already in this
      # repo, just Apple's own equivalent.
      - name: Write App Store Connect API key
        # base64 in, decoded here -- see ios-almost-human.yml's own comment
        # for why: a raw PEM secret can survive copy-paste into GitHub's UI
        # looking identical on screen with its line endings quietly changed.
        run: |
          mkdir -p $HOME/private_keys
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 --decode > $HOME/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      # MANUAL SIGNING, added 2026-09-02, replacing -allowProvisioningUpdates.
      # Automatic signing kept insisting on an iOS App Development profile
      # ("Your team has no devices from which to generate a provisioning
      # profile") no matter what else changed -- configuration, destination,
      # the shared scheme file, an explicit signing identity. The account
      # genuinely has zero registered devices, which a development profile
      # needs and a plain App Store distribution profile never does. Real,
      # manually created distribution certificate + provisioning profile
      # sidesteps that CLI bootstrap behavior entirely rather than fighting
      # it further. A temporary keychain keeps the imported certificate
      # scoped to this one job; nothing persists past it on a fresh runner.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.ASC_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ASC_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary-ci-keychain
        run: |
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import $RUNNER_TEMP/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.ASC_PROFILE_GOOD_COMPANY_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          UUID=$(grep -a -A1 UUID $RUNNER_TEMP/profile.mobileprovision | grep -io '[-A-F0-9]\{36\}')
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Archive
        working-directory: good-company-ios/ios/App
        # No signing build-setting overrides here on purpose, added
        # 2026-09-02: passing them on the xcodebuild command line applies
        # them to EVERY target in the workspace, including the Pods
        # library targets (CapacitorCordova, Capacitor, Pods-App), which
        # don't take a provisioning profile at all -- "CapacitorCordova
        # does not support provisioning profiles, but provisioning
        # profile ... has been manually specified." Manual signing is set
        # in project.pbxproj on the App target's Release config only.
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive

      - name: Export IPA
        working-directory: good-company-ios/ios/App
        # No destination=upload, no -authenticationKeyPath: both of
        # Xcode's own upload mechanisms are broken on this Xcode 26.6
        # image. destination=upload fails with "Failed to Use Accounts"
        # regardless of teamID/-allowProvisioningUpdates; an explicit
        # -authenticationKeyPath fails with keyPathInvalid even with
        # confirmed-correct key content -- that flag itself is the bug,
        # not anything about the file. Plain export + ID/IssuerID-only
        # auto-discovery is the one combination that has reliably worked
        # every time. Upload now goes through fastlane's `pilot` below
        # instead of xcodebuild or altool, added 2026-09-02: fastlane
        # reads the API key itself in Ruby rather than going through the
        # DVTFoundation.JWT validation that's been failing.
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>9HPF7YA3P3</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.emergingtechlab.goodcompany</key>
              <string>Good Company App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_API_KEY_ISSUER_ID }}

      - name: Upload to App Store Connect via fastlane pilot
        # fastlane pilot's CLI has no --api_key_id/--api_issuer_id flags
        # (that was a wrong guess at its syntax) -- it wants one
        # --api_key_path pointing to a JSON file in fastlane's own
        # App Store Connect API key format instead.
        #
        # key_filepath rejected 2026-09-02: fastlane's own JSON loader
        # (Spaceship::ConnectAPI::Token.from_json_file) errored "missing
        # field(s): key" -- this fastlane version only accepts the actual
        # key content under "key", not a path to it. A Ruby one-liner
        # builds the JSON so the multi-line PEM content gets escaped
        # correctly, which a hand-written heredoc can't safely do.
        #
        # explicit UTF-8 + scrub added 2026-09-02: File.read with no
        # encoding given errored "source sequence is illegal/malformed
        # utf-8" out of JSON.generate -- the runner's default external
        # encoding isn't UTF-8 (no LANG set), so a plain-ASCII PEM file
        # was still getting tagged with an encoding JSON.generate won't
        # trust. Reading as UTF-8 explicitly and scrubbing any stray
        # bytes removes that ambiguity.
        #
        # openssl pkey conversion added 2026-09-02: the JSON built fine,
        # but OpenSSL::PKey::EC#initialize itself then errored "string
        # contains null byte" -- a known Ruby/OpenSSL quirk where
        # OpenSSL::PKey::EC (which fastlane's spaceship code calls
        # directly, not the format-detecting OpenSSL::PKey.read) doesn't
        # reliably parse Apple's PKCS8-wrapped "BEGIN PRIVATE KEY" .p8
        # format and needs the older SEC1 "BEGIN EC PRIVATE KEY" form
        # instead. `openssl ec` itself turned out to be the wrong tool for
        # that conversion -- it expects its INPUT to already be SEC1, not
        # PKCS8, so it failed with "unable to load Key" on the real .p8.
        # `openssl pkey` is the PKCS8-aware command; -traditional makes it
        # write SEC1 output.
        #
        # Homebrew openssl added 2026-09-02: `openssl pkey` then prompted
        # "Enter pass phrase for PKCS12 import pass phrase" and failed --
        # macOS's system /usr/bin/openssl is actually Apple's LibreSSL,
        # not real OpenSSL, and mishandles this plain unencrypted PKCS8
        # key as if it needed a PKCS12 passphrase. fastlane's own Ruby
        # toolchain is already Homebrew-based on this runner, so real
        # OpenSSL 3.x is available there too.
        run: |
          gem install fastlane --no-document
          echo "--- one-time diagnostic ---"
          OPENSSL_BIN="/opt/homebrew/opt/openssl@3/bin/openssl"
          if [ ! -x "$OPENSSL_BIN" ]; then
            echo "Homebrew openssl not found at $OPENSSL_BIN, falling back"
            OPENSSL_BIN="openssl"
          fi
          echo "Using: $OPENSSL_BIN"
          "$OPENSSL_BIN" version
          which openssl
          openssl version
          echo "--- key file ---"
          wc -c "$HOME/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8"
          head -c 40 "$HOME/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8"; echo
          tail -c 40 "$HOME/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8"; echo
          echo "--- pkey dry parse ---"
          "$OPENSSL_BIN" pkey -in "$HOME/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8" -noout -text < /dev/null || true
          echo "--- end diagnostic ---"
          "$OPENSSL_BIN" pkey -traditional \
            -in "$HOME/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8" \
            -out "$RUNNER_TEMP/AuthKey_traditional.pem" < /dev/null
          KEY_ID='${{ secrets.ASC_API_KEY_ID }}' \
          ISSUER_ID='${{ secrets.ASC_API_KEY_ISSUER_ID }}' \
          KEY_PATH="$RUNNER_TEMP/AuthKey_traditional.pem" \
          OUT_PATH="$RUNNER_TEMP/asc_api_key.json" \
          ruby -rjson -e '
            File.write(ENV["OUT_PATH"], JSON.generate({
              key_id: ENV["KEY_ID"],
              issuer_id: ENV["ISSUER_ID"],
              key: File.read(ENV["KEY_PATH"], encoding: "UTF-8").scrub,
              in_house: false
            }))
          '
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --ipa "$RUNNER_TEMP/export/App.ipa" \
            --app_identifier "com.emergingtechlab.goodcompany" \
            --skip_waiting_for_build_processing true
