// ── LIVE BANTER POLL ──────────────────────────────────────────────────────
// etl-banter-cron writes a new Haiku-generated message every 2 minutes.
// We poll etl-banter-feed every 10 s and append anything newer than lastTs.
var lastBanterTs = 0;
function pollBanter() {
  fetch('/.netlify/functions/etl-banter-feed', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      var all = d.messages || [];
      var nowMs = Date.now();
      // Staleness watchdog: if newest message is 12+ min behind now, kick the cron
      var newestTs = all.reduce(function(mx,m){ return Math.max(mx, m.ts||0); }, 0);
      if (newestTs > 0 && nowMs - newestTs > 12 * 60 * 1000) {
        fetch('/.netlify/functions/etl-banter-cron', {cache:'no-store'}).catch(function(){});
      }
      // Only reveal messages whose reveal time has arrived (ts <= now); future-queued lines stay hidden
      var fresh = all.filter(function(m){ return (m.ts||0) > lastBanterTs && (m.ts||0) <= nowMs; });
      // First load: cap to 8 most recent so old cached messages don't flood the view
      if (lastBanterTs === 0 && fresh.length > 8) fresh = fresh.slice(0, 8);
      // process oldest-of-fresh first; prepend each so newest lands at top
      fresh.slice().reverse().forEach(function(m){
        appendMsg(buildMsg(m.agent||'Staff', m.role||'', m.time||'', m.message||''));
        if((m.ts||0) > lastBanterTs) lastBanterTs = m.ts;
      });
      if (fresh.length > 0) feed.scrollTop = 0;
    })
    .catch(function(){})
    .finally(function(){ setTimeout(pollBanter, 10000); });
}

// ── ETL CLOCK ────────────────────────────────────────────────────────────────
(function(){
  function updateClock(){
    var el = document.getElementById('bc-etl-clock');
    if(!el) return;
    var now = new Date();
    var et  = new Date(now.toLocaleString('en-US', {timeZone:'America/New_York'}));
    var hh  = et.getHours() % 12 || 12;
    var mm  = String(et.getMinutes()).padStart(2,'0');
    var ampm = et.getHours() >= 12 ? 'PM' : 'AM';
    el.textContent = hh + ':' + mm + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 60000);
})();
