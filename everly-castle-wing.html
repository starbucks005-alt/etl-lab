<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everly Castle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   A wing of Everly Castle. One princess, one subject, one thing to do.

   Everything on this page assumes a child who cannot read a word of it. The
   three rules that shaped it:

   1. SHE NEVER READS. The princess's line is spoken. The transcript on screen
      is for the grown-up sitting next to her, and it is deliberately small and
      quiet so it does not compete with the picture.

   2. SHE NEVER TYPES. She answers by tapping one of two or three big emoji.
      The microphone is a bonus on top of that, never the way through, for the
      reason documented at listen() below.

   3. SHE IS NEVER TOLD SHE FAILED. There is no wrong answer, no error message,
      no "I did not understand", no empty state. Every path forward is a warm
      line from the princess, including the ones that only exist because the
      network fell over.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  /* Straight from ETL's own sheet, not invented here: ink, stamp blue, blue
     tint and the Greylander gold. An earlier pass at this used a parchment
     palette that belonged to no ETL product and was simply wrong.

     Blue is also what the artwork is actually made of. Nerida's Aegean,
     Zephyra's sky, Neva's ice and Lenora's night sky are all this family, and
     every nameplate in every picture is brass. The UI now agrees with its own
     cast instead of arguing with it.

     It stays LIGHT. A four-year-old gets a bright day-sky, not a dark theme,
     and the portraits supply the saturation. */
  --ink:#16202b;          /* ETL ink */
  --ink-soft:#51637a;
  --blue:#28527a;         /* ETL stamp blue */
  --blue-lit:#7fa8c9;     /* ETL blue tint */
  --sky1:#eaf3fa;
  --sky2:#cfe3f2;
  --sky3:#aecde6;
  --card:#ffffff;
  --gold:#c9a23f;         /* ETL gold */
  --gold-lit:#e6c877;
  --rule:#bcd4e6;
  --stone:#dce9f4;
  --shadow:0 8px 22px rgba(22,32,43,.16);
  --shadow-deep:0 14px 34px rgba(22,32,43,.26);
  --serif:Spectral,Georgia,'Iowan Old Style',Palatino,serif;
}
/* ── The child picks her castle's colour ───────────────────────────────────
   Chosen at the crest picker, the moment she says who she is, and remembered
   against her own profile. Sisters get different castles out of the same
   install, which is the whole point of "Charlotte's Castle" being hers.

   EVERY COLOUR HERE IS A REAL ETL COLOUR, wearing a name a four-year-old would
   actually say. Dr. O's call, and it is the right one: the brand stays exactly
   itself underneath, and the child gets Mermaid Green instead of #35806f. An
   earlier pass invented its own hexes, which drifted from ETL for no gain.

     Butterfly Blue  #28527a  stamp blue      (default)
     Mermaid Green   #35806f  evergreen
     Petal Pink      #e8756b  ETL YOU Coral Reef
     Sunshine Yellow #c9a23f  Greylander gold
     Snowflake White #f4f3ee  paper
     Starry Night    #10161d  night

   Six, which is the even number the house rule wants, and no wrong choice
   among them. */
html[data-theme="mermaid"]{        /* Mermaid Green, ETL evergreen */
  --blue:#35806f; --blue-lit:#63b3a0;
  --sky1:#e9f4f1; --sky2:#cbe6df; --sky3:#a7d3c8; --rule:#b3dbd0; --stone:#dcefe9;
}
html[data-theme="petal"]{          /* Petal Pink, from ETL YOU's Coral Reef */
  --blue:#a84c4c; --blue-lit:#f0a49c;
  --sky1:#fdf0ee; --sky2:#fadad5; --sky3:#f4bcb4; --rule:#eec4bd; --stone:#fbe4e0;
}
html[data-theme="sunshine"]{       /* Sunshine Yellow, ETL Greylander gold */
  --blue:#8a6c1f; --blue-lit:#e2c469;
  --sky1:#fdf8e8; --sky2:#f7ecc6; --sky3:#eeda9c; --rule:#e6d5a1; --stone:#faf1d8;
}
html[data-theme="snowflake"]{      /* Snowflake White, ETL paper */
  --blue:#4a5b6b; --blue-lit:#b7bfc6;
  --sky1:#fbfbf8; --sky2:#f4f3ee; --sky3:#e6e5dd; --rule:#dedcd2; --stone:#f7f6f1;
}
/* Starry Night is deliberately dark, the one theme that inverts. A castle at
   bedtime is a lovely thing to hand a four-year-old, and Lenora's whole wing
   is the night sky. ETL night and ETL paper, swapped. */
html[data-theme="starry"]{
  --ink:#f4f3ee; --ink-soft:#a9b6c4;
  --blue:#c9a23f; --blue-lit:#7fa8c9;
  --sky1:#1b2635; --sky2:#131b26; --sky3:#10161d;
  --card:#1f2b3a; --rule:#38485c; --stone:#27354a;
  --shadow:0 8px 22px rgba(0,0,0,.45);
  --shadow-deep:0 14px 34px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Public Sans','Trebuchet MS',Verdana,sans-serif;
  color:var(--ink);
  background:
    repeating-linear-gradient(90deg, rgba(40,82,122,.028) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(0deg,  rgba(40,82,122,.028) 0 2px, transparent 2px 4px),
    radial-gradient(120% 80% at 50% 0%, var(--sky1) 0%, var(--sky2) 55%, var(--sky3) 100%);
  background-attachment:fixed;
  min-height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;touch-action:manipulation;
}

.top{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.home{
  width:52px;height:52px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--blue);
  box-shadow:var(--shadow);font-size:26px;cursor:pointer;flex:0 0 auto
}
.home:active{transform:scale(.94)}
.who{font-family:'Public Sans','Trebuchet MS',Verdana,sans-serif;font-size:18px;font-weight:700;color:var(--blue)}
.who small{display:block;font-family:'Public Sans','Trebuchet MS',Verdana,sans-serif;font-size:12px;font-weight:400;color:var(--ink-soft)}

/* ── Three windows ─────────────────────────────────────────────────────────
   The same three-part shape as kronborg-room.html: who is speaking on top,
   the conversation in the middle, the thing you act with at the bottom.
   Kronborg calls them the avatars row, the log and the composer. Here they
   are the princess window, the speech window and the game window.

   What carries over from Kronborg and matters most is that the middle is a
   SCROLLING CONVERSATION, not a single line. The child cannot read any of it,
   but the grown-up next to her can see the whole exchange, which is how they
   judge whether this is any good. What changes from Kronborg is everything to
   do with size and weight: light instead of dark, enormous instead of dense. */
.stage{
  flex:0 0 auto;min-height:0;width:100%;max-width:1180px;margin:0 auto;
  padding:6px 14px 14px;display:grid;gap:12px;
  /* Phone: one column. The game is moved ahead of the story, because the game
     is the thing a child's thumb has to reach and the story is something she
     sits and listens to. On a wide screen the quadrants take their designed
     positions and the order stops mattering. */
  grid-template-columns:1fr;
  grid-template-areas:'princess' 'speech' 'game' 'story';
}
@media (min-width:820px){
  /* The 2x2. Every wing gets this, with or without a cartoon.

     It briefly did not: adding the has-embed variant below closed this rule
     early, so grid-template-areas ended up ONLY on the embed version and the
     eight princesses without clips fell back to the single mobile column.
     Areas and rows belong here; has-embed changes the column split and
     nothing else. */
  .stage{
    grid-template-columns:38fr 62fr;
    grid-template-rows:auto auto;
    grid-template-areas:
      'princess speech'
      'story    game';
  }
  /* A wing with a cartoon flips the emphasis: the video is landscape and is
     the thing worth looking at, so it takes the wider column. */
  .stage.has-embed{
    grid-template-columns:58fr 42fr;
  }
}
.w-princess{grid-area:princess}
.w-speech{grid-area:speech}
.w-story{grid-area:story}
.w-game{grid-area:game}
.window{
  background:var(--card);border:1px solid var(--rule);border-radius:18px;
  box-shadow:var(--shadow);padding:12px;min-height:0
}
.window-cap{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  opacity:.38;margin-bottom:6px;text-align:center
}

/* 1. The princess window. */
.w-princess{display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;padding:6px}
/* Portrait, matching the artwork. The pieces are roughly 7:8 and they are
   ENVIRONMENTAL: Clementine is not a cut-out on a background, she is standing
   in the Copper Kitchen with the fire and the hanging pans around her, and
   Posy is standing in the Wild Garden with the castle behind her. The wing is
   the room in the picture, so the frame has to keep the room.

   The clips are cartoon but made to Almost Human's standard, so the panel has
   to be worth what went into them. */
.face{
  width:100%;flex:1;min-height:150px;border-radius:12px;
  background:var(--stone);display:grid;place-items:center;overflow:hidden;
  font-size:min(14vw,64px);box-shadow:inset 0 0 0 1px rgba(22,32,43,.12);
  transition:transform .25s ease
}
.face video{width:100%;height:100%;object-fit:cover;display:block}
/* Vimeo panel. The shape comes from the clip itself, set inline by drawFace,
   because the exports are not all the same: Posy is 4:3, Nerida is 16:9.
   Hardcoding one ratio here and cropping the difference in CSS was the earlier
   approach, and it assumed every clip was padded identically and centred. */
.face.has-embed{
  flex:0 0 auto;align-self:stretch;background:#000;overflow:hidden;position:relative;
}
.face.has-embed iframe{
  position:absolute;left:0;top:50%;
  width:100%;height:calc(100% * var(--embed-fill, 1));
  transform:translateY(-50%);
  border:0;display:block;
}

.w-princess:has(.has-embed){justify-content:flex-start}
/* The still, used ONLY when this princess has no clip yet, and mounted only
   after the video element has been removed. See fallToStill(). */
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.talking{transform:scale(1.012)}

/* 2. The speech window. Scrolls, oldest at the top, same as Kronborg's log. */
.w-speech{display:flex;flex-direction:column;min-height:min(52vh,420px)}
/* With a cropped embed the princess panel sizes to the video, so the speech
   column should not stretch to match a tall portrait that is no longer there. */
.stage.has-embed .w-princess{align-self:start}

/* The simplified emotion scale. One face, one word. A four-year-old cannot
   read Kronborg's seven labelled bars and would not look at them if she
   could, but she reads a face instantly, which is the whole point. */
.mood{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:2px 0 8px;border-bottom:1px solid var(--rule);margin-bottom:8px
}
.mood-face{font-size:46px;line-height:1;transition:transform .3s ease}
.mood-word{font-size:14px;letter-spacing:.1em;text-transform:uppercase;opacity:.45}

/* The other direction: the child taps how SHE feels. Same four faces, so the
   vocabulary she is being taught to read is the vocabulary she answers in.
   Four buttons, which is the balanced number. */
.mymood{
  display:flex;gap:8px;justify-content:center;align-items:center;
  padding-top:8px;margin-top:8px;border-top:1px solid var(--rule)
}
.mymood-cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.38;margin-right:2px}
.mymood button{
  border:1px solid var(--rule);background:var(--card);border-radius:18px;width:64px;height:64px;
  font-size:36px;line-height:1;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .12s ease
}
.mymood button:active{transform:scale(.9)}
.log{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  padding:2px 2px 0;scroll-behavior:smooth
}
.bubble{
  padding:9px 13px;border-radius:16px;max-width:86%;
  font-size:14px;line-height:1.45
}
.bubble--agent{background:var(--stone);align-self:flex-start;border-bottom-left-radius:5px}
.bubble--you{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:5px;opacity:.8}

/* 3. The princess' story. Two sentences, and a big button to hear them,
   because the child cannot read a word of it. */
.w-story{display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center}
.story-text{font-family:'Public Sans','Trebuchet MS',Verdana,sans-serif;font-size:13.5px;line-height:1.6;color:var(--ink-soft)}
.story-play{
  align-self:center;border:0;border-radius:20px;padding:10px 18px;
  background:var(--blue);color:#fff;font-family:'Public Sans','Trebuchet MS',Verdana,sans-serif;font-size:13px;
  font-weight:700;cursor:pointer
}
.story-play:active{transform:scale(.95)}
.story-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.story-play.book{background:var(--gold);color:#1f1704}

/* The counting game. Big things, one tap each, a number popping as it lands.
   This is the first thing in the castle a child can actually DO rather than
   watch, which was the gap: the princesses described breathing on windows and
   brushing bones while the screen showed a growth emoji and some buttons. */
.counting{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:4px 0 10px}
.countable{
  position:relative;width:74px;height:74px;border:0;border-radius:20px;
  background:var(--stone);box-shadow:var(--shadow);
  font-size:40px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:transform .14s ease,opacity .2s ease
}
.countable:active{transform:scale(.9)}
.countable.done{opacity:.45}
/* The number that pops when a thing is counted. Deliberately enormous: it is
   the whole point of the exercise and she cannot read the word for it. */
.countable .num{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-size:38px;font-weight:700;
  color:var(--blue);background:var(--card);border-radius:20px;
  box-shadow:inset 0 0 0 3px var(--gold);
  animation:pop .32s ease
}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.count-total{
  text-align:center;font-family:var(--serif);font-size:30px;font-weight:700;
  color:var(--blue);min-height:36px
}

/* Something to look at. A single big picture, or a sequence she taps through.

   The sequence is the better half. "Shall we plant a carrot?" puts a seed on
   screen that becomes a carrot in her own hands, which turns watching into
   doing, and doing is the only thing a four-year-old can really have here. */
.showcard{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:4px 0 12px;cursor:default
}
.showcard.tappable{cursor:pointer}
.show-pic{font-size:96px;line-height:1;transition:transform .28s ease}
.show-pic.grew{animation:grow .4s ease}
@keyframes grow{from{transform:scale(.55);opacity:.3}to{transform:scale(1);opacity:1}}
.show-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.45}
/* Dots showing how far along the sequence is. No numbers, no "3 of 5": she
   cannot read either, and a progress count is a thing you can be behind on. */
.show-dots{display:flex;gap:6px}
.show-dots i{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.show-dots i.on{background:var(--blue)}

/* The shape-fit puzzle. A plate with a hole, and pieces under it. */
.puzzle{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0 10px}
.puzzle-plate{
  width:132px;height:132px;border-radius:22px;background:var(--stone);
  box-shadow:inset 0 0 0 3px var(--rule);display:grid;place-items:center;
  color:var(--card);transition:transform .25s ease
}
.puzzle-plate.filled{transform:scale(1.06)}
.puzzle-plate .hole{color:var(--card)}
.puzzle-plate.filled .hole{color:var(--blue)}
.puzzle-pieces{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.piece{
  width:74px;height:74px;border:0;border-radius:18px;background:var(--card);
  box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;
  color:var(--blue);transition:transform .14s ease,opacity .2s ease
}
.piece:active{transform:scale(.92)}
.piece.gone{opacity:0;pointer-events:none;transform:scale(.4)}
/* A wrong piece wobbles. That is the entire negative feedback in this game:
   no buzz, no red, no counter, nothing a child could read as failing. */
.piece.wobble{animation:wobble .4s ease}
@keyframes wobble{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px) rotate(-4deg)}
  75%{transform:translateX(7px) rotate(4deg)}
}

/* 4. The game window: what is growing, and the things you can tap. How much
   room it needs depends on the game, so it sizes to its contents rather than
   being pinned to a share of the screen. */
.w-game{text-align:center;display:flex;flex-direction:column;justify-content:center}
.thing{font-size:min(15vw,62px);line-height:1;min-height:1em;filter:drop-shadow(0 5px 6px rgba(0,0,0,.14))}
.thing small{display:block;font-size:11px;opacity:.5;margin-top:4px;filter:none}

/* Answers. Enormous, because a four-year-old's tap is not precise. */
.answers{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  padding:8px 0 2px;width:100%
}
.answer{border:1px solid var(--rule);
  flex:1 1 84px;max-width:140px;min-height:88px;
  border-radius:20px;background:var(--card);box-shadow:var(--shadow);
  font-size:42px;cursor:pointer;display:grid;place-items:center;
  transition:transform .12s ease
}
.answer:active{transform:scale(.93)}
.answer:disabled{opacity:.4}
.mic{background:var(--stone);color:var(--blue)}
.mic.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

.begin{
  border:0;border-radius:30px;padding:20px 34px;font-size:20px;font-weight:700;font-family:var(--serif);
  background:var(--blue);color:#fff;box-shadow:var(--shadow);cursor:pointer;
  font-family:inherit
}
.hidden{display:none !important}
</style>
</head>
<body>

<div class="top">
  <button class="home" id="home" aria-label="Back to the castle">🏰</button>
  <div class="who"><span id="whoName">…</span><small id="whoWing"></small></div>
</div>

<main class="stage">
  <!-- 1. Princess window -->
  <section class="window w-princess">
    <div class="face" id="face">🌻</div>
    <button class="begin" id="begin">Tap to start</button>
  </section>

  <!-- 2. Speech window, with the simplified emotion scale on top. Every line
       here is also spoken aloud; the text is for the grown-up sitting
       alongside, who is the one who can read it. -->
  <section class="window w-speech">
    <div class="mood">
      <span class="mood-face" id="moodFace">🙂</span>
      <span class="mood-word" id="moodWord">happy</span>
    </div>
    <div class="log" id="log"></div>
    <div class="mymood" id="myMood">
      <span class="mymood-cap">You</span>
    </div>
  </section>

  <!-- 3. The princess' story -->
  <section class="window w-story">
    <div class="window-cap">Her story</div>
    <p class="story-text" id="storyText"></p>
    <div class="story-buttons">
      <button class="story-play" id="storyPlay" type="button">▶ Hear it</button>
      <!-- The book. Free on every tier: it is fixed text, cached once, and
           costs nothing to serve. What the paid tier buys is a princess
           talking to one particular child, not this. -->
      <button class="story-play book" id="bookPlay" type="button">📖 Tell me a story</button>
    </div>
  </section>

  <!-- 4. Game window -->
  <section class="window w-game">
    <div class="showcard" id="showcard" hidden></div>
    <div class="puzzle" id="puzzle" hidden></div>
    <div class="counting" id="counting" hidden></div>
    <div class="count-total" id="countTotal"></div>
    <div class="thing" id="thing"></div>
    <div class="answers" id="answers"></div>
  </section>
</main>

<script>
/* ── Cast, mirrored from netlify/functions/everly-castle-chat.js (display only) ──── */
const WINGS = {
  posy:       { name:'Posy',       wing:'the Wild Garden',        emoji:'🌻' , lang:'French', topic:'flowers' },
  nerida:     { name:'Nerida',     wing:'the Coral Court',        emoji:'🐚' , lang:'Greek', topic:'sea creatures' },
  zephyra:    { name:'Zephyra',    wing:'the Windward Tower',     emoji:'🪁' , lang:'Nepali', topic:'the wind' },
  neva:       { name:'Neva',       wing:'the Frost Conservatory', emoji:'❄️' , lang:'Norwegian', topic:'snow' },
  lenora:      { name:'Lenora',      wing:'the Star Balcony',       emoji:'🌙' , lang:'Mongolian', topic:'the moon' },
  elowyn:     { name:'Elowyn',     wing:'the Story Loft',         emoji:'📖' , lang:'Māori', topic:'stories' },
  clementine: { name:'Clementine', wing:'the Copper Kitchen',     emoji:'🥕' , lang:null, topic:'food', offer2:'tell me what children eat in other countries' },
  piper:      { name:'Piper',      wing:'the Music Hall',         emoji:'🎵' , lang:'German', topic:'music' },
  almasi:      { name:'Almasi',      wing:'the Fossil Field',       emoji:'🦴' , lang:'Swahili', topic:'fossils' },
  bex:        { name:'Bex',        wing:'the Workshop',           emoji:'🔧' , lang:'Portuguese', topic:'how things work' },
};
// The stills, for princesses who have been drawn but not yet animated. Both
// extensions are tried so the artwork can be exported as either.
const stillsFor = (n) => ['agents/' + n + '.png', 'agents/' + n + '.jpg'];

/* ── Cartoons on Vimeo ─────────────────────────────────────────────────────
   The clips are being delivered as Vimeo embeds rather than files in /agents,
   which is the same way every other ETL platform ships its video. An iframe
   cannot go through the video/still ladder below, so a princess with a Vimeo
   id takes a separate path: the iframe replaces the panel outright, and no
   still is ever mounted behind it.

   That last part matters. The rule is that a still must never sit under a
   video, because a still hiding a dead player looks like a working one. So
   when a Vimeo id is present there is no fallback image in this panel at all.
   If the embed fails, the panel is empty and obviously broken, which is the
   correct outcome.

   The hub keeps using stills on its door thumbnails. Ten autoplaying iframes
   in 92px circles would be heavy and Vimeo will not crop to a circle, and a
   deliberate thumbnail is not the same thing as a still masking a failure. */
const VIMEO = {
  posy:   { id: '1216824336', file: '4/3', content: '16/9' },
  nerida: { id: '1216824863', file: '4/3', content: '16/9' },
  neva:   { id: '1216832962', file: '4/3', content: '16/9' },
  elowyn: { id: '1216836207', file: '4/3', content: '16/9' },
  lenora: { id: '1216838790', file: '4/3', content: '16/9' },
  clementine: { id: '1216840815', file: '4/3', content: '16/9' },
  piper:  { id: '1216842418', file: '4/3', content: '16/9' },
  almasi: { id: '1216839089', file: '4/3', content: '16/9' },
  bex:    { id: '1216837850', file: '4/3', content: '16/9' },
};

const params = new URLSearchParams(location.search);
const wingId = (params.get('wing') || 'posy').toLowerCase();
const AGENT = WINGS[wingId] || WINGS.posy;

/* ── Storage, all local ────────────────────────────────────────────────────
   Same store the hub reads. Nothing here goes to a server. */
const KEY = 'everlyCastle';
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } }
function save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){ console.warn('[everly] storage unavailable', e); } }
/* Everything below reads and writes ONE child's slice, never the device's.
   With sisters sharing a tablet, a wing that wrote to a global would grow one
   sunflower between three of them and hand whoever opened it last the crowns.
   `prof` is the child who was picked on the hub. */
let state = load();
state.profiles = state.profiles || {};

function currentProfile(){
  let p = state.profiles[state.activeId];
  if (!p) {
    // Reached the wing without a child selected, e.g. a deep link or a fresh
    // install. Make one rather than dropping her crowns on the floor.
    const id = 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    state.activeId = id;
    p = state.profiles[id] = { name:'', title:'Princess', crest:'🦋', charms:{}, visits:{}, grow:{}, log:[] };
    save(state);
  }
  p.charms = p.charms || {};
  p.visits = p.visits || {};
  p.grow   = p.grow   || {};
  p.taught = p.taught || {};   // per wing: what this princess has covered
  p.notes  = p.notes  || {};   // per wing: what she has noticed about this child
  p.mood   = p.mood   || {};   // per wing: how she felt when they last parted
  p.log    = Array.isArray(p.log) ? p.log : [];
  return p;
}
let prof = currentProfile();

/* Free or paid, stored per device rather than per child: a family subscribes
   once and every child in it is known by name.

   Nothing here is ever shown to the child. She sees no lock, no greyed-out
   door and no upgrade prompt, because a four-year-old who meets a locked door
   does not conclude that her grown-up should subscribe, she concludes she did
   something wrong. The only difference she can perceive is whether the
   princess uses her name. The offer lives in the parents' guide. */
function isPaid(){
  return (state.tier || 'free') === 'family';
}

/* The wing wears whatever colour she chose on the hub. Applied before first
   paint rather than after, so a child on Starry Night never gets a flash of
   daylight on her way through the door. */
(function applyChosenTheme(){
  const t = prof && prof.theme;
  if (t) document.documentElement.setAttribute('data-theme', t);
})();

const today = new Date().toISOString().slice(0,10);

/* ── The thing that grows ──────────────────────────────────────────────────
   The single most important mechanic in the product, and the cheapest: it is
   five emoji and a counter. A child comes back tomorrow because the seed she
   planted is taller, not because anything clever happened.

   It advances on DISTINCT DAYS, not on visits, deliberately. Opening the app
   eleven times in one afternoon must not race the sunflower to full bloom and
   spend the whole hook in an hour, and a child who tries it will find that
   plants do not work that way, which is the lesson anyway. */
/* Six stages each, not five. Everything in Everly Castle comes in even numbers: ten
   princesses, six stages, an even number of buttons on screen. It is a house
   rule, and it happens to be the right one here anyway, because a child can
   halve an even row of things and cannot halve an odd one. */
const GROWTH = {
  posy:       ['🌰','🌱','🌿','🪴','🌷','🌻'],
  nerida:     ['🫧','🐚','🦀','🐠','🐡','🐙'],
  // A leaf, a feather, a windchime, a balloon, a kite, a bird. The sequence is
  // the lesson: each one needs more air under it than the last.
  zephyra:    ['🍃','🪶','🎐','🎈','🪁','🦅'],
  neva:       ['💧','🧊','❄️','⛄','🏔️','🦊'],
  lenora:      ['🌑','🌒','🌓','🌔','🌖','🌕'],
  elowyn:     ['📄','✏️','📃','📒','📔','📚'],
  // Colours collected onto a plate. "Eat a rainbow" is the framing preschool
  // nutrition programmes actually use, and it sorts food by variety rather
  // than by virtue, which is the whole point of this wing.
  clementine: ['🥕','🍎','🥦','🫐','🌽','🍽️'],
  piper:      ['🎵','🎶','🥁','🎹','🎻','🎺'],
  almasi:     ['🪨','🖌️','🦴','🔍','🦖','🦕'],
  bex:        ['🔩','🔧','⚙️','🪛','🛠️','🤖'],
};
const GROWTH_CAPTION = {
  posy:'Your sunflower', nerida:'Your tide pool', zephyra:'Your kite', neva:'Your window',
  lenora:'Tonight’s moon', elowyn:'Your story shelf', clementine:'Your rainbow plate',
  piper:'Your song', almasi:'Your dig', bex:'What you are building',
};

function growthStage(){
  const days = prof.visits[wingId] || [];
  return Math.min(days.length ? days.length - 1 : 0, (GROWTH[wingId] || GROWTH.posy).length - 1);
}
function recordVisit(){
  const days = prof.visits[wingId] || [];
  if (!days.includes(today)) { days.push(today); prof.visits[wingId] = days; save(state); }
}
function drawThing(){
  const set = GROWTH[wingId] || GROWTH.posy;
  const el = document.getElementById('thing');
  el.textContent = set[growthStage()];
  const cap = document.createElement('small');
  cap.textContent = GROWTH_CAPTION[wingId] || '';
  el.appendChild(cap);
}

/* ── What the princess remembers ───────────────────────────────────────────
   A short plain-language note passed up per turn and handed straight to the
   system prompt. Kept small on purpose: it is cheap, it is readable by the
   grown-up in the panel, and there is no version of this where a four-year-
   old's transcript belongs in a database. */
function remembers(){
  const bits = [];
  const days = (prof.visits[wingId] || []).length;
  // No "she". A prince visits this castle too, and the grown-up sets a title,
  // not a pronoun, so the only safe thing to write here is "they".
  if (days > 1) bits.push('They have visited you ' + days + ' times.');
  const set = GROWTH[wingId] || GROWTH.posy;
  bits.push('The ' + (GROWTH_CAPTION[wingId] || 'thing') .toLowerCase().replace(/^your /,'') +
            ' you two are looking after is at stage ' + (growthStage() + 1) + ' of ' + set.length + '.');
  /* How she felt when they last parted, and how long ago that was. She opens
     in this state rather than resetting to cheerful, which is the whole
     difference between an emotion implant and a mood badge. */
  const parted = prof.mood[wingId];
  if (parted && parted.felt) {
    const gap = parted.when === today ? 'earlier today'
      : (prof.visits[wingId] || []).length > 1 ? 'last time' : 'when you first met';
    bits.push('When you parted ' + gap + ' you were feeling ' + parted.felt + '.');
  }

  /* What she has noticed about this child. This is the half that makes her
     seem to know someone rather than to have taught someone. */
  const notes = prof.notes[wingId] || [];
  if (notes.length) bits.push('Things you have noticed about them: ' + notes.join('; ') + '.');

  /* What she has already covered. This is the difference between a princess
     who remembers a child and one who greets her identically forever. The
     oldest entries are dropped rather than the newest, so a long-standing
     visitor keeps her recent ground and loses the ancient history. */
  const taught = prof.taught[wingId] || [];
  if (taught.length) {
    bits.push('You have already taught them: ' + taught.slice(-12).join('; ') + '.');
  }
  if (prof.grow[wingId]) bits.push(prof.grow[wingId]);
  return bits.join(' ');
}

/* ── Voice out ─────────────────────────────────────────────────────────────
   Two tiers. everly-castle-voice.js gives the real princess voice; if no voice ID is
   configured yet, or the network is down, the browser's own speech synthesis
   reads the line instead. That fallback is NOT good enough to ship as the
   product, but it is far better than a four-year-old sitting in front of a
   silent screen, and it means the whole wing is testable today, before a
   single ElevenLabs voice has been chosen. */
let audioEl = null;
async function speak(text, scriptLine){
  /* A small scale nudge while she speaks. The old version also swapped to a
     _talk.mp4, which no longer exists: cartoons are Vimeo embeds now and the
     player owns its own loop. */
  const faceEl = document.getElementById('face');
  faceEl.classList.add('talking');
  const done = () => faceEl.classList.remove('talking');

  try {
    const r = await fetch('/.netlify/functions/everly-castle-voice', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(scriptLine ? { agent: wingId, line: scriptLine } : { agent: wingId, text }),
    });
    if (!r.ok) throw new Error('voice ' + r.status);
    const blob = await r.blob();
    if (audioEl) { audioEl.pause(); URL.revokeObjectURL(audioEl.src); }
    audioEl = new Audio(URL.createObjectURL(blob));
    audioEl.onended = done;
    await audioEl.play();
    return;
  } catch (e) {
    console.warn('[everly] princess voice unavailable, using the browser voice:', e.message);
  }

  try {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1.15;
    u.onend = done;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (_) { done(); }
}

/* ── Voice in ──────────────────────────────────────────────────────────────
   Read this before making the microphone the main way through, because it is
   tempting and it is wrong.

   Speech recognition is trained overwhelmingly on adult speech. A four-year-
   old has a smaller vocal tract, less consistent articulation and a habit of
   trailing off, and recognition accuracy on preschoolers is dramatically
   worse than on adults. Any design that REQUIRES her to be understood will
   fail her several times a minute, and a small child who is not understood
   does not retry, she gives up and goes away.

   So: the emoji buttons are the guaranteed path and are always on screen. The
   microphone sits alongside them as a bonus. When it hears nothing, mishears,
   errors, or is not supported at all, nothing is announced and nothing is
   blamed. The turn simply carries on with the buttons already sitting there.

   The princesses are also briefed (rule 2 in everly-castle-chat.js) to write lines
   that survive a garbled answer, which is the other half of the same fix. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let listening = false;
function listen(btn){
  if (!SR || listening) return;
  let rec;
  try { rec = new SR(); } catch { return; }
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.continuous = false;

  listening = true;
  btn.classList.add('on');
  const stop = () => { listening = false; btn.classList.remove('on'); };

  rec.onresult = (ev) => {
    stop();
    const said = ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript;
    if (said && said.trim()) turn(said.trim());
    // No transcript means we say nothing at all. The buttons are still there.
  };
  rec.onerror = stop;
  rec.onend = stop;
  // Four-year-olds pause mid-thought. Give her longer than the default before
  // the browser decides she has finished.
  setTimeout(() => { try { rec.stop(); } catch(_){} }, 7000);
  try { rec.start(); } catch { stop(); }
}

/* ── A turn ────────────────────────────────────────────────────────────────── */
let history = [];
let busy = false;

/* Buttons always come out to an even number. House rule, and it earns its
   keep on this page in particular: an even row wraps into two clean columns
   on a phone with nothing stranded on its own line, and a four-year-old
   choosing between a tidy pair is calmer than one facing a ragged three.

   The mic counts as a button, so whether it is present changes the padding.
   Anything short is filled with a "something else" door, which is never a
   dead end: it is a real answer the princess can pick up. */
/* ── Mirror of everly-castle-chat.js's SCRIPT ─────────────────────────────────
   Fixed lines, held here so the page can show and speak them before it has
   called any backend, and so the browser-voice fallback says exactly the words
   the cached princess audio would. If you edit one, edit BOTH, and bump
   CACHE_VERSION in everly-castle-voice.js. The consistency check enforces this. */
const SCRIPT_TEXT = {
  posy:       { hello:'Oh good, you came back. Clover and I were just checking on things.', again:'There you are. Come and look, something happened while you were gone.', story:'I am Princess Posy. I live in France, and I love plants and flowers. I speak French. Would you like to learn about flowers? Or would you like to learn some French words?' },
  nerida:     { hello:'You found the Coral Court. Careful, it is slippery.', again:'Back again. The tide came in and left us something.', story:'I am Princess Nerida. I live in Greece, and I love the sea and everything living in it. I speak Greek. Would you like to learn about sea creatures? Or would you like to learn some Greek words?' },
  zephyra:    { hello:'Hold on to something. It is windy up here.', again:'You are back. Good, the wind has swung right round since yesterday.', story:'I am Princess Zephyra. I live in Nepal, high up in the mountains, and I love the wind. I speak Nepali. Would you like to learn about the wind? Or would you like to learn some Nepali words?' },
  neva:       { hello:'Come in. Mind the cold, it bites a little at first.', again:'You came back. Wisp knew you would.', story:'I am Princess Neva. I live in Norway, where it snows, and I love ice and snowflakes. I speak Norwegian. Would you like to learn about snow? Or would you like to learn some Norwegian words?' },
  lenora:      { hello:'Shh. Come and stand here, where you can see.', again:'There you are. The moon has changed since you left.', story:'I am Princess Lenora. I live in Mongolia, where the night sky is very dark, and I love the moon and the stars. I speak Mongolian. Would you like to learn about the moon? Or would you like to learn some Mongolian words?' },
  elowyn:     { hello:'A visitor. Inkwell, we have a visitor, and the story is not finished.', again:'You are back, and just in time, I was stuck.', story:'I am Princess Elowyn. I live in New Zealand, and I love stories. I speak English and Māori. Would you like to make up a story? Or would you like to learn some Māori words?' },
  clementine: { hello:'Perfect timing. I am building a plate and I have run clean out of colours.', again:'You came back. Good, because I have done it again, look at this.', story:'I am Princess Clementine. I live in America, and I love cooking and finding out what food does for you. I speak English. Would you like to learn about food? Or shall I tell you what children eat in other countries?' },

/* ── The simplified emotion scale ──────────────────────────────────────────
   Kronborg and Almost Human run seven emotions on 0-8 bars. This is the same
   idea reduced to what a four-year-old can actually read: one face and one
   word. Every state is warm or neutral, deliberately, because a small child
   should never be shown that she made someone sad. */
const MOODS = {
  happy:   { face:'😊', word:'happy',   say:'I feel happy today' },
  sad:     { face:'😢', word:'sad',     say:'I feel sad today' },
  curious: { face:'🤔', word:'curious', say:'I feel curious today' },
  angry:   { face:'😠', word:'cross',   say:'I feel cross today' },
};

/* The child's own mood row. Tapping a face sends it as if she had said it,
   which is the only way a four-year-old can tell anyone how she feels without
   being able to write or reliably be understood by a microphone.

   Every tap is logged for the grown-up, and sad or cross is marked, not as an
   alarm but because "she told a princess she was sad on Tuesday" is exactly
   the kind of thing a parent wants to know and would otherwise never hear. */
function drawMyMood(){
  const host = document.getElementById('myMood');
  Object.entries(MOODS).forEach(([key, m]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = m.face;
    b.setAttribute('aria-label', 'I feel ' + m.word);
    b.addEventListener('click', () => {
      logIt(m.say, key === 'sad' || key === 'angry');
      turn(m.say);
    });
    host.appendChild(b);
  });
}
function setMood(key){
  const m = MOODS[key] || MOODS.happy;
  const f = document.getElementById('moodFace');
  f.textContent = m.face;
  document.getElementById('moodWord').textContent = m.word;
  // A tiny pop, so a change of feeling is noticed by someone not reading.
  f.style.transform = 'scale(1.28)';
  setTimeout(() => { f.style.transform = 'scale(1)'; }, 260);
}

/* Keeps the princess's own notes on what she has covered with this child in
   this wing. Capped, de-duplicated, and stored per child, so sisters do not
   inherit each other's lessons. */
/* The emotion implant. Her feeling is stored when the turn ends and handed
   back when the child returns, so she opens in the state she was left in
   rather than resetting to cheerful. Cosmetic gauges reset; implants do not. */
function rememberMood(feeling){
  if (!feeling) return;
  prof.mood[wingId] = { felt: feeling, when: today };
  save(state);
}

/* What she noticed about the child, as opposed to what she taught them. Kept
   shorter and fresher than the lesson list: a relationship is made of recent
   things, and a note from four months ago is not insight, it is a database. */
function rememberNoticed(note){
  if (!note) return;
  const n = String(note).trim().slice(0, 100);
  if (!n) return;
  const list = prof.notes[wingId] || [];
  if (list.map((s) => s.toLowerCase()).indexOf(n.toLowerCase()) !== -1) return;
  list.push(n);
  prof.notes[wingId] = list.slice(-8);
  save(state);
}

function rememberTaught(covered){
  if (!covered) return;
  const note = String(covered).trim().slice(0, 80);
  if (!note) return;
  const list = prof.taught[wingId] || [];
  const seen = list.map((s) => s.toLowerCase());
  if (seen.indexOf(note.toLowerCase()) !== -1) return;
  list.push(note);
  prof.taught[wingId] = list.slice(-24);
  save(state);
}

/* The speech window, filled the way Kronborg fills its log: a bubble per turn,
   oldest at the top, newest scrolled into view. The child's own taps go in as
   her bubbles, so a grown-up reading over her shoulder sees a conversation
   rather than a series of disconnected princess lines. */
function addBubble(who, text){
  const log = document.getElementById('log');
  const b = document.createElement('div');
  b.className = 'bubble bubble--' + (who === 'you' ? 'you' : 'agent');
  b.textContent = text;
  log.appendChild(b);
  // Keep it bounded. Nothing here is worth remembering past the session, and
  // an unbounded log on a tablet a child never closes will grow all day.
  while (log.children.length > 40) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

/* Puts one big thing on screen, or a sequence she advances by tapping.

   She kept offering to show things, a sunflower, a snail, and nothing ever
   appeared. That is the same broken promise as asking a child to hold a
   spanner: she does not conclude the app is empty, she concludes she missed
   it. Now the offer has something behind it. */
function setShow(spec){
  const host = document.getElementById('showcard');
  host.innerHTML = '';
  host.classList.remove('tappable');
  if (!spec || (!spec.emoji && !(spec.steps && spec.steps.length))) { host.hidden = true; return; }
  host.hidden = false;

  const steps = (spec.steps && spec.steps.length) ? spec.steps : [spec.emoji];
  let at = 0;

  const pic = document.createElement('div');
  pic.className = 'show-pic';
  pic.textContent = steps[0];

  const label = document.createElement('div');
  label.className = 'show-label';
  label.textContent = spec.label || '';

  const dots = document.createElement('div');
  dots.className = 'show-dots';
  const paintDots = () => {
    dots.innerHTML = '';
    if (steps.length < 2) return;
    steps.forEach((_, i) => {
      const d = document.createElement('i');
      if (i <= at) d.classList.add('on');
      dots.appendChild(d);
    });
  };
  paintDots();

  host.append(pic, label, dots);

  if (steps.length > 1) {
    host.classList.add('tappable');
    host.setAttribute('role', 'button');
    host.setAttribute('aria-label', 'tap to see what happens next');
    host.addEventListener('click', () => {
      if (at >= steps.length - 1) return;
      at += 1;
      pic.textContent = steps[at];
      pic.classList.remove('grew');
      void pic.offsetWidth;
      pic.classList.add('grew');
      paintDots();
      // Tell her when it is finished, so she can react to the thing they grew.
      if (at === steps.length - 1) {
        setTimeout(() => turn('it finished growing'), 800);
      }
    });
  }
}

/* Shapes for the puzzle, drawn rather than emoji so they read cleanly at
   size and match the badge set already in the castle. */
const SHAPES = {
  circle:   'M32 6a26 26 0 1 0 0 52a26 26 0 1 0 0-52z',
  square:   'M8 8h48v48H8z',
  triangle: 'M32 6L60 56H4z',
  star:     'M32 6l7.6 16.4L57 24.6 44 36.8l3.4 17.6L32 46 16.6 54.4 20 36.8 7 24.6l17.4-2.2z',
  heart:    'M32 57S7 41 7 25a12.5 12.5 0 0125-6 12.5 12.5 0 0125 6c0 16-25 32-25 32z',
  hexagon:  'M32 4l24 14v28L32 60 8 46V18z',
};
function shapeSvg(kind, size){
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 64 64');
  s.setAttribute('width', size); s.setAttribute('height', size);
  s.setAttribute('aria-hidden', 'true'); s.style.display = 'block';
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', SHAPES[kind] || SHAPES.circle);
  p.setAttribute('fill', 'currentColor');
  s.appendChild(p);
  return s;
}

/* Builds the hole and the pieces.

   Wrong taps are counted but never shown. The number goes to the princess at
   the end so she can put that shape back in gently another day, which is the
   memory implant doing something useful rather than decorative. The child
   sees only a wobble. */
function setPuzzle(spec){
  const host = document.getElementById('puzzle');
  host.innerHTML = '';
  if (!spec || !spec.fits) { host.hidden = true; return; }
  host.hidden = false;

  const plate = document.createElement('div');
  plate.className = 'puzzle-plate';
  const hole = shapeSvg(spec.fits, 84);
  hole.classList.add('hole');
  plate.appendChild(hole);

  const row = document.createElement('div');
  row.className = 'puzzle-pieces';

  let misses = 0;
  let solved = false;
  const opts = (spec.options && spec.options.length ? spec.options : [spec.fits]).slice(0, 3);

  opts.forEach((kind) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'piece';
    b.setAttribute('aria-label', kind);
    b.appendChild(shapeSvg(kind, 44));
    b.addEventListener('click', () => {
      if (solved) return;
      if (kind === spec.fits) {
        solved = true;
        b.classList.add('gone');
        plate.classList.add('filled');
        setTimeout(() => {
          turn(misses ? 'I found the ' + kind : 'I got it, the ' + kind);
        }, 700);
      } else {
        // The whole of the negative feedback. No sound, no colour, no count.
        misses += 1;
        b.classList.remove('wobble');
        void b.offsetWidth;              // restart the animation
        b.classList.add('wobble');
      }
    });
    row.appendChild(b);
  });

  host.append(plate, row);
}

/* Lays out things to count. One tap per thing, in any order: a four-year-old
   who counts them out of sequence has still counted them, and being corrected
   for it is how you teach her that counting is a test she can fail.

   Numbers are spoken in the princess's own voice through the scripted-line
   path, so each one is bought once per princess and cached forever. */
function setCounting(spec){
  const host = document.getElementById('counting');
  const total = document.getElementById('countTotal');
  host.innerHTML = '';
  total.textContent = '';
  if (!spec || !spec.howMany) { host.hidden = true; return; }

  host.hidden = false;
  let counted = 0;
  const n = Math.max(1, Math.min(10, spec.howMany));

  for (let i = 0; i < n; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'countable';
    b.textContent = spec.emoji || '⭐';
    b.setAttribute('aria-label', 'one to count');
    b.addEventListener('click', () => {
      if (b.classList.contains('done')) return;   // each thing counts once
      b.classList.add('done');
      counted += 1;

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(counted);
      b.appendChild(num);

      speak(String(counted), 'count-' + counted);

      if (counted === n) {
        total.textContent = String(n);
        // Tell the princess, so she can react and it goes in her notes.
        setTimeout(() => turn('I counted ' + n), 900);
      }
    });
    host.appendChild(b);
  }
}

function setAnswers(choices){
  const host = document.getElementById('answers');
  host.innerHTML = '';

  const items = (choices || []).slice(0, 3).map((c) => ({ emoji:c.emoji, say:c.say, mic:false }));
  if (SR) items.push({ emoji:'🎤', say:null, mic:true });
  if (items.length % 2 === 1) items.push({ emoji:'🤷', say:'something else', mic:false });

  items.forEach((it) => {
    const b = document.createElement('button');
    b.className = 'answer' + (it.mic ? ' mic' : '');
    b.textContent = it.emoji;
    b.setAttribute('aria-label', it.mic ? 'Say something' : it.say);
    b.addEventListener('click', () => { if (it.mic) listen(b); else turn(it.say); });
    host.appendChild(b);
  });
}

/* Writes into THIS child's log and nobody else's. Re-reads first so a name or
   a crest the grown-up changed in another tab is not clobbered, then merges
   only the fields this wing actually owns. */
function logIt(said, flag){
  const s = load();
  s.profiles = s.profiles || {};
  const id = state.activeId;
  const stored = s.profiles[id] || {};

  const merged = {
    ...stored,
    charms: { ...(stored.charms || {}), ...prof.charms },
    visits: { ...(stored.visits || {}), ...prof.visits },
    grow:   { ...(stored.grow   || {}), ...prof.grow },
    taught: { ...(stored.taught || {}), ...prof.taught },
    notes:  { ...(stored.notes  || {}), ...prof.notes },
    mood:   { ...(stored.mood   || {}), ...prof.mood },
    log:    Array.isArray(stored.log) ? stored.log.slice() : [],
  };
  merged.log.push({ when: new Date().toLocaleString(), wing: AGENT.name, said, ...(flag ? { flag:true } : {}) });
  merged.log = merged.log.slice(-200);

  s.profiles[id] = merged;
  s.activeId = id;
  save(s);
  prof.log = merged.log;
}

async function turn(message){
  if (busy) return;
  busy = true;
  document.querySelectorAll('.answer').forEach((b) => { b.disabled = true; });
  addBubble('you', message);
  logIt(message);

  let data;
  try {
    const r = await fetch('/.netlify/functions/everly-castle-chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        agent: wingId,
        message,
        history: history.slice(-10),
        /* THE PAID LINE.

           Free accounts send no name and no notes, so the princess speaks to a
           child she does not know and the reply is one that would suit any
           child anywhere. That is why it is cheap: a generic line is cached
           once and served to everybody forever, while a line containing a
           name belongs to one child and can never be shared.

           The title still goes, because Princess or Prince is not personal
           information and getting it wrong would be worse than free. */
        student: isPaid() ? (prof.name || undefined) : undefined,
        title: prof.title === 'Prince' ? 'Prince' : 'Princess',
        remembers: isPaid() ? remembers() : undefined,
      }),
    });
    data = await r.json();
  } catch (e) {
    console.warn('[everly] chat unreachable', e);
    // She is four. She does not get an error, she gets the princess.
    data = { ok:true, body:'Hold on, my hands are full of soil. Say that again in a moment.', choices:[{emoji:'👋', say:'hello'}] };
  }

  busy = false;
  if (!data || !data.ok) data = { body:'Come and look at this instead.', choices:[{emoji:'👀', say:'let me see'}] };

  history.push({ role:'user', body: message });
  history.push({ role:'agent', body: data.body });

  if (data.flag === 'grownup') {
    // Flagged in the grown-up log so somebody can follow it up later. She is
    // never told that anything was flagged.
    logIt(message, true);
  }

  addBubble('agent', data.body);
  setMood(data.feeling);
  rememberTaught(data.covered);
  rememberNoticed(data.noticed);
  rememberMood(data.feeling);
  setCounting(data.count);
  setShow(data.show);
  setPuzzle(data.puzzle);
  setAnswers(data.choices);
  speak(data.body);
}

/* ── Opening ───────────────────────────────────────────────────────────────
   Browsers will not play audio until the user has touched the page, so the
   wing opens behind one big button. That is not a workaround here, it is the
   right shape anyway: tapping the princess to wake her up is a nicer way in
   than a screen that starts talking at a child on its own. */
function begin(){
  document.getElementById('begin').classList.add('hidden');
  recordVisit();
  drawThing();

  const returning = (prof.visits[wingId] || []).length > 1;
  const lineKey = returning ? 'again' : 'hello';
  /* Every visit opens by name and ends on the feelings question, so the first
     thing that happens in the castle is somebody asking her how she is. The
     mood row underneath is the answer, which means her very first tap of the
     session is always available and always means something.

     This cannot be a purely scripted line any more, because it carries her
     name. It is still cached: everly-castle-voice hashes live text, and the name
     and title are fixed per device, so it is generated once for a family and
     served from the store every time after that. */
  const bank = SCRIPT_TEXT[wingId] || SCRIPT_TEXT.posy;
  const rank = prof.title === 'Prince' ? 'Prince' : 'Princess';
  /* Falls back to the bare title, never to "your highness". A four-year-old
     has no hook for that word, and a greeting she cannot parse is a greeting
     that teaches her the castle talks over her head. */
  const who = (isPaid() && prof.name) ? rank + ' ' + prof.name : rank;
  const opening = 'Hello, ' + who + '. ' + bank[lineKey] + ' How are you feeling today?';

  /* She opens in the mood she was left in. Without this the face resets to
     happy on every visit, which is the tell that a gauge is decorative. */
  const parted = isPaid() ? prof.mood[wingId] : null;
  if (parted && parted.felt) setMood(parted.felt);

  addBubble('agent', opening);
  history.push({ role:'agent', body: opening });
  setAnswers([{ emoji:'👋', say:'hello' }, { emoji:'👀', say:'what happened?' }]);
  speak(opening);

  /* The charm is for showing up, not for performing. There is no test to pass
     in a wing, and there must never be one: the moment a four-year-old can
     fail at this, it stops being somewhere she wants to go. */
  if (!prof.charms[wingId]) {
    prof.charms[wingId] = today;
    save(state);
  }
}

/* ── Wire up ───────────────────────────────────────────────────────────────── */
document.getElementById('whoName').textContent = AGENT.name;
document.getElementById('whoWing').textContent = AGENT.wing;
document.getElementById('home').addEventListener('click', () => {
  try { if (audioEl) audioEl.pause(); speechSynthesis.cancel(); } catch(_){}
  location.href = 'everly-castle.html';
});

/* ── The face is a cartoon loop, never a still ──────────────────────────────
   House rule, and it is absolute: NO image behind, over, or as the poster of
   a video. Not a portrait, not a CSS background, not the emoji. A still under
   a clip makes a dead video look alive, and that exact failure has cost this
   shop weeks more than once.

   So the emoji only ever holds the space, and it is removed BEFORE the video
   is revealed, never underneath it. If the clip cannot play, the video element
   is torn out entirely and the emoji stays, loudly, in the console. */

/* Removes the placeholder emoji and NOTHING ELSE.

   `el.textContent = ''` does not clear the text, it clears every child node,
   and by the time we want the emoji gone the video or the image is already a
   child. So the line written to reveal the artwork was deleting the artwork
   and leaving a blank panel. It stayed invisible until a real file was put on
   disk to load, because with nothing to load it never got the chance to fire. */
function clearEmoji(host){
  Array.prototype.slice.call(host.childNodes).forEach((n) => {
    if (n.nodeType === 3) host.removeChild(n);
  });
}

/* ── The princess's face ───────────────────────────────────────────────────
   Vimeo or a still. Nothing else.

   Cartoons ship as Vimeo embeds, which is ETL's path for video everywhere.
   An earlier version also probed for a local agents/<Name>_idle.mp4 first and
   fell back through it; that was never going to be used and cost a 404 per
   princess on every load, so it is gone.

   The rule that survives: a still must never sit under a video, because a
   still hiding a dead player looks exactly like a working one. So the two are
   mutually exclusive here. A princess with a Vimeo id gets the iframe and no
   image at all, and if that embed fails the panel is empty and obviously
   broken, which is correct. A princess without one gets her portrait. */
(function drawFace(){
  const el = document.getElementById('face');
  el.textContent = AGENT.emoji;

  const clip = VIMEO[wingId];
  if (clip) {
    clearEmoji(el);
    el.classList.add('has-embed');
    document.querySelector('.stage').classList.add('has-embed');
    const frame = document.createElement('iframe');
    /* Panel takes the picture's shape; the iframe is scaled so the file's
       baked bars sit outside it. */
    el.style.aspectRatio = clip.content;
    const [cw, ch] = clip.content.split('/').map(Number);
    const [fw, fh] = clip.file.split('/').map(Number);
    el.style.setProperty('--embed-fill', String((cw / ch) / (fw / fh)));
    frame.src = 'https://player.vimeo.com/video/' + clip.id +
                '?badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1&muted=1&loop=1&controls=0&dnt=1';
    frame.title = AGENT.name + ' in ' + AGENT.wing;
    frame.setAttribute('frameborder', '0');
    frame.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
    frame.setAttribute('allowfullscreen', '');
    frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    el.appendChild(frame);
    return;
  }

  // No cartoon yet: her portrait, trying both export formats.
  const cands = stillsFor(AGENT.name);
  let i = 0;
  (function tryNext(){
    if (i >= cands.length) {
      console.warn('[everly] nothing to show for ' + AGENT.name + ': no Vimeo id and no ' + cands.join(', '));
      return;
    }
    const img = new Image();
    img.alt = '';
    img.style.display = 'none';
    img.onload = () => { clearEmoji(el); img.style.display = 'block'; };
    img.onerror = () => { if (img.parentNode) img.parentNode.removeChild(img); i++; tryNext(); };
    el.appendChild(img);
    img.src = cands[i];
  })();
})();



drawThing();
drawMyMood();
document.getElementById('begin').addEventListener('click', begin);

/* Her story. The text is for the grown-up, the button is for the child, and
   the audio is a scripted line so it is generated once ever and served from
   the cache every time after that. */
/* The book. One story per princess, a minute long, about her country. Fixed
   text so it is bought once and cached forever, which is why it sits on the
   free side of the line. */
(function wireBook(){
  const btn = document.getElementById('bookPlay');
  if (!btn) return;
  btn.addEventListener('click', () => {
    btn.disabled = true;
    addBubble('agent', '(telling a story about ' + (AGENT.place || 'home') + ')');
    speak('', 'tale');
    // She remembers she told it, so she can offer a different one another day
    // once there is more than one to offer.
    rememberTaught('told the story about ' + (AGENT.place || 'home'));
    setTimeout(() => { btn.disabled = false; }, 4000);
  });
})();

(function wireStory(){
  const bank = SCRIPT_TEXT[wingId] || SCRIPT_TEXT.posy;
  document.getElementById('storyText').textContent = bank.story;
  /* Her story now ENDS in two questions, so playing it has to leave two
     things to tap. Without this a four-year-old hears "would you like to
     learn about flowers, or some French words?" and has no way to answer
     either one. */
  document.getElementById('storyPlay').addEventListener('click', () => {
    addBubble('agent', bank.story);
    speak(bank.story, 'story');
    /* Clementine is the one princess who already shares the child's language,
       so her second offer is not "some words" but the thing that ties her to
       the other nine: what children eat everywhere else. `offer2` overrides
       the language button for any princess who needs a different second door. */
    setAnswers([
      { emoji: AGENT.emoji, say: 'tell me about ' + (AGENT.topic || 'your wing') },
      { emoji: AGENT.offer2 ? '🌍' : '🗣️',
        say: AGENT.offer2 || ('teach me some ' + (AGENT.lang || 'new') + ' words') },
    ]);
  });
})();
