<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Company: the AR room</title>
<meta name="description" content="Bring a Good Company companion into your own room with your camera.">
<link rel="stylesheet" href="gc-skin.css">
<script src="gc-skin.js"></script>

<!-- ADDED 2026-09-08. Dr. O: "I want to go to an AR room, not see poppy" -- until now the only
     way to any companion's AR page was a link you had to already know (ar.html?who=poppy), or the
     one small chip inside Tansy's own room, which Poppy and Blue never had at all since they
     borrow her room rather than having one of their own. This is the front door: one page, every
     companion who actually has a real AR pair, a real portrait and a click through to theirs.

     Cassius is not here on purpose. He has AR footage (the mirror at Larkmere Hall), but no
     persona to chat as, and Dr. O separately said the effect itself "was not as cool as I hoped." -->

<style>
.wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 32px 4rem; }
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
.top a { font-family: var(--mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; }
.top a:hover { color: var(--accent); }
h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(1.6rem, 3.4vw, 2.4rem); margin: 0 0 .6rem; }
.lede { color: var(--ink-dim); max-width: 60ch; margin: 0 0 2.2rem; }
.grid {
  display: grid; gap: clamp(1rem, 2.4vw, 1.6rem);
  grid-template-columns: repeat(3, 1fr);
}
@media (max-width: 820px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
.ar-card > a { display: block; text-decoration: none; color: inherit; }
.ar-card .slot {
  position: relative; overflow: hidden; background: var(--panel); border-radius: 14px;
  aspect-ratio: 3/4; margin-bottom: .6rem; transition: opacity .15s;
}
/* MISSING THIS IS WHAT BLEW OUT THE WHOLE GRID. Without it each <img> renders at its own huge
   intrinsic size (an AI-generated portrait is easily a few thousand pixels wide), and a grid
   item's default min-width:auto lets that raw size force its column far past an even 1fr split --
   confirmed live: the two rendered columns came out 1152px and 3655px instead of equal thirds. */
.ar-card .slot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ar-card > a:hover .slot { opacity: .85; }
.ar-card-label {
  display: block; font-family: var(--mono); font-size: .78rem; letter-spacing: .08em;
  text-transform: uppercase; color: inherit;
}
.ar-card > a:hover .ar-card-label { color: var(--accent); }
</style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <a href="index.html">&larr; Good Company</a>
  </div>

  <h1>See them in your own room</h1>
  <p class="lede">Turn on your camera, and they stand right there on your own screen. Talk to them
    the same as you would in their room, out loud or typed. Nothing is recorded, uploaded, or sent
    anywhere.</p>

  <div class="grid">
    <div class="ar-card">
      <a href="ar.html?who=arch">
        <div class="slot"><img src="photos/arch-ar-cutout.jpeg" alt=""></div>
        <span class="ar-card-label">Arch</span>
      </a>
    </div>
    <div class="ar-card">
      <a href="ar.html?who=tansy">
        <div class="slot"><img src="photos/tansy-ar-cutout.jpeg" alt=""></div>
        <span class="ar-card-label">Tansy</span>
      </a>
    </div>
    <div class="ar-card">
      <a href="ar.html?who=poppy">
        <div class="slot"><img src="photos/poppy-ar-cutout.jpeg" alt=""></div>
        <span class="ar-card-label">Poppy</span>
      </a>
    </div>
    <div class="ar-card">
      <a href="ar.html?who=blue">
        <div class="slot"><img src="photos/blue-ar-cutout.jpeg" alt=""></div>
        <span class="ar-card-label">Blue</span>
      </a>
    </div>
    <div class="ar-card">
      <a href="ar.html?who=cressida">
        <div class="slot"><img src="photos/cressida-ar-cutout.jpeg" alt=""></div>
        <span class="ar-card-label">Cressida</span>
      </a>
    </div>
    <div class="ar-card">
      <a href="ar.html?who=meera">
        <div class="slot"><img src="photos/meera-ar-cutout.jpeg" alt=""></div>
        <span class="ar-card-label">Meera</span>
      </a>
    </div>
    <div class="ar-card">
      <a href="ar.html?who=nell">
        <div class="slot"><img src="photos/nell-ar-cutout.jpeg" alt=""></div>
        <span class="ar-card-label">Nell</span>
      </a>
    </div>
  </div>
</div>
</body>
</html>
