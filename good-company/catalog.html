<title>Good Company — The Catalog</title>
<meta name="description" content="Companions other people built and chose to share. Pick one to start your own copy.">

<!-- The friend resolves the opening skin, then the shared palette paints,
     same pattern as every other page here. No friend on this page, so it
     falls to the system preference, same as index.html and faq.html. -->
<script src="gc-friend.js"></script>
<script src="gc-skin.js"></script>
<link rel="stylesheet" href="gc-skin.css">

<style>
/* Palette, base body and shared primitives (including .topnav) are in
   gc-skin.css. Only this page's own layout is below. */
.wrap{ padding-inline:clamp(.9rem,2.2vw,1.75rem); max-width:720px; margin:0 auto; }

header{ display:flex; align-items:center; justify-content:space-between;
  gap:1rem; padding:1.1rem clamp(.9rem,2.2vw,1.75rem); }
h1{ font-family:Georgia,serif; font-weight:400; letter-spacing:-.012em; line-height:1.12;
  font-size:clamp(1.7rem,4.4vw,2.5rem); margin:1.6rem 0 .4rem; }
.lede{ color:var(--ink-dim); margin:1rem 0 1rem; max-width:52ch; }

/* Full-bleed, unlike the rest of this page's own .wrap column, since the
   image already carries the wordmark and cast -- the same job the plain
   H1 used to do in text. H1 stays in the markup, visually hidden, so a
   screen reader and search engines still get a real page title. */
.hero-band{ width:100%; overflow:hidden; }
.hero-band img{ display:block; width:100%; height:auto; }
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* ── the book itself ─────────────────────────────────────────────────────
   ONE COMPANION SHOWING AT A TIME, on purpose: a grid of thumbnails is a
   catalog you scan, a page you turn is a catalog you meet somebody from.
   The whole point of this feature is that each entry is a real person
   somebody built, not a SKU -- one at a time treats it that way. */
.flipbook{ position:relative; }
.flip-card{
  border:1px solid var(--line); border-radius:10px; overflow:hidden;
  background:var(--panel); box-shadow:var(--shadow, 0 1px 2px rgba(0,0,0,.06));
}
.flip-photo{
  position:relative; width:100%; aspect-ratio:16/10; overflow:hidden;
  background:var(--panel-2, var(--panel));
}
.flip-photo img{ display:block; width:100%; height:100%; object-fit:cover; }
.flip-body{ padding:1.1rem 1.3rem 1.3rem; }
.flip-body h2{ font-family:Georgia,serif; font-weight:400; font-size:1.4rem; margin:0 0 .25rem; }
.flip-tagline{ color:var(--ink-dim); font-size:.92rem; margin:0 0 .9rem; }
/* CREDIT, added 2026-08-29. Only rendered when a builder actually opted in
   -- see gc-catalog-add.js, which never sets creditName on an anonymous
   entry rather than storing a visible empty string. */
.flip-credit{
  font-family:var(--mono); font-size:.72rem; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-dim); margin:-.5rem 0 .9rem;
}
.flip-facts{
  display:flex; flex-wrap:wrap; gap:.4rem .5rem; margin:0 0 1rem;
  font-family:var(--mono); font-size:.72rem; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-dim);
}
.flip-facts span{ border:1px solid var(--line); border-radius:999px; padding:.25rem .7rem; }

.flip-scenes-label{
  font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-dim); margin:0 0 .5rem;
}
.flip-scenes{
  display:flex; gap:.6rem; overflow-x:auto; padding-bottom:.3rem; margin:0 0 1.1rem;
}
.flip-scene{
  flex:0 0 auto; width:6.5rem;
}
.flip-scene video, .flip-scene img{
  display:block; width:100%; aspect-ratio:3/4; object-fit:cover;
  border-radius:6px; background:var(--panel-2, var(--panel));
}
.flip-scene span{
  display:block; margin-top:.3rem; font-size:.68rem; color:var(--ink-dim);
  line-height:1.25; text-align:center;
}

/* TURNING, NOT SWAPPING. A plain content swap reads as a reload; a short
   fade-and-lift on the incoming card is the smallest amount of motion that
   still reads as one page settling in after the last one left, which is
   the entire ask ("flip book style"). Respects reduced-motion like every
   other transition on this campus. */
.flip-card{ opacity:1; transform:translateY(0); }
@media (prefers-reduced-motion:no-preference){
  .flip-card{ transition:opacity .22s ease, transform .22s ease; }
  .flip-card.flip-out{ opacity:0; transform:translateY(6px); }
}

.flip-nav{
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; margin-top:1rem;
}
.flip-count{ font-family:var(--mono); font-size:.78rem; letter-spacing:.06em; color:var(--ink-dim); }
.flip-arrows{ display:flex; gap:.6rem; }

.flip-empty, .flip-loading{
  border:1px dashed var(--line); border-radius:10px;
  padding:2.5rem 1.5rem; text-align:center; color:var(--ink-dim);
}

.back{ display:inline-block; margin:2rem 0 0; color:var(--ink-dim); }
.back:hover{ color:var(--ink); }
</style>
</head>

<body>

<header>
  <a class="mark" href="index.html">
    <img class="logo logo-dark-ink"  src="brand/logo-dark-ink.png"  alt="Good Company" width="560" height="244">
    <img class="logo logo-light-ink" src="brand/logo-light-ink.png" alt="Good Company" width="560" height="260">
  </a>
  <nav class="topnav">
    <a href="index.html#demos">Companions</a>
    <a href="index.html#pricing">Cost</a>
    <a href="build.html">Build</a>
    <a href="catalog.html">Catalog</a>
    <a href="index.html#bring">Friends</a>
    <a href="faq.html">Questions</a>
  </nav>
  <span class="picker" id="picker"><button class="btn" id="skinBtn" type="button">&#127912; Palette</button></span>
</header>

<div class="hero-band">
  <img src="photos/catalog-hero.jpg" alt="Good Company Catalog">
</div>

<main class="wrap">

  <h1 class="sr-only">The catalog</h1>
  <p class="lede">Companions other people built and chose to share here. Pick one and you get your
    own copy: same face, same scenes, same personality. Memories not included —
    <a href="faq.html#catalog">what does that mean?</a></p>

  <div class="flipbook" id="flipbook">
    <div class="flip-loading">Finding who's here&hellip;</div>
  </div>

  <p><a class="back" href="build.html">&larr; Build your own instead</a></p>

</main>

<script>
gcMountSkinPicker(document.getElementById("picker"), document.getElementById("skinBtn"));

/* ── load the list ──────────────────────────────────────────────────────── */
var ITEMS = [];
var idx = 0;
var book = document.getElementById('flipbook');

fetch('/.netlify/functions/gc-catalog-list')
  .then(function (r) { return r.json(); })
  .then(function (data) {
    ITEMS = (data && data.ok && Array.isArray(data.items)) ? data.items : [];
    if (!ITEMS.length) {
      book.innerHTML = '<div class="flip-empty">Nobody has added a companion to the catalog yet. ' +
        '<a href="build.html">Build one</a> and be the first.</div>';
      return;
    }
    render();
  })
  .catch(function () {
    book.innerHTML = '<div class="flip-empty">Could not reach the catalog. Try again in a moment.</div>';
  });

/* ── one page of the book ───────────────────────────────────────────────── */
function factList(item) {
  var facts = [];
  if (item.work) facts.push(item.work);
  if (item.from) facts.push(item.from);
  /* into CAN BE AN ARRAY (Marion, Aaron, etc. all use it that way) --
     pushing the whole array here let it fall through to Array.toString()
     wherever it got rendered, joining with a bare comma and no space
     ("...the day,EXPLAINING OCD..."). Each item is its own real fact and
     reads better as its own pill anyway. */
  if (Array.isArray(item.into)) facts = facts.concat(item.into);
  else if (item.into) facts.push(item.into);
  return facts;
}

/* WHAT A SCENE LOOKS LIKE HERE, added 2026-08-27 per Dr. O direct: "they
   probably want to see the scenes/images that come with it, not just a
   vague summary." A name and a one-line bio is not what somebody is
   actually choosing between; the rooms are. Same preview convention
   room.html's own scene picker already uses (see its renderScenes()) --
   a real muted, looping <video> for a local clip, a still image for a
   Vimeo-hosted one, so this reads consistent with the rest of the
   product rather than inventing a second visual language. Not
   clickable: there is no room to open yet for a companion nobody has
   started, this is only ever a preview of what comes with them. */
function sceneChipHtml(scene) {
  var label = escapeHtml(scene.label || '');
  if (scene.src) {
    return '<div class="flip-scene"><video src="' + escapeAttr(scene.src) + '" muted loop ' +
      'playsinline autoplay></video><span>' + label + '</span></div>';
  }
  var thumb = scene.thumb || (scene.vimeoId ? ('https://vumbnail.com/' + encodeURIComponent(scene.vimeoId) + '.jpg') : '');
  if (thumb) {
    return '<div class="flip-scene"><img src="' + escapeAttr(thumb) + '" alt="" ' +
      'onerror="this.style.display=\'none\'"><span>' + label + '</span></div>';
  }
  return '';
}

function scenesHtml(item) {
  var scenes = Array.isArray(item.scenes) ? item.scenes.filter(function (s) { return s && (s.src || s.vimeoId); }) : [];
  if (!scenes.length) return '';
  return '<div class="flip-scenes-label">Their rooms</div>' +
    '<div class="flip-scenes">' + scenes.map(sceneChipHtml).join('') + '</div>';
}

function cardHtml(item) {
  var img = item.portraitWide || item.portrait || '';
  var facts = factList(item);
  return (
    '<div class="flip-photo"><img src="' + escapeAttr(img) + '" alt=""></div>' +
    '<div class="flip-body">' +
      '<h2>' + escapeHtml(item.name || 'Somebody') + '</h2>' +
      (item.creditName ? '<p class="flip-credit">Added by ' + escapeHtml(item.creditName) + '</p>' : '') +
      (item.been ? '<p class="flip-tagline">' + escapeHtml(item.been) + '</p>' : '') +
      (facts.length ? '<div class="flip-facts">' + facts.map(function (f) {
        return '<span>' + escapeHtml(f) + '</span>';
      }).join('') + '</div>' : '') +
      scenesHtml(item) +
      '<button class="btn go" type="button" id="startBtn">Meet ' + escapeHtml(item.name || 'them') + '</button>' +
    '</div>'
  );
}

function render() {
  var item = ITEMS[idx];
  var card = document.createElement('div');
  card.className = 'flip-card';
  card.innerHTML = cardHtml(item);

  var nav = document.createElement('div');
  nav.className = 'flip-nav';
  nav.innerHTML =
    '<div class="flip-arrows">' +
      '<button class="btn" type="button" id="prevBtn"' + (ITEMS.length < 2 ? ' disabled' : '') + '>&larr; Back</button>' +
      '<button class="btn" type="button" id="nextBtn"' + (ITEMS.length < 2 ? ' disabled' : '') + '>Next &rarr;</button>' +
    '</div>' +
    '<span class="flip-count">' + (idx + 1) + ' of ' + ITEMS.length + '</span>';

  book.innerHTML = '';
  book.appendChild(card);
  book.appendChild(nav);

  document.getElementById('startBtn').addEventListener('click', function () { startWith(item); });
  if (ITEMS.length > 1) {
    document.getElementById('prevBtn').addEventListener('click', function () { turn(-1); });
    document.getElementById('nextBtn').addEventListener('click', function () { turn(1); });
  }
}

function turn(dir) {
  var card = book.querySelector('.flip-card');
  idx = (idx + dir + ITEMS.length) % ITEMS.length;
  if (!card) { render(); return; }
  card.classList.add('flip-out');
  setTimeout(render, 160);
}

/* ── picking one starts a real copy, same shape build.html itself makes ───
   No paid field set, changed 2026-08-27, Dr. O direct: "there is never an
   unlock everywhere." Opening the copy's room is free, same as every
   companion now; talking to it still costs real credits, checked live the
   same way it already is everywhere else. user is left blank on purpose,
   it describes the ORIGINAL builder (their own name/pronouns/about), never
   the person picking a copy now.

   ONE COPY PER CATALOG ENTRY PER BROWSER, added 2026-08-28: found live,
   five separate Isabelles piled up in one person's already-built list from
   pressing this more than once while testing. catalogSourceId is the
   catalog entry's own id (item.id, e.g. cat-xxxxx), stamped onto the copy
   so a second press can recognize "I already have this one" instead of
   minting another. Checked against GC_ALL_BUILT, the same array
   build.html's own list renders from. */
function startWith(item) {
  var already = (typeof GC_ALL_BUILT !== 'undefined' ? GC_ALL_BUILT : []).filter(function (f) {
    return f && f.catalogSourceId === item.id;
  })[0];
  if (already) {
    GC_touchFriend(already.id);
    location.href = 'build.html';
    return;
  }

  var friend = {};
  ['name','kind','age','gender','from','work','into','knows','been','voice','voiceId','portrait','portraitWide','scenes']
    .forEach(function (k) { if (item[k] !== undefined) friend[k] = item[k]; });
  friend.catalogSourceId = item.id;
  friend.id = GC_newFriendId();
  friend.createdAt = new Date().toISOString();
  friend.user = { call: '', want: [], about: '' };
  try { GC_saveFriend(friend); } catch (e) {}
  location.href = 'build.html';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function escapeAttr(s) { return escapeHtml(s); }
</script>

</body>
</html>
