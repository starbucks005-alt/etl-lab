/* THE OTHER END OF THE LINK ABOVE. Redeems the code and writes the exact same
   friend into THIS device's own gc-friends via the one function every save
   already goes through (GC_saveFriend, gc-friend.js), then reloads onto the
   normal ?who=<id> path so every existing resolution rule (GC_WHO, the swap
   menu, GC_touchFriend) picks it up with no separate code path to keep in
   sync with those. */
var SYNC_CODE = new URLSearchParams(location.search).get("sync");
if (SYNC_CODE) {
  history.replaceState({}, "", location.pathname);   // the code is spent either way
  $("gateTitle").textContent = "Getting your companion";
  $("gateSay").textContent = "One moment.";
  fetch("/.netlify/functions/gc-friend-sync?code=" + encodeURIComponent(SYNC_CODE))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.friend) {
        $("gateSay").textContent = "That link did not work: " + ((j && j.error) || "unknown") +
          ". Ask for a fresh one from the other device.";
        return;
      }
      GC_saveFriend(j.friend);
      location.href = "room.html?who=" + encodeURIComponent(j.friend.id);
    })
    .catch(function (err) {
      $("gateSay").textContent = "Could not reach it. " + err.message;
    });
}

/* ── ARRIVING ON A LINK ──────────────────────────────────────────────────────
   THE DOORSTEP COMES FIRST, AND THIS WAS WRONG THE FIRST TIME.

   The original version joined the room the instant the page loaded, before
   the guest had told us anything, and only then showed them the doorstep. Two
   failures fell out of that: they arrived nameless, so whatever they typed
   into the panel never reached the room; and if they pressed Sit down before
   the fetch came back, SEAT was still null and they went down the local path
   into a private conversation of their own. Which is exactly what happened.

   So the token is held, the doorstep is shown, and joining happens when they
   are ready and have a name and pronouns to arrive with. */
var PENDING_INVITE = new URLSearchParams(location.search).get("join");
if (PENDING_INVITE) {
  history.replaceState({}, "", location.pathname);   // the link is spent
  $("gateTitle").textContent = "You have been invited";
  $("gateSay").textContent =
    "Tell them who you are and you will be in the room. No sign in, no account. " +
    "You will see the conversation from the moment you arrive, not before it.";
  $("startBtn").textContent = "Join them";
}

/* Called instead of sitDown() when there is an invite in hand. */
/* Asked once, and only of somebody arriving on an invite. */
var nameAsked = false;

function joinThenSit() {
  var btn = $("startBtn");

  /* ARRIVE AS SOMEBODY. A guest who presses straight through without filling
     the name in lands in the room anonymous: their seat carries no name, so
     every line they say goes up under no name and the friend has nothing to
     call them by. Pookie arrived this way and the room could not tell her
     apart from Arch.

     Asked once, never enforced. Wanting to be in the room without giving a
     name is allowed; not being asked is the bug. */
  if (!nameAsked && !(YOU.name || "").trim()) {
    nameAsked = true;
    $("gateSay").textContent =
      "Put a name in first so they know who just walked in, then press it again. " +
      "Any name you like.";
    var f = $("youPanel").querySelector(".you-name-input");
    if (f) f.focus();
    return;
  }

  btn.disabled = true; btn.textContent = "Joining";

  fetch("/.netlify/functions/gc-room-join", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      invite_token: PENDING_INVITE,
      you: { name: YOU.name, pronouns: YOU.pronouns, avatar: YOU.photo || gcAvatarLabel(YOU.avatarId), remember_me: false }
    })
  }).then(function (r) { return r.json(); }).then(function (j) {
    btn.disabled = false;
    if (!j || !j.seat_token) {
      /* Says which problem rather than silently dumping them into a room of
         their own, which is the failure this whole rewrite exists to stop.

         AN INVITE IS FOR ONE PERSON AND IS USED UP. A second tap on the same
         link is the ORDINARY case, not an edge one: the host tests their own
         link, or two people are sent the same one. The server calls a spent
         link invite_not_found, which was missing from this list, so the
         commonest failure of all fell through to "something went wrong" and
         then offered the wrong person as a consolation. */
      PENDING_INVITE = null;
      var spent = "That link has already been used. They are single use, one per " +
                  "person, so ask for a fresh one.";
      $("gateTitle").textContent = "That invite has been used";
      $("gateSay").textContent =
        ({ invite_not_found:    spent,
           invite_already_used: spent,
           bad_invite:          "That link is not complete. Copying it again usually fixes it.",
           room_full:           "That room is full.",
           expired:             "That room has closed.",
           closed:              "That room has closed." }[j && j.error]) ||
        "Something went wrong joining. Ask them for a fresh link.";

      /* NOT OFFERED SOMEBODY ELSE AS A CONSOLATION. This used to say "you can
         still sit with Hollis on your own" to a person who had come here to
         join a particular room, naming whoever happened to be built on this
         device. You came to see somebody. Being handed a different person is
         not a smaller version of that. */
      btn.textContent = "Wait for a new link";
      btn.disabled = true;
      return;
    }
    SEAT = j.seat_token; ROOM = j.room_id; MY_SEAT_ID = j.seat_id || null;
    stopSpectating(); paintSpectate(); // a shared room's turns go through the room, not this button
    ROOM_CREDIT_REF = j.host_credit_ref || null;
    /* INSTRUMENTED 2026-08-28, arrival side of gc_invite_shown above. Fired
       once, on a genuinely successful join (past the invite_not_found /
       room_full / expired branch just above), not on every attempt.

       RETURN RATE STILL NEEDS MORE THAN THIS. A guest is anonymous, no
       account, and this event alone cannot tell "a guest came back later"
       from "a different guest joined a different room" -- that needs a
       persistent id planted in this browser at join time (localStorage,
       same no-account shape as everything else here) and checked against
       on any later visit, a real follow-up, not built tonight. */
    if (typeof gtag === 'function') gtag('event', 'gc_guest_joined');
    if (j.friend) {
      FRIEND = j.friend; nameEverything(); renderScenes();
      /* room_view, same event nameEverything()'s own call site fires for a
         direct ?who= visit -- this is the invite-arrival equivalent, the
         real friend was not known until just now. */
      if (typeof gtag === 'function') gtag('event', 'room_view', { room_id: FRIEND.id || FRIEND.name, room_name: FRIEND.name });
    }
    if (j.scene_key) {
      var sc = (FRIEND.scenes || []).filter(function (x) { return x.key === j.scene_key; })[0];
      if (sc) play(sc);
    }
    PENDING_INVITE = null;
    sitDown();
    startPolling();
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = "Try again";
    $("gateSay").textContent = "Could not reach the room. " + err.message;
  });
}
/* Everybody in the room reads from the same place. A guest is bounded below by
   their own arrival, which is enforced server side and cannot be argued down
   from here. */
function startPolling() {
  if (polling) return;
  polling = setInterval(function () {
    fetch("/.netlify/functions/gc-room-poll", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seat_token: SEAT, since: lastSeen })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.messages) return;
      var lastHeard = null, lastHeardBubble = null;
      var lastCameo = null;   // { text, bubble, voiceId } — see below
      j.messages.forEach(function (m) {
        lastSeen = m.created_at;

        /* MY OWN LINES ARE NEVER DRAWN FROM THE POLL. They went up the instant
           I pressed send and they are already on screen.

           Claiming the id when gc-room-say answers is too late, and that was
           the race putting typed messages up twice: that function writes the
           line to the room STRAIGHT AWAY and only then waits on the model, so
           for the ten seconds he is thinking the line is sitting there
           readable, and the poll fires every three. It would fetch my own
           sentence back and draw a second copy of it before the response
           carrying its id ever arrived. Whether it happened came down to where
           the three-second tick fell, which is why some typed lines doubled
           and others did not.

           The seat id is known at the door now, so this needs no round trip. */
        if (m.speaker === "person" && m.author_id && m.author_id === MY_SEAT_ID) {
          seen[m.id] = true;
          return;
        }

        if (seen[m.id]) return;      /* already drawn, by this browser or a prior poll */
        seen[m.id] = true;

        /* WHO SAID IT COMES FROM speaker, NEVER FROM A MISSING NAME. The old
           fallback was (m.name || FRIEND.name), so a guest who joined without
           typing a name had every word they said attributed to the friend.
           Pookie's line about her dog appeared over Arch's name. A person
           without a name is "Someone"; only the friend is ever the friend.

           A CAMEO IS ALSO speaker:"friend", added 2026-08-18: gc-room-say.js
           now persists Poppy/Biscuit/Mochi's line as its own message row
           the same way it persists the friend's own, so this used to always
           relabel it as Reggie or Tansy — every cameo line in a shared room
           was silently wearing the wrong name. m.name is trusted for a
           friend-speaker row now, and only falls back to FRIEND.name when
           it is genuinely missing. */
        var label = (m.speaker === "friend")
          ? (m.name || FRIEND.name || "Companion")
          : (m.name || "Someone");

        var bubble = post(label, m.content, m.speaker === "person" && m.author_id && m.author_id === MY_SEAT_ID);

        if (m.speaker === "friend") {
          var isCameo = m.name && m.name !== FRIEND.name;
          if (isCameo) {
            /* FRIEND.cameos ONLY EVER HAS THE HAND-AUTHORED ONES (Gus, Poppy,
               Blue...) -- a dynamic guest cameo like Isabelle is added to
               gc-chat.js's own copy of the friend for one request and never
               sent back to update this browser's copy, so looking her up
               here would always miss and wrongly read as narrated (no
               voice). Falls back to guestCameoLookup(), which searches this
               browser's full GC_ALL_BUILT by name -- not just whichever
               friend was built most recently -- since the cameo could be
               any built friend this visitor invited in by name. */
            var cEntry = (FRIEND.cameos || []).find(function (c) { return c && c.name === m.name; });
            if (!cEntry) cEntry = guestCameoLookup(m.name);
            lastCameo = { text: m.content, bubble: bubble, voiceId: cEntry ? cEntry.voiceId : null };
            /* Same reasoning as the solo-chat path: a narrated cameo (no
               voiceId at all, Gus/Barley) reads like a quote otherwise. */
            if (cEntry && !cEntry.voiceId) {
              var sharedCameoText = bubble.querySelector('.msg-text');
              if (sharedCameoText) sharedCameoText.style.fontStyle = 'italic';
            }
            /* Guarded by the same seen[m.id] check above this whole block,
               so this fires exactly once per real cameo, not once per poll
               tick that happens to redraw the same history. */
            rememberCameoElsewhere(m.name, m.content);
          } else {
            lastHeard = m.content; lastHeardBubble = bubble;
          }
        }
      });

      /* TELL US WHEN A GUEST ARRIVES, added 2026-08-18 per Dr. O: "It should
         tell us when our guest is in the room." Somebody who tapped a
         Bring Someone link used to just silently start appearing in the
         transcript the moment they said something; there was no signal
         that they had actually arrived. gc-room-poll.js already returns
         the full current roster on every tick, this just watches it for a
         name that was not there before. */
      if (j.people) {
        var currentNames = j.people.map(function (p) { return (p && p.name) || 'Someone'; });
        if (knownPeopleNames === null) {
          knownPeopleNames = {};
          currentNames.forEach(function (n) { knownPeopleNames[n] = true; });
        } else {
          currentNames.forEach(function (n) {
            if (!knownPeopleNames[n]) {
              knownPeopleNames[n] = true;
              post('Room', n + ' joined.');
            }
          });
        }
      }

      /* HE STAYS AUDIBLE IN A ROOM. Once a room exists his reply no longer
         comes back to the person who spoke; it arrives here, on everyone's
         poll, and nothing here used to speak it. So he went quiet the moment
         anybody was invited, which is precisely when being heard matters most.

         Only the last MAIN line of a batch is spoken, because speak()
         interrupts whatever is playing and a queue of two would talk over
         itself. A CAMEO, IF ONE ARRIVED IN THE SAME BATCH, chains after the
         main line via onDone rather than firing at the same time — same
         reasoning and same pattern as the solo-chat path in ask(), added
         2026-08-18 once shared rooms could carry a cameo line at all. */
      if (lastHeard) {
        speak(lastHeard, FRIEND.voiceId, function () {
          if (lastCameo && lastCameo.voiceId) speak(lastCameo.text, lastCameo.voiceId, undefined, lastCameo.bubble);
        }, lastHeardBubble);
      } else if (lastCameo && lastCameo.voiceId) {
        speak(lastCameo.text, lastCameo.voiceId, undefined, lastCameo.bubble);
      }
      /* THE SCENE IS SHARED. The host changes rooms and everybody follows,
         because if you are both sitting with him at the fireplace then you are
         both at the fireplace. */
      if (j.scene_key && (!current || current.key !== j.scene_key)) {
        var sc = (FRIEND.scenes || []).filter(function (x) { return x.key === j.scene_key; })[0];
        if (sc) play(sc);
      }
    }).catch(function () {});
  }, 3000);
}
/* ── WHAT THEY REMEMBER ──────────────────────────────────────────────────────
   The second thing this product promises, and the last thing in the room that
   was still a button apologising for itself.

   ON THIS DEVICE AND NOWHERE ELSE. There are no accounts here, so there is no
   server that could hold this without inventing one, and what somebody tells a
   friend to remember is the most personal thing in the product: who died, what
   they are frightened of, which day is hard. It is kept in this browser and
   sent nowhere except the request that produces their next reply. That is a
   real limit, said plainly in the panel rather than discovered later: clear
   the browser and it is gone.

   TYPED IN DELIBERATELY, NOT HARVESTED. Nothing is quietly extracted from the
   conversation and filed. You decide what they keep, you can read all of it
   back, and you can take any of it away. Being remembered is only a good thing
   when you know what is being remembered.

   Kept per friend, because Arch and the friend you built are different people
   and should not share a head. */
/* FIXED 2026-08-19: this checked GC_WHO === 'mine' literally, which is
   true only when the URL itself says ?who=mine. Every ordinary way of
   reaching a built friend's own room -- the homepage's "Go to Isabelle's
   room," build.html's "Open their room," a bookmark -- links by that
   friend's actual id instead, so this fell through to 'arch' for exactly
   the room it was supposed to recognise as "mine." rememberCameoElsewhere
   writes to 'gc-mem-mine' unconditionally; the Memory panel here was
   reading a different bucket entirely for anyone who did not literally
   type "mine" into the address bar. Dr. O: "she did not remember meeting
   them" -- this is why. Checked by actual identity now (id if the friend
   has one, name otherwise), not by which literal string is in the URL. */
function memKey() {
  var mine = (typeof GC_mostRecentBuilt === 'function') ? GC_mostRecentBuilt() : null;
  var isMine = !!(mine && FRIEND && (FRIEND.id ? FRIEND.id === mine.id : FRIEND.name === mine.name));
  return 'gc-mem-' + (isMine ? 'mine' : 'arch');
}

/* BOTH TAKE AN OPTIONAL KEY OVERRIDE, added 2026-08-19 for cameos-remember-
   elsewhere (see rememberCameoElsewhere below). Every existing call keeps
   working exactly as it did: omit it and both fall back to memKey(), the
   current room's own bucket. The one new caller needs to write into the
   VISITOR'S OWN friend's memory while physically standing in somebody
   else's room, where memKey() would resolve to the wrong bucket entirely. */
function loadMemories(key) {
  try {
    var v = JSON.parse(localStorage.getItem(key || memKey()) || '[]');
    return Array.isArray(v) ? v.filter(function (x) { return typeof x === 'string' && x.trim(); }) : [];
  } catch (e) { return []; }
}

function saveMemories(list, key) {
  try { localStorage.setItem(key || memKey(), JSON.stringify(list)); } catch (e) {}
  /* Carried on the friend, which is what gets sent to the model and what gets
     written into the room when somebody is invited, so a memory holds in both
     places without a second path to keep in step. Only for the CURRENT
     room's own friend -- writing a cameo note elsewhere must never overwrite
     what this room already has loaded for whoever FRIEND actually is here. */
  if (!key || key === memKey()) FRIEND.memories = list;
}

/* A CAMEO REMEMBERS ITSELF, added 2026-08-19. Dr. O: "will Isabelle
   remember being in the room?" She did not, anywhere -- a cameo lived
   only in whatever room it happened in and vanished the moment that tab
   closed. This is the bridge: when the cameo speaking is genuinely the
   visitor's own built friend (never a hand-authored one like Poppy or
   Gus, who have no memory panel of their own to write into), one line
   goes straight into their memory, the same 'gc-mem-mine' bucket the
   Memory panel itself reads -- so it is just there, unremarked, next
   time, the same as anything typed in by hand. */
function rememberCameoElsewhere(cameoName, cameoText) {
  var mine = (typeof GC_mostRecentBuilt === 'function') ? GC_mostRecentBuilt() : null;
  if (!mine || !mine.name || mine.name !== cameoName) return;
  var key = 'gc-mem-mine';
  var list = loadMemories(key);
  var here = (FRIEND && FRIEND.name) || 'somewhere else';
  /* REWORDED 2026-08-19, same day this shipped: Dr. O caught it repeating
     the meeting almost every reply, two rounds running. The instruction
     these are read under already says "most turns will touch none of it" --
     true for a flat typed fact like "my daughter is called Nell," not for
     this: a fresh, quoted, narratively vivid line was simply more
     interesting than an ordinary memory, and the model kept reaching for
     the interesting one. No quotation marks now (nothing that reads as a
     line worth repeating verbatim), past tense, and a plain de-emphasis
     said outright rather than trusted to the shared instruction alone. */
  var said = String(cameoText).replace(/[.!?]+$/, '').replace(/^["“]|["”]$/g, '');
  var note = 'Once spent a little time in ' + here + '’s room -- ' + said.slice(0, 260) +
    '. A small, ordinary thing from one afternoon, not worth bringing up often.';

  /* ONE NOTE PER ROOM, NOT ONE PER OCCURRENCE. Dr. O, live: five of these
     had piled up, all "Stopped by Tansy's room," each a different
     fragment -- and with five entries all on the same topic, of course
     the model kept reaching for it; that was most of what it knew about
     anything. A cameo happening again in the same room now updates the
     one existing note about that room instead of adding a sixth, so
     memory grows with genuinely new things, not five copies of the same
     relationship. */
  var marker = 'in ' + here + '’s room';
  var already = list.findIndex(function (m) { return typeof m === 'string' && m.indexOf(marker) > -1; });
  if (already > -1) list[already] = note.slice(0, 600);
  else list.push(note.slice(0, 600));
  saveMemories(list, key);
}

FRIEND.memories = loadMemories();

function renderMemories() {
  var host = $('memPanel');
  host.innerHTML = '';
  host.className = 'you-panel';

  var list = loadMemories();

  var note = document.createElement('p');
  note.className = 'gate-say';
  note.textContent = list.length
    ? FRIEND.name + ' has these in mind whenever you talk. Kept on this device only, ' +
      'and never anywhere else.'
    : 'Anything you put here, ' + FRIEND.name + ' will know next time without you having to ' +
      'say it again. Kept on this device only, and never anywhere else.';
  host.appendChild(note);

  list.forEach(function (text, i) {
    var row = document.createElement('div');
    row.className = 'you-row';

    var p = document.createElement('div');
    p.style.cssText = 'flex:1;min-width:0';
    p.textContent = text;
    row.appendChild(p);

    var x = document.createElement('button');
    x.type = 'button'; x.className = 'btn';
    x.textContent = 'Forget';
    x.title = 'Take this one away';
    x.addEventListener('click', function () {
      var next = loadMemories();
      next.splice(i, 1);
      saveMemories(next);
      renderMemories();
    });
    row.appendChild(x);
    host.appendChild(row);
  });

  var addRow = document.createElement('div');
  addRow.className = 'you-row';
  var label = document.createElement('label');
  label.className = 'you-label';
  label.textContent = 'Something for ' + FRIEND.name + ' to remember';
  addRow.appendChild(label);

  var box = document.createElement('textarea');
  box.rows = 3;
  box.placeholder = 'My daughter is called Nell. Tuesdays are hard.';
  box.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                      'background:var(--paper);color:var(--ink);border-radius:3px;resize:vertical';
  addRow.appendChild(box);
  host.appendChild(addRow);

  var add = document.createElement('button');
  add.type = 'button'; add.className = 'btn go'; add.textContent = 'Remember this';
  add.addEventListener('click', function () {
    var v = box.value.trim();
    if (!v) { box.focus(); return; }
    var next = loadMemories();
    next.push(v.slice(0, 600));
    saveMemories(next);
    box.value = '';
    renderMemories();
  });
  host.appendChild(add);
}

/* ── REACHING DR. O DIRECTLY ─────────────────────────────────────────────
   Added 2026-08-19. Pookie's invite sent her to Arch instead of Isabelle,
   and the only reason it got fixed is that it happened to Dr. O herself.
   A stranger hitting the same wall had no way to say so. This is that way
   -- a real message, no AI answering in its place, because the thing most
   likely to send somebody here is exactly the kind of problem a chatbot
   cannot actually fix. */
function renderHelp() {
  var host = $('helpPanel');
  host.innerHTML = '';
  host.className = 'you-panel';

  var note = document.createElement('p');
  note.className = 'gate-say';
  note.textContent = 'Something wrong, or something you cannot figure out? Say what happened ' +
    'and it goes straight to Dr. O, not a chatbot.';
  host.appendChild(note);

  var msgRow = document.createElement('div');
  msgRow.className = 'you-row';
  var box = document.createElement('textarea');
  box.rows = 4;
  box.placeholder = 'What happened, and what you expected instead.';
  box.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                      'background:var(--paper);color:var(--ink);border-radius:3px;resize:vertical';
  msgRow.appendChild(box);
  host.appendChild(msgRow);

  var fromRow = document.createElement('div');
  fromRow.className = 'you-row';
  var fromLabel = document.createElement('label');
  fromLabel.className = 'you-label';
  fromLabel.textContent = 'How to reach you back, if you want a reply';
  fromRow.appendChild(fromLabel);
  var from = document.createElement('input');
  from.type = 'text'; from.autocomplete = 'off';
  from.placeholder = 'an email address, or nothing at all';
  from.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                       'background:var(--paper);color:var(--ink);border-radius:3px';
  fromRow.appendChild(from);
  host.appendChild(fromRow);

  var send = document.createElement('button');
  send.type = 'button'; send.className = 'btn go'; send.textContent = 'Send';
  send.addEventListener('click', function () {
    var v = box.value.trim();
    if (!v) { box.focus(); return; }
    send.disabled = true; send.textContent = 'Sending';

    fetch('/.netlify/functions/gc-contact', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: v,
        from: from.value.trim(),
        page: location.pathname,
        friend_name: FRIEND && FRIEND.name,
      }),
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) {
        send.disabled = false; send.textContent = 'Try again';
        note.textContent = 'That did not send: ' + ((j && j.reason) || 'unknown') + '.';
        return;
      }
      host.innerHTML = '';
      var ok = document.createElement('p');
      ok.className = 'gate-say';
      ok.textContent = 'Sent. If you left a way to reach you, expect to hear back directly, ' +
        'not from a bot.';
      host.appendChild(ok);
    }).catch(function (err) {
      send.disabled = false; send.textContent = 'Try again';
      note.textContent = 'Could not reach it. ' + err.message;
    });
  });
  host.appendChild(send);
}

$('helpBtn').addEventListener('click', function () {
  renderHelp();
  showGate('help', 'Reach Dr. O', 'Not a chatbot. A real message, straight to her.');
  $('startBtn').textContent = 'Back to ' + FRIEND.name;
});

/* Which of the three panels the doorstep is showing. */
function showGate(panel, title, say) {
  $('chat').style.display = 'none';
  $('gate').style.display = 'block';
  $('youPanel').style.display = (panel === 'you') ? 'block' : 'none';
  $('memPanel').style.display = (panel === 'mem') ? 'block' : 'none';
  $('helpPanel').style.display = (panel === 'help') ? 'block' : 'none';
  $('gateTitle').textContent = title;
  $('gateSay').textContent = say;
}

$('memBtn').addEventListener('click', function () {
  renderMemories();
  showGate('mem', 'What ' + FRIEND.name + ' remembers',
    'Things you have asked ' + FRIEND.name + ' to keep. Add or remove any of it.');
  $('startBtn').textContent = 'Back to ' + FRIEND.name;
});

/* CREDITS, added 2026-08-18 per Dr. O: "let them see how many credits they
   have." No new panel, no new login: posted into the log the same way an
   upsell or a wiring error already is, since a balance is a one-off fact
   to glance at, not something that needs its own screen. */
$('creditsBtn').addEventListener('click', function () {
  var token = GC_accessToken();
  if (!token) { post('Credits', 'No account on this browser yet — build a companion, subscribe, or buy credits to get one.'); return; }
  fetch('/.netlify/functions/gc-my-credits', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ access_token: token })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || j.balance === undefined) { post('Credits', 'Could not check your balance right now.'); return; }
    post('Credits', j.balance + ' credit' + (j.balance === 1 ? '' : 's') + ' left' +
      (j.subscription_active ? ', refills automatically each month.' : '.'));
  }).catch(function () { post('Credits', 'Could not check your balance right now.'); });
});
/* ── SPEAKING INSTEAD OF TYPING ──────────────────────────────────────────────
   The browser's own speech recognition. No API, no key, no per-minute cost,
   which matters for a product whose audience will use it a lot.

   IT STAYS ON. Press once and it keeps listening: you pause, it sends what you
   said, and it carries on. Press again to stop. Somebody with arthritis or a
   tremor should not have to hold a button down, and somebody mid-thought
   should not lose the end of a sentence to a timer.

   Chrome does this by sending audio to Google, which is exactly what the hint
   under the wake word already says: audio leaves the browser only while it is
   on. Off by default, and visibly on when it is on. */
var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false;

/* micManual: the mic button, pressed on purpose, everything typed or spoken
   sends without needing a wake word, exactly as it always has.

   THE LISTEN BUTTON (ambient wake-word mode, wakeMode/awaitingWake) WAS
   REMOVED 2026-08-30, Dr. O direct: "it is something we use in My Echo" --
   a deliberate product-line distinction, not a bug. It shared this same
   recognizer rather than running a second one (two SpeechRecognition
   instances fighting over one microphone is unreliable across browsers),
   which is why removing it left micManual's own logic untouched below. */
var micManual = false;

function micLabel() {
  $('micBtn').innerHTML = micManual ? '&#128308;' : '&#127908;';
  $('micBtn').title = micManual
    ? 'Listening. Pause and it sends. Press to stop.'
    : 'Speak instead of typing. It stays on: pause and it sends, then keeps listening.';
}
function ensureRec() { if (!listening) startListening(); }
function stopRecIfIdle() { if (listening && !micManual) stopListening(); }

function startListening() {
  if (!Rec) {
    notYet('Speaking instead of typing',
      'This browser will not do speech recognition. Chrome and Edge will.');
    return;
  }
  rec = new Rec();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = navigator.language || 'en-US';

  var pending = '';

  /* NOTHING IS READ TWICE. This is what was sending every spoken line to the
     room in duplicate while typing was fine.

     With continuous on, e.results holds EVERY result of the session, not just
     the new ones, and the loop below trusts e.resultIndex to say where the new
     ones begin. Chrome resets that index when it restarts recognition, which
     onend does on purpose so that "it stays on" is true. After a restart the
     loop therefore walks back over speech that was already finalised and sends
     it again. "I am still here, Arch", twice. */
  var taken = 0;

  rec.onresult = function (e) {
    /* THE FEEDBACK LOOP. Dr. O: "when Sophia talks on audio her voice is
       displayed as text in my text space and sends." Nothing here was ever
       telling the mic to stop listening while his own reply was coming out
       of the speaker, so on a laptop without headphones the mic hears him,
       recognition transcribes him, and the room sends his own words back to
       him as though the person had said them.

       PORTED FROM MY ECHO'S OWN HARDENED VERSION OF THIS, not guessed at
       fresh. ME hit this live (2026-08-15: Terry said something kind about
       Ivy, M.E.'s spoken reply got picked up by the still-open mic and sent
       back as Terry's next line), tried a fixed pause after playback ends,
       found it still happening, and traced it to recognition lag: a final
       result can land two or three seconds behind the audio that produced
       it, so a short window closes before the delayed transcript of his own
       voice arrives. Their fix, copied here: every result heard WHILE he is
       talking pushes the deaf window forward again, so it stays shut until
       a real gap after he actually stops, not a fixed pause from the moment
       hush() fires.

       IGNORED, NOT PAUSED, same reasoning as ME: stopping and restarting the
       recognition engine around every reply risks losing whatever the person
       is mid-saying when he starts talking.

       SAID PLAINLY, ALSO FROM ME'S OWN COMMENT: this reduces the loop, it
       does not close it completely. Real echo cancellation would need
       control over the microphone's own audio pipeline that the Web Speech
       API does not expose, and ME still sees this "sometimes" even with the
       longer tail. Barge-in was never the goal; not hearing himself is. */
    if (speaking) micQuietUntil = Date.now() + MIC_TAIL_MS;
    if (speaking || Date.now() < micQuietUntil) return;

    var finalBit = '';
    /* Never behind what has already been consumed, whatever the index claims. */
    for (var i = Math.max(e.resultIndex, taken); i < e.results.length; i++) {
      if (e.results[i].isFinal) { finalBit += e.results[i][0].transcript; taken = i + 1; }
      else $('say').value = pending + e.results[i][0].transcript;   // show it forming
    }
    if (finalBit || pending) {
      pending = (pending + ' ' + finalBit).trim();
      $('say').value = pending;
      /* A PAUSE IS THE SEND, AND 1.4 SECONDS IS NOT A PAUSE. It is the gap in
         the middle of an ordinary sentence.

         Pookie, mid-sentence, into the room: "it's not letting me finish what
         I was sending". Her side of that conversation arrived as "Okay so",
         "well", "well", "because one is listen and", "where if you". Every one
         of those is somebody thinking, chopped off and posted as though it
         were a finished thought, and it reads back to her as a machine talking
         over her.

         Nearly three seconds now, and longer still when what is held is short
         enough to obviously be the start of something. "Okay so" is never a
         complete thing anybody meant to say. Waiting too long only costs a
         moment; cutting somebody off costs them the sentence. */
      var held = $('say').value.trim();
      var wait = held.length < 25 ? 4500 : 2800;

      clearTimeout(rec._pause);
      rec._pause = setTimeout(function () {
        if ($('say').value.trim()) { send(); pending = ''; }
      }, wait);
    }
  };

  /* Chrome ends the session on its own after a while. If we are still meant to
     be listening, start it again, so 'it stays on' is actually true. The new
     session gets a fresh results array, so the consumed mark starts over with
     it. Getting this wrong in the other direction would swallow speech. */
  rec.onend = function () {
    taken = 0;
    if (listening) { try { rec.start(); } catch (_) {} }
  };

  rec.onerror = function (e) {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      listening = false; micManual = false;
      micLabel();
      /* NOT notYet, BECAUSE THE MICROPHONE IS BUILT. This read "The microphone
         is not built yet. The browser refused access", which is two
         contradictory sentences and sends somebody looking for a feature that
         is right there. A browser refusing permission is a thing they can fix
         in about five seconds, and saying so is the entire job here. */
      post('The microphone', 'Your browser blocked it. Allow the microphone from the ' +
           'icon in the address bar and press it again.');
    }
    /* no-speech and aborted are ordinary. onend restarts. */
  };

  try { rec.start(); listening = true; micLabel(); }
  catch (_) { listening = false; micLabel(); }
}

function stopListening() {
  listening = false;
  if (rec) { try { rec.stop(); } catch (_) {} }
  micLabel();
}

$('micBtn').addEventListener('click', function () {
  if (!gcSeenComposerIntro()) gcDismissComposerIntro();
  micManual = !micManual;
  if (micManual) { ensureRec(); }
  else { stopRecIfIdle(); }
  micLabel();
});
micLabel();

/* Close was wired to nothing. In a full-screen room with no wordmark it is the
   only way out, so it goes home. */
$('closeBtn').addEventListener('click', function () { location.href = 'index.html'; });


/* ── ARCH SPEAKS ────────────────────────────────────────────────────────────
   Off by default and opted into, because speech is billed per character and
   this audience talks a lot. Text costs nothing; audio is a choice.

   His voice id lives with the rest of him in gc-friend.js, not in a lookup
   table here, because a voice is part of a person rather than a setting.

   ALWAYS INTERRUPTIBLE. Somebody who wants to say something should never
   have to wait for him to finish, so any new line stops the old audio, and
   there is a visible Stop while he is talking. */
/* THE ECHO GUARD lives with the mic, near rec.onresult: this flag is what it
   checks to know he is actually making sound right now. See the long
   comment there for why a fixed pause after hush() was not enough.

   MIC_TAIL_MS/micQuietUntil PROMOTED OUT OF startListening(), 2026-08-18,
   after Dr. O reported the leak "still there and bad" even with the 3s
   tail. Reading the guard again found the real gap: it was ONLY extended
   from inside rec.onresult, while speech was being heard. If recognition
   produced no result near the true end of a reply (lag, a quiet trailing
   word), the window's last extension could sit well behind the actual
   moment playback stopped, so a late-arriving transcript of his own last
   syllables could land after the window had already expired. Now hush()
   itself extends the window at the moment audio actually stops, so the
   full 3s always counts from real playback end, not from wherever
   recognition last happened to fire. */
var MIC_TAIL_MS = 3000;
var micQuietUntil = 0;
var speaking = null;

function hush() {
  if (speaking) {
    try { speaking.pause(); } catch (_) {}
    speaking = null;
    micQuietUntil = Date.now() + MIC_TAIL_MS;
  }
  $("stopBtn").style.display = "none";
}

/* REPLAY, added 2026-08-18 per Dr. O, after Reggie's Duke-and-the-mailman
   speech: "can you make it so we can replay his text - voice?" The audio
   already exists in the browser by the time this button appears (it just
   played once), so replaying it costs nothing extra: no second call to
   gc-voice.js, no second credit spent. Only ever attached to a message that
   actually played successfully; text-only or failed messages get no button,
   since there is nothing cached to replay. */
function playCachedAudio(b64) {
  hush();
  speaking = new Audio("data:audio/mpeg;base64," + b64);
  $("stopBtn").style.display = "inline-block";
  speaking.onended = hush;
  speaking.play().catch(function () { hush(); });
}
function addReplayButton(bubble, b64) {
  if (!bubble) return;
  var btn = document.createElement('button');
  btn.className = 'replay-btn';
  btn.type = 'button';
  btn.title = 'Play this again';
  btn.innerHTML = '&#128266; Replay';
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    playCachedAudio(b64);
  });
  bubble.appendChild(btn);
}

function speak(text, voiceId, onDone, bubble) {
  /* voiceId DEFAULTS TO THE FRIEND'S OWN, so every existing call site
     (speak(text)) is untouched. The override exists for a cameo line
     (Poppy, in Tansy's own room) which needs a different voice than the
     friend she is chained after. onDone is ALWAYS called eventually, audio
     on or off, success or failure, so a caller can chain a second line
     (the cameo's text bubble and speech) without caring whether audio is
     even enabled. bubble, if given, gets a Replay button once the audio for
     THIS line actually arrives. */
  voiceId = voiceId || FRIEND.voiceId;
  if (!asAudio || !voiceId || !text) { if (onDone) onDone(); return; }
  hush();

  /* SAY THE NAME RIGHT. Only the audio is substituted: the transcript keeps
     the real spelling, because the point is that they are seen properly, not
     that their name gets rewritten. */
  var spoken = text;
  if (YOU.saidAs && YOU.name) {
    var escaped = YOU.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    spoken = spoken.replace(new RegExp('\\b' + escaped + '\\b', 'g'), YOU.saidAs);
  }
  fetch("/.netlify/functions/gc-voice", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text: spoken, voice_id: voiceId,
      /* access_token covers a solo conversation or the host; credit_ref
         covers a guest, who never holds the host's real token. gc-voice.js
         tries the token first and only falls back to the reference.
         is_demo/visitor_id, added 2026-08-18: lets a house demo draw free
         audio from the same daily pool text already uses — "the free daily
         has to have audio because the audio makes it." */
      access_token: GC_accessToken(), credit_ref: ROOM_CREDIT_REF, owner_key: GC_ownerKey(),
      /* Same currentDemoId() fix as the ask() call above, same date, same
         reason: this used to be FRIEND === GC_DEMO, true only for Arch. */
      is_demo: !!currentDemoId(), visitor_id: GC_visitorId(),
      /* friend_id, added 2026-08-28: gc-voice.js now checks THIS companion's
         own credit row (per-companion subscriptions), not a pooled balance,
         same reason gc-chat.js's own ask() call needs it. Undefined for a
         demo, which has no per-companion row to check. */
      friend_id: (!currentDemoId() && FRIEND && FRIEND.id) || undefined
    })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.daily_capped) {
      if (!speak._creditsWarned) { speak._creditsWarned = true; showCreditsUpsell(true, j.owner_key_rejected); }
      if (onDone) onDone();
      return;
    }
    if (j && j.credits_exhausted) {
      /* A real, named reason, not a generic wiring failure, and only once:
         nobody needs this said again on every single line while audio stays
         toggled on with nothing left to spend on it. */
      if (!speak._creditsWarned) { speak._creditsWarned = true; showCreditsUpsell(false, j.owner_key_rejected); }
      if (onDone) onDone();
      return;
    }
    if (!j || !j.audio) {
      /* Says which problem rather than failing silently, and only once: a
         missing voice key should not nag on every single line. */
      if (!speak._warned) { speak._warned = true; post("Not wired yet", "Could not fetch his voice: " + ((j && j.error) || "unknown") + ". Text still works."); }
      if (onDone) onDone();
      return;
    }
    speaking = new Audio("data:audio/mpeg;base64," + j.audio);
    $("stopBtn").style.display = "inline-block";
    speaking.onended = function () { hush(); if (onDone) onDone(); };
    speaking.play().catch(function () { hush(); if (onDone) onDone(); });
    addReplayButton(bubble, j.audio);
  }).catch(function () { hush(); if (onDone) onDone(); });
}

var asAudio = false;
$('replyBtn').addEventListener('click', function () {
  if (!gcSeenComposerIntro()) gcDismissComposerIntro();
  asAudio = !asAudio;
  this.innerHTML = asAudio ? '&#127911; Audio On' : '&#127911; Audio Off';
  if (!asAudio) hush();
});
</script>

</body>
</html>
