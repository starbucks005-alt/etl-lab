/* THE CHAT FUNCTION. Same path locally and on the campus: serve.js aliases it
   to the very file that deploys, so what is tested is what ships. */
var CHAT_URL = "/.netlify/functions/gc-chat";
var thinking = false;
var lastSpoke = Date.now();

/* THE SCALE MOVES. It is how somebody sees that they landed, and how they can
   check on him and tell whether he is all right, which is the whole reason it
   is above the video rather than tucked in a panel. The bars were hardcoded
   percentages until now, so a person could ask after him and get nothing back.

   Comes down with the reply in the same model call, so a living gauge costs
   nothing extra. */
function setFeelings(f) {
  var map = { happy:"f-happy", sad:"f-sad", fear:"f-fear", disgust:"f-disgust",
              anger:"f-anger", surprise:"f-surprise", curious:"f-curious" };
  Object.keys(map).forEach(function (k) {
    var bar = document.querySelector("." + map[k]);
    if (bar && typeof f[k] === "number") bar.style.width = Math.max(0, Math.min(100, f[k])) + "%";
  });
}

function transcript() {
  return Array.prototype.map.call($("log").children, function (el) {
    var w = el.querySelector(".who");
    var who = w ? w.textContent.trim() : "";
    return { who: who,
             text: el.textContent.slice(who.length).trim(),
             mine: el.classList.contains("mine") };
  });
}

function ask(payload) {
  thinking = true;
  $("sendBtn").disabled = true;
  return fetch(CHAT_URL, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({
      friend: FRIEND,
      you: { name: YOU.name, pronouns: YOU.pronouns },
      messages: transcript(),
      scene: current ? { label: current.label, where: current.where } : null,
      /* THE CREDIT CEILING, added 2026-08-17. is_demo tells gc-chat.js
         whether this is a house friend (free, daily-capped) or a friend
         somebody built (paid rung, credits only, no free fallback). The
         other two are the same shared identity Almost Human already uses;
         a person's existing membership just works here. */
      is_demo: FRIEND === GC_DEMO,
      visitor_id: GC_visitorId(),
      access_token: GC_accessToken(),
      owner_key: GC_ownerKey()
    }, payload))
  }).then(function (r) { return r.json(); }).then(function (j) {
    thinking = false; $("sendBtn").disabled = false;
    lastSpoke = Date.now();
    /* A NULL REPLY IS A REAL ANSWER, not a failure. Nothing is rendered: no
       bubble, no apology, no dots. If silence cannot be produced the room
       always feels like a demo. */
    if (j && j.reply) {
      var replyBubble = post(FRIEND.name, j.reply);
      /* THE CAMEO, IF THERE IS ONE (Poppy, in Tansy's room, rarely).
         Text posts right away either way. The speech is chained after her
         own line finishes, via onDone, rather than fired at the same time,
         so audio mode never has two voices talking over each other. */
      speak(j.reply, FRIEND.voiceId, function () {
        if (j.cameo && j.cameo.text) {
          var cameoBubble = post(j.cameo.name, j.cameo.text);
          speak(j.cameo.text, j.cameo.voice_id, undefined, cameoBubble);
        }
      }, replyBubble);
    }
    else if (j && (j.credits_exhausted || j.daily_capped)) { showCreditsUpsell(j.daily_capped); }
    else if (j && j.error) post("Not wired yet", "The chat function said: " + j.error);
    if (j && j.mood) $("gaugeLabel").textContent = j.mood;
    if (j && j.feelings) setFeelings(j.feelings);
    return j;
  }).catch(function (err) {
    thinking = false; $("sendBtn").disabled = false;
    post("Not wired yet", "Could not reach " + FRIEND.name + ". " + err.message);
  });
}

/* ── THE UPSELL, WHEN CREDITS OR THE FREE CAP RUN OUT ────────────────────────
   Matches Almost Human's own showUpsell pattern: daily_capped (a house demo,
   free tier exhausted for today) offers the $9.99/mo subscribe button;
   credits_exhausted (a paid built friend, or a subscriber who ran dry)
   offers subscribe AND, if there is already a token to top up, the $4.99
   addon. return_to sends them straight back to this room afterward, since
   it is the same membership either way. */
var creditsUpsellShown = false;
function showCreditsUpsell(isDailyCap) {
  if (creditsUpsellShown) return;
  creditsUpsellShown = true;

  var box = document.createElement('div');
  box.className = 'msg';
  box.id = 'creditsUpsell';

  var say = document.createElement('div');
  say.textContent = isDailyCap
    ? "That's today's free messages with " + FRIEND.name + ". Come back tomorrow, or go unlimited."
    : "Out of credits for " + FRIEND.name + " right now.";
  box.appendChild(say);

  var actions = document.createElement('div');
  actions.style.cssText = 'margin-top:.5rem; display:flex; gap:.5rem; flex-wrap:wrap;';

  var subBtn = document.createElement('button');
  subBtn.type = 'button'; subBtn.className = 'btn go';
  subBtn.textContent = '$9.99/mo, unlimited';
  subBtn.addEventListener('click', function () { startCreditsCheckout('/.netlify/functions/create-checkout-ah', {}); });
  actions.appendChild(subBtn);

  /* ALWAYS OFFERED NOW, not just to somebody who already has a token.
     create-checkout-ah-addon.js mints a fresh one on success if this visitor
     has none yet, added 2026-08-18: "we need to let them buy credits. the
     demos may end up being the star of the app." A first sit-down with
     Reggie or Tansy should not have to end at "subscribe monthly or stop." */
  var existingToken = GC_accessToken();
  var addonBtn = document.createElement('button');
  addonBtn.type = 'button'; addonBtn.className = 'btn';
  addonBtn.textContent = '+30 credits, $4.99';
  addonBtn.addEventListener('click', function () {
    startCreditsCheckout('/.netlify/functions/create-checkout-ah-addon', { access_token: existingToken || '' });
  });
  actions.appendChild(addonBtn);

  box.appendChild(actions);
  $('log').appendChild(box);
  $('log').scrollTop = $('log').scrollHeight;
}

function startCreditsCheckout(url, extra) {
  var returnTo = location.pathname + location.search;
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ return_to: returnTo }, extra))
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.url) { location.href = data.url; }
      else { post('Not wired yet', 'Could not start that just now. Try again in a moment.'); }
    })
    .catch(function () { post('Not wired yet', 'Could not start that just now. Try again in a moment.'); });
}

/* ── SHOWING THEM SOMETHING ──────────────────────────────────────────────────
   Dr. O: the friend should be able to receive images and see webpages, the way
   Claude can. This is the images half, and it is the half people actually
   reach for: the dog, the garden, the grandchildren, what somebody has cooked.

   SHRUNK BEFORE IT GOES. A modern phone photograph is four thousand pixels
   across and several megabytes, and vision tokens scale with size, so a
   friend being shown the garden should not cost more than a long conversation.
   1024 across is plenty for somebody to talk about and a fraction of the bill.

   IT LEAVES THE DEVICE, and that is said once, the first time, rather than
   buried. Everything else in this room stays in the browser. */
var pending = [];        // what is queued to show them, already shrunk
var saidPicturesLeave = false;

function shrink(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var max = 1024, w = img.width, h = img.height;
      if (Math.max(w, h) > max) {
        if (w > h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('that file is not a picture')); };
    img.src = url;
  });
}

function queuePictures(files) {
  var list = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\//.test(f.type); });
  if (!list.length) return;
  /* Four is what the friend is given; queueing more just wastes the person's
     time shrinking pictures that will not be sent. */
  list = list.slice(0, 4 - pending.length);

  Promise.all(list.map(shrink)).then(function (shrunk) {
    pending = pending.concat(shrunk);
    if (!saidPicturesLeave) {
      saidPicturesLeave = true;
      post('Showing ' + FRIEND.name, 'A picture you show them is sent so they can see it. ' +
           'It is the only thing here that leaves this device.');
    }
    showQueue();
  }).catch(function (err) {
    post('Showing ' + FRIEND.name, 'That could not be opened: ' + err.message);
  });
}

/* What is about to be sent, with a way to change your mind. */
function showQueue() {
  var old = document.getElementById('queue');
  if (old) old.remove();
  if (!pending.length) return;

  var box = document.createElement('div');
  box.id = 'queue'; box.className = 'msg';
  var row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:.4rem;flex-wrap:wrap;align-items:center';
  pending.forEach(function (src, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn';
    b.style.cssText = 'padding:0;overflow:hidden;width:64px;height:64px';
    b.title = 'Take this one back';
    var im = document.createElement('img');
    im.src = src; im.alt = '';
    im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
    b.appendChild(im);
    b.addEventListener('click', function () { pending.splice(i, 1); showQueue(); });
    row.appendChild(b);
  });
  var note = document.createElement('span');
  note.className = 'hint';
  note.textContent = 'Sends when you do. Tap one to take it back.';
  row.appendChild(note);
  box.appendChild(row);
  $('log').appendChild(box);
  $('log').scrollTop = $('log').scrollHeight;
}

$('showBtn').addEventListener('click', function () { $('pickPic').click(); });
$('pickPic').addEventListener('change', function () { queuePictures(this.files); this.value = ''; });

/* Pasting a screenshot is how most people will do this without being told. */
$('say').addEventListener('paste', function (e) {
  var items = (e.clipboardData && e.clipboardData.files) || [];
  if (items.length) { queuePictures(items); e.preventDefault(); }
});

var lastSent = '', lastSentAt = 0;

function send() {
  var v = $("say").value.trim();
  /* A PICTURE ON ITS OWN IS A MESSAGE. Handing somebody your phone without
     saying anything is a normal thing to do, so an empty box with something
     queued still sends. */
  if ((!v && !pending.length) || thinking) return;

  /* THE SAME WORDS TWICE IN A MOMENT ARE A BUG, NOT A PERSON.

     This is the last line of defence and it has to be, because the cause
     upstream cannot be told apart from ordinary speech: when Chrome restarts
     recognition it may replay what it already finalised, and it looks
     identical to somebody saying it again. Refusing to reset the consumed mark
     on a restart would swallow the first real sentence of every new session,
     which is worse.

     HOW LONG DEPENDS ON HOW MUCH WAS SAID. "Yes" twice in five seconds is a
     person agreeing twice, and it goes through. A whole sentence repeated word
     for word inside fifteen seconds is a machine, every time. */
  var window = v.length < 12 ? 2000 : 15000;
  if (v === lastSent && (Date.now() - lastSentAt) < window) { $("say").value = ""; return; }
  lastSent = v; lastSentAt = Date.now();

  /* On screen before it goes, so the friend is reacting to something the
     person can still see. */
  var shown = pending.slice();
  var q = document.getElementById('queue'); if (q) q.remove();
  pending = [];
  post(youLabel(), v || '(showing you this)', true, shown);
  $("say").value = "";
  lastSpoke = Date.now();
  /* SPEAKING RESETS HOW SOON HE BREAKS A SILENCE. Only typing did, and typing
     is not how everybody talks: a person using the microphone never fired the
     input event, so the ladder never went back to the bottom for them. */
  idleStep = 0;

  /* Once there is a room, everything goes through it: the line has to reach the
     other browsers, and whether the friend answers at all is decided server
     side by the room's size, not here. */
  if (SEAT) { sayInRoom(v || '(showing you this)'); return; }
  ask({ message: v || '', images: shown });
}

function sayInRoom(text) {
  thinking = true; $("sendBtn").disabled = true;
  fetch("/.netlify/functions/gc-room-say", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ seat_token: SEAT, message: text })
  }).then(function (r) { return r.json(); }).then(function (j) {
    thinking = false; $("sendBtn").disabled = false;
    lastSpoke = Date.now();
    /* Mine is on screen already. Claiming its id here is what stops the next
       poll drawing a second copy of it. */
    if (j && j.said && j.said.id) { seen[j.said.id] = true; MY_SEAT_ID = j.said.author_id || MY_SEAT_ID; }
    /* A null reply is correct and common in a room with several people in it.
       Nothing is rendered. The poll will bring anything he did say, and speak it. */
    if (j && j.daily_capped) showCreditsUpsell(true);
    if (j && j.feelings) setFeelings(j.feelings);
    if (j && j.mood) $("gaugeLabel").textContent = j.mood;
  }).catch(function (err) {
    thinking = false; $("sendBtn").disabled = false;
    post("Not wired yet", "Could not reach the room. " + err.message);
  });
}

/* ── BREAKING A SILENCE ──────────────────────────────────────────────────────
   The complaint that every chat room on this campus has: nobody speaks first.
   Chat is request and response, so quiet produces nothing, and the moment
   somebody sits down not knowing how to start is exactly the moment this
   product is for.

   So the friend gets ASKED whether they want to say something. They may
   decline, and declining is normal. Backing off each time and stopping after
   a few, so an abandoned tab is not talking to an empty chair, and only while
   the tab is actually in front. */
/* HOW LONG A SILENCE HAS TO BE BEFORE IT IS ONE.

   This was 40 seconds, and Dr. O: "Arch is overdoing the me not talking, he is
   saying it every minute or so." Forty seconds is not a silence. It is less
   time than it takes to read the paragraph he just wrote, and the clock starts
   from HIS reply, so sitting and reading was enough to get asked whether you
   were still there. Being checked on that often is not company, it is being
   hovered over, and it teaches you the room cannot be sat in quietly.

   Ten minutes now, Dr. O's revised number ("5 is too soon"), then fifteen,
   then forty, then he leaves it alone. A person who has gone to make tea
   comes back to the room as they left it. Nothing here is allowed to make
   sitting quietly feel like being watched.

   If this ever needs shortening again, it probably does not; ask first. Being
   left in peace is the feature, and the nudge is only for somebody who
   genuinely does not know how to start. */
var IDLE_STEPS = [600, 900, 2400];   // seconds, then it stops
var idleStep = 0;

setInterval(function () {
  if (thinking || idleStep >= IDLE_STEPS.length) return;
  if (document.hidden) return;                       // not talking to a background tab
  if (!$("log").children.length) return;             // nobody has sat down yet
  if ((Date.now() - lastSpoke) / 1000 < IDLE_STEPS[idleStep]) return;
  idleStep += 1;
  ask({ idle: true, idleSeconds: IDLE_STEPS[idleStep - 1] });
}, 5000);

/* Anything said by anybody resets the whole ladder. */
$("say").addEventListener("input", function () { lastSpoke = Date.now(); idleStep = 0; });
$("stopBtn").addEventListener("click", hush);
$('sendBtn').addEventListener('click', send);
$('say').addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

/* A NEW TAB, NEVER THIS ONE. Dr. O: Pookie opened the photo album mid
   conversation, closed it, and the room had kicked her out.

   Navigating room.html away entirely was worse than losing her place. SEAT
   lives only as a JavaScript variable, nowhere in storage, and the polling
   interval it drives is torn down the moment the page unloads. Coming back
   was not "reload and resume", it was landing on this page as though for the
   first time, with the one thing that could get her back in, the invite
   link, already spent because invites are single use. There was no way back
   in at all, which is the shape of "kicked out".

   Fixed at the only point that matters: never leave. Opened in a new tab so
   the room, its poll, and its live SEAT are simply never touched.

   WHO= IS PASSED EXPLICITLY rather than left to sessionStorage to carry
   across, because whether a new tab opened this way inherits the opener's
   sessionStorage is genuinely inconsistent across browsers. GC_WHO is already
   resolved here; handing the same answer to the new tab in the URL makes it
   correct regardless. */
$('albumBtn').addEventListener('click', function () {
  var who = (typeof GC_WHO !== 'undefined' && GC_WHO === 'mine') ? 'mine' : currentDemoId();
  var url = 'album.html' + (who ? '?who=' + encodeURIComponent(who) : '');
  window.open(url, '_blank');
});

/* NOTHING IN THIS ROOM IS ALLOWED TO DO NOTHING. These three are real features
   with no backend yet, and a button that swallows a press is worse than one
   that admits it: the person assumes they missed, presses again, and decides
   the product is broken.

   Bring someone needs the conference-room tables ported over (invite tokens,
   seat tokens, the arrival-forward read rule). Add a memory needs the memory
   store. The mic needs speech capture. Each says so until it is built. */
/* SAID ONCE, NOT ONCE PER PRESS. Pressing the four scene slots in a row filled
   the conversation with four near-identical paragraphs, and a person poking at
   the buttons to see what they do should not have to scroll their friend back
   into view afterwards. The same notice twice running is a repeat, and a
   repeat is noise. */
var lastNotYet = '';
function notYet(what, why) {
  var msg = what + ' is not built yet. ' + why;
  if (msg === lastNotYet) return;
  lastNotYet = msg;
  post('Not wired yet', msg);
}
/* ── BRINGING SOMEBODY IN ────────────────────────────────────────────────────
   PROMOTE ON INVITE. Up to this point the conversation has been a browser and
   nothing else, which is right, because talking to your friend on your own is
   the common case and should cost no database at all. Pressing this is what
   brings a room into existence, and the whole prior thread goes up with it so
   he does not forget what you were saying the moment somebody arrives.

   Anyone in the room can do this, not only the host. A guest wanting to show
   their mum is the product spreading on its own. */

/* WHICH DEMO THE CURRENT ROOM ACTUALLY IS, BY WHO FRIEND IS, NOT BY WHICH
   OBJECT IT HAPPENS TO BE.

   The first version of this checked FRIEND === GC_DEMO, an object identity
   check, and it broke exactly the way object identity checks break: FRIEND is
   REPLACED wholesale the moment somebody joins a room, with a fresh object
   deserialised from the server's join response (see joinThenSit, "FRIEND =
   j.friend"). So the very first person in a room passed the check and their
   invite carried who=; anybody who joined THAT room and then invited a third
   person themselves held a FRIEND that was contentwise Sophia but was no
   longer literally GC_SOFIA, the check silently failed, and the link they
   sent defaulted the next arrival to Arch. Dr. O: "the link sent her to Arch
   again."

   Compared by name instead, which survives the reassignment because Sophia's
   name is always "Sophia" whichever copy of the object it lives on. The one
   real cost: somebody who builds and names their own friend "Arch" or "Sophia"
   would have their room mistaken for the demo. Accepted rather than solved,
   because solving it properly means the server telling a joiner which KIND of
   room they are in, not just which friend, and that is a larger change than
   this bug warrants. */
function currentDemoId() {
  if (typeof GC_DEMOS === 'undefined' || !FRIEND) return null;
  for (var id in GC_DEMOS) {
    if (GC_DEMOS[id] && GC_DEMOS[id].name === FRIEND.name) return id;
  }
  return null;
}

function inviteLink(token) {
  var url = location.origin + location.pathname + "?join=" + encodeURIComponent(token);
  var demoId = currentDemoId();
  if (demoId) url += '&who=' + encodeURIComponent(demoId);
  return url;
}

function showInvite(token) {
  var url = inviteLink(token);
  /* SAYS IT IS SINGLE USE, because it is, and nothing said so. One link lets in
     one person and is then spent, so testing your own link burns it and two
     people sent the same one means the second is turned away. That was being
     discovered by being turned away. */
  post("Bring someone", "Send them this. They tap it once and they are in the room with you, " +
       "no sign in and no account. It lets in one person and is then used up, so do not open it " +
       "yourself to test it. Press this again for another. They will see the conversation from " +
       "the moment they arrive, not before it.");
  var box = document.createElement("div");
  box.className = "msg";
  var a = document.createElement("input");
  a.type = "text"; a.readOnly = true; a.value = url;
  a.style.cssText = "width:100%;font:inherit;font-size:13px;padding:.4rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px";
  a.addEventListener("focus", function () { this.select(); });
  box.appendChild(a);
  var copy = document.createElement("button");
  copy.className = "btn"; copy.style.marginTop = ".45rem"; copy.textContent = "Copy the link";
  copy.addEventListener("click", function () {
    navigator.clipboard.writeText(url).then(function () { copy.textContent = "Copied"; })
      .catch(function () { a.focus(); });
  });
  box.appendChild(copy);
  $("log").appendChild(box);
  $("log").scrollTop = $("log").scrollHeight;
}

$("bringBtn").addEventListener("click", function () {
  if (SEAT) {  /* already a room: just mint another invite */
    fetch("/.netlify/functions/gc-room-open", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ friend: FRIEND, reuse_seat: SEAT })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.host_credit_ref) ROOM_CREDIT_REF = j.host_credit_ref;
      if (j.invite_token) showInvite(j.invite_token);
    });
    return;
  }
  this.disabled = true;
  fetch("/.netlify/functions/gc-room-open", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      friend: FRIEND,
      scene_key: current ? current.key : null,
      you: { name: YOU.name, pronouns: YOU.pronouns, avatar: YOU.photo || YOU.emoji },
      messages: transcript(),
      /* So a built friend's room can bill the host's own balance rather than
         falling back to the free daily cap. Empty for a house demo or a host
         with no account yet; gc-room-open.js handles either gracefully. */
      access_token: GC_accessToken()
    })
  }).then(function (r) { return r.json(); }).then(function (j) {
    $("bringBtn").disabled = false;
    if (!j || !j.seat_token) { post("Not wired yet", "Could not open the room: " + ((j && j.error) || "unknown")); return; }
    SEAT = j.seat_token; ROOM = j.room_id; MY_SEAT_ID = j.seat_id || null;
    ROOM_CREDIT_REF = j.host_credit_ref || null;
    /* THE CARRIED THREAD IS ALREADY ON SCREEN. Opening a room writes the prior
       conversation up to the server, and without this the very next poll reads
       it straight back and posts every line a second time. His greeting
       appeared twice. Start the cursor at now: anything older is already here. */
    lastSeen = new Date().toISOString();
    startPolling();
    showInvite(j.invite_token);
  }).catch(function (err) {
    $("bringBtn").disabled = false;
    post("Not wired yet", "Could not open the room. " + err.message);
  });
});

/* ── ARRIVING ON A LINK ──────────────────────────────────────────────────────
   THE DOORSTEP COMES FIRST, AND THIS WAS WRONG THE FIRST TIME.

   The original version joined the room the instant the page loaded, before
   the guest had told us anything, and only then showed them the doorstep. Two
   failures fell out of that: they arrived nameless, so whatever they typed
   into the panel never reached the room; and if they pressed Sit down before
   the fetch came back, SEAT was still null and they went down the local path
   into a private conversation of their own. Which is exactly what happened.

   So the token is held, the doorstep is shown, and joining happens when they
   are ready and have a name and pronouns to arrive with. */
var PENDING_INVITE = new URLSearchParams(location.search).get("join");
if (PENDING_INVITE) {
  history.replaceState({}, "", location.pathname);   // the link is spent
  $("gateTitle").textContent = "You have been invited";
  $("gateSay").textContent =
    "Tell them who you are and you will be in the room. No sign in, no account. " +
    "You will see the conversation from the moment you arrive, not before it.";
  $("startBtn").textContent = "Join them";
}

/* Called instead of sitDown() when there is an invite in hand. */
/* Asked once, and only of somebody arriving on an invite. */
var nameAsked = false;

function joinThenSit() {
  var btn = $("startBtn");

  /* ARRIVE AS SOMEBODY. A guest who presses straight through without filling
     the name in lands in the room anonymous: their seat carries no name, so
     every line they say goes up under no name and the friend has nothing to
     call them by. Pookie arrived this way and the room could not tell her
     apart from Arch.

     Asked once, never enforced. Wanting to be in the room without giving a
     name is allowed; not being asked is the bug. */
  if (!nameAsked && !(YOU.name || "").trim()) {
    nameAsked = true;
    $("gateSay").textContent =
      "Put a name in first so they know who just walked in, then press it again. " +
      "Any name you like.";
    var f = $("youPanel").querySelector(".you-name-input");
    if (f) f.focus();
    return;
  }

  btn.disabled = true; btn.textContent = "Joining";

  fetch("/.netlify/functions/gc-room-join", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      invite_token: PENDING_INVITE,
      you: { name: YOU.name, pronouns: YOU.pronouns, avatar: YOU.photo || YOU.emoji, remember_me: false }
    })
  }).then(function (r) { return r.json(); }).then(function (j) {
    btn.disabled = false;
    if (!j || !j.seat_token) {
      /* Says which problem rather than silently dumping them into a room of
         their own, which is the failure this whole rewrite exists to stop.

         AN INVITE IS FOR ONE PERSON AND IS USED UP. A second tap on the same
         link is the ORDINARY case, not an edge one: the host tests their own
         link, or two people are sent the same one. The server calls a spent
         link invite_not_found, which was missing from this list, so the
         commonest failure of all fell through to "something went wrong" and
         then offered the wrong person as a consolation. */
      PENDING_INVITE = null;
      var spent = "That link has already been used. They are single use, one per " +
                  "person, so ask for a fresh one.";
      $("gateTitle").textContent = "That invite has been used";
      $("gateSay").textContent =
        ({ invite_not_found:    spent,
           invite_already_used: spent,
           bad_invite:          "That link is not complete. Copying it again usually fixes it.",
           room_full:           "That room is full.",
           expired:             "That room has closed.",
           closed:              "That room has closed." }[j && j.error]) ||
        "Something went wrong joining. Ask them for a fresh link.";

      /* NOT OFFERED SOMEBODY ELSE AS A CONSOLATION. This used to say "you can
         still sit with Hollis on your own" to a person who had come here to
         join a particular room, naming whoever happened to be built on this
         device. You came to see somebody. Being handed a different person is
         not a smaller version of that. */
      btn.textContent = "Wait for a new link";
      btn.disabled = true;
      return;
    }
    SEAT = j.seat_token; ROOM = j.room_id; MY_SEAT_ID = j.seat_id || null;
    ROOM_CREDIT_REF = j.host_credit_ref || null;
    if (j.friend) { FRIEND = j.friend; nameEverything(); renderScenes(); }
    if (j.scene_key) {
      var sc = (FRIEND.scenes || []).filter(function (x) { return x.key === j.scene_key; })[0];
      if (sc) play(sc);
    }
    PENDING_INVITE = null;
    sitDown();
    startPolling();
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = "Try again";
    $("gateSay").textContent = "Could not reach the room. " + err.message;
  });
}
/* Everybody in the room reads from the same place. A guest is bounded below by
   their own arrival, which is enforced server side and cannot be argued down
   from here. */
function startPolling() {
  if (polling) return;
  polling = setInterval(function () {
    fetch("/.netlify/functions/gc-room-poll", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seat_token: SEAT, since: lastSeen })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.messages) return;
      var lastHeard = null, lastHeardBubble = null;
      var lastCameo = null;   // { text, bubble, voiceId } — see below
      j.messages.forEach(function (m) {
        lastSeen = m.created_at;

        /* MY OWN LINES ARE NEVER DRAWN FROM THE POLL. They went up the instant
           I pressed send and they are already on screen.

           Claiming the id when gc-room-say answers is too late, and that was
           the race putting typed messages up twice: that function writes the
           line to the room STRAIGHT AWAY and only then waits on the model, so
           for the ten seconds he is thinking the line is sitting there
           readable, and the poll fires every three. It would fetch my own
           sentence back and draw a second copy of it before the response
           carrying its id ever arrived. Whether it happened came down to where
           the three-second tick fell, which is why some typed lines doubled
           and others did not.

           The seat id is known at the door now, so this needs no round trip. */
        if (m.speaker === "person" && m.author_id && m.author_id === MY_SEAT_ID) {
          seen[m.id] = true;
          return;
        }

        if (seen[m.id]) return;      /* already drawn, by this browser or a prior poll */
        seen[m.id] = true;

        /* WHO SAID IT COMES FROM speaker, NEVER FROM A MISSING NAME. The old
           fallback was (m.name || FRIEND.name), so a guest who joined without
           typing a name had every word they said attributed to the friend.
           Pookie's line about her dog appeared over Arch's name. A person
           without a name is "Someone"; only the friend is ever the friend.

           A CAMEO IS ALSO speaker:"friend", added 2026-08-18: gc-room-say.js
           now persists Poppy/Biscuit/Mochi's line as its own message row
           the same way it persists the friend's own, so this used to always
           relabel it as Reggie or Tansy — every cameo line in a shared room
           was silently wearing the wrong name. m.name is trusted for a
           friend-speaker row now, and only falls back to FRIEND.name when
           it is genuinely missing. */
        var label = (m.speaker === "friend")
          ? (m.name || FRIEND.name || "Friend")
          : (m.name || "Someone");

        var bubble = post(label, m.content, m.speaker === "person" && m.author_id && m.author_id === MY_SEAT_ID);

        if (m.speaker === "friend") {
          var isCameo = m.name && m.name !== FRIEND.name;
          if (isCameo) {
            var cEntry = (FRIEND.cameos || []).find(function (c) { return c && c.name === m.name; });
            lastCameo = { text: m.content, bubble: bubble, voiceId: cEntry ? cEntry.voiceId : null };
          } else {
            lastHeard = m.content; lastHeardBubble = bubble;
          }
        }
      });

      /* TELL US WHEN A GUEST ARRIVES, added 2026-08-18 per Dr. O: "It should
         tell us when our guest is in the room." Somebody who tapped a
         Bring Someone link used to just silently start appearing in the
         transcript the moment they said something; there was no signal
         that they had actually arrived. gc-room-poll.js already returns
         the full current roster on every tick, this just watches it for a
         name that was not there before. */
      if (j.people) {
        var currentNames = j.people.map(function (p) { return (p && p.name) || 'Someone'; });
        if (knownPeopleNames === null) {
          knownPeopleNames = {};
          currentNames.forEach(function (n) { knownPeopleNames[n] = true; });
        } else {
          currentNames.forEach(function (n) {
            if (!knownPeopleNames[n]) {
              knownPeopleNames[n] = true;
              post('Room', n + ' joined.');
            }
          });
        }
      }

      /* HE STAYS AUDIBLE IN A ROOM. Once a room exists his reply no longer
         comes back to the person who spoke; it arrives here, on everyone's
         poll, and nothing here used to speak it. So he went quiet the moment
         anybody was invited, which is precisely when being heard matters most.

         Only the last MAIN line of a batch is spoken, because speak()
         interrupts whatever is playing and a queue of two would talk over
         itself. A CAMEO, IF ONE ARRIVED IN THE SAME BATCH, chains after the
         main line via onDone rather than firing at the same time — same
         reasoning and same pattern as the solo-chat path in ask(), added
         2026-08-18 once shared rooms could carry a cameo line at all. */
      if (lastHeard) {
        speak(lastHeard, FRIEND.voiceId, function () {
          if (lastCameo && lastCameo.voiceId) speak(lastCameo.text, lastCameo.voiceId, undefined, lastCameo.bubble);
        }, lastHeardBubble);
      } else if (lastCameo && lastCameo.voiceId) {
        speak(lastCameo.text, lastCameo.voiceId, undefined, lastCameo.bubble);
      }
      /* THE SCENE IS SHARED. The host changes rooms and everybody follows,
         because if you are both sitting with him at the fireplace then you are
         both at the fireplace. */
      if (j.scene_key && (!current || current.key !== j.scene_key)) {
        var sc = (FRIEND.scenes || []).filter(function (x) { return x.key === j.scene_key; })[0];
        if (sc) play(sc);
      }
    }).catch(function () {});
  }, 3000);
}
/* ── WHAT THEY REMEMBER ──────────────────────────────────────────────────────
   The second thing this product promises, and the last thing in the room that
   was still a button apologising for itself.

   ON THIS DEVICE AND NOWHERE ELSE. There are no accounts here, so there is no
   server that could hold this without inventing one, and what somebody tells a
   friend to remember is the most personal thing in the product: who died, what
   they are frightened of, which day is hard. It is kept in this browser and
   sent nowhere except the request that produces their next reply. That is a
   real limit, said plainly in the panel rather than discovered later: clear
   the browser and it is gone.

   TYPED IN DELIBERATELY, NOT HARVESTED. Nothing is quietly extracted from the
   conversation and filed. You decide what they keep, you can read all of it
   back, and you can take any of it away. Being remembered is only a good thing
   when you know what is being remembered.

   Kept per friend, because Arch and the friend you built are different people
   and should not share a head. */
function memKey() { return 'gc-mem-' + (GC_WHO === 'mine' ? 'mine' : 'arch'); }

function loadMemories() {
  try {
    var v = JSON.parse(localStorage.getItem(memKey()) || '[]');
    return Array.isArray(v) ? v.filter(function (x) { return typeof x === 'string' && x.trim(); }) : [];
  } catch (e) { return []; }
}

function saveMemories(list) {
  try { localStorage.setItem(memKey(), JSON.stringify(list)); } catch (e) {}
  /* Carried on the friend, which is what gets sent to the model and what gets
     written into the room when somebody is invited, so a memory holds in both
     places without a second path to keep in step. */
  FRIEND.memories = list;
}

FRIEND.memories = loadMemories();

function renderMemories() {
  var host = $('memPanel');
  host.innerHTML = '';
  host.className = 'you-panel';

  var list = loadMemories();

  var note = document.createElement('p');
  note.className = 'gate-say';
  note.textContent = list.length
    ? FRIEND.name + ' has these in mind whenever you talk. Kept on this device only, ' +
      'and never anywhere else.'
    : 'Anything you put here, ' + FRIEND.name + ' will know next time without you having to ' +
      'say it again. Kept on this device only, and never anywhere else.';
  host.appendChild(note);

  list.forEach(function (text, i) {
    var row = document.createElement('div');
    row.className = 'you-row';

    var p = document.createElement('div');
    p.style.cssText = 'flex:1;min-width:0';
    p.textContent = text;
    row.appendChild(p);

    var x = document.createElement('button');
    x.type = 'button'; x.className = 'btn';
    x.textContent = 'Forget';
    x.title = 'Take this one away';
    x.addEventListener('click', function () {
      var next = loadMemories();
      next.splice(i, 1);
      saveMemories(next);
      renderMemories();
    });
    row.appendChild(x);
    host.appendChild(row);
  });

  var addRow = document.createElement('div');
  addRow.className = 'you-row';
  var label = document.createElement('label');
  label.className = 'you-label';
  label.textContent = 'Something for ' + FRIEND.name + ' to remember';
  addRow.appendChild(label);

  var box = document.createElement('textarea');
  box.rows = 3;
  box.placeholder = 'My daughter is called Nell. Tuesdays are hard.';
  box.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                      'background:var(--paper);color:var(--ink);border-radius:3px;resize:vertical';
  addRow.appendChild(box);
  host.appendChild(addRow);

  var add = document.createElement('button');
  add.type = 'button'; add.className = 'btn go'; add.textContent = 'Remember this';
  add.addEventListener('click', function () {
    var v = box.value.trim();
    if (!v) { box.focus(); return; }
    var next = loadMemories();
    next.push(v.slice(0, 600));
    saveMemories(next);
    box.value = '';
    renderMemories();
  });
  host.appendChild(add);
}

/* Which of the two panels the doorstep is showing. */
function showGate(panel, title, say) {
  $('chat').style.display = 'none';
  $('gate').style.display = 'block';
  $('youPanel').style.display = (panel === 'you') ? 'block' : 'none';
  $('memPanel').style.display = (panel === 'mem') ? 'block' : 'none';
  $('gateTitle').textContent = title;
  $('gateSay').textContent = say;
}

$('memBtn').addEventListener('click', function () {
  renderMemories();
  showGate('mem', 'What ' + FRIEND.name + ' remembers',
    'Things you have asked ' + FRIEND.name + ' to keep. Add or remove any of it.');
  $('startBtn').textContent = 'Back to ' + FRIEND.name;
});

  fetch('/.netlify/functions/gc-my-credits', {

/* ── SPEAKING INSTEAD OF TYPING ──────────────────────────────────────────────
   The browser's own speech recognition. No API, no key, no per-minute cost,
   which matters for a product whose audience will use it a lot.

   IT STAYS ON. Press once and it keeps listening: you pause, it sends what you
   said, and it carries on. Press again to stop. Somebody with arthritis or a
   tremor should not have to hold a button down, and somebody mid-thought
   should not lose the end of a sentence to a timer.

   Chrome does this by sending audio to Google, which is exactly what the hint
   under the wake word already says: audio leaves the browser only while it is
   on. Off by default, and visibly on when it is on. */
var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false;

function micLabel() {
  $('micBtn').innerHTML = listening ? '&#128308;' : '&#127908;';
  $('micBtn').title = listening
    ? 'Listening. Pause and it sends. Press to stop.'
    : 'Speak instead of typing. It stays on: pause and it sends, then keeps listening.';
}

function startListening() {
  if (!Rec) {
    notYet('Speaking instead of typing',
      'This browser will not do speech recognition. Chrome and Edge will.');
    return;
  }
  rec = new Rec();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = navigator.language || 'en-US';

  var pending = '';

  /* NOTHING IS READ TWICE. This is what was sending every spoken line to the
     room in duplicate while typing was fine.

     With continuous on, e.results holds EVERY result of the session, not just
     the new ones, and the loop below trusts e.resultIndex to say where the new
     ones begin. Chrome resets that index when it restarts recognition, which
     onend does on purpose so that "it stays on" is true. After a restart the
     loop therefore walks back over speech that was already finalised and sends
     it again. "I am still here, Arch", twice. */
  var taken = 0;

  rec.onresult = function (e) {
    /* THE FEEDBACK LOOP. Dr. O: "when Sophia talks on audio her voice is
       displayed as text in my text space and sends." Nothing here was ever
       telling the mic to stop listening while his own reply was coming out
       of the speaker, so on a laptop without headphones the mic hears him,
       recognition transcribes him, and the room sends his own words back to
       him as though the person had said them.

       PORTED FROM MY ECHO'S OWN HARDENED VERSION OF THIS, not guessed at
       fresh. ME hit this live (2026-08-15: Terry said something kind about
       Ivy, M.E.'s spoken reply got picked up by the still-open mic and sent
       back as Terry's next line), tried a fixed pause after playback ends,
       found it still happening, and traced it to recognition lag: a final
       result can land two or three seconds behind the audio that produced
       it, so a short window closes before the delayed transcript of his own
       voice arrives. Their fix, copied here: every result heard WHILE he is
       talking pushes the deaf window forward again, so it stays shut until
       a real gap after he actually stops, not a fixed pause from the moment
       hush() fires.

       IGNORED, NOT PAUSED, same reasoning as ME: stopping and restarting the
       recognition engine around every reply risks losing whatever the person
       is mid-saying when he starts talking.

       SAID PLAINLY, ALSO FROM ME'S OWN COMMENT: this reduces the loop, it
       does not close it completely. Real echo cancellation would need
       control over the microphone's own audio pipeline that the Web Speech
       API does not expose, and ME still sees this "sometimes" even with the
       longer tail. Barge-in was never the goal; not hearing himself is. */
    if (speaking) micQuietUntil = Date.now() + MIC_TAIL_MS;
    if (speaking || Date.now() < micQuietUntil) return;

    var finalBit = '';
    /* Never behind what has already been consumed, whatever the index claims. */
    for (var i = Math.max(e.resultIndex, taken); i < e.results.length; i++) {
      if (e.results[i].isFinal) { finalBit += e.results[i][0].transcript; taken = i + 1; }
      else $('say').value = pending + e.results[i][0].transcript;   // show it forming
    }
    if (finalBit) {
      pending = (pending + ' ' + finalBit).trim();
      $('say').value = pending;
      /* A PAUSE IS THE SEND, AND 1.4 SECONDS IS NOT A PAUSE. It is the gap in
         the middle of an ordinary sentence.

         Pookie, mid-sentence, into the room: "it's not letting me finish what
         I was sending". Her side of that conversation arrived as "Okay so",
         "well", "well", "because one is listen and", "where if you". Every one
         of those is somebody thinking, chopped off and posted as though it
         were a finished thought, and it reads back to her as a machine talking
         over her.

         Nearly three seconds now, and longer still when what is held is short
         enough to obviously be the start of something. "Okay so" is never a
         complete thing anybody meant to say. Waiting too long only costs a
         moment; cutting somebody off costs them the sentence. */
      var held = $('say').value.trim();
      var wait = held.length < 25 ? 4500 : 2800;

      clearTimeout(rec._pause);
      rec._pause = setTimeout(function () {
        if ($('say').value.trim()) { send(); pending = ''; }
      }, wait);
    }
  };

  /* Chrome ends the session on its own after a while. If we are still meant to
     be listening, start it again, so 'it stays on' is actually true. The new
     session gets a fresh results array, so the consumed mark starts over with
     it. Getting this wrong in the other direction would swallow speech. */
  rec.onend = function () {
    taken = 0;
    if (listening) { try { rec.start(); } catch (_) {} }
  };

  rec.onerror = function (e) {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      listening = false; micLabel();
      /* NOT notYet, BECAUSE THE MICROPHONE IS BUILT. This read "The microphone
         is not built yet. The browser refused access", which is two
         contradictory sentences and sends somebody looking for a feature that
         is right there. A browser refusing permission is a thing they can fix
         in about five seconds, and saying so is the entire job here. */
      post('The microphone', 'Your browser blocked it. Allow the microphone from the ' +
           'icon in the address bar and press it again.');
    }
    /* no-speech and aborted are ordinary. onend restarts. */
  };

  try { rec.start(); listening = true; micLabel(); }
  catch (_) { listening = false; micLabel(); }
}

function stopListening() {
  listening = false;
  if (rec) { try { rec.stop(); } catch (_) {} }
  micLabel();
}

$('micBtn').addEventListener('click', function () {
  if (listening) stopListening(); else startListening();
});
micLabel();

/* Close was wired to nothing. In a full-screen room with no wordmark it is the
   only way out, so it goes home. */
$('closeBtn').addEventListener('click', function () { location.href = 'index.html'; });


/* ── ARCH SPEAKS ────────────────────────────────────────────────────────────
   Off by default and opted into, because speech is billed per character and
   this audience talks a lot. Text costs nothing; audio is a choice.

   His voice id lives with the rest of him in gc-friend.js, not in a lookup
   table here, because a voice is part of a person rather than a setting.

   ALWAYS INTERRUPTIBLE. Somebody who wants to say something should never
   have to wait for him to finish, so any new line stops the old audio, and
   there is a visible Stop while he is talking. */
/* THE ECHO GUARD lives with the mic, near rec.onresult: this flag is what it
   checks to know he is actually making sound right now. See the long
   comment there for why a fixed pause after hush() was not enough.

   MIC_TAIL_MS/micQuietUntil PROMOTED OUT OF startListening(), 2026-08-18,
   after Dr. O reported the leak "still there and bad" even with the 3s
   tail. Reading the guard again found the real gap: it was ONLY extended
   from inside rec.onresult, while speech was being heard. If recognition
   produced no result near the true end of a reply (lag, a quiet trailing
   word), the window's last extension could sit well behind the actual
   moment playback stopped, so a late-arriving transcript of his own last
   syllables could land after the window had already expired. Now hush()
   itself extends the window at the moment audio actually stops, so the
   full 3s always counts from real playback end, not from wherever
   recognition last happened to fire. */
var MIC_TAIL_MS = 3000;
var micQuietUntil = 0;
var speaking = null;

function hush() {
  if (speaking) {
    try { speaking.pause(); } catch (_) {}
    speaking = null;
    micQuietUntil = Date.now() + MIC_TAIL_MS;
  }
  $("stopBtn").style.display = "none";
}

/* REPLAY, added 2026-08-18 per Dr. O, after Reggie's Duke-and-the-mailman
   speech: "can you make it so we can replay his text - voice?" The audio
   already exists in the browser by the time this button appears (it just
   played once), so replaying it costs nothing extra: no second call to
   gc-voice.js, no second credit spent. Only ever attached to a message that
   actually played successfully; text-only or failed messages get no button,
   since there is nothing cached to replay. */
function playCachedAudio(b64) {
  hush();
  speaking = new Audio("data:audio/mpeg;base64," + b64);
  $("stopBtn").style.display = "inline-block";
  speaking.onended = hush;
  speaking.play().catch(function () { hush(); });
}
function addReplayButton(bubble, b64) {
  if (!bubble) return;
  var btn = document.createElement('button');
  btn.className = 'replay-btn';
  btn.type = 'button';
  btn.title = 'Play this again';
  btn.innerHTML = '&#128266; Replay';
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    playCachedAudio(b64);
  });
  bubble.appendChild(btn);
}

function speak(text, voiceId, onDone, bubble) {
  /* voiceId DEFAULTS TO THE FRIEND'S OWN, so every existing call site
     (speak(text)) is untouched. The override exists for a cameo line
     (Poppy, in Tansy's own room) which needs a different voice than the
     friend she is chained after. onDone is ALWAYS called eventually, audio
     on or off, success or failure, so a caller can chain a second line
     (the cameo's text bubble and speech) without caring whether audio is
     even enabled. bubble, if given, gets a Replay button once the audio for
     THIS line actually arrives. */
  voiceId = voiceId || FRIEND.voiceId;
  if (!asAudio || !voiceId || !text) { if (onDone) onDone(); return; }
  hush();

  /* SAY THE NAME RIGHT. Only the audio is substituted: the transcript keeps
     the real spelling, because the point is that they are seen properly, not
     that their name gets rewritten. */
  var spoken = text;
  if (YOU.saidAs && YOU.name) {
    var escaped = YOU.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    spoken = spoken.replace(new RegExp('\\b' + escaped + '\\b', 'g'), YOU.saidAs);
  }
  fetch("/.netlify/functions/gc-voice", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text: spoken, voice_id: voiceId,
      /* access_token covers a solo conversation or the host; credit_ref
         covers a guest, who never holds the host's real token. gc-voice.js
         tries the token first and only falls back to the reference.
         is_demo/visitor_id, added 2026-08-18: lets a house demo draw free
         audio from the same daily pool text already uses — "the free daily
         has to have audio because the audio makes it." */
      access_token: GC_accessToken(), credit_ref: ROOM_CREDIT_REF, owner_key: GC_ownerKey(),
      is_demo: FRIEND === GC_DEMO, visitor_id: GC_visitorId()
    })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.daily_capped) {
      if (!speak._creditsWarned) { speak._creditsWarned = true; showCreditsUpsell(true); }
      if (onDone) onDone();
      return;
    }
    if (j && j.credits_exhausted) {
      /* A real, named reason, not a generic wiring failure, and only once:
         nobody needs this said again on every single line while audio stays
         toggled on with nothing left to spend on it. */
      if (!speak._creditsWarned) { speak._creditsWarned = true; showCreditsUpsell(false); }
      if (onDone) onDone();
      return;
    }
    if (!j || !j.audio) {
      /* Says which problem rather than failing silently, and only once: a
         missing voice key should not nag on every single line. */
      if (!speak._warned) { speak._warned = true; post("Not wired yet", "Could not fetch his voice: " + ((j && j.error) || "unknown") + ". Text still works."); }
      if (onDone) onDone();
      return;
    }
    speaking = new Audio("data:audio/mpeg;base64," + j.audio);
    $("stopBtn").style.display = "inline-block";
    speaking.onended = function () { hush(); if (onDone) onDone(); };
    speaking.play().catch(function () { hush(); if (onDone) onDone(); });
    addReplayButton(bubble, j.audio);
  }).catch(function () { hush(); if (onDone) onDone(); });
}

var asAudio = false;
$('replyBtn').addEventListener('click', function () {
  asAudio = !asAudio;
  this.innerHTML = asAudio ? '&#127911; Audio' : '&#127911; Text';
  if (!asAudio) hush();
});
/* THIS BUTTON WAS DOING NOTHING, AND SAYING SOMETHING UNTRUE WHILE IT DID IT.

   It set a flag no code ever read. There is one speech recogniser in this file
   and it belongs to the microphone; nothing anywhere listens for a wake word.
   So "Listen: on" lit up, and the hint underneath told the person that audio
   was leaving their browser, which was not happening. A dead switch is bad. A
   dead switch making a false claim about a microphone is not something to
   leave sitting on a live page.

   Pookie turned it on and talked to it. It says what it is now, until it is
   built. */
$('earBtn').addEventListener('click', function () {
  /* notYet already appends "is not built yet", and this said it again straight
     after: "Saying Sophia from across the room is not built yet. Not built yet."
     The second half only has to say what to do instead. */
  notYet('Saying "' + FRIEND.name + '" from across the room',
         'To talk, press the microphone next to the box. Nothing is listening until ' +
         'you do.');
});
</script>

</body>
</html>
