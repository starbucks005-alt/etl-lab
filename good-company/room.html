<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Company</title>

<!-- Who is in the room, then the skin they bring, then the paint. Both before
     the stylesheet so nobody eats a flash of the wrong room. GC_SKIN resolves
     an explicit choice first, then the friend's own room, then the system
     preference. That chain is what replaced the light/dark toggle: nobody has
     to know the words "light" and "dark" to get the brightness they wanted. -->
<script src="gc-friend.js"></script>
<script src="gc-skin.js"></script>
<script src="gc-you.js"></script>
<link rel="stylesheet" href="gc-skin.css">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   LAYOUT IS M.E.'s, SKIN SYSTEM IS FOUNDER STUDIO's.

   Layout: two columns on a laptop, one on a phone. The video sizes the left
   column and everything in it inherits that width. The conversation takes the
   rest. Those are M.E.'s hard-won shapes, inherited rather than re-derived.

   Skins: gc-skin.css and gc-skin.js, shared with every other page. Adding one
   is a block there plus an entry in GC_SKINS. Nothing changes here.

   THE RULE FOUNDER STUDIO WROTE IN ITS OWN MARGIN, applied to what matters
   here: a skin dresses the ROOM. It never touches the friend and it never
   touches whether the conversation can be read.
     * The video is never tinted, filtered, overlaid or bordered by a skin.
       Nothing goes on top of that face.
     * Chat text keeps its contrast floor in every skin. These readers are
       mostly older, and a pretty palette that costs legibility is not pretty.
   Both are enforced by the variables the protected rules are allowed to use,
   not by remembering.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Palette, base body and shared primitives now live in gc-skin.css, linked
   above. Only the room's own layout is below. */

/* html and body need a height here that gc-skin.css does not set, because
   this page is a full-viewport room rather than a scrolling document. */
html,body{ height:100%; }
/* ── the room ────────────────────────────────────────────────────────────── */
.room{ height:100vh; display:grid; grid-template-columns:auto 1fr; grid-template-rows:1fr; }
.stage{ display:flex; flex-direction:column; width:min(58vw, calc(52vh * 16 / 9)); min-width:0; }

.topline{ display:flex; align-items:center; gap:.8rem; padding:.5rem .6rem; }
.brandbar{ display:flex; justify-content:center; padding:.4rem .2rem; }
/* The real mark replaces the GC placeholder circle. Sized by height because a
   wordmark is wide: a 52px round slot was shaped for two letters and would
   crush it. The ink swap by skin is in gc-skin.css and applies here too. */
.brandbar .mark{ flex:none; }
/* THE ICON ALONE IN A NARROW SLOT. Dr. O: when the space is like this, use
   the two people part. A wordmark squeezed into the corner of a column sized
   by a video reads as a squashed wordmark; the two figures read as a mark. The
   full lockup stays on the pages that have width for it. */
/* SIZE ONLY, NEVER display. gc-skin.css decides WHICH ink shows, and setting
   display here ties on specificity and wins on source order, so both inks
   rendered at once. Same bug as the wordmark, reintroduced by me two hours
   later. Size is safe; visibility is not ours to set. */
.brandbar .logo{ height:34px; width:34px; }
.gauge-wrap{ flex:1; min-width:0; }

/* ── the feeling scale ───────────────────────────────────────────────────── */
.gauge-title{ font-family:var(--mono); font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin-bottom:.45rem; }
.gauge-head{ display:flex; align-items:center; gap:.5rem; }
.gauge-emoji{ font-size:19px; }
.gauge-label{ font-family:var(--mono); font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--accent); }
.gauge-sub{ font-size:12px; color:var(--ink-dim); margin:.2rem 0 .5rem; }
.gauge-row{ display:flex; align-items:center; gap:.6rem; margin-bottom:3px; }
.gauge-row-label{ font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-dim); width:66px; flex:none; }
.gauge-bar-track{ flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
.gauge-bar-fill{ height:100%; border-radius:2px; transition:width .5s ease; }
.f-happy{background:var(--happy);} .f-sad{background:var(--sad);} .f-fear{background:var(--fear);}
.f-disgust{background:var(--disgust);} .f-anger{background:var(--anger);}
.f-surprise{background:var(--surprise);} .f-curious{background:var(--curious);}

/* ── the face ────────────────────────────────────────────────────────────────
   PROTECTED. No skin variable appears in this block and none may be added.
   No tint, no filter, no overlay, no border, no radius.

   And no image, ever: no poster attribute, no still underneath, no CSS
   background standing in while it loads. A fallback image under a video loads
   first, the swap reads as a jump, and the video gets blamed for a bug the
   image caused. If a clip is missing the box names the file and stays black. */
.portrait{ position:relative; background:#000; width:100%; aspect-ratio:16/9; overflow:hidden; }
.portrait video{ display:block; width:100%; height:100%; object-fit:cover; }
.portrait .missing{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center;
  padding:1rem; font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:#9A8A78;
}

/* A scene that has no film of it yet. Not layered over the video: the video is
   emptied and taken out of the layout before this goes in. See showStill. */
.portrait .still{ position:absolute; inset:0; }
.portrait .still img{ width:100%; height:100%; object-fit:cover; display:block; }
.portrait .still-say{
  position:absolute; left:0; right:0; bottom:0; padding:.45rem .6rem;
  background:rgba(0,0,0,.62); color:#F0E7DA;
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
}

/* ── scenes ──────────────────────────────────────────────────────────────── */
.scene-bar{ display:flex; flex-wrap:wrap; gap:.4rem; padding:.55rem .6rem .7rem; }
.scene-chip{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-dim); background:transparent; border:1px solid var(--line);
  border-radius:3px; padding:.32rem .6rem; cursor:pointer;
}
.scene-chip:hover{ color:var(--accent); border-color:var(--accent); }
.scene-chip.on{ color:var(--accent); border-color:var(--accent); }

/* ── the conversation ────────────────────────────────────────────────────── */
/* THE COLUMN DOES NOT SCROLL. THE TRANSCRIPT DOES.
   This was the wrong way round and it showed: .side scrolled the whole column
   including the input row, .log was overflow:visible, so a long conversation
   ran straight underneath the text box with no way to reach it. 2732px of talk
   in a 749px window and nothing to drag.

   The input row and the tools have to stay put. Only the conversation moves. */
.side{
  min-height:0; overflow:hidden; display:flex; flex-direction:column;
  border-left:1px solid var(--line);
}

/* THE CHROME FLOATS OVER THIS COLUMN, so the conversation has to start below
   it or the first thing the friend ever says sits underneath three buttons.
   Caught by testing whether the chrome's box intersects any message, not by
   looking: at 1440 it was covering Arch's opening line.

   --chrome-h is MEASURED at runtime, never a number typed here. The buttons
   carry labels that change length ("Fullscreen" becomes "Exit fullscreen") and
   the row wraps on narrow windows, so any constant I wrote would be wrong the
   first time a label changed. Same lesson M.E. learned when three hand-computed
   right offsets started landing on top of each other. */
.log{
  flex:1; min-height:0;
  overflow-y:auto;                     /* the one thing in this column that moves */
  padding:calc(var(--chrome-h, 51px) + 1.4rem) 1rem .5rem;
}
/* A VISIBLE SCROLLBAR, deliberately. M.E. hides its bar because a grey track
   is browser furniture in a built room, and that was right for a page you
   read. This is a conversation that grows past the window, and somebody who
   cannot see that there is more above has simply lost it. Slim and skinned,
   but present. */
.log{ scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.log::-webkit-scrollbar{ width:10px; }
.log::-webkit-scrollbar-track{ background:transparent; }
.log::-webkit-scrollbar-thumb{
  background:var(--line); border-radius:6px;
  border:3px solid transparent; background-clip:content-box;
}
.log::-webkit-scrollbar-thumb:hover{ background:var(--ink-dim); background-clip:content-box; }

/* ── the sound ───────────────────────────────────────────────────────────────
   The room has a fire in it, and birds, and a kettle. None of it was audible
   because the clip is muted, and it is muted because no browser will autoplay
   a video with sound. So it starts silent and one tap turns the room on.
   Sits on the video, bottom centre, out of the way of his face. */
.sound-on{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:3;
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:#F4ECE0; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.28);
  border-radius:999px; padding:.5rem 1rem; cursor:pointer; backdrop-filter:blur(2px);
}
.sound-on:hover{ background:rgba(0,0,0,.72); border-color:rgba(255,255,255,.5); }
/* PROTECTED. Chat text is --ink on --panel in every skin, and that pair is
   contrast-checked per skin rather than eyeballed. No skin may give this rule
   a softer color: a dimmed message is where a palette starts costing reading. */
.msg{ border:1px solid var(--line); background:var(--panel); color:var(--ink);
  padding:.55rem .8rem .7rem; margin-bottom:.55rem; max-width:52ch; }
.msg .who{ display:block; font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-dim); margin-bottom:.15rem; }
.msg.mine{ margin-left:auto; border-color:var(--accent); }

.row{ display:flex; gap:.45rem; padding:.5rem 1rem; align-items:center; }
/* The occasional controls, small and wrapping rather than stacked full-width. */
.row.tools{ flex-wrap:wrap; padding-top:0; }
.row.tools .btn{ flex:0 0 auto; font-size:10.5px; padding:.45rem .6rem; }

/* The doorstep. Scrolls on its own so a long panel never traps the button. */
.gate{ padding:1rem 1rem 1.4rem; overflow-y:auto; }
.gate h3{ font-family:Georgia,serif; font-weight:400; font-size:1.35rem; margin:0 0 .3rem; }
.gate-say{ color:var(--ink-dim); font-size:14.5px; margin:0 0 .6rem; }
.gate .you-panel{ border-top:none; padding-left:0; padding-right:0; }
.chat{ display:flex; flex-direction:column; min-height:0; flex:1; }
/* The occasional controls, small and wrapping rather than stacked full-width. */
.row.tools{ flex-wrap:wrap; padding-top:0; }
.row.tools .btn{ flex:0 0 auto; font-size:10.5px; padding:.45rem .6rem; }

/* The doorstep. Scrolls on its own so a long panel never traps the button. */
.gate{ padding:1rem 1rem 1.4rem; overflow-y:auto; }
.gate h3{ font-family:Georgia,serif; font-weight:400; font-size:1.35rem; margin:0 0 .3rem; }
.gate-say{ color:var(--ink-dim); font-size:14.5px; margin:0 0 .6rem; }
.gate .you-panel{ border-top:none; padding-left:0; padding-right:0; }
.chat{ display:flex; flex-direction:column; min-height:0; flex:1; }
.row.tight{ padding-top:0; }
.btn{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); background:transparent; border:1px solid var(--line);
  border-radius:3px; padding:.55rem .8rem; cursor:pointer;
}
.btn:hover{ color:var(--accent); border-color:var(--accent); }
.btn.wide{ flex:1; }
.btn.go{ color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
.btn.go:hover{ background:var(--accent-hover); border-color:var(--accent-hover); color:var(--accent-ink); }
#say{
  flex:1; min-width:0; font:inherit; font-size:16px;
  color:var(--ink); background:var(--paper);
  border:1px solid var(--line); border-radius:3px; padding:.6rem .7rem;
}
#say:focus{ outline:none; border-color:var(--accent); }
.hint{ padding:0 1rem .7rem; font-size:12px; color:var(--ink-dim); }

/* ── chrome ──────────────────────────────────────────────────────────────── */
.chrome{ position:fixed; top:16px; right:16px; z-index:20;
  display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.chrome .btn{ background:var(--chrome); }

/* ── phone ───────────────────────────────────────────────────────────────────
   HAS TO SIT LAST. On M.E. this block lived earlier in the file, tied on
   specificity, lost on source order, and left the phone broken while the media
   query matched perfectly. */
@media (max-width:820px){
  .room{ grid-template-columns:1fr; grid-template-rows:auto auto; height:100vh; overflow-y:auto;
         -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .room::-webkit-scrollbar{ width:0; }
  .stage{ width:100%; }
  .side{ overflow:visible; min-height:auto; border-left:none; border-top:1px solid var(--line); }
  /* Chrome moves to the bottom on a phone, so the clearance moves with it. */
  .log{ padding-top:1rem; }
  .side{ padding-bottom:calc(var(--chrome-h, 51px) + 1.4rem); }
  .chrome{ top:auto; bottom:12px; right:12px; }
  .skins{ top:auto; bottom:calc(100% + 6px); }
}
</style>
</head>

<body>

<div class="chrome">
  <div class="picker" id="picker">
    <button class="btn" id="skinBtn" type="button">&#9752; Room</button>
  </div>
  <button class="btn" id="fsBtn" type="button">&#9974; Fullscreen</button>
  <button class="btn" id="closeBtn" type="button">&times; Close</button>
</div>

<div class="room">

  <div class="stage">
    <div class="topline">
      <div class="brandbar">
        <a class="mark" href="index.html" title="Good Company">
          <img class="logo logo-dark-ink"  src="brand/icon-dark-ink.png"  alt="Good Company" width="122" height="122">
          <img class="logo logo-light-ink" src="brand/icon-light-ink.png" alt="Good Company" width="123" height="123">
        </a>
      </div>

      <div class="gauge-wrap">
        <!-- NAMED, NEVER PRONOUNED. The friend is whoever the user built, so
             the title is written from their name at runtime. -->
        <div class="gauge-title" id="gaugeTitle">How they are feeling right now</div>
        <div class="gauge-head">
          <div class="gauge-emoji" id="gaugeEmoji">&#128522;</div>
          <div class="gauge-label" id="gaugeLabel">&nbsp;</div>
        </div>
        <div class="gauge-sub">Shifts with what you say, and with the time of day</div>

        <div class="gauge-row"><div class="gauge-row-label">Happy</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-happy" style="width:62%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Sad</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-sad" style="width:14%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Fear</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-fear" style="width:8%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Disgust</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-disgust" style="width:5%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Anger</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-anger" style="width:6%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Surprise</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-surprise" style="width:22%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Curious</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-curious" style="width:58%"></div></div></div>
      </div>
    </div>

    <div class="portrait" id="portrait">
      <video id="loop" muted loop playsinline autoplay preload="auto"></video>
      <button class="sound-on" id="soundBtn" type="button">&#128264; Sound on</button>
    </div>

    <div class="scene-bar" id="sceneBar"></div>
  </div>

  <div class="side">

    <!-- THE DOORSTEP. Who you are is asked once, here, not from six stacked
         bars inside the conversation. Same reason M.E. has a gate: the chat
         column has to hold a conversation, and every permanent control parked
         in it is a line of talk you cannot see. -->
    <div class="gate" id="gate">
      <h3 id="gateTitle">Before you sit down</h3>
      <p class="gate-say" id="gateSay"></p>
      <div id="youPanel"></div>
      <!-- Shares the doorstep rather than adding a surface, the same way Who
           you are does: the chat column has to hold a conversation. -->
      <div id="memPanel" style="display:none"></div>
      <div class="row tight"><button class="btn go wide" id="startBtn">Sit down</button></div>
    </div>

    <div class="chat" id="chat" style="display:none">
      <div class="log" id="log"></div>

      <div class="row">
        <button class="btn" id="micBtn" title="Speak instead of typing">&#127908;</button>
        <input type="text" id="say" placeholder="Say whatever's on your mind&hellip;" autocomplete="off">
        <button class="btn" id="stopBtn" type="button" style="display:none" title="Stop him talking">&#9209;</button>
        <button class="btn go" id="sendBtn">Send</button>
      </div>

      <!-- ONE ROW, SMALL, WRAPPING. These are reached for occasionally; the
           conversation is what the column is for. -->
      <div class="row tools">
        <button class="btn" id="bringBtn">&#128100; Bring someone</button>
        <button class="btn" id="replyBtn">&#127911; Text</button>
        <button class="btn" id="earBtn">&#128066; Listen</button>
        <button class="btn" id="albumBtn">&#128247; Photos</button>
        <button class="btn" id="memBtn">&#128206; Memory</button>
        <button class="btn" id="youBtn">&#128100; You</button>
        <!-- Only shown when there is somebody to swap to. Hidden by default so
             a person with one friend never sees a control about having two. -->
        <button class="btn" id="swapBtn" style="display:none"></button>
      </div>
      <div class="hint" id="earHint" style="display:none"></div>
      <div style="height:.8rem"></div>
    </div>
  </div>

</div>

<script>
/* ── the friend ────────────────────────────────────────────────────────────
   Arch and the loader now live in gc-friend.js, shared with album.html, so his
   canon exists in exactly one file. Which friend this is, demo or built, is
   decided there too and answers to ?who=. */
var FRIEND = GC_FRIEND;

/* THE WAY BACK TO ARCH. Building somebody used to hide the demo permanently,
   with no control anywhere to return, so the only way back was clearing site
   data. This appears only when there are actually two people to move between,
   and it names the one you would be going to rather than saying "switch". */
if (typeof GC_BUILT !== 'undefined' && GC_BUILT) {
  var swap = document.getElementById('swapBtn');
  var goingToDemo = (GC_WHO === 'mine');
  swap.textContent = goingToDemo
    ? '⇄ ' + GC_DEMO.name
    : '⇄ ' + GC_BUILT.name;
  swap.title = goingToDemo
    ? 'Sit with ' + GC_DEMO.name + ' instead. ' + GC_BUILT.name + ' stays exactly as they are.'
    : 'Back to ' + GC_BUILT.name + '.';
  swap.style.display = 'inline-block';
  swap.addEventListener('click', function () {
    location.href = 'room.html?who=' + (goingToDemo ? 'arch' : 'mine');
  });
}

var $ = function (id) { return document.getElementById(id); };

/* The friend's name, written into every place the room says it, from the one
   source. Never a hardcoded name and never a pronoun: this product makes a
   different person for everybody. */
/* Called again when a guest arrives, because they are handed the host's friend
   and everything named after them has to catch up. */
function nameEverything() {
  $('gaugeTitle').textContent = 'How ' + FRIEND.name + ' is feeling right now';
  $('gaugeLabel').textContent = FRIEND.mood || 'Easy, glad you came by';
  /* The wake word hint used to be written here, describing a feature that does
     not exist and telling the reader their audio was being sent away while it
     did not exist. Removed rather than reworded: the button says what it is. */
  $('gateSay').textContent = 'Tell ' + FRIEND.name + ' who you are. You only do this once.';
  $('startBtn').textContent = 'Sit down with ' + FRIEND.name;
}
nameEverything();

/* Skins: resolution and the picker both live in gc-skin.js, shared with every
   other page, so these four surfaces cannot drift apart. */
gcMountSkinPicker(document.getElementById("picker"), document.getElementById("skinBtn"));

/* Publishes the chrome's real height so the conversation can clear it. Re-run
   on resize and whenever a label changes, because both change the box. */
function fitChrome() {
  var c = document.querySelector('.chrome');
  document.documentElement.style.setProperty('--chrome-h', c.offsetHeight + 'px');
}
window.addEventListener('resize', fitChrome);
fitChrome();

/* ── fullscreen ──────────────────────────────────────────────────────────── */
$('fsBtn').addEventListener('click', function () {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function () {});
});
document.addEventListener('fullscreenchange', function () {
  $('fsBtn').innerHTML = document.fullscreenElement ? '&#9974; Exit fullscreen' : '&#9974; Fullscreen';
  fitChrome();   // the label just changed length, so the row may have rewrapped
});

/* ── scenes ──────────────────────────────────────────────────────────────────
   A MISSING CLIP SAYS WHICH CLIP IS MISSING. No poster, no still, no stand-in.
   A placeholder that looks deliberate is how a broken asset reaches production. */
var bar = $('sceneBar'), video = $('loop'), portrait = $('portrait'), current = null;

/* Declared here, not down with the button: play() reads it, and relying on var
   hoisting to make that undefined-but-falsy is luck rather than intent. */
var wantSound = false;

/* Is there a generation API behind this page? False on the deployed campus
   copy, true when running against the local server with a key. Asked once,
   and any failure at all means no. */
var CAN_GENERATE = false;
fetch('/api/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
  .then(function (r) { return r.ok ? r.json() : null; })
  .then(function (j) {
    CAN_GENERATE = !!(j && j.configured);
    if (CAN_GENERATE && current) { var m = portrait.querySelector('.missing'); if (m) showMissing(current.src); }
  })
  .catch(function () { CAN_GENERATE = false; });

function showMissing(src) {
  var old = portrait.querySelector('.missing');
  if (old) old.remove();
  var n = document.createElement('div');
  n.className = 'missing';

  var line = document.createElement('div');
  line.textContent = 'missing: ' + src;
  n.appendChild(line);

  /* MAKE IT, FROM HERE, BUT ONLY WHERE THERE IS SOMETHING TO MAKE IT WITH.
     The generation API is a local Node server; the deployed campus copy has no
     /api at all. So the button appears only once CAN_GENERATE has come back
     true. A dead button on a live page is worse than no button, and this is
     the same file in both places rather than two that drift.

     Every press spends real money, so the server holds the ceilings and
     nothing here retries on its own. A retry loop on a per-second bill is how
     a bounded feature becomes an overnight one. */
  if (CAN_GENERATE) {
    var make = document.createElement('button');
    make.className = 'btn';
    make.style.marginTop = '.9rem';
    make.textContent = 'Make this scene';
    make.addEventListener('click', function () { makeScene(current, make, line); });
    n.appendChild(make);
  }

  portrait.appendChild(n);
  console.warn('[good-company] scene clip not found: ' + src);
}

/* Start, then poll. Veo takes minutes and a serverless function has ten
   seconds, so the browser waits rather than the server. */
function makeScene(scene, btn, line) {
  if (!scene) return;
  btn.disabled = true;
  btn.textContent = 'Starting';

  var name = scene.src.replace(/^video\//, '').replace(/\.mp4$/, '');
  var where = (FRIEND.name + ' at ' + scene.label.toLowerCase() +
               (FRIEND.been ? '. ' + FRIEND.been : ''));

  fetch('/api/scene/start', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: FRIEND.portrait, description: where })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) { fail(j); return; }
    line.textContent = 'making it, this takes a few minutes';
    poll(j.operation, 0);
  }).catch(fail);

  function poll(op, n) {
    btn.textContent = 'Working (' + (n * 15) + 's)';
    fetch('/api/scene/poll', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operation: op, name: name })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) { fail(j); return; }
      if (!j.done) {
        if (n > 40) { fail({ error: 'gave up waiting' }); return; }  // ~10 min, then stop
        setTimeout(function () { poll(op, n + 1); }, 15000);
        return;
      }
      play(scene);          // the file is now exactly where the room looks for it
    }).catch(fail);
  }

  function fail(j) {
    btn.disabled = false;
    btn.textContent = 'Try again';
    line.textContent = 'could not make it: ' + (j && (j.error || j.message) || 'unknown');
    console.warn('[good-company] scene generation failed', j);
  }
}

/* ── A SCENE WITH NO FILM OF IT YET ──────────────────────────────────────────
   NOT A BREACH OF "NO IMAGES UNDER VIDEO", AND THE DIFFERENCE IS THE WHOLE
   POINT OF THIS COMMENT.

   That rule exists because a still placed behind, over or as the poster of a
   video hides the video failing, and a hidden video failure has cost weeks
   more than once. Every part of it still holds: where a scene HAS a source and
   that source breaks, this room shows "missing: <file>" and never a picture,
   exactly as before.

   This is the other case. A friend somebody built has scenes with no source at
   all, because scene generation is not built, so there is no film to hide and
   no failure to mask. There is no video element in play here either: it is
   emptied and taken out of the layout, and what shows is the portrait they
   chose, with a line saying plainly that the moving scene is not made yet.

   Until now that case put up a black rectangle reading "missing:
   video/kitchen.mp4" for every friend anybody built. Cal held a real
   conversation from behind it. */
function showStill(scene) {
  var n = document.createElement('div');
  n.className = 'still';

  if (FRIEND.portrait) {
    var im = document.createElement('img');
    im.src = FRIEND.portrait;
    im.alt = FRIEND.name;
    n.appendChild(im);
  }

  var line = document.createElement('div');
  line.className = 'still-say';
  /* SAYS WHAT IT IS rather than letting a still pass for a scene. If there is
     no picture either, it says that too, instead of dropping to initials in a
     box and letting a missing image go unnoticed.

     With one scene, "no film of the original yet" reads like a fault. It is
     not one: a still picture is what this friend comes with. */
  line.textContent = !FRIEND.portrait
    ? 'No picture of ' + FRIEND.name + ' yet'
    : (FRIEND.scenes.length > 1
        ? 'No film of ' + scene.label.toLowerCase() + ' yet'
        : 'A still picture of ' + FRIEND.name);
  n.appendChild(line);

  portrait.appendChild(n);
}

function play(scene) {
  current = scene;
  var old = portrait.querySelector('.missing');
  if (old) old.remove();
  var oldStill = portrait.querySelector('.still');
  if (oldStill) oldStill.remove();

  if (!scene.src) {
    /* Emptied and hidden, so nothing is layered over anything. */
    video.removeAttribute('src');
    try { video.load(); } catch (e) {}
    video.style.display = 'none';
    showStill(scene);
  } else {
    video.style.display = '';
    video.src = scene.src;
    video.muted = !wantSound;      // the choice survives changing rooms
    video.play().catch(function () {});
  }

  Array.prototype.forEach.call(bar.children, function (chip) {
    chip.classList.toggle('on', chip.dataset.key === scene.key);
  });
}
/* Only where a source was actually asked for. Emptying the element to get it
   out of the way fires this too, and a scene with no film is not a failure. */
video.addEventListener('error', function () { if (current && current.src) showMissing(current.src); });

/* SOUND. Starts off because no browser will autoplay audio, and stays off
   until somebody asks for it. Once on it stays on across scene changes, so
   walking from the fire to the porch does not silence the room. */
$('soundBtn').addEventListener('click', function () {
  wantSound = !wantSound;
  video.muted = !wantSound;
  if (wantSound) video.play().catch(function () {});
  this.innerHTML = wantSound ? '&#128263; Sound off' : '&#128264; Sound on';
});

FRIEND.scenes.forEach(function (scene, i) {
  var chip = document.createElement('button');
  chip.className = 'scene-chip' + (i === 0 ? ' on' : '');
  chip.dataset.key = scene.key;
  chip.textContent = scene.label;
  chip.addEventListener('click', function () { play(scene); });
  bar.appendChild(chip);
});

/* MORE SCENES ARE SOMETHING YOU ADD, NOT SOMETHING MISSING.

   A friend you build comes with one, the picture you chose. Every extra place
   is a film that has to be made, which costs real money each time, so it is
   offered rather than promised: five greyed-out rooms would be five failures
   on the first screen.

   Only where there is one scene. Arch has his five and needs no upsell in his
   own front room. */
if (FRIEND.scenes.length === 1) {
  var more = document.createElement('button');
  more.className = 'scene-chip';
  more.textContent = '+ More scenes';
  more.title = 'Somewhere else to sit with ' + FRIEND.name;
  more.addEventListener('click', function () {
    /* No price and no number written into this. Both change, and copy carrying
       a number goes stale where nobody is looking. */
    notYet('More scenes',
      FRIEND.name + ' comes with the one picture you picked. Other places to sit, ' +
      'and moving scenes rather than a still, are an add-on: each one has to be ' +
      'made. It is not on sale yet.');
  });
  bar.appendChild(more);
}

if (FRIEND.scenes.length) play(FRIEND.scenes[0]);

/* ── conversation ────────────────────────────────────────────────────────────
   SHELL ONLY. Nothing here talks to a model. Your line goes in the log so the
   layout can be judged with real content in it, and the reply says plainly
   that the backend is not wired rather than faking one. */
function post(who, text, mine) {
  var d = document.createElement('div');
  d.className = 'msg' + (mine ? ' mine' : '');
  var w = document.createElement('span');
  w.className = 'who';
  /* Your own lines carry your face, so a room with two humans in it shows at a
     glance who said what. */
  if (mine) {
    var f = document.createElement('span');
    f.className = 'who-face';
    if (YOU.photo) { var im = document.createElement('img'); im.src = YOU.photo; im.alt = ''; f.appendChild(im); }
    else { f.textContent = YOU.emoji; }
    w.appendChild(f);
  }
  w.appendChild(document.createTextNode(who));
  d.appendChild(w); d.appendChild(document.createTextNode(text));
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

/* His own line if he has one, a neutral one if the user built somebody who
   does not. Never a line written for a different person. */
/* WHO YOU ARE. The friend needs your pronouns to talk about you correctly,
   and a room with two humans in it needs to show which line came from whom.
   The same panel serves a guest who arrived on a link with no account. */
var YOU = gcLoadYou();

/* Room state, declared here because sitDown() reads SEAT and relying on var
   hoisting to make that undefined-but-falsy is luck rather than intent. */
var SEAT = null, ROOM = null, lastSeen = null, polling = null;

/* WHAT IS ALREADY ON SCREEN, AND WHICH OF IT IS MINE.

   Your own line is drawn the instant you press send, and then the poll reads
   it straight back out of the room and drew it again. Every single thing the
   host said appeared twice. The old guard tested m.mine_local, a flag nothing
   in this file ever set.

   MY_SEAT_ID is how a line is recognised as yours. That used to be done by
   comparing display names, which breaks two ways: two people called Jen, and
   worse, a guest who never typed a name at all. */
var seen = {}, MY_SEAT_ID = null;
function youLabel(){ return YOU.name || "You"; }

gcMountYou($("youPanel"), function (saved) {
  YOU = saved;
  if (PENDING_INVITE) joinThenSit(); else sitDown();
});

/* Leaving the doorstep. The gate goes, the conversation arrives, and the friend
   speaks first. Coming back to it from the room shows the same panel rather
   than a second copy of it, and the conversation is still there afterwards. */
function sitDown() {
  $("gate").style.display = "none";
  $("chat").style.display = "flex";
  /* His opening line is for somebody arriving alone. A guest joining a room
     already has a conversation coming down the poll, and greeting them over
     the top of it would be him talking to himself. */
  if (!$("log").children.length && !SEAT) {
    post(FRIEND.name, FRIEND.hello || "You came. Sit down, I want to hear about your day.");
  }
}
$("startBtn").addEventListener("click", function () {
  /* Take whatever is in the boxes first. Pressing this instead of Save is not
     a mistake anybody should be punished for. */
  var p = $("youPanel");
  if (p.gcCommit) YOU = p.gcCommit();
  if (PENDING_INVITE) joinThenSit(); else sitDown();
});
$("youBtn").addEventListener("click", function () {
  /* Through the same switch as the memory panel, so the doorstep never shows
     both at once. */
  showGate("you", "Who you are",
    "Change any of it. " + FRIEND.name + " will keep talking after.");
  $("startBtn").textContent = "Back to " + FRIEND.name;
});



/* THE CHAT FUNCTION. Same path locally and on the campus: serve.js aliases it
   to the very file that deploys, so what is tested is what ships. */
var CHAT_URL = "/.netlify/functions/gc-chat";
var thinking = false;
var lastSpoke = Date.now();

/* THE SCALE MOVES. It is how somebody sees that they landed, and how they can
   check on him and tell whether he is all right, which is the whole reason it
   is above the video rather than tucked in a panel. The bars were hardcoded
   percentages until now, so a person could ask after him and get nothing back.

   Comes down with the reply in the same model call, so a living gauge costs
   nothing extra. */
function setFeelings(f) {
  var map = { happy:"f-happy", sad:"f-sad", fear:"f-fear", disgust:"f-disgust",
              anger:"f-anger", surprise:"f-surprise", curious:"f-curious" };
  Object.keys(map).forEach(function (k) {
    var bar = document.querySelector("." + map[k]);
    if (bar && typeof f[k] === "number") bar.style.width = Math.max(0, Math.min(100, f[k])) + "%";
  });
}

function transcript() {
  return Array.prototype.map.call($("log").children, function (el) {
    var w = el.querySelector(".who");
    var who = w ? w.textContent.trim() : "";
    return { who: who,
             text: el.textContent.slice(who.length).trim(),
             mine: el.classList.contains("mine") };
  });
}

function ask(payload) {
  thinking = true;
  $("sendBtn").disabled = true;
  return fetch(CHAT_URL, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({
      friend: FRIEND,
      you: { name: YOU.name, pronouns: YOU.pronouns },
      messages: transcript(),
      scene: current ? { label: current.label, where: current.where } : null
    }, payload))
  }).then(function (r) { return r.json(); }).then(function (j) {
    thinking = false; $("sendBtn").disabled = false;
    lastSpoke = Date.now();
    /* A NULL REPLY IS A REAL ANSWER, not a failure. Nothing is rendered: no
       bubble, no apology, no dots. If silence cannot be produced the room
       always feels like a demo. */
    if (j && j.reply) { post(FRIEND.name, j.reply); speak(j.reply); }
    else if (j && j.error) post("Not wired yet", "The chat function said: " + j.error);
    if (j && j.mood) $("gaugeLabel").textContent = j.mood;
    if (j && j.feelings) setFeelings(j.feelings);
    return j;
  }).catch(function (err) {
    thinking = false; $("sendBtn").disabled = false;
    post("Not wired yet", "Could not reach " + FRIEND.name + ". " + err.message);
  });
}

var lastSent = '', lastSentAt = 0;

function send() {
  var v = $("say").value.trim();
  if (!v || thinking) return;

  /* THE SAME WORDS TWICE IN A MOMENT ARE A BUG, NOT A PERSON.

     This is the last line of defence and it has to be, because the cause
     upstream cannot be told apart from ordinary speech: when Chrome restarts
     recognition it may replay what it already finalised, and it looks
     identical to somebody saying it again. Refusing to reset the consumed mark
     on a restart would swallow the first real sentence of every new session,
     which is worse.

     HOW LONG DEPENDS ON HOW MUCH WAS SAID. "Yes" twice in five seconds is a
     person agreeing twice, and it goes through. A whole sentence repeated word
     for word inside fifteen seconds is a machine, every time. */
  var window = v.length < 12 ? 2000 : 15000;
  if (v === lastSent && (Date.now() - lastSentAt) < window) { $("say").value = ""; return; }
  lastSent = v; lastSentAt = Date.now();

  post(youLabel(), v, true);
  $("say").value = "";
  lastSpoke = Date.now();
  /* SPEAKING RESETS HOW SOON HE BREAKS A SILENCE. Only typing did, and typing
     is not how everybody talks: a person using the microphone never fired the
     input event, so the ladder never went back to the bottom for them. */
  idleStep = 0;

  /* Once there is a room, everything goes through it: the line has to reach the
     other browsers, and whether the friend answers at all is decided server
     side by the room's size, not here. */
  if (SEAT) { sayInRoom(v); return; }
  ask({ message: v });
}

function sayInRoom(text) {
  thinking = true; $("sendBtn").disabled = true;
  fetch("/.netlify/functions/gc-room-say", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ seat_token: SEAT, message: text })
  }).then(function (r) { return r.json(); }).then(function (j) {
    thinking = false; $("sendBtn").disabled = false;
    lastSpoke = Date.now();
    /* Mine is on screen already. Claiming its id here is what stops the next
       poll drawing a second copy of it. */
    if (j && j.said && j.said.id) { seen[j.said.id] = true; MY_SEAT_ID = j.said.author_id || MY_SEAT_ID; }
    /* A null reply is correct and common in a room with several people in it.
       Nothing is rendered. The poll will bring anything he did say, and speak it. */
    if (j && j.feelings) setFeelings(j.feelings);
    if (j && j.mood) $("gaugeLabel").textContent = j.mood;
  }).catch(function (err) {
    thinking = false; $("sendBtn").disabled = false;
    post("Not wired yet", "Could not reach the room. " + err.message);
  });
}

/* ── BREAKING A SILENCE ──────────────────────────────────────────────────────
   The complaint that every chat room on this campus has: nobody speaks first.
   Chat is request and response, so quiet produces nothing, and the moment
   somebody sits down not knowing how to start is exactly the moment this
   product is for.

   So the friend gets ASKED whether they want to say something. They may
   decline, and declining is normal. Backing off each time and stopping after
   a few, so an abandoned tab is not talking to an empty chair, and only while
   the tab is actually in front. */
/* HOW LONG A SILENCE HAS TO BE BEFORE IT IS ONE.

   This was 40 seconds, and Dr. O: "Arch is overdoing the me not talking, he is
   saying it every minute or so." Forty seconds is not a silence. It is less
   time than it takes to read the paragraph he just wrote, and the clock starts
   from HIS reply, so sitting and reading was enough to get asked whether you
   were still there. Being checked on that often is not company, it is being
   hovered over, and it teaches you the room cannot be sat in quietly.

   Five minutes, Dr. O's number, then fifteen, then forty, then he leaves it
   alone. A person who has gone to make tea comes back to the room as they left
   it. Nothing here is allowed to make sitting quietly feel like being watched.

   If this ever needs shortening again, it does not. Being left in peace is the
   feature; the nudge is only for somebody who genuinely does not know how to
   start. */
var IDLE_STEPS = [300, 900, 2400];   // seconds, then it stops
var idleStep = 0;

setInterval(function () {
  if (thinking || idleStep >= IDLE_STEPS.length) return;
  if (document.hidden) return;                       // not talking to a background tab
  if (!$("log").children.length) return;             // nobody has sat down yet
  if ((Date.now() - lastSpoke) / 1000 < IDLE_STEPS[idleStep]) return;
  idleStep += 1;
  ask({ idle: true, idleSeconds: IDLE_STEPS[idleStep - 1] });
}, 5000);

/* Anything said by anybody resets the whole ladder. */
$("say").addEventListener("input", function () { lastSpoke = Date.now(); idleStep = 0; });
$("stopBtn").addEventListener("click", hush);
$('sendBtn').addEventListener('click', send);
$('say').addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

$('albumBtn').addEventListener('click', function () { location.href = 'album.html'; });

/* NOTHING IN THIS ROOM IS ALLOWED TO DO NOTHING. These three are real features
   with no backend yet, and a button that swallows a press is worse than one
   that admits it: the person assumes they missed, presses again, and decides
   the product is broken.

   Bring someone needs the conference-room tables ported over (invite tokens,
   seat tokens, the arrival-forward read rule). Add a memory needs the memory
   store. The mic needs speech capture. Each says so until it is built. */
function notYet(what, why) {
  post('Not wired yet', what + ' is not built yet. ' + why);
}
/* ── BRINGING SOMEBODY IN ────────────────────────────────────────────────────
   PROMOTE ON INVITE. Up to this point the conversation has been a browser and
   nothing else, which is right, because talking to your friend on your own is
   the common case and should cost no database at all. Pressing this is what
   brings a room into existence, and the whole prior thread goes up with it so
   he does not forget what you were saying the moment somebody arrives.

   Anyone in the room can do this, not only the host. A guest wanting to show
   their mum is the product spreading on its own. */

function inviteLink(token) {
  return location.origin + location.pathname + "?join=" + encodeURIComponent(token);
}

function showInvite(token) {
  var url = inviteLink(token);
  /* SAYS IT IS SINGLE USE, because it is, and nothing said so. One link lets in
     one person and is then spent, so testing your own link burns it and two
     people sent the same one means the second is turned away. That was being
     discovered by being turned away. */
  post("Bring someone", "Send them this. They tap it once and they are in the room with you, " +
       "no sign in and no account. It lets in one person and is then used up, so do not open it " +
       "yourself to test it. Press this again for another. They will see the conversation from " +
       "the moment they arrive, not before it.");
  var box = document.createElement("div");
  box.className = "msg";
  var a = document.createElement("input");
  a.type = "text"; a.readOnly = true; a.value = url;
  a.style.cssText = "width:100%;font:inherit;font-size:13px;padding:.4rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px";
  a.addEventListener("focus", function () { this.select(); });
  box.appendChild(a);
  var copy = document.createElement("button");
  copy.className = "btn"; copy.style.marginTop = ".45rem"; copy.textContent = "Copy the link";
  copy.addEventListener("click", function () {
    navigator.clipboard.writeText(url).then(function () { copy.textContent = "Copied"; })
      .catch(function () { a.focus(); });
  });
  box.appendChild(copy);
  $("log").appendChild(box);
  $("log").scrollTop = $("log").scrollHeight;
}

$("bringBtn").addEventListener("click", function () {
  if (SEAT) {  /* already a room: just mint another invite */
    fetch("/.netlify/functions/gc-room-open", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ friend: FRIEND, reuse_seat: SEAT })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.invite_token) showInvite(j.invite_token);
    });
    return;
  }
  this.disabled = true;
  fetch("/.netlify/functions/gc-room-open", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      friend: FRIEND,
      scene_key: current ? current.key : null,
      you: { name: YOU.name, pronouns: YOU.pronouns, avatar: YOU.photo || YOU.emoji },
      messages: transcript()
    })
  }).then(function (r) { return r.json(); }).then(function (j) {
    $("bringBtn").disabled = false;
    if (!j || !j.seat_token) { post("Not wired yet", "Could not open the room: " + ((j && j.error) || "unknown")); return; }
    SEAT = j.seat_token; ROOM = j.room_id; MY_SEAT_ID = j.seat_id || null;
    /* THE CARRIED THREAD IS ALREADY ON SCREEN. Opening a room writes the prior
       conversation up to the server, and without this the very next poll reads
       it straight back and posts every line a second time. His greeting
       appeared twice. Start the cursor at now: anything older is already here. */
    lastSeen = new Date().toISOString();
    startPolling();
    showInvite(j.invite_token);
  }).catch(function (err) {
    $("bringBtn").disabled = false;
    post("Not wired yet", "Could not open the room. " + err.message);
  });
});

/* ── ARRIVING ON A LINK ──────────────────────────────────────────────────────
   THE DOORSTEP COMES FIRST, AND THIS WAS WRONG THE FIRST TIME.

   The original version joined the room the instant the page loaded, before
   the guest had told us anything, and only then showed them the doorstep. Two
   failures fell out of that: they arrived nameless, so whatever they typed
   into the panel never reached the room; and if they pressed Sit down before
   the fetch came back, SEAT was still null and they went down the local path
   into a private conversation of their own. Which is exactly what happened.

   So the token is held, the doorstep is shown, and joining happens when they
   are ready and have a name and pronouns to arrive with. */
var PENDING_INVITE = new URLSearchParams(location.search).get("join");
if (PENDING_INVITE) {
  history.replaceState({}, "", location.pathname);   // the link is spent
  $("gateTitle").textContent = "You have been invited";
  $("gateSay").textContent =
    "Tell them who you are and you will be in the room. No sign in, no account. " +
    "You will see the conversation from the moment you arrive, not before it.";
  $("startBtn").textContent = "Join them";
}

/* Called instead of sitDown() when there is an invite in hand. */
/* Asked once, and only of somebody arriving on an invite. */
var nameAsked = false;

function joinThenSit() {
  var btn = $("startBtn");

  /* ARRIVE AS SOMEBODY. A guest who presses straight through without filling
     the name in lands in the room anonymous: their seat carries no name, so
     every line they say goes up under no name and the friend has nothing to
     call them by. Pookie arrived this way and the room could not tell her
     apart from Arch.

     Asked once, never enforced. Wanting to be in the room without giving a
     name is allowed; not being asked is the bug. */
  if (!nameAsked && !(YOU.name || "").trim()) {
    nameAsked = true;
    $("gateSay").textContent =
      "Put a name in first so they know who just walked in, then press it again. " +
      "Any name you like.";
    var f = $("youPanel").querySelector(".you-name-input");
    if (f) f.focus();
    return;
  }

  btn.disabled = true; btn.textContent = "Joining";

  fetch("/.netlify/functions/gc-room-join", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      invite_token: PENDING_INVITE,
      you: { name: YOU.name, pronouns: YOU.pronouns, avatar: YOU.photo || YOU.emoji, remember_me: false }
    })
  }).then(function (r) { return r.json(); }).then(function (j) {
    btn.disabled = false;
    if (!j || !j.seat_token) {
      /* Says which problem rather than silently dumping them into a room of
         their own, which is the failure this whole rewrite exists to stop.

         AN INVITE IS FOR ONE PERSON AND IS USED UP. A second tap on the same
         link is the ORDINARY case, not an edge one: the host tests their own
         link, or two people are sent the same one. The server calls a spent
         link invite_not_found, which was missing from this list, so the
         commonest failure of all fell through to "something went wrong" and
         then offered the wrong person as a consolation. */
      PENDING_INVITE = null;
      var spent = "That link has already been used. They are single use, one per " +
                  "person, so ask for a fresh one.";
      $("gateTitle").textContent = "That invite has been used";
      $("gateSay").textContent =
        ({ invite_not_found:    spent,
           invite_already_used: spent,
           bad_invite:          "That link is not complete. Copying it again usually fixes it.",
           room_full:           "That room is full.",
           expired:             "That room has closed.",
           closed:              "That room has closed." }[j && j.error]) ||
        "Something went wrong joining. Ask them for a fresh link.";

      /* NOT OFFERED SOMEBODY ELSE AS A CONSOLATION. This used to say "you can
         still sit with Hollis on your own" to a person who had come here to
         join a particular room, naming whoever happened to be built on this
         device. You came to see somebody. Being handed a different person is
         not a smaller version of that. */
      btn.textContent = "Wait for a new link";
      btn.disabled = true;
      return;
    }
    SEAT = j.seat_token; ROOM = j.room_id; MY_SEAT_ID = j.seat_id || null;
    if (j.friend) { FRIEND = j.friend; nameEverything(); }
    if (j.scene_key) {
      var sc = (FRIEND.scenes || []).filter(function (x) { return x.key === j.scene_key; })[0];
      if (sc) play(sc);
    }
    PENDING_INVITE = null;
    sitDown();
    startPolling();
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = "Try again";
    $("gateSay").textContent = "Could not reach the room. " + err.message;
  });
}
/* Everybody in the room reads from the same place. A guest is bounded below by
   their own arrival, which is enforced server side and cannot be argued down
   from here. */
function startPolling() {
  if (polling) return;
  polling = setInterval(function () {
    fetch("/.netlify/functions/gc-room-poll", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seat_token: SEAT, since: lastSeen })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.messages) return;
      var lastHeard = null;
      j.messages.forEach(function (m) {
        lastSeen = m.created_at;

        /* MY OWN LINES ARE NEVER DRAWN FROM THE POLL. They went up the instant
           I pressed send and they are already on screen.

           Claiming the id when gc-room-say answers is too late, and that was
           the race putting typed messages up twice: that function writes the
           line to the room STRAIGHT AWAY and only then waits on the model, so
           for the ten seconds he is thinking the line is sitting there
           readable, and the poll fires every three. It would fetch my own
           sentence back and draw a second copy of it before the response
           carrying its id ever arrived. Whether it happened came down to where
           the three-second tick fell, which is why some typed lines doubled
           and others did not.

           The seat id is known at the door now, so this needs no round trip. */
        if (m.speaker === "person" && m.author_id && m.author_id === MY_SEAT_ID) {
          seen[m.id] = true;
          return;
        }

        if (seen[m.id]) return;      /* already drawn, by this browser or a prior poll */
        seen[m.id] = true;

        /* WHO SAID IT COMES FROM speaker, NEVER FROM A MISSING NAME. The old
           fallback was (m.name || FRIEND.name), so a guest who joined without
           typing a name had every word they said attributed to the friend.
           Pookie's line about her dog appeared over Arch's name. A person
           without a name is "Someone"; only the friend is ever the friend. */
        var label = (m.speaker === "friend")
          ? (FRIEND.name || "Friend")
          : (m.name || "Someone");

        post(label, m.content, m.speaker === "person" && m.author_id && m.author_id === MY_SEAT_ID);

        if (m.speaker === "friend") lastHeard = m.content;
      });

      /* HE STAYS AUDIBLE IN A ROOM. Once a room exists his reply no longer
         comes back to the person who spoke; it arrives here, on everyone's
         poll, and nothing here used to speak it. So he went quiet the moment
         anybody was invited, which is precisely when being heard matters most.

         Only the last line of a batch is spoken, because speak() interrupts
         whatever is playing and a queue of two would talk over itself. */
      if (lastHeard) speak(lastHeard);
      /* THE SCENE IS SHARED. The host changes rooms and everybody follows,
         because if you are both sitting with him at the fireplace then you are
         both at the fireplace. */
      if (j.scene_key && (!current || current.key !== j.scene_key)) {
        var sc = (FRIEND.scenes || []).filter(function (x) { return x.key === j.scene_key; })[0];
        if (sc) play(sc);
      }
    }).catch(function () {});
  }, 3000);
}
/* ── WHAT THEY REMEMBER ──────────────────────────────────────────────────────
   The second thing this product promises, and the last thing in the room that
   was still a button apologising for itself.

   ON THIS DEVICE AND NOWHERE ELSE. There are no accounts here, so there is no
   server that could hold this without inventing one, and what somebody tells a
   friend to remember is the most personal thing in the product: who died, what
   they are frightened of, which day is hard. It is kept in this browser and
   sent nowhere except the request that produces their next reply. That is a
   real limit, said plainly in the panel rather than discovered later: clear
   the browser and it is gone.

   TYPED IN DELIBERATELY, NOT HARVESTED. Nothing is quietly extracted from the
   conversation and filed. You decide what they keep, you can read all of it
   back, and you can take any of it away. Being remembered is only a good thing
   when you know what is being remembered.

   Kept per friend, because Arch and the friend you built are different people
   and should not share a head. */
function memKey() { return 'gc-mem-' + (GC_WHO === 'mine' ? 'mine' : 'arch'); }

function loadMemories() {
  try {
    var v = JSON.parse(localStorage.getItem(memKey()) || '[]');
    return Array.isArray(v) ? v.filter(function (x) { return typeof x === 'string' && x.trim(); }) : [];
  } catch (e) { return []; }
}

function saveMemories(list) {
  try { localStorage.setItem(memKey(), JSON.stringify(list)); } catch (e) {}
  /* Carried on the friend, which is what gets sent to the model and what gets
     written into the room when somebody is invited, so a memory holds in both
     places without a second path to keep in step. */
  FRIEND.memories = list;
}

FRIEND.memories = loadMemories();

function renderMemories() {
  var host = $('memPanel');
  host.innerHTML = '';
  host.className = 'you-panel';

  var list = loadMemories();

  var note = document.createElement('p');
  note.className = 'gate-say';
  note.textContent = list.length
    ? FRIEND.name + ' has these in mind whenever you talk. Kept on this device only, ' +
      'and never anywhere else.'
    : 'Anything you put here, ' + FRIEND.name + ' will know next time without you having to ' +
      'say it again. Kept on this device only, and never anywhere else.';
  host.appendChild(note);

  list.forEach(function (text, i) {
    var row = document.createElement('div');
    row.className = 'you-row';

    var p = document.createElement('div');
    p.style.cssText = 'flex:1;min-width:0';
    p.textContent = text;
    row.appendChild(p);

    var x = document.createElement('button');
    x.type = 'button'; x.className = 'btn';
    x.textContent = 'Forget';
    x.title = 'Take this one away';
    x.addEventListener('click', function () {
      var next = loadMemories();
      next.splice(i, 1);
      saveMemories(next);
      renderMemories();
    });
    row.appendChild(x);
    host.appendChild(row);
  });

  var addRow = document.createElement('div');
  addRow.className = 'you-row';
  var label = document.createElement('label');
  label.className = 'you-label';
  label.textContent = 'Something for ' + FRIEND.name + ' to remember';
  addRow.appendChild(label);

  var box = document.createElement('textarea');
  box.rows = 3;
  box.placeholder = 'My daughter is called Nell. Tuesdays are hard.';
  box.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                      'background:var(--paper);color:var(--ink);border-radius:3px;resize:vertical';
  addRow.appendChild(box);
  host.appendChild(addRow);

  var add = document.createElement('button');
  add.type = 'button'; add.className = 'btn go'; add.textContent = 'Remember this';
  add.addEventListener('click', function () {
    var v = box.value.trim();
    if (!v) { box.focus(); return; }
    var next = loadMemories();
    next.push(v.slice(0, 600));
    saveMemories(next);
    box.value = '';
    renderMemories();
  });
  host.appendChild(add);
}

/* Which of the two panels the doorstep is showing. */
function showGate(panel, title, say) {
  $('chat').style.display = 'none';
  $('gate').style.display = 'block';
  $('youPanel').style.display = (panel === 'you') ? 'block' : 'none';
  $('memPanel').style.display = (panel === 'mem') ? 'block' : 'none';
  $('gateTitle').textContent = title;
  $('gateSay').textContent = say;
}

$('memBtn').addEventListener('click', function () {
  renderMemories();
  showGate('mem', 'What ' + FRIEND.name + ' remembers',
    'Things you have asked ' + FRIEND.name + ' to keep. Add or remove any of it.');
  $('startBtn').textContent = 'Back to ' + FRIEND.name;
});
/* ── SPEAKING INSTEAD OF TYPING ──────────────────────────────────────────────
   The browser's own speech recognition. No API, no key, no per-minute cost,
   which matters for a product whose audience will use it a lot.

   IT STAYS ON. Press once and it keeps listening: you pause, it sends what you
   said, and it carries on. Press again to stop. Somebody with arthritis or a
   tremor should not have to hold a button down, and somebody mid-thought
   should not lose the end of a sentence to a timer.

   Chrome does this by sending audio to Google, which is exactly what the hint
   under the wake word already says: audio leaves the browser only while it is
   on. Off by default, and visibly on when it is on. */
var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false;

function micLabel() {
  $('micBtn').innerHTML = listening ? '&#128308;' : '&#127908;';
  $('micBtn').title = listening
    ? 'Listening. Pause and it sends. Press to stop.'
    : 'Speak instead of typing. It stays on: pause and it sends, then keeps listening.';
}

function startListening() {
  if (!Rec) {
    notYet('Speaking instead of typing',
      'This browser will not do speech recognition. Chrome and Edge will.');
    return;
  }
  rec = new Rec();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = navigator.language || 'en-US';

  var pending = '';

  /* NOTHING IS READ TWICE. This is what was sending every spoken line to the
     room in duplicate while typing was fine.

     With continuous on, e.results holds EVERY result of the session, not just
     the new ones, and the loop below trusts e.resultIndex to say where the new
     ones begin. Chrome resets that index when it restarts recognition, which
     onend does on purpose so that "it stays on" is true. After a restart the
     loop therefore walks back over speech that was already finalised and sends
     it again. "I am still here, Arch", twice. */
  var taken = 0;

  rec.onresult = function (e) {
    var finalBit = '';
    /* Never behind what has already been consumed, whatever the index claims. */
    for (var i = Math.max(e.resultIndex, taken); i < e.results.length; i++) {
      if (e.results[i].isFinal) { finalBit += e.results[i][0].transcript; taken = i + 1; }
      else $('say').value = pending + e.results[i][0].transcript;   // show it forming
    }
    if (finalBit) {
      pending = (pending + ' ' + finalBit).trim();
      $('say').value = pending;
      /* A PAUSE IS THE SEND, AND 1.4 SECONDS IS NOT A PAUSE. It is the gap in
         the middle of an ordinary sentence.

         Pookie, mid-sentence, into the room: "it's not letting me finish what
         I was sending". Her side of that conversation arrived as "Okay so",
         "well", "well", "because one is listen and", "where if you". Every one
         of those is somebody thinking, chopped off and posted as though it
         were a finished thought, and it reads back to her as a machine talking
         over her.

         Nearly three seconds now, and longer still when what is held is short
         enough to obviously be the start of something. "Okay so" is never a
         complete thing anybody meant to say. Waiting too long only costs a
         moment; cutting somebody off costs them the sentence. */
      var held = $('say').value.trim();
      var wait = held.length < 25 ? 4500 : 2800;

      clearTimeout(rec._pause);
      rec._pause = setTimeout(function () {
        if ($('say').value.trim()) { send(); pending = ''; }
      }, wait);
    }
  };

  /* Chrome ends the session on its own after a while. If we are still meant to
     be listening, start it again, so 'it stays on' is actually true. The new
     session gets a fresh results array, so the consumed mark starts over with
     it. Getting this wrong in the other direction would swallow speech. */
  rec.onend = function () {
    taken = 0;
    if (listening) { try { rec.start(); } catch (_) {} }
  };

  rec.onerror = function (e) {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      listening = false; micLabel();
      notYet('The microphone', 'The browser refused access. It can be allowed from the address bar.');
    }
    /* no-speech and aborted are ordinary. onend restarts. */
  };

  try { rec.start(); listening = true; micLabel(); }
  catch (_) { listening = false; micLabel(); }
}

function stopListening() {
  listening = false;
  if (rec) { try { rec.stop(); } catch (_) {} }
  micLabel();
}

$('micBtn').addEventListener('click', function () {
  if (listening) stopListening(); else startListening();
});
micLabel();

/* Close was wired to nothing. In a full-screen room with no wordmark it is the
   only way out, so it goes home. */
$('closeBtn').addEventListener('click', function () { location.href = 'index.html'; });


/* ── ARCH SPEAKS ────────────────────────────────────────────────────────────
   Off by default and opted into, because speech is billed per character and
   this audience talks a lot. Text costs nothing; audio is a choice.

   His voice id lives with the rest of him in gc-friend.js, not in a lookup
   table here, because a voice is part of a person rather than a setting.

   ALWAYS INTERRUPTIBLE. Somebody who wants to say something should never
   have to wait for him to finish, so any new line stops the old audio, and
   there is a visible Stop while he is talking. */
var speaking = null;

function hush() {
  if (speaking) { try { speaking.pause(); } catch (_) {} speaking = null; }
  $("stopBtn").style.display = "none";
}

function speak(text) {
  if (!asAudio || !FRIEND.voiceId || !text) return;
  hush();

  /* SAY THE NAME RIGHT. Only the audio is substituted: the transcript keeps
     the real spelling, because the point is that they are seen properly, not
     that their name gets rewritten. */
  var spoken = text;
  if (YOU.saidAs && YOU.name) {
    var escaped = YOU.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    spoken = spoken.replace(new RegExp('\\b' + escaped + '\\b', 'g'), YOU.saidAs);
  }
  fetch("/.netlify/functions/gc-voice", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: spoken, voice_id: FRIEND.voiceId })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.audio) {
      /* Says which problem rather than failing silently, and only once: a
         missing voice key should not nag on every single line. */
      if (!speak._warned) { speak._warned = true; post("Not wired yet", "Could not fetch his voice: " + ((j && j.error) || "unknown") + ". Text still works."); }
      return;
    }
    speaking = new Audio("data:audio/mpeg;base64," + j.audio);
    $("stopBtn").style.display = "inline-block";
    speaking.onended = hush;
    speaking.play().catch(function () { hush(); });
  }).catch(function () { hush(); });
}

var asAudio = false;
$('replyBtn').addEventListener('click', function () {
  asAudio = !asAudio;
  this.innerHTML = asAudio ? '&#127911; Audio' : '&#127911; Text';
  if (!asAudio) hush();
});
/* THIS BUTTON WAS DOING NOTHING, AND SAYING SOMETHING UNTRUE WHILE IT DID IT.

   It set a flag no code ever read. There is one speech recogniser in this file
   and it belongs to the microphone; nothing anywhere listens for a wake word.
   So "Listen: on" lit up, and the hint underneath told the person that audio
   was leaving their browser, which was not happening. A dead switch is bad. A
   dead switch making a false claim about a microphone is not something to
   leave sitting on a live page.

   Pookie turned it on and talked to it. It says what it is now, until it is
   built. */
$('earBtn').addEventListener('click', function () {
  notYet('Saying "' + FRIEND.name + '" from across the room',
         'Not built yet. To talk, press the microphone next to the box. ' +
         'Nothing is listening until you do.');
});
</script>
