   and it sent both of them to whichever scene happened to be frozen in from
   whenever the room was first opened.

   Played locally first for a responsive click, then told to the server if
   there is a room to tell. Fire and forget: a failed write here is not worth
   interrupting somebody over, and the next successful change corrects it. */
function moveRoom(scene) {
  play(scene);
  if (!SEAT) return;
  fetch('/.netlify/functions/gc-room-scene', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ seat_token: SEAT, scene_key: scene.key }),
  }).catch(function () {});
}

/* PULLED INTO A FUNCTION, 2026-08-18, so it can run again after a guest
   joins via an invite link. Before this it only ever ran once, at the top
   of the page, against whatever FRIEND happened to be at load time (the
   default demo, Arch, for a cold arrival with no ?who= on the link — every
   invite link is exactly that). joinThenSit() already correctly swapped
   the FRIEND variable to the room's real friend on a successful join, but
   nothing rebuilt the scene picker or replayed a first scene against the
   new value, so the video, the portrait, and every scene chip stayed
   frozen on Arch even once the underlying data was right. Dr. O: sent
   Pookie a link to Reggie's room, it took them both to Arch — this is why. */
function renderScenes() {
  bar.innerHTML = '';
  FRIEND.scenes.forEach(function (scene, i) {
    var chip = document.createElement('button');
    chip.className = 'scene-chip' + (i === 0 ? ' on' : '');
    chip.dataset.key = scene.key;
    /* THE CLIP ITSELF, when there is one. Muted so several can play at once
       without turning the picker into noise; looped and small, a preview, not
       the room's actual audio. A scene with neither src nor vimeoId gets
       nothing at all, same "nothing pretending to be there" rule as the
       main stage.

       A VIMEO SCENE gets a real still, not nothing, added 2026-08-18: Dr. O
       caught the spa chip sitting as a flat black box next to five real
       previews, which reads as broken even though the scene itself is fine
       (it just has no local file to loop for a thumbnail, unlike every
       other scene). This is a picker button, not the main stage, so a
       still here is not the same claim the no-poster rule protects against
       on the actual video surface: it is not standing in for a missing
       clip, the clip is one click away and real.

       scene.thumb, A CHOSEN STILL, WINS WHEN THERE IS ONE (added minutes
       later, same day): Dr. O sent a real photo for this exact purpose,
       which beats guessing at a frame via a third-party proxy. Falls back
       to vumbnail.com (a longstanding public Vimeo-thumbnail service, no
       API key, no server round trip) only when a scene has neither a local
       clip nor a chosen still. */
    if (scene.src) {
      var v = document.createElement('video');
      v.src = scene.src; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
      v.playbackRate = scene.speed || 1;   // matches the main stage, so the picker preview isn't a different speed than the real thing
      v.setAttribute('aria-hidden', 'true');
      chip.appendChild(v);
    } else if (scene.thumb || scene.still || scene.vimeoId) {
      var thumb = document.createElement('img');
      thumb.src = scene.thumb || scene.still || ('https://vumbnail.com/' + encodeURIComponent(scene.vimeoId) + '.jpg');
      thumb.alt = '';
      thumb.onerror = function () { this.remove(); };   // falls back to the plain label, not a broken-image icon
      chip.appendChild(thumb);
    } else if (FRIEND.portrait) {
      /* THE SAME GAP AS THE SPA CHIP, found 2026-08-20 on "The Original"
         itself: no src, no thumb, no vimeoId, so it fell all the way
         through to a flat black box next to three real previews, next to
         the exact label ("THE ORIGINAL") that most needs a face on it. The
         Vimeo fix's own reasoning applies unchanged -- reads as broken even
         though it is fine, it is just a still, not a missing clip. The
         portrait IS what this scene is, so it is the obvious fallback: no
         guessing at a frame, no third-party proxy, the same photograph the
         main stage already shows for this exact scene (see showStill()). */
      var still = document.createElement('img');
      still.src = FRIEND.portrait;
      still.alt = '';
      chip.appendChild(still);
    }
    var label = document.createElement('span');
    label.textContent = scene.label;
    chip.appendChild(label);
    chip.addEventListener('click', function () { moveRoom(scene); });

    /* ONLY A DELIVERED SCENE, ONLY ON YOUR OWN BUILT FRIEND. "added-" is the
       exact prefix the add-scene link handler mints (see its own note),
       so this can never appear on The Original, a house-authored scene, or
       anybody's demo room. */
    if (FRIEND === GC_BUILT && /^added-/.test(scene.key)) {
      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'scene-remove';
      remove.textContent = '×';
      remove.title = 'Remove this scene';
      remove.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('Remove "' + scene.label + '"? This cannot be undone from here.')) return;
        FRIEND.scenes = FRIEND.scenes.filter(function (s) { return s.key !== scene.key; });
        GC_saveFriend(FRIEND);
        renderScenes();
      });
      chip.appendChild(remove);
    }

    bar.appendChild(chip);
  });
  /* MOVED IN FROM TOP-LEVEL SCRIPT, 2026-08-25. Dr. O: "I need more scene
     options for Cal, not just one and done." Root cause: this slot used to
     be appended exactly once, at initial page load, as script outside this
     function -- so the very first call to renderScenes() (page load) got
     it, but bar.innerHTML = '' above wipes it on every call AFTER that
     (adding a scene, removing one), and nothing ever put it back. Cal
     could only ever end up with one delivered scene, permanently, the
     moment renderScenes() ran a second time. Living inside the function
     now means every render includes it, not just the first. */
  if (FRIEND === GC_BUILT) {
    var slot = document.createElement('button');
    slot.className = 'scene-chip locked';
    slot.textContent = '+ Add a scene';
    slot.title = 'Somewhere else to sit with ' + FRIEND.name + ', made to order';
    slot.addEventListener('click', askForScene);
    bar.appendChild(slot);
  }
  if (FRIEND.scenes.length) play(FRIEND.scenes[0]);
  renderWatch();
}

/* WATCH ROW, added 2026-08-18. Same thumbnail shape as the scene picker but
   a separate row, separate click behavior: this opens the full-screen
   viewer rather than moving the room. Hidden entirely when a friend has no
   watch array, rather than an empty labeled row.

   REAL <video> FILES, NOT vimeoId, changed 2026-08-21 -- see the long note
   on Tansy's watch array in gc-friend.js for the full history of why these
   left the app and what brought them back. A plain <button> again rather
   than the <a target="_blank"> the 2026-08-18 version used: there is
   nowhere else to send this click now that the viewer is a real player. */
function renderWatch() {
  watchBar.innerHTML = '';
  var list = FRIEND.watch || [];
  if (!list.length) { watchBar.style.display = 'none'; return; }
  watchBar.style.display = '';
  var label = document.createElement('div');
  label.className = 'watch-bar-label';
  label.textContent = 'For watching';
  watchBar.appendChild(label);
  list.forEach(function (item) {
    if (!item.src) return;
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'watch-chip';
    if (item.thumb) {
      var thumb = document.createElement('img');
      thumb.src = item.thumb;
      thumb.alt = '';
      thumb.onerror = function () { this.remove(); };
      chip.appendChild(thumb);
    }
    var glyph = document.createElement('span');
    glyph.className = 'play-glyph';
    glyph.textContent = '▶';
    chip.appendChild(glyph);
    var cap = document.createElement('span');
    cap.textContent = item.label;
    chip.appendChild(cap);
    chip.addEventListener('click', function () { openWatch(item); });
    watchBar.appendChild(chip);
  });
}

/* THE VIEWER ITSELF. A real <video>, so its volume is the browser's own
   native control -- nothing here calls a Player SDK or a postMessage mute,
   because that bridge is exactly what broke twice before. Autoplay WITH
   sound is fine here specifically because the click that opens this IS the
   user gesture browsers require for it. */
function openWatch(item) {
  if (!item.src) return;
  watchVideo.src = item.src;
  watchVideo.muted = false;
  watchViewer.style.display = '';
  watchVideo.play().catch(function () {});
  updateWatchCastVisibility();
}
function closeWatch() {
  watchViewer.style.display = 'none';
  watchVideo.pause();
  watchVideo.removeAttribute('src');
  try { watchVideo.load(); } catch (e) {}   // stops playback and audio the instant it closes
}
$('watchCloseBtn').addEventListener('click', closeWatch);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && watchViewer.style.display !== 'none') closeWatch();
});

/* CAST, for the watch viewer specifically -- a separate <video> element from
   the scene player's #loop, so it needs its own Remote Playback API wiring
   rather than sharing castBtn/updateCastVisibility above. */
var watchCastBtn = $('watchCastBtn');
var watchCastSupported = !!(watchVideo.remote && typeof watchVideo.remote.prompt === 'function');
var watchCastAvailable = false;
function updateWatchCastVisibility() {
  watchCastBtn.style.display = (watchCastSupported && watchCastAvailable && watchVideo.src) ? '' : 'none';
}
if (watchCastSupported) {
  watchVideo.remote.watchAvailability(function (available) {
    watchCastAvailable = available;
    updateWatchCastVisibility();
  }).catch(function () {
    watchCastAvailable = true;
    updateWatchCastVisibility();
  });
}
watchCastBtn.addEventListener('click', function () {
  if (!watchCastSupported) return;
  watchVideo.remote.prompt().catch(function () {});
});

/* SKIPPED HERE ON PURPOSE when arriving on an invite -- see
   ARRIVING_ON_INVITE's own comment above FRIEND. This is what actually put
   Arch's own first scene on the main stage for a guest who had not joined
   anything yet: play(FRIEND.scenes[0]) runs inside renderScenes(), using
   whatever FRIEND was at that moment. joinThenSit() calls renderScenes()
   again once the real friend is known. */
if (!ARRIVING_ON_INVITE) renderScenes();

/* ── COMING BACK FROM PAYING ─────────────────────────────────────────────────
   Stripe sends them back here with a session id and nothing else. Whether it
   was actually paid is a question for Stripe, asked server side, because a
   query parameter that unlocks something is not a payment. */
(function () {
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  var sid = q.get('scene-paid');
  if (!sid) return;

  history.replaceState({}, '', location.pathname + '?who=mine');

  fetch('/.netlify/functions/gc-scene-checkout?session_id=' + encodeURIComponent(sid))
    .then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.paid) {
        /* KEY EVENT, added 2026-08-20, same reasoning as build.html's
           friend_built/friend_paid: no conversion was tracked anywhere on
           Good Company before this, only page views. $4.99 matches
           gc-scene-checkout.js's own SCENE_CENTS, not a guess kept in sync
           by hand elsewhere. */
        if (typeof gtag === 'function') gtag('event', 'scene_ordered', { value: 4.99, currency: 'USD' });
        if (j.job_id) { pollScene(j.job_id); }
        else {
          /* THE AUTO-START ITSELF FAILED SERVER-SIDE (see gc-scene-checkout.js's
             own non-fatal catch around this) -- rare, but honest is better
             than a poll loop with nothing to poll. The order is still paid
             and still sitting there; it just needs the old by-hand path. */
          post('Your scene', 'Paid, thank you. It could not be started automatically just now, ' +
               'but nothing is lost: the order is saved and will still be made.');
        }
      } else {
        post('Your scene', 'That did not come back as paid. If you were charged, nothing is ' +
             'lost: the request is still here and can be picked up.');
      }
    }).catch(function () {
      post('Your scene', 'Could not check that payment just now. The request is still here.');
    });

  /* POLLING, added 2026-08-30 alongside the auto-start in gc-scene-checkout.js
     -- Dr. O direct: "the app must run it." gc-scene.js was always built to
     be polled (see its own header note on why there is no background
     function: Veo answers in under a second, but rendering takes a few
     minutes, so something has to keep checking). Before now the ONLY thing
     that ever polled it was Dr. O, running a GET by hand. This is that same
     poll, just running here instead, while whoever paid is still sitting on
     this exact page having just come back from Stripe.

     BOUNDED, NOT FOREVER: 45 tries, 8 seconds apart, six minutes -- generous
     against "This takes a few minutes" plus gc-scene.js's own up-to-3-attempt
     retry-on-filter, without leaving a tab polling into the night if
     something is genuinely stuck. If it is not done by then, the standing
     fallback still holds: gc-scene.js emails the add-scene link the moment
     it finishes either way (see notify.sceneReady), so nothing is lost, it
     just is not delivered onto the screen still open. */
  function pollScene(jobId) {
    var tries = 0;
    var MAX_TRIES = 45;
    var box = post('Your scene', 'Paid, thank you. Making it now -- this takes a few minutes, ' +
                    'and it will drop straight into the room the moment it is ready.');
    (function check() {
      tries++;
      fetch('/.netlify/functions/gc-scene?job_id=' + encodeURIComponent(jobId))
        .then(function (r) { return r.json(); }).then(function (j) {
          if (!j || !j.ok) { scheduleNext(); return; }
          if (j.status === 'ready') {
            /* REUSES THE EXISTING DELIVERY LINK MECHANISM, same shape the
               email already sends (see gc-scene.js's own order.status ===
               'made' block) and the same one ?add-scene= already knows how
               to accept -- one real path for a scene to arrive, whether by
               email link or by staying on this page. */
            var link = '/.netlify/functions/gc-scene?job_id=' + encodeURIComponent(jobId) + '&file=1';
            location.href = location.pathname + '?add-scene=' + encodeURIComponent(link) +
              '&label=' + encodeURIComponent('A new scene') +
              '&aspect=' + encodeURIComponent(j.aspect || '16:9') + '&who=mine';
            return;
          }
          if (j.status === 'error') {
            post('Your scene', 'It could not be made: ' + (j.note || 'something went wrong') +
                 '. Nothing is owed -- a failed render is refunded automatically.');
            return;
          }
          scheduleNext();
        }).catch(function () { scheduleNext(); });
    })();
    function scheduleNext() {
      if (tries >= MAX_TRIES) {
        post('Your scene', 'Still making it after a few minutes. Leave this tab open a bit ' +
             'longer, or check back -- it will also arrive as a link if you left an email, ' +
             'and nothing is lost either way.');
        return;
      }
      setTimeout(check, 8000);
    }
  }
})();

/* ── COMING BACK FROM PAYING FOR AN IMAGE ────────────────────────────────────
   Same "ask Stripe, never trust the URL" shape as the scene handler just
   above, much shorter: gc-image-checkout.js's own GET does the entire
   generation synchronously (a still edit fits in one request where a Veo
   render never could, see that file's own header note), so there is no
   job to poll -- paid and ready arrive in the same response, and this
   goes straight to the same ?add-scene= delivery every other scene
   already uses, just carrying a still instead of a video. */
(function () {
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  var sid = q.get('image-paid');
  if (!sid) return;

  history.replaceState({}, '', location.pathname + '?who=mine');

  fetch('/.netlify/functions/gc-image-checkout?session_id=' + encodeURIComponent(sid))
    .then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.paid && j.ready && j.image_url) {
        if (typeof gtag === 'function') gtag('event', 'image_ordered', { value: 4.99, currency: 'USD' });
        location.href = location.pathname + '?add-scene=' + encodeURIComponent(j.image_url) +
          '&label=' + encodeURIComponent('A new image') + '&image=1&who=mine';
        return;
      }
      if (j && j.paid && !j.ready) {
        post('Your image', 'Paid, thank you. ' + (j.error || 'It could not be made just now, but nothing is lost.'));
        return;
      }
      post('Your image', 'That did not come back as paid. If you were charged, nothing is ' +
           'lost: the request is still here and can be picked up.');
    }).catch(function () {
      post('Your image', 'Could not check that payment just now. The request is still here.');
    });
})();

/* ── ASKING FOR A SCENE ──────────────────────────────────────────────────────
   The half that was missing. A scene is made from the picture they chose, that
   picture lives in this browser and nowhere else, and nothing ever sent it
   anywhere: a scene could be made and delivered, and the person who wanted one
   had no way to hand over the only thing needed to make it.

   THE PICTURE LEAVING THIS DEVICE IS SAID OUT LOUD. Everything else here keeps
   a built friend in the browser, and somebody told that deserves to be told the
   one moment it stops being true, before it happens rather than in a policy.

   ASKING COSTS NOTHING AND STARTS NOTHING. This writes a request and a picture
   into storage and stops. Making the scene is a separate, owner-only step, so
   a queue can fill up without a penny being spent on it. */
function askForScene() {
  if (!GC_BUILT || !FRIEND.portrait) {
    /* Also not notYet: ordering a scene IS built. What is missing is a friend
       of theirs to make one of, which is a different sentence and a thing they
       can go and do. */
    post('More scenes', 'A scene is made from the picture you chose when you built ' +
         'somebody, and there is not one on this device yet. Make a companion first and ' +
         'this will be waiting.');
    return;
  }

  /* FIXED 2026-08-26 per Dr. O direct: this said "made to order either way, for
     $4.99," which was never true of the bring-your-own path -- see mode 'own'
     in the send handler below, which writes straight to GC_BUILT.scenes with
     no server round-trip and no charge at all. The old text told every
     visitor both options cost money right before showing them a free one. */
  showGate('mem', 'Somewhere else to sit',
    'A picture or a moving scene of ' + FRIEND.name + ' somewhere new. Bring your own and it is ' +
    'free, wired in right away. Ask for one to be made and it is $4.99 either way -- a still in ' +
    'seconds, a moving scene in a few minutes.');
  $('startBtn').textContent = 'Back to ' + FRIEND.name;

  var host = $('memPanel');
  host.innerHTML = '';
  host.className = 'you-panel';

  function row(label, note) {
    var d = document.createElement('div'); d.className = 'you-row';
    var l = document.createElement('label'); l.className = 'you-label'; l.textContent = label;
    d.appendChild(l);
    if (note) { var p = document.createElement('div'); p.className = 'gate-say'; p.textContent = note; d.appendChild(p); }
    host.appendChild(d);
    return d;
  }

  /* IMAGES AND SCENES, SEPARATED, added 2026-08-30. Dr. O direct, thinking
     it through live: "images and scenes are separated. simple." A still
     and a moving clip are different products with different prices, and
     the old single mode row (Describe it / I already have one / Just a
     photo) put a still (free upload) next to two video paths with no line
     between what is a picture and what moves. Two top-level categories
     now, each with exactly two ways in -- upload your own, or pay to
     generate -- same shape on both sides, which is the whole point of
     calling it simple. */
  var categoryRow = document.createElement('div');
  categoryRow.style.cssText = 'display:flex; gap:.5rem; margin-bottom:1rem;';
  var categoryImages = document.createElement('button');
  categoryImages.type = 'button'; categoryImages.className = 'btn'; categoryImages.textContent = 'Images';
  var categoryScenes = document.createElement('button');
  categoryScenes.type = 'button'; categoryScenes.className = 'btn go'; categoryScenes.textContent = 'Scenes';
  categoryRow.appendChild(categoryImages); categoryRow.appendChild(categoryScenes);
  host.appendChild(categoryRow);

  /* TWO WAYS IN, added 2026-08-20. Dr. O, after uploading her own
     already-made video by hand for Isabelle three times in one day, each
     time requiring me to do it for her: "did you make the change where
     they can add an image or a video?" Real gap -- "describe it, Veo
     makes it" was the only path that ever existed. This is the second
     one: already have a video hosted on Vimeo, or a photo you would
     rather Veo worked from instead of the picture you built them with. */
  var modeRow = document.createElement('div');
  modeRow.style.cssText = 'display:flex; gap:.5rem; margin-bottom:1rem; flex-wrap:wrap;';
  var modeGenerate = document.createElement('button');
  modeGenerate.type = 'button'; modeGenerate.className = 'btn go'; modeGenerate.textContent = 'Generate';
  var modeOwn = document.createElement('button');
  modeOwn.type = 'button'; modeOwn.className = 'btn'; modeOwn.textContent = 'Insert Vimeo ID';
  modeRow.appendChild(modeGenerate); modeRow.appendChild(modeOwn);
  host.appendChild(modeRow);

  /* JUST A PHOTO, added 2026-08-30, Dr. O direct: "upload an image (still)
     only an image, not a video. free." Its own mode rather than a second
     file input tucked into the Vimeo/animate row -- that row already has
     a photo field ("a photo to work from instead"), and that one goes
     through Veo and costs nothing to look at but everything to confuse
     with a field that does not. Two visually identical photo pickers
     doing two completely different things (one animated and paid, one
     plain and free) is exactly the shape of mistake this whole page
     exists to avoid -- separating Images from Scenes is the same fix at
     the category level. */
  var imageModeRow = document.createElement('div');
  imageModeRow.style.cssText = 'display:none; gap:.5rem; margin-bottom:1rem; flex-wrap:wrap;';
  var modePhoto = document.createElement('button');
  modePhoto.type = 'button'; modePhoto.className = 'btn go'; modePhoto.textContent = 'Upload your own';
  var modeImageGenerate = document.createElement('button');
  modeImageGenerate.type = 'button'; modeImageGenerate.className = 'btn'; modeImageGenerate.textContent = 'Generate';
  imageModeRow.appendChild(modePhoto); imageModeRow.appendChild(modeImageGenerate);
  host.appendChild(imageModeRow);

  var category = 'scenes';
  var mode = 'generate';
  function setCategory(c) {
    category = c;
    categoryImages.className = 'btn' + (c === 'images' ? ' go' : '');
    categoryScenes.className = 'btn' + (c === 'scenes' ? ' go' : '');
    modeRow.style.display = c === 'scenes' ? '' : 'none';
    imageModeRow.style.display = c === 'images' ? '' : 'none';
    setMode(c === 'images' ? 'photo' : 'generate');
  }
  function setMode(m) {
    mode = m;
    modeGenerate.className = 'btn' + (m === 'generate' && category === 'scenes' ? ' go' : '');
    modeOwn.className = 'btn' + (m === 'own' ? ' go' : '');
    modePhoto.className = 'btn' + (m === 'photo' ? ' go' : '');
    modeImageGenerate.className = 'btn' + (m === 'generate' && category === 'images' ? ' go' : '');
    generateFields.style.display = (m === 'generate' && category === 'scenes') ? '' : 'none';
    ownFields.style.display = m === 'own' ? '' : 'none';
    photoFields.style.display = m === 'photo' ? '' : 'none';
    imageGenerateFields.style.display = (m === 'generate' && category === 'images') ? '' : 'none';
  }
  categoryImages.addEventListener('click', function () { setCategory('images'); });
  categoryScenes.addEventListener('click', function () { setCategory('scenes'); });
  modeGenerate.addEventListener('click', function () { setMode('generate'); });
  modeOwn.addEventListener('click', function () { setMode('own'); });
  modePhoto.addEventListener('click', function () { setMode('photo'); });
  modeImageGenerate.addEventListener('click', function () { setMode('generate'); });

  var generateFields = document.createElement('div');
  host.appendChild(generateFields);
  function rowIn(host2, label, note) {
    var d = document.createElement('div'); d.className = 'you-row';
    var l = document.createElement('label'); l.className = 'you-label'; l.textContent = label;
    d.appendChild(l);
    if (note) { var p = document.createElement('div'); p.className = 'gate-say'; p.textContent = note; d.appendChild(p); }
    host2.appendChild(d);
    return d;
  }

  var whereRow = rowIn(generateFields, 'Where should ' + FRIEND.name + ' be',
    'Short and plain works best -- a brief setting, not a detailed scene. "near a quiet ' +
    'waterfall with a soft rainbow in the mist" is a real one that worked. The longer and ' +
    'more elaborate this gets, the more likely Veo drifts away from their actual face ' +
    'partway through the loop.');
  var where = document.createElement('textarea');
  where.rows = 3;
  where.placeholder = 'at the kitchen table with the morning light coming in';
  where.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                        'background:var(--paper);color:var(--ink);border-radius:3px;resize:vertical';
  whereRow.appendChild(where);

  /* THE SHORT-DESCRIPTION GUARDRAIL, added 2026-08-30. Dr. O: "people will
     be upset if the scene they pay for is bad." Two real renders of the
     same companion, same portrait, same clean single-wrapped prompt
     (stripTemplateEcho already ruled out duplication as the cause) --
     short where kept the face intact both times, long/elaborate where
     lost it entirely by the last second both times. Not proof of exactly
     why, but a real, repeated pattern worth warning against before
     somebody pays $4.99 to find out the hard way. A WARNING, not a block:
     two data points is a real pattern, not certainty enough to refuse
     someone's own words outright. */
  var whereWarn = document.createElement('div');
  whereWarn.className = 'gate-say';
  whereWarn.style.cssText = 'display:none; color:var(--accent); margin-top:.3rem;';
  whereWarn.textContent = 'That is fairly long for a scene description -- consider trimming to ' +
    'just the setting. A shorter description has kept the face intact every time so far; a ' +
    'longer one has lost it every time.';
  whereRow.appendChild(whereWarn);
  var WHERE_WARN_LENGTH = 90;
  where.addEventListener('input', function () {
    whereWarn.style.display = where.value.trim().length > WHERE_WARN_LENGTH ? '' : 'none';
  });

  /* LANDSCAPE OR PORTRAIT, added 2026-08-30, Dr. O direct: "there has to be
     an option for landscape or portrait image/scene." Every scene used to
     be forced into the room's own 16:9 stage regardless of what shape the
     portrait actually was. Two buttons, same visual language as the
     Describe-it/I-already-have-one toggle above, defaulting to landscape
     since that still matches the room's own stage and every existing
     scene. */
  var aspectRow = rowIn(generateFields, 'Shape');
  var sceneAspect = '16:9';
  var aspectPickRow = document.createElement('div');
  aspectPickRow.style.cssText = 'display:flex; gap:.5rem;';
  var aspectLandscape = document.createElement('button');
  aspectLandscape.type = 'button'; aspectLandscape.className = 'btn go'; aspectLandscape.textContent = 'Landscape';
  var aspectPortrait = document.createElement('button');
  aspectPortrait.type = 'button'; aspectPortrait.className = 'btn'; aspectPortrait.textContent = 'Portrait';
  aspectLandscape.addEventListener('click', function () {
    sceneAspect = '16:9';
    aspectLandscape.className = 'btn go'; aspectPortrait.className = 'btn';
  });
  aspectPortrait.addEventListener('click', function () {
    sceneAspect = '9:16';
    aspectPortrait.className = 'btn go'; aspectLandscape.className = 'btn';
  });
  aspectPickRow.appendChild(aspectLandscape); aspectPickRow.appendChild(aspectPortrait);
  aspectRow.appendChild(aspectPickRow);

  var ownFields = document.createElement('div');
  ownFields.style.display = 'none';
  host.appendChild(ownFields);

  var vimeoRow = rowIn(ownFields, 'A Vimeo link or id',
    'Already uploaded somewhere? Paste the link (or just the id) and it is wired in right ' +
    'away -- free, no $4.99, no render to wait on.');
  var vimeoInput = document.createElement('input');
  vimeoInput.type = 'text'; vimeoInput.autocomplete = 'off';
  vimeoInput.placeholder = 'vimeo.com/1219868589, or just 1219868589';
  vimeoInput.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                             'background:var(--paper);color:var(--ink);border-radius:3px';
  vimeoRow.appendChild(vimeoInput);

  var thumbRow = rowIn(ownFields, 'A thumbnail for it', 'Optional. Only used alongside a Vimeo link.');
  var thumbInput = document.createElement('input');
  thumbInput.type = 'file'; thumbInput.accept = 'image/*';
  thumbRow.appendChild(thumbInput);

  /* SOURCE PHOTO, MOVED HERE 2026-08-30 FROM THE VIMEO ROW, Dr. O direct:
     "when you generate the scene there is no way to point to the still
     and also say the text box 'loop'." Two real gaps in one sentence --
     this capability belonged under Generate, not tucked inside Insert
     Vimeo ID where it read like an unrelated bonus field, AND it could
     only ever take a fresh upload, never one of the stills already sitting
     in this same companion's own scene bar (an Images > Generate result,
     or a free Just-a-photo upload) -- David wanted exactly that: point at
     a still he already has, describe the loop, pay $4.99. where above
     already asks the loop question for every Generate order now, photo or
     not, so nothing extra is needed there -- just a source. */
  var sourceRow = rowIn(generateFields, 'Starting from (optional)',
    'Defaults to ' + FRIEND.name + "'s own picture. Pick one of the stills already added below, " +
    'or upload a different photo -- Veo animates whichever one this points to.');
  var sourceSelect = document.createElement('select');
  sourceSelect.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                               'background:var(--paper);color:var(--ink);border-radius:3px;margin-bottom:.5rem';
  var sourceDefaultOpt = document.createElement('option');
  sourceDefaultOpt.value = ''; sourceDefaultOpt.textContent = FRIEND.name + "'s own picture";
  sourceSelect.appendChild(sourceDefaultOpt);
  (GC_BUILT.scenes || []).forEach(function (s, i) {
    if (!s || !s.still) return;
    var opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = s.label || 'A picture';
    sourceSelect.appendChild(opt);
  });
  sourceRow.appendChild(sourceSelect);
  var photoInput = document.createElement('input');
  photoInput.type = 'file'; photoInput.accept = 'image/*';
  sourceRow.appendChild(photoInput);
  /* Choosing one clears the other -- picking an existing still while a
     fresh file still sits in the upload input (or the reverse) would
     leave it ambiguous which one actually gets sent. */
  sourceSelect.addEventListener('change', function () { if (sourceSelect.value) photoInput.value = ''; });
  photoInput.addEventListener('change', function () { if (photoInput.files.length) sourceSelect.value = ''; });

  /* A STILL ALREADY ON THIS DEVICE, TURNED BACK INTO BASE64. scene.still
     is either a data: URL (a free upload or an Images > Generate result
     wired in locally) or, for an Images > Generate delivery, the live
     gc-image.js URL it was delivered from -- either way this is the one
     place that has to tell those two shapes apart before Veo can use it. */
  function stillToBase64(dataUrlOrUrl) {
    if (/^data:/.test(dataUrlOrUrl)) return Promise.resolve(dataUrlOrUrl);
    return fetch(dataUrlOrUrl).then(function (r) { return r.blob(); }).then(function (blob) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () { resolve(String(r.result || '')); };
        r.onerror = function () { reject(new Error('could not read that picture')); };
        r.readAsDataURL(blob);
      });
    });
  }

  /* JUST A PHOTO -- a plain still, no Veo, no render, no charge. Same free,
     instant, client-only wiring as the Vimeo path above: writes straight
     onto this browser's own copy of the friend and shows up immediately. */
  var photoFields = document.createElement('div');
  photoFields.style.display = 'none';
  host.appendChild(photoFields);

  var stillOnlyRow = rowIn(photoFields, 'A photo',
    'Just a picture, not animated. Free, wired in right away -- no $4.99, no render to wait on.');
  var stillOnlyInput = document.createElement('input');
  stillOnlyInput.type = 'file'; stillOnlyInput.accept = 'image/*';
  stillOnlyRow.appendChild(stillOnlyInput);

  var stillOnlyLabelRow = rowIn(photoFields, 'What to call it', 'Optional. Shown under the scene chip.');
  var stillOnlyLabel = document.createElement('input');
  stillOnlyLabel.type = 'text'; stillOnlyLabel.autocomplete = 'off';
  stillOnlyLabel.placeholder = 'A new scene';
  stillOnlyLabel.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                                 'background:var(--paper);color:var(--ink);border-radius:3px';
  stillOnlyLabelRow.appendChild(stillOnlyLabel);

  /* IMAGES > GENERATE, $4.99, added 2026-08-30. Dr. O direct: "images and
     scenes are separated," then, on hitting gc-face.js's own free-draw
     ceiling: "what if after they are made you want to change them?" --
     "not replace their portrait, takes the spot of a scene." A new still
     of the same companion, made the same identity-preserving way Scenes
     already does (see gc-image-checkout.js's own imagePrompt, the still
     twin of gc-scene.js's scenePrompt), landing as a scene-slot picture
     rather than swapping FRIEND.portrait itself. No photo upload here on
     purpose: it always edits FRIEND's own stored portrait, same as
     Describe It always has for a video. */
  var imageGenerateFields = document.createElement('div');
  imageGenerateFields.style.display = 'none';
  host.appendChild(imageGenerateFields);

  var imageWhereRow = rowIn(imageGenerateFields, 'Where should ' + FRIEND.name + ' be',
    'A real still photo of ' + FRIEND.name + ' there, $4.99, ready in seconds -- no render to wait on.');
  var imageWhere = document.createElement('textarea');
  imageWhere.rows = 3;
  imageWhere.placeholder = 'at the kitchen table with the morning light coming in';
  imageWhere.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                             'background:var(--paper);color:var(--ink);border-radius:3px;resize:vertical';
  imageWhereRow.appendChild(imageWhere);

  function readAsBase64(input) {
    return new Promise(function (resolve) {
      var f = input.files && input.files[0];
      if (!f) return resolve(null);
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result || '')); };
      r.onerror = function () { resolve(null); };
      r.readAsDataURL(f);
    });
  }

  var fromRow = row('How to reach you about it', 'Optional. Leave it blank if you would rather not say.');
  var from = document.createElement('input');
  from.type = 'text'; from.autocomplete = 'off';
  from.placeholder = 'an email address, or nothing at all';
  from.style.cssText = 'width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);' +
                       'background:var(--paper);color:var(--ink);border-radius:3px';
  fromRow.appendChild(from);

  var note = document.createElement('p');
  note.className = 'gate-say';
  note.textContent = 'Sending this is the one time ' + FRIEND.name + "'s picture leaves this " +
    'device. It goes so the scene can be made from the portrait you picked, and nothing else.';
  host.appendChild(note);

  var send = document.createElement('button');
  send.type = 'button'; send.className = 'btn go'; send.textContent = 'Ask for it';
  send.addEventListener('click', function () {
    var w = where.value.trim();
    var vimeoRaw = vimeoInput.value.trim();
    var vimeoMatch = /(\d{4,12})/.exec(vimeoRaw);

    /* IMAGES > GENERATE, its own branch, checked first: an entirely
       different order/checkout pair (gc-image-order.js, gc-image-
       checkout.js) from everything below, which all still talks to
       gc-scene-order.js/gc-scene-checkout.js. */
    if (category === 'images' && mode === 'generate') {
      var iw = imageWhere.value.trim();
      if (!iw) { imageWhere.focus(); return; }
      send.disabled = true; send.textContent = 'Sending';
      fetch('/.netlify/functions/gc-image-order', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          portrait: FRIEND.portrait,
          friend: { name: FRIEND.name, gender: FRIEND.gender },
          where: iw,
          from: from.value.trim(),
        }),
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (!j || !j.order_id) {
          send.disabled = false; send.textContent = 'Try again';
          note.textContent = 'That did not send: ' + ((j && j.error) || 'unknown') + '.';
          return;
        }
        /* SAME "ASKED, NOW PAY FOR IT" PAUSE AS SCENES, added so nothing
           charges on the same click that describes it -- consistency with
           the Scenes flow below, not a shortcut around it. */
        host.innerHTML = '';
        var iok = document.createElement('p');
        iok.className = 'gate-say';
        iok.textContent = 'That is noted, and nothing has been charged yet. ' +
          FRIEND.name + ' is not being made into anything until you say so.';
        host.appendChild(iok);

        var ipay = document.createElement('button');
        ipay.type = 'button'; ipay.className = 'btn go'; ipay.textContent = 'Pay $4.99 for it';
        ipay.addEventListener('click', function () {
          ipay.disabled = true; ipay.textContent = 'Opening';
          fetch('/.netlify/functions/gc-image-checkout', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: j.order_id }),
          }).then(function (r) { return r.json(); }).then(function (c) {
            if (c && c.url) { location.href = c.url; return; }
            ipay.disabled = false; ipay.textContent = 'Try again';
            iok.textContent = 'Could not open the payment page: ' + ((c && c.error) || 'unknown') +
              '. Nothing has been charged.';
          }).catch(function (err) {
            ipay.disabled = false; ipay.textContent = 'Try again';
            iok.textContent = 'Could not reach the payment page. ' + err.message;
          });
        });
        host.appendChild(ipay);
      }).catch(function (err) {
        send.disabled = false; send.textContent = 'Try again';
        note.textContent = 'Could not reach it. ' + err.message;
      });
      return;
    }

    if (mode === 'generate') {
      /* w covers both a from-scratch description AND the loop description
         for an existing/uploaded source photo now that the source picker
         lives in this same section -- one field, one question, answered
         once, whichever way the still gets there. */
      if (!w) { where.focus(); return; }
    } else if (mode === 'photo') {
      if (!stillOnlyInput.files.length) {
        note.textContent = 'Choose a photo first.';
        return;
      }
    } else {
      if (!vimeoMatch) {
        note.textContent = 'Paste a Vimeo link or id.';
        return;
      }
    }
    send.disabled = true; send.textContent = 'Sending';

    /* JUST A PHOTO, added 2026-08-30, Dr. O direct: "upload an image
       (still) only an image, not a video. free." Exactly the free,
       client-only wiring the Vimeo branch right below already uses --
       src stays null (see showStill()'s own reasoning on why null means
       "this is a still, not a missing video") and scene.still carries the
       picture. No Veo, no order queue, no $4.99. */
    if (mode === 'photo') {
      readAsBase64(stillOnlyInput).then(function (stillDataUrl) {
        if (!stillDataUrl) {
          send.disabled = false; send.textContent = 'Try again';
          note.textContent = 'That photo could not be read.';
          return;
        }
        var label = stillOnlyLabel.value.trim() || 'A new scene';
        var key = 'added-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        var newScene = { key: key, label: label, src: null, still: stillDataUrl };
        GC_BUILT.scenes = (GC_BUILT.scenes || []).concat([newScene]);
        try { GC_saveFriend(GC_BUILT); }
        catch (e) {
          send.disabled = false; send.textContent = 'Try again';
          note.textContent = 'That could not be saved: this device is out of storage.';
          return;
        }
        host.innerHTML = '';
        var ok = document.createElement('p');
        ok.className = 'gate-say';
        ok.textContent = FRIEND.name + ' has it now -- no charge, nothing to wait on.';
        host.appendChild(ok);
        renderScenes();
      });
      return;
    }

    /* FREE AND INSTANT WHEN IT IS ALREADY MADE, added 2026-08-25. Dr. O:
       "make it so users can upload images or videos they own to use on
       the site for free." A Vimeo link costs nothing to attach -- no Veo
       render, no order queue, no $4.99 -- so it writes straight onto this
       browser's own copy of the friend, the same scene shape the
       add-scene link already produces, and shows up immediately via
       renderScenes() rather than a reload. Only an actual request to
       GENERATE something (a photo for Veo to animate, or a written
       description) still costs real compute and stays behind the paid
       order queue below -- that branch is untouched. */
    /* A REAL VIMEO VIDEO IS ALWAYS FREE, no condition on what else is in the
       form. This used to also require the "photo to work from" field be
       empty, which meant filling in that unrelated optional field -- a
       reasonable thing to do, nothing told anyone not to -- silently
       dropped an already-hosted video into the same $4.99 queue Veo
       renders use, with the fallback below never checking mode at all
       before showing "Pay $4.99." Found 2026-08-28 after Dr. O hit it
       uploading Isabelle's second scene. A video that already exists costs
       nothing to attach either way; the photo field only ever mattered for
       Veo, and Veo is not involved here. */
    if (mode === 'own' && vimeoMatch) {
      readAsBase64(thumbInput).then(function (thumbDataUrl) {
        var label = w || 'A new scene';
        var key = 'added-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        var newScene = { key: key, label: label, vimeoId: vimeoMatch[1] };
        if (thumbDataUrl) newScene.thumb = thumbDataUrl;
        var already = (GC_BUILT.scenes || []).some(function (s) { return s && s.vimeoId === vimeoMatch[1]; });
        if (!already) {
          GC_BUILT.scenes = (GC_BUILT.scenes || []).concat([newScene]);
          try { GC_saveFriend(GC_BUILT); }
          catch (e) {
            send.disabled = false; send.textContent = 'Try again';
            note.textContent = 'That could not be saved: this device is out of storage.';
            return;
          }
        }
        host.innerHTML = '';
        var ok = document.createElement('p');
        ok.className = 'gate-say';
        ok.textContent = FRIEND.name + ' has it now -- no charge, nothing to wait on.';
        host.appendChild(ok);
        renderScenes();
      });
      return;
    }

    /* THE SOURCE, RESOLVED ONCE, added 2026-08-30 alongside sourceSelect
       above -- a picked existing still (possibly a live gc-image.js URL,
       see stillToBase64's own note) or a freshly uploaded file, either
       one turned into the same base64 shape gc-scene-order.js has always
       taken as own_photo. Neither picked: falls through to plain
       from-scratch generation, exactly as before this existed. */
    var sourcePromise = sourceSelect.value
      ? stillToBase64(GC_BUILT.scenes[Number(sourceSelect.value)].still)
      : readAsBase64(photoInput);

    sourcePromise.then(function (sourceDataUrl) {
    var body = {
      portrait: FRIEND.portrait,
      friend: { name: FRIEND.name, gender: FRIEND.gender },
      from: from.value.trim(),
      where: w,
      aspect: sceneAspect,
    };
    if (sourceDataUrl) { body.mode = 'own'; body.own_photo = sourceDataUrl; }

    fetch('/.netlify/functions/gc-scene-order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.order_id) {
        send.disabled = false; send.textContent = 'Try again';
        note.textContent = 'That did not send: ' + ((j && j.error) || 'unknown') + '.';
        return;
      }
      /* ASKED, NOW PAY FOR IT. The order and the picture are already stored
         and nothing has been charged or made. Paying is what releases it to be
         made, which is the same order as everywhere else here: take the money,
         then make the thing. */
      host.innerHTML = '';
      var ok = document.createElement('p');
      ok.className = 'gate-say';
      ok.textContent = 'That is noted, and nothing has been charged yet. ' +
        FRIEND.name + ' is not being made into anything until you say so.';
      host.appendChild(ok);

      var pay = document.createElement('button');
      pay.type = 'button'; pay.className = 'btn go'; pay.textContent = 'Pay $4.99 for it';
      pay.addEventListener('click', function () {
        pay.disabled = true; pay.textContent = 'Opening';
        fetch('/.netlify/functions/gc-scene-checkout', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order_id: j.order_id }),
        }).then(function (r) { return r.json(); }).then(function (c) {
          if (c && c.url) { location.href = c.url; return; }
          pay.disabled = false; pay.textContent = 'Try again';
          ok.textContent = 'Could not open the payment page: ' + ((c && c.error) || 'unknown') +
            '. Nothing has been charged.';
        }).catch(function (err) {
          pay.disabled = false; pay.textContent = 'Try again';
          ok.textContent = 'Could not reach the payment page. ' + err.message;
        });
      });
      host.appendChild(pay);

      var later = document.createElement('p');
      later.className = 'gate-say';
      later.style.marginTop = '.7rem';
      later.textContent = 'Or leave it. Asking does not commit you to anything and the ' +
        'request keeps.';
      host.appendChild(later);
    }).catch(function (err) {
      send.disabled = false; send.textContent = 'Try again';
      note.textContent = 'Could not reach it. ' + err.message;
    });
    }).catch(function (err) {
      send.disabled = false; send.textContent = 'Try again';
      note.textContent = 'Could not read that picture. ' + err.message;
    });
  });
  host.appendChild(send);
}

/* ── A SCENE ARRIVING ────────────────────────────────────────────────────────
   HOW A MADE SCENE GETS TO THE PERSON WHO BOUGHT IT.

   Scenes are made to order and a friend lives in one browser, so there is no
   account to deliver into: the buyer's friend exists only on their own device.
   A link is the whole mechanism. They open it once and the scene is theirs,
   saved with their friend, there every time after.

     room.html?add-scene=video/cal-porch.mp4&label=The%20porch

   Deliberately no owner key on this side. Making a scene costs money and is
   owner only; receiving one is just a file already paid for, and putting a
   secret in a link somebody will paste into a chat is worse than pointless.

   Only ever ADDS. It never edits or replaces what is there, so a link that
   gets opened twice is harmless and a stray link cannot take somebody's friend
   away from them.

   VIMEO SCENES, added 2026-08-20. Dr. O: "Add this scene and use this
   thumbnail" -- her own video, made outside the Veo pipeline entirely and
   uploaded to Vimeo, same as Arch's own spa scene already does it
   (renderScenes() has read scene.vimeoId/scene.thumb since 2026-08-18).
   The rendering side already understood a Vimeo scene; this delivery link
   never did, because every built friend's scene up to now came from this
   file's own Veo pipeline. src carries "vimeo:<numeric id>" instead of a
   path, and thumb carries a real chosen still (same origin rule as
   everything else here) rather than falling back to vumbnail.com's guess
   at a frame. */
(function () {
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  var src = q.get('add-scene');
  if (!src) return;

  var vimeoMatch = /^vimeo:(\d+)$/.exec(src);
  var thumb = (q.get('thumb') || '').trim();
  /* SECOND ACCEPTED SHAPE, added 2026-08-20 for "I already have my own":
     a customer-uploaded thumbnail lives in gc_scene_orders, not the repo,
     so it is served by order id through gc-scene-order.js's own public
     ?order_id=...&thumb=1 route rather than committed as a photos/ file
     the way every hand-placed thumbnail before it was. */
  var thumbOk = !thumb ||
    /^photos\/[A-Za-z0-9._-]+\.(jpg|jpeg|png|webp)$/.test(thumb) ||
    /^\/\.netlify\/functions\/gc-scene-order\?order_id=gco-[0-9a-f]+&thumb=1$/.test(thumb);

  /* Same origin only. An arbitrary URL here would let any link play any video
     (or show any image) inside somebody's room, under their friend's name.
     gc-image.js, added 2026-08-30 alongside Images/Generate -- see
     gc-image-checkout.js's own header note on why an image needs no
     job_id/poll shape the way gcs- does. */
  var imageMatch = /^\/\.netlify\/functions\/gc-image\?order_id=gci-[0-9a-f]+&file=1$/.test(src);
  if (!vimeoMatch && !imageMatch &&
      !/^video\/[A-Za-z0-9._-]+\.mp4$/.test(src) &&
      !/^\/\.netlify\/functions\/gc-scene\?job_id=gcs-[0-9a-f]+&file=1$/.test(src)) {
    post('Not wired yet', 'That scene link does not look right, so nothing was added.');
    history.replaceState({}, '', location.pathname);
    return;
  }
  if (!thumbOk) {
    post('Not wired yet', 'That thumbnail link does not look right, so nothing was added.');
    history.replaceState({}, '', location.pathname);
    return;
  }

  if (!GC_BUILT) {
    post('A scene arrived', 'This scene belongs to a companion you built, and there is not one ' +
         'on this device yet. Make your companion first and open the link again.');
    return;
  }

  var label = (q.get('label') || '').trim().slice(0, 40) || 'A new scene';
  var key = 'added-' + src.replace(/[^a-z0-9]+/gi, '-').slice(-40);
  /* aspect, added 2026-08-30 alongside the landscape/portrait option --
     see gc-scene.js's own note on why the delivery link now carries this.
     Only '9:16' is ever worth storing; '16:9' is play()'s own default, so
     leaving it off a landscape scene keeps every scene from before this
     existed reading exactly the way it always has. */
  var aspect = q.get('aspect') === '9:16' ? '9:16' : null;
  /* A STILL, NOT A VIDEO -- src stays null (see showStill()'s own reasoning
     on why null means "this is a still," not a missing/broken video) and
     the picture lives in scene.still instead, same shape the free
     Just-a-photo upload already uses. */
  var newScene = vimeoMatch
    ? { key: key, label: label, vimeoId: vimeoMatch[1], thumb: thumb || undefined }
    : imageMatch
    ? { key: key, label: label, src: null, still: src }
    : { key: key, label: label, src: src, aspect: aspect || undefined };

  var already = (GC_BUILT.scenes || []).some(function (s) {
    return s && (vimeoMatch ? s.vimeoId === vimeoMatch[1] : imageMatch ? s.still === src : s.src === src);
  });
  if (!already) {
    GC_BUILT.scenes = (GC_BUILT.scenes || []).concat([newScene]);
    try { GC_saveFriend(GC_BUILT); }
    catch (e) {
      post('A scene arrived', 'It could not be saved: this device is out of storage.');
      return;
    }
  }

  /* The link is spent, so the address bar goes back to normal and a refresh
     does not look like it is adding it again. */
  history.replaceState({}, '', location.pathname + '?who=mine');
  /* Reloading is the honest way to pick it up: the scene bar and the friend
     were both built at load from the old list. */
  location.reload();
})();

/* ?set-voice=<elevenlabs id>, added 2026-08-25. Dr. O, after a night of
   copy/paste failing through a remote-controlled machine and a Word
   document mangling straight quotes into curly ones: "give this voice
   to Cal." Same delivery pattern as ?add-scene= above, on purpose --
   that channel worked every single time tonight, it just never had the
   right id to write. A voiceId is not a secret and costs nothing to
   set, so this needs nothing more than GC_BUILT existing on the device
   the link is opened on. */
(function () {
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  var voiceId = (q.get('set-voice') || '').trim();
  if (!voiceId) return;

  if (!/^[A-Za-z0-9]{10,40}$/.test(voiceId)) {
    post('Not wired yet', 'That voice id does not look right, so nothing changed.');
    history.replaceState({}, '', location.pathname);

  if (!GC_BUILT) {

         'this device yet. Make your companion first and open the link again.');

  GC_BUILT.voiceId = voiceId;
  try { GC_saveFriend(GC_BUILT); }
  catch (e) {
    post('A voice arrived', 'It could not be saved: this device is out of storage.');
    return;
  }

  history.replaceState({}, '', location.pathname + '?who=mine');
  location.reload();
})();

/* ?debug-friends=1, added 2026-08-25, TEMPORARY. Console paste kept failing
   through a remote-controlled machine tonight (autocorrected quotes, a tiny
   input box). Real question on the table: is there more than one saved
   "Cal" on this device, with which one is "mine" flipping between loads --

(function () {
