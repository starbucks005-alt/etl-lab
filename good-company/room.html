    return (f.name || '?') + ' [id=' + (f.id || '?') + ', scenes=' + ((f.scenes || []).map(function (s) { return s.key; }).join('|') || 'none') + ']';
  }).join('  //  ');
  post('Debug', (report || 'GC_ALL_BUILT is empty') +
    '  ||  GC_BUILT is currently: ' + (GC_BUILT ? GC_BUILT.id : 'null'));
})();

/* THE SCENES THEY DO NOT HAVE YET, SHOWN AS EMPTY SLOTS.

   A friend you build comes with one, the picture you chose, and the rest are
   made to order because each is a film that costs real money.

   Shown rather than hidden. An empty slot called "Scene two" says both true
   things at once: there is more, and it is not here yet. Hiding it entirely
   would leave somebody thinking one picture is all their friend can ever have,
   and a row of places named for Arch's life ("Porch", "Cabin") was the version
   that made every friend generic.

   Deliberately unnamed. Where scene two happens is the buyer's to decide, and
   guessing at it here is the mistake this whole change came from.

   Only where the friend has the one. Arch has his five and needs no upsell in
   his own front room.

   WAS CAPPED AT FIVE, removed 2026-08-20. Dr. O, once removing a scene
   became possible: "delete and make more, because some people may want
   more... 5,10,15." Right call -- five was Arch's own count, carried over
   as a ceiling with no actual reason behind it for a friend somebody paid
   for one scene at a time. Every scene is $4.99; there was never a
   business reason to stop somebody buying a sixth. ONE slot shown at a
   time now instead of every remaining slot up to a ceiling, since there
   is no longer a ceiling to count down to -- ordinal words ("Scene one")
   do not scale past a handful anyway.

   MOVED INSIDE renderScenes() ITSELF, 2026-08-25 -- see that function's own
   note. This used to live here, as script that ran once at page load, which
   is exactly why it only ever survived the FIRST render. */

/* ── conversation ────────────────────────────────────────────────────────────
   SHELL ONLY. Nothing here talks to a model. Your line goes in the log so the
   layout can be judged with real content in it, and the reply says plainly
   that the backend is not wired rather than faking one. */
function post(who, text, mine, pictures) {
  var d = document.createElement('div');
  d.className = 'msg' + (mine ? ' mine' : '');
  /* WHAT THEY WERE SHOWN STAYS IN THE CONVERSATION. A picture that vanishes
     the moment it is sent leaves the friend reacting to something the person
     can no longer see, which reads as them making it up. */
  if (pictures && pictures.length) {
    var strip = document.createElement('div');
    strip.style.cssText = 'display:flex;gap:.35rem;flex-wrap:wrap;margin:.35rem 0 .1rem';
    pictures.forEach(function (src) {
      var im = document.createElement('img');
      im.src = src; im.alt = 'A picture you showed ' + FRIEND.name;
      im.style.cssText = 'max-width:180px;max-height:180px;border-radius:4px;display:block';
      strip.appendChild(im);
    });
    d.appendChild(strip);
  }
  var w = document.createElement('span');
  w.className = 'who';
  /* Your own lines carry your face, so a room with two humans in it shows at a
     glance who said what. */
  if (mine) {
    var f = document.createElement('span');
    f.className = 'who-face';
    if (YOU.photo) { var im = document.createElement('img'); im.src = YOU.photo; im.alt = ''; f.appendChild(im); }
    else { f.innerHTML = gcAvatarSvg(YOU.avatarId); }
    w.appendChild(f);
  }
  w.appendChild(document.createTextNode(who));
  /* THE ACTUAL WORDS GET THEIR OWN ELEMENT, not a bare text node sitting
     next to whatever else ends up in this bubble. Found 2026-08-19: the
     Replay button (see addReplayButton below) is appended into this same
     div, and transcript() was reading el.textContent for the whole thing --
     which includes a button's own label. "Twice, even" was a duplicate
     MESSAGE; this was a friend's own reply text quietly growing a literal
     "Replay" on the end of it in her own history, which is exactly the kind
     of thing a model keeps noticing and riffing on once it is there. */
  var msgText = document.createElement('span');
  msgText.className = 'msg-text';
  msgText.appendChild(document.createTextNode(text));
  d.appendChild(w); d.appendChild(msgText);
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

/* His own line if he has one, a neutral one if the user built somebody who
   does not. Never a line written for a different person. */
/* WHO YOU ARE. The friend needs your pronouns to talk about you correctly,
   and a room with two humans in it needs to show which line came from whom.
   The same panel serves a guest who arrived on a link with no account. */
var YOU = gcLoadYou();

/* Room state, declared here because sitDown() reads SEAT and relying on var
   hoisting to make that undefined-but-falsy is luck rather than intent. */
var SEAT = null, ROOM = null, lastSeen = null, polling = null;
/* A TALKING-POINT CHIP'S LINE, CARRIED ACROSS THE SIT-DOWN TRANSITION.
   Set by a chip click in nameEverything(), consumed and cleared inside
   sitDown() once #chat is actually visible -- see the note there. */
var GATE_PENDING_ASK = null;
/* WHO PAYS FOR THIS ROOM, added 2026-08-17. A one-way reference, never the
   host's real access_token, handed to every browser in the room (host and
   guests alike) by gc-room-open.js or gc-room-join.js so voice can bill the
   shared balance directly rather than only through the proxied text path. */
var ROOM_CREDIT_REF = null;

/* WHAT IS ALREADY ON SCREEN, AND WHICH OF IT IS MINE.

   Your own line is drawn the instant you press send, and then the poll reads
   it straight back out of the room and drew it again. Every single thing the
   host said appeared twice. The old guard tested m.mine_local, a flag nothing
   in this file ever set.

   MY_SEAT_ID is how a line is recognised as yours. That used to be done by
   comparing display names, which breaks two ways: two people called Jen, and
   worse, a guest who never typed a name at all. */
var seen = {}, MY_SEAT_ID = null;
/* WHO WE ALREADY KNOW IS HERE, for announcing arrivals. Starts null and is
   seeded from the FIRST poll response rather than empty, so everybody
   already in the room at the moment polling starts (including yourself)
   never gets announced as though they just walked in — only a name that
   was not there on a prior poll counts as an arrival. */
var knownPeopleNames = null;
function youLabel(){ return YOU.name || "You"; }

gcMountYou($("youPanel"), function (saved) {
  YOU = saved;
  if (PENDING_INVITE) joinThenSit(); else sitDown();
});

/* FIRST-VISIT INTRO, see the HTML comment above #introTip for why this
   exists. One flag, campus-wide, not per-room: sitting down with a second
   companion does not need the same "there is a text box" lesson repeated. */
function gcSeenComposerIntro() {
  try { return !!localStorage.getItem('gc_seen_composer_intro'); } catch (e) { return true; }
}
function gcDismissComposerIntro() {
  try { localStorage.setItem('gc_seen_composer_intro', '1'); } catch (e) {}
  var tip = $('introTip');
  if (tip) tip.style.display = 'none';
  var reply = $('replyBtn');
  if (reply) reply.classList.remove('intro-highlight');
}
var introTipCloseBtn = $('introTipClose');
if (introTipCloseBtn) introTipCloseBtn.addEventListener('click', gcDismissComposerIntro);

/* Leaving the doorstep. The gate goes, the conversation arrives, and the friend
   speaks first. Coming back to it from the room shows the same panel rather
   than a second copy of it, and the conversation is still there afterwards. */
function sitDown() {
  if (typeof paintSpectate === 'function') paintSpectate();
  $("gate").style.display = "none";
  $("chat").style.display = "flex";
  if (!gcSeenComposerIntro()) {
    var tip = $('introTip'); if (tip) tip.style.display = '';
    var reply = $('replyBtn'); if (reply) reply.classList.add('intro-highlight');
  }
  /* His opening line is for somebody arriving alone. A guest joining a room
     already has a conversation coming down the poll, and greeting them over
     the top of it would be him talking to himself. */
  if (!$("log").children.length && !SEAT) {
    post(FRIEND.name, FRIEND.hello || "You came. Sit down, I want to hear how you have been.");
  }
  // Sat down onto a spectator scene: they are already talking (see play()).
  if (current && current.spectate && !SEAT && typeof startSpectating === 'function') startSpectating();
  /* THE CHIP'S QUESTION, ASKED FOR THEM, now that #chat and $('say') are
     actually visible. Covers both sitDown()'s own callers and
     joinThenSit(), which calls this same function on a successful join. */
  if (GATE_PENDING_ASK) {
    var askText = GATE_PENDING_ASK;
    GATE_PENDING_ASK = null;
    $("say").value = askText;
    send();
  }
}
$("startBtn").addEventListener("click", function () {
  /* Take whatever is in the boxes first. Pressing this instead of Save is not
     a mistake anybody should be punished for. */
  var p = $("youPanel");
  if (p.gcCommit) YOU = p.gcCommit();
  /* A plain Sit down press never carries a stale chip question in from an
     earlier, uncompleted attempt (e.g. an invite join that stopped to ask
     for a name first -- see joinThenSit()). Only an actual chip click sets
     this, immediately before triggering the same sit-down path. */
  GATE_PENDING_ASK = null;
  if (PENDING_INVITE) joinThenSit(); else sitDown();
});
$("youBtn").addEventListener("click", function () {
  /* Through the same switch as the memory panel, so the doorstep never shows
     both at once. */
  showGate("you", "Who you are",
    "Change any of it. " + FRIEND.name + " will keep talking after.");
  $("startBtn").textContent = "Back to " + FRIEND.name;
});



/* THE CHAT FUNCTION. Same path locally and on the campus: serve.js aliases it
   to the very file that deploys, so what is tested is what ships. */
var CHAT_URL = "/.netlify/functions/gc-chat";
var thinking = false;
var lastSpoke = Date.now();

/* THE SCALE MOVES. It is how somebody sees that they landed, and how they can
   check on him and tell whether he is all right, which is the whole reason it
   is above the video rather than tucked in a panel. The bars were hardcoded
   percentages until now, so a person could ask after him and get nothing back.

   Comes down with the reply in the same model call, so a living gauge costs
   nothing extra. */
function setFeelings(f) {
  var map = { happy:"f-happy", sad:"f-sad", fear:"f-fear", disgust:"f-disgust",
              anger:"f-anger", surprise:"f-surprise", curious:"f-curious" };
  Object.keys(map).forEach(function (k) {
    var bar = document.querySelector("." + map[k]);
    if (bar && typeof f[k] === "number") bar.style.width = Math.max(0, Math.min(100, f[k])) + "%";
  });
}

function transcript() {
  return Array.prototype.map.call($("log").children, function (el) {
    var w = el.querySelector(".who");
    var who = w ? w.textContent.trim() : "";
    /* READ ONLY .msg-text, NEVER THE WHOLE BUBBLE. el.textContent used to
       stand in for "what was actually said", which was true right up until
       a message could grow a Replay button after the fact (see post() and
       addReplayButton) -- at which point it silently included the button's
       own label too, and a friend's history quietly filled with a literal
       "Replay" she never said. Falls back to the old whole-element read
       only for a bubble with no .msg-text span at all, which should not
       exist going forward but costs nothing to guard against. */
    var t = el.querySelector(".msg-text");
    var text = t ? t.textContent.trim() : el.textContent.slice(who.length).trim();
    return { who: who, text: text, mine: el.classList.contains("mine") };
  });
}

/* A VISITOR'S OWN BUILT FRIEND, OFFERED TO WHOEVER'S ROOM THIS IS.
   Added 2026-08-19. Dr. O, asking whether Isabelle could meet the house
   cast: "she wants to meet them."

   NEVER OFFERED IN THEIR OWN ROOM. "Isabelle sometimes cameos in
   Isabelle's room" is not a feature, it is a bug shaped like one.
   NEVER OFFERED WITHOUT A VOICE. A cameo with nothing to speak with is
   the exact gap the narrated mechanism exists for, and that is a
   deliberate choice (Gus, Barley), not a fallback for a friend nobody
   got around to giving a voice.

   MORE TO WORK WITH, added 2026-08-19 after Dr. O: "Isabelle talked, but
   very very little." Gender/work/into alone gave the model almost
   nothing to sound like her with, next to how much a hand-authored
   cameo's own host canon already carries about Biscuit or Mochi. voice
   (the how-they-talk chips) and knows (what they are actually good at,
   if anything was given) close most of that gap -- see buildCameoObj. */

/* THE INVITE GATE, added 2026-08-25, WIDENED same day. Dr. O, after Isabelle
   turned up uninvited in Pookie's room: "the invite gate was supposed to be,
   'Isabelle, are you here? If so, say hi.'" First pass only ever checked
   the single most-recently-built friend (GC_mostRecentBuilt) by name --
   tested with Isabelle built last, "Tansy, are you here" came back empty.
   Dr. O: "it should not matter... as long as I say 'x, are you here'."
   guestCameoCandidateFor searches everything in GC_ALL_BUILT, not just the
   most recent one. Arch and the rest of the house cast are demos, not
   built friends -- not in GC_ALL_BUILT, not reachable through this gate,
   since there is nothing of the visitor's to bring in for them. */
function invitesCameo(text, name) {
  if (!text || !name) return false;
  return new RegExp('\\b' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i').test(text);
}

function buildCameoObj(mine) {
  var bits = [];
  if (mine.gender) bits.push(mine.gender);
  if (mine.work) bits.push(mine.work);
  if (mine.into) bits.push('into ' + mine.into);
  if (mine.voice && mine.voice.length) bits.push('talks ' + mine.voice.join(', ').toLowerCase());
  if (mine.knows) bits.push(mine.knows);
  return { name: mine.name, voiceId: mine.voiceId, blurb: bits.join('. ') };
}

function guestCameoCandidateFor(messageText) {
  if (!messageText) return null;
  for (var i = 0; i < GC_ALL_BUILT.length; i++) {
    var mine = GC_ALL_BUILT[i];
    if (!mine || !mine.name || !mine.voiceId) continue;
    if (FRIEND && FRIEND.name === mine.name) continue;
    if (invitesCameo(messageText, mine.name)) return buildCameoObj(mine);
  }
  return null;
}

/* NAME LOOKUP, NOT AN INVITE CHECK. Used only to find a voiceId for a cameo
   the server already decided to include (see the render path below) -- by
   the time a cameo line exists to render, it already happened, so this
   searches the same full GC_ALL_BUILT list guestCameoCandidateFor does,
   not just GC_mostRecentBuilt(), or a cameo from anyone but your latest
   build would post text with no voice. */
function guestCameoLookup(name) {
  if (!name) return null;
  for (var i = 0; i < GC_ALL_BUILT.length; i++) {
    var mine = GC_ALL_BUILT[i];
    if (mine && mine.name === name && mine.voiceId) return buildCameoObj(mine);
  }
  return null;
}

/* ALTERNATING CO-EQUAL SPEAKERS, added 2026-08-29 for Jacob & Wilhelm (see
   gc-friend.js's GC_GRIMMS for the full reasoning), built generic on
   purpose: it reads FRIEND.turnOrder + FRIEND.companions, nothing Grimms-
   specific, so the next shared-room duo just needs its own data, not a new
   mechanism -- Dr. O direct: "creating this one for the brothers will let
   us explore other duos."

   DIFFERENT FROM current.speaker BELOW ON PURPOSE. That is a fixed speaker
   for as long as one SOLO SCENE is on screen (Poppy's scene, Blue's
   scene). A shared room like Jacob & Wilhelm's has no solo scene at all --
   every scene already shows both of them -- so what has to rotate is the
   SPEAKER, every message, not the scene. sessionStorage rather than a
   plain variable so the rotation survives a reload mid-conversation
   instead of silently resetting to whoever goes first. */
function nextTurnSpeaker(friend) {
  var order = friend.turnOrder, key = 'gc-turn-' + friend.id, i = 0;
  try { i = parseInt(sessionStorage.getItem(key), 10) || 0; } catch (e) {}
  try { sessionStorage.setItem(key, String(i + 1)); } catch (e) {}
  return order[i % order.length];
}

function ask(payload) {
  thinking = true;
  $("sendBtn").disabled = true;
  /* WHO IS ACTUALLY IN THE SCENE, added 2026-08-18. Dr. O picked the scene
     with just Poppy, or just Blue, on their own, and expected them to be
     the one talking — "but Tansy is still there" was the bug, the room
     kept answering as Tansy no matter which scene was on screen. A scene
     names its speaker by key (see gc-friend.js, current.speaker), looked
     up here against FRIEND.companions, the small persona Tansy carries for
     each of them. Sent alongside friend, not instead of it: friend still
     does the billing, is_demo, and credit gating (see gc-chat.js's own
     activeFriend note) because Poppy and Blue are not separately built or
     paid for, they are borrowing Tansy's room.

     FALLS THROUGH TO nextTurnSpeaker() when the scene names no fixed
     speaker but the friend has a turnOrder -- a shared room like Jacob &
     Wilhelm's, where every scene is shared and who answers rotates by
     message instead of by scene. */
  var speakerKey = (current && current.speaker) ? current.speaker
                  : (FRIEND.companions && FRIEND.turnOrder) ? nextTurnSpeaker(FRIEND) : null;
  var speakerObj = (speakerKey && FRIEND.companions) ? FRIEND.companions[speakerKey] : null;
  return fetch(CHAT_URL, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({
      friend: FRIEND,
      speaker: speakerObj,
      /* NOT DURING A COMPANION'S SOLO SCENE. speakerObj means Poppy or Blue
         is standing in for Tansy on their own -- "the point of a solo
         scene is that this companion has the room to themselves" is this
         same file's own existing rule for why speaker carries no .cameos,
         and a guest cameo showing up anyway would quietly break it. */
      guest_cameo: speakerObj ? null : guestCameoCandidateFor(payload.message || ''),
      you: { name: YOU.name, pronouns: YOU.pronouns },
      messages: transcript(),
      scene: current ? { label: current.label, where: current.where } : null,
      /* THE CREDIT CEILING, added 2026-08-17. is_demo tells gc-chat.js
         whether this is a house friend (free, daily-capped) or a friend
         somebody built (paid rung, credits only, no free fallback). The
         other two are the same shared identity Almost Human already uses;
         a person's existing membership just works here.

         WAS FRIEND === GC_DEMO, fixed 2026-08-19: an object identity
         check against Arch specifically, so Reggie, Sophia, and Tansy
         all read as NOT a demo — the same object-identity mistake
         currentDemoId() (below) was already fixed for once, for a
         different symptom. A real visitor with no credits talking to
         Reggie would hit the paid-friend wall instead of the free daily
         allowance. Never bit Dr. O herself, since her owner key bypasses
         credit checks entirely regardless of is_demo. */
      is_demo: !!currentDemoId(),
      visitor_id: GC_visitorId(),
      access_token: GC_accessToken(),
      owner_key: GC_ownerKey(),
      /* tester_key, added 2026-08-29 -- see GC_testerKey()'s own comment in
         gc-friend.js. A separate, narrower door than owner_key: gc-chat.js
         checks it against GC_TESTER_KEYS and skips both the free daily-cap
         wall and credits_exhausted, nothing else about the visit changes. */
      tester_key: GC_testerKey()
    }, payload))
  }).then(function (r) { return r.json(); }).then(function (j) {
    thinking = false; $("sendBtn").disabled = false;
    lastSpoke = Date.now();
    /* WHEN THE WHOLE TURN IS OVER, added 2026-09-03 for Spectator Mode: the
       reply shown and said, the cameo shown and said, or nothing to show.
       payload.onSettled(spoke, j) fires exactly once, audio on or off, so a
       caller can chain the next beat without caring which path this took. */
    var settledOnce = false;
    function settled(spoke) {
      if (settledOnce) return; settledOnce = true;
      if (payload && typeof payload.onSettled === 'function') payload.onSettled(spoke, j);
    }
    /* A NULL REPLY IS A REAL ANSWER, not a failure. Nothing is rendered: no
       bubble, no apology, no dots. If silence cannot be produced the room
       always feels like a demo.

       WIDENED FROM if (j && j.reply) TO ALSO COVER j.cameo ALONE, found
       2026-08-19: Dr. O asked Tansy directly into Reggie's room, nothing
       showed up, asked again, got a real Reggie line. gc-chat.js now
       preserves a cameo even when the host has no line of his own that
       turn (see its own fix, same date) -- this side still needed to stop
       requiring j.reply to render anything at all, or that preserved
       cameo would arrive here and still never post. */
    if (j && (j.reply || (j.cameo && j.cameo.text))) {
      /* speaker_name/speaker_voice_id are what gc-chat.js actually used to
         build the reply (see its own activeFriend note) — trusted over the
         locally-picked speakerObj in case the scene changed underneath a
         slow reply. Falls back to FRIEND for every ordinary scene, exactly
         as before this existed. */
      var talkerName = (j.speaker_name) || FRIEND.name;
      var talkerVoice = (j.speaker_voice_id) || FRIEND.voiceId;
      var replyBubble = j.reply ? post(talkerName, j.reply) : null;
      /* THE CAMEO, IF THERE IS ONE (Poppy, in Tansy's room, rarely).
         Text posts right away either way. The speech is chained after her
         own line finishes, via onDone, rather than fired at the same time,
         so audio mode never has two voices talking over each other. */
      function showCameo() {
        if (j.cameo && j.cameo.text) {
          var cameoBubble = post(j.cameo.name, j.cameo.text);
          /* A NARRATED LINE READS LIKE A QUOTE OTHERWISE. "Gus noses at
             Arch's hand" sits in the exact same bubble shape as anybody
             else's actual words; italic is the whole difference between
             description and dialogue at a glance. */
          if (j.cameo.narrated) {
            var cameoText = cameoBubble.querySelector('.msg-text');
            if (cameoText) cameoText.style.fontStyle = 'italic';
          }
          /* NARRATED CAMEOS (Gus, Barley) CARRY voice_id: null, and speak()
             falls back to FRIEND's OWN voice when given a falsy one -- fine
             for every ordinary call, wrong here specifically: Gus would
             speak in Arch's voice, which is exactly the thing "narrated,
             non-speaking" rules out. Skipped outright rather than passed
             through. */
          /* settled() rides the cameo's own onDone, so a spectate run waits for the
             partner's answer to finish being said before asking for the next beat. */
          if (j.cameo.voice_id) speak(j.cameo.text, j.cameo.voice_id, function () { settled(true); }, cameoBubble);
          else settled(true);
          rememberCameoElsewhere(j.cameo.name, j.cameo.text);
        } else settled(true);
      }
      if (j.reply) speak(j.reply, talkerVoice, showCameo, replyBubble);
      else showCameo();
    }
    else if (j && (j.credits_exhausted || j.daily_capped)) { showCreditsUpsell(j.daily_capped, j.owner_key_rejected); settled(false); }
    else if (j && j.error) { post("Not wired yet", "The chat function said: " + j.error); settled(false); }
    else settled(false);
    if (j && j.mood) $("gaugeLabel").textContent = j.mood;
    if (j && j.feelings) setFeelings(j.feelings);
    return j;
  }).catch(function (err) {
    thinking = false; $("sendBtn").disabled = false;
    post("Not wired yet", "Could not reach " + FRIEND.name + ". " + err.message);
    if (payload && typeof payload.onSettled === 'function') payload.onSettled(false, null);
  });
}

/* ── SPECTATOR MODE ──────────────────────────────────────────────────────────
   Added 2026-09-03, named by Dr. O: "the characters with 2+ [get] the chance
   to play out their own conversations while the humans watch... a button
   that lets the characters autoplay." Ported from My Echo the same day.

   One press asks for a beat: a turn where nobody said anything, sent with
   spectate:true and the names of who is in the room to talk to. gc-chat
   has the speaker say something to a partner and the partner answer on the
   cameo line. When that beat has been shown and said (ask's onSettled), the
   next is asked for, until six, or the person types, or the button again.
   A ceiling rather than forever: each beat is a model turn (Haiku, see
   gc-chat's SPECTATE_MODEL) and a conversation nobody is in should wind
   down on its own.

   WHO THERE IS TO TALK TO. A turnOrder room (the Grimms, Tobias & Briar,
   the puppets, the nursery): the other companions in the order, which are
   exactly this speaker's cameos. A friend with a spectateWith list (Reggie:
   Biscuit and Mochi; Marion: the household in her walls). A friend with
   companions (Tansy: Poppy and Blue). Anybody else has nobody in the room
   with them and never sees the button. NOT in a shared room: there the
   turns go through gc-room-say, and this is a different feature. */
var spectating = false, spectateBeats = 0, spectateTimer = null;
var SPECTATE_MAX_BEATS = 6;
var SPECTATE_PAUSE_MS = 1600;
function spectatePartnersFor(speakerKey) {
  var names = [];
  if (FRIEND.turnOrder && FRIEND.companions) {
    FRIEND.turnOrder.forEach(function (k) {
      if (k !== speakerKey && FRIEND.companions[k] && FRIEND.companions[k].name) names.push(FRIEND.companions[k].name);
    });
  } else if (Array.isArray(FRIEND.spectateWith) && FRIEND.spectateWith.length) {
    names = FRIEND.spectateWith.slice();
  } else if (FRIEND.companions) {
    Object.keys(FRIEND.companions).forEach(function (k) {
      if (FRIEND.companions[k] && FRIEND.companions[k].name) names.push(FRIEND.companions[k].name);
    });
  }
  /* A turnOrder can list the same companion more than once (the Littles
     weight Marion to every other turn), so the same name must not be
     offered twice as a partner. */
  var seen = {}, out = [];
  names.forEach(function (n) { if (!seen[n]) { seen[n] = 1; out.push(n); } });
  return out.slice(0, 4);
}
function roomCanSpectate() {
  if (SEAT || !FRIEND) return false;
  return spectatePartnersFor(null).length > 0;
}
function paintSpectate() {
  var b = document.getElementById('spectateBtn');
  if (!b) return;
  b.style.display = roomCanSpectate() ? '' : 'none';
  b.innerHTML = spectating ? '&#128065; Spectating&hellip;' : '&#128065; Spectate';
}
function stopSpectating() {
  if (spectateTimer) { clearTimeout(spectateTimer); spectateTimer = null; }
  if (!spectating) return;
  spectating = false;
  paintSpectate();
}
function spectateBeat() {
  spectateTimer = null;
  if (!spectating || !roomCanSpectate()) { stopSpectating(); return; }
  if (thinking) { spectateTimer = setTimeout(spectateBeat, 800); return; }
  if (spectateBeats >= SPECTATE_MAX_BEATS) { stopSpectating(); return; }
  spectateBeats += 1;
  /* The speaker is picked inside ask() exactly as for a typed message
     (current.speaker, else nextTurnSpeaker), so the partners are worked out
     from the same rotation one step ahead: peek without advancing. */
  var peek = null;
  if (current && current.speaker) peek = current.speaker;
  else if (FRIEND.companions && FRIEND.turnOrder) {
    var i = 0; try { i = parseInt(sessionStorage.getItem('gc-turn-' + FRIEND.id), 10) || 0; } catch (e) {}
    peek = FRIEND.turnOrder[i % FRIEND.turnOrder.length];
  }
  ask({
    spectate: true,
    spectate_with: spectatePartnersFor(peek),
    onSettled: function (spoke, j) {
      if (!spectating) return;
      if (!spoke || (j && (j.credits_exhausted || j.daily_capped || j.error))) { stopSpectating(); return; }
      spectateTimer = setTimeout(spectateBeat, SPECTATE_PAUSE_MS);
    }
  });
}
function startSpectating() {
  if (spectating || !roomCanSpectate()) return;
  if (!gcSeenComposerIntro()) gcDismissComposerIntro();
  spectating = true; spectateBeats = 0;
  paintSpectate();
  spectateBeat();
}
$('spectateBtn').addEventListener('click', function () {
  if (spectating) { stopSpectating(); return; }
  startSpectating();
});

/* ── THE UPSELL, WHEN CREDITS OR THE FREE CAP RUN OUT ────────────────────────
   Matches Almost Human's own showUpsell pattern: daily_capped (a house demo,

   credits_exhausted (a paid built friend, or a subscriber who ran dry)
   offers subscribe AND, if there is already a token to top up, the $4.99
   addon. return_to sends them straight back to this room afterward, since
   it is the same membership either way. */
var creditsUpsellShown = false;
function showCreditsUpsell(isDailyCap, ownerKeyRejected) {

  creditsUpsellShown = true;

  var box = document.createElement('div');
  box.className = 'msg';
  box.id = 'creditsUpsell';

  /* ownerKeyRejected, added 2026-08-18: Dr. O hit this exact message twice
     on real attempts and there was no way to tell, from the message alone,
     whether her key never arrived or arrived and got rejected — two
     different problems that looked identical. Named plainly rather than
     silently falling through to the same visitor-facing copy a real
     first-time visitor sees. */
  say.textContent = ownerKeyRejected
    ? "An owner key came through with that message but was not recognized. Check it against " +

    : isDailyCap
    /* REWRITTEN 2026-08-30: the old copy only ever named "make X yours" as

    ? "That's today's free messages with " + FRIEND.name + ". Come back tomorrow, or keep " +

  /* THE VALUE LINE, added 2026-08-26 per Dr. O direct: "make everything very

     _ah-credits.js's XL_ADDON_CREDITS comment. A real number here would go

  if (!ownerKeyRejected) {

    value.className = 'upsell-note';
    value.textContent = 'Less than a movie ticket, for a lot more company.';
    box.appendChild(value);
  }

  /* NO PURCHASE BUTTONS FOR A REJECTED OWNER KEY. Offering to buy credits or
     subscribe to somebody who was trying to use the owner bypass is the
     wrong answer to the actual problem, and it is exactly what real

  if (!ownerKeyRejected) {
    var actions = document.createElement('div');
    actions.style.cssText = 'margin-top:.5rem; display:flex; gap:.5rem; flex-wrap:wrap;';

    if (isDailyCap) {
      /* BUY CTAS BELONG HERE TOO, changed 2026-08-30, Dr. O direct: "the CTA
         links to top off/buy in the chat rooms are not there unless you
         make them yours, but should be there if you do not have funds."
         Somebody out of free messages on a DEMO wants to keep sampling

         didn't buy the 4.99 for a companion, he bought it for talking to

         (startCreditsCheckout, create-checkout-ah/-addon, already built

      var claimNowBtn = document.createElement('button');

      /* PER-COMPANION, changed 2026-08-28: subscribing and topping up both

      var subBtn = document.createElement('button');

function startCreditsCheckout(url, extra) {
  /* return_to BUILT EXPLICITLY, same fix and same reasoning as
     startCompanionCheckout's own note below: location.search is not
     guaranteed to carry ?who= just because a real demo is on screen (see
     GC_WHO's own rule 3, the remembered-tab fallback). access_token added
     2026-08-30: without it this always minted a brand new pooled row
     instead of topping up whatever this visitor already had, so someone
     buying credits twice for demos in general would silently split across
     two different balances. */
  var demoId = currentDemoId();
  var returnTo = '/good-company/room.html?who=' + encodeURIComponent(demoId || (FRIEND && FRIEND.id) || '');
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ return_to: returnTo, access_token: GC_accessToken() }, extra))
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.url) { location.href = data.url; }
      else { post('Not wired yet', 'Could not start that just now. Try again in a moment.'); }
    })
    .catch(function () { post('Not wired yet', 'Could not start that just now. Try again in a moment.'); });
}

/* PER-COMPANION CHECKOUT, added 2026-08-28: same shape as
   startCreditsCheckout above, but always names THIS companion
   (friend_id/friend_name), since gc-companion-checkout.js and
   gc-companion-addon.js both write to that companion's own row, not a
   pooled balance.

   return_to BUILT EXPLICITLY FROM FRIEND.id, not read off the address
   bar, fixed 2026-08-30. David subscribed on his own newly-claimed Dario,
   came back from Stripe, and landed on Arch's room instead -- the same
   "make Arch yours" gate Dr. O then saw, on a companion nobody had asked
   for. Root cause: GC_WHO can resolve the current room from remembered
   session state alone (see its own rule 3), so location.search is not
   guaranteed to contain ?who=<id> just because a real, specific FRIEND is
   on screen. If it did not, the round trip through Stripe came back to a
   bare /room.html, and whatever GC_WHO fell through to next (Arch, same
   as this whole function's default demo) is where Stripe returned him --
   this button had never actually promised to come back to THIS
   companion, only to whatever the URL happened to say at that exact
   moment. Naming FRIEND.id directly removes the guess. */
function startCompanionCheckout(url, extra, friendOverride) {
  /* friendOverride, added 2026-08-30 for the daily-cap buy buttons (see
     showCreditsUpsell above): those silently claim a demo into an owned
     copy first, then need checkout to bill THAT new friend, not the demo
     still sitting in the global FRIEND. Without this the function always
     read FRIEND regardless of what was passed, which meant every claim-
     then-buy click on a demo sent the demo's own id (or none) to
     gc-companion-checkout.js, got rejected, and showed "Not wired yet"
     for what was actually a real, correctly-claimed friend. */
  var f = friendOverride || FRIEND;
  var returnTo = '/good-company/room.html?who=' + encodeURIComponent(f.id || '');
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({
      return_to: returnTo,
      friend_id: f.id || '',
      friend_name: f.name || '',
      access_token: GC_accessToken(),
    }, extra))
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.url) { location.href = data.url; }
      else { post('Not wired yet', 'Could not start that just now. Try again in a moment.'); }
    })
    .catch(function () { post('Not wired yet', 'Could not start that just now. Try again in a moment.'); });
}

/* COMING BACK FROM A PER-COMPANION PAYMENT, added 2026-08-28. Same
   "ask Stripe, never trust the URL" reasoning as build.html's old
   ?friend-paid= handler (now removed there, since opening a room is free)
   -- this is its replacement, just for a real money event (subscribe or
   top up) instead of a one-time unlock.

   confirmingPayment, added 2026-08-30: a real global, not scoped inside
   the IIFE below, so send() itself (Enter key, not just a click on the
   now-disabled sendBtn) can see it too. Disabling sendBtn alone left the
   Enter-key path wide open the whole time this fetch was in flight. */
var confirmingPayment = false;
(function () {
  var q = null;
  try { q = new URLSearchParams(location.search); } catch (e) {}
  var subSession = q && q.get('companion-paid');
  var addonSession = q && q.get('companion-addon-paid');
  var sessionId = subSession || addonSession;
  if (!sessionId) return;

  var endpoint = subSession
    ? '/.netlify/functions/gc-companion-checkout'
    : '/.netlify/functions/gc-companion-addon';

  try { history.replaceState(null, '', location.pathname + location.search.replace(/[?&](companion-paid|companion-addon-paid)=[^&]*/, '').replace(/^&/, '?')); } catch (e) {}

  /* SEND DISABLED UNTIL THIS RESOLVES, added 2026-08-30. David paid,
     landed back in the room, and typed a message before this fetch had
     saved his new access_token to localStorage -- GC_accessToken() still
     read empty, gc-chat.js's credit check found no row to check against,
     and it looked exactly like the payment had not registered even
     though it had, a few hundred milliseconds too late. This confirmation
     is the only place that token gets written for a first-time buyer, so
     nothing should be able to talk to the room until it lands. */
  confirmingPayment = true;
  var sendBtn = $('sendBtn');
  if (sendBtn) sendBtn.disabled = true;

  fetch(endpoint + '?session_id=' + encodeURIComponent(sessionId))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.paid) return;
      if (data.access_token) { try { localStorage.setItem('ah_access_token', data.access_token); } catch (e) {} }
      if (typeof gtag === 'function') {
        gtag('event', subSession ? 'companion_subscribed' : 'companion_addon', { value: subSession ? 9.99 : null, currency: 'USD' });
      }
      creditsUpsellShown = false;
      var old = document.getElementById('creditsUpsell');
      if (old) old.remove();
      post('You’re set', data.balance != null
        ? 'Credits with ' + FRIEND.name + ': ' + data.balance + '.'
        : 'That went through.');
    })
    .catch(function () {})
    .then(function () { confirmingPayment = false; if (sendBtn) sendBtn.disabled = false; });
})();

/* ── SHOWING THEM SOMETHING ──────────────────────────────────────────────────
   Dr. O: the friend should be able to receive images and see webpages, the way
   Claude can. This is the images half, and it is the half people actually
   reach for: the dog, the garden, the grandchildren, what somebody has cooked.

   SHRUNK BEFORE IT GOES. A modern phone photograph is four thousand pixels
   across and several megabytes, and vision tokens scale with size, so a
   friend being shown the garden should not cost more than a long conversation.
   1024 across is plenty for somebody to talk about and a fraction of the bill.

   IT LEAVES THE DEVICE, and that is said once, the first time, rather than
   buried. Everything else in this room stays in the browser. */
var pending = [];        // what is queued to show them, already shrunk
var saidPicturesLeave = false;

function shrink(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var max = 1024, w = img.width, h = img.height;
      if (Math.max(w, h) > max) {
        if (w > h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('that file is not a picture')); };
    img.src = url;
  });
}

function queuePictures(files) {
  var list = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\//.test(f.type); });
  if (!list.length) return;
  /* Four is what the friend is given; queueing more just wastes the person's
     time shrinking pictures that will not be sent. */
  list = list.slice(0, 4 - pending.length);

  Promise.all(list.map(shrink)).then(function (shrunk) {
    pending = pending.concat(shrunk);
    if (!saidPicturesLeave) {
      saidPicturesLeave = true;
      post('Showing ' + FRIEND.name, 'A picture you show them is sent so they can see it. ' +
           'It is the only thing here that leaves this device.');
    }
    showQueue();
  }).catch(function (err) {
    post('Showing ' + FRIEND.name, 'That could not be opened: ' + err.message);
  });
}

/* What is about to be sent, with a way to change your mind. */
function showQueue() {
  var old = document.getElementById('queue');
  if (old) old.remove();
  if (!pending.length) return;

  var box = document.createElement('div');
  box.id = 'queue'; box.className = 'msg';
  var row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:.4rem;flex-wrap:wrap;align-items:center';

var lastSent = '', lastSentAt = 0;

function send() {
  var v = $("say").value.trim();
  /* A PICTURE ON ITS OWN IS A MESSAGE. Handing somebody your phone without
     saying anything is a normal thing to do, so an empty box with something
     queued still sends. */
  if ((!v && !pending.length) || thinking) return;
  /* confirmingPayment, see its own declaration above: David paid, sent a
     message before the return trip had saved his new access_token, and
     the room told him he had no credits for money it had already taken.
     A few hundred milliseconds, blocked here so it can never happen
     again regardless of which path (click or Enter) tried to send. */
  if (confirmingPayment) return;
  /* Sending anything at all proves the composer intro already did its job,
     whether or not it was ever dismissed by hand. */
  if (!gcSeenComposerIntro()) gcDismissComposerIntro();

  /* THE SAME WORDS TWICE IN A MOMENT ARE A BUG, NOT A PERSON.

     This is the last line of defence and it has to be, because the cause
     upstream cannot be told apart from ordinary speech: when Chrome restarts
     recognition it may replay what it already finalised, and it looks
     identical to somebody saying it again. Refusing to reset the consumed mark
     on a restart would swallow the first real sentence of every new session,
     which is worse.

     HOW LONG DEPENDS ON HOW MUCH WAS SAID. "Yes" twice in five seconds is a
     person agreeing twice, and it goes through. A whole sentence repeated word
     for word inside fifteen seconds is a machine, every time. */
  var window = v.length < 12 ? 2000 : 15000;
  if (v === lastSent && (Date.now() - lastSentAt) < window) { $("say").value = ""; return; }
  lastSent = v; lastSentAt = Date.now();

  /* On screen before it goes, so the friend is reacting to something the
     person can still see. */
  var shown = pending.slice();
  var q = document.getElementById('queue'); if (q) q.remove();
  pending = [];
  post(youLabel(), v || '(showing you this)', true, shown);
  $("say").value = "";
  lastSpoke = Date.now();
  stopSpectating(); // the person has stepped back in
  /* SPEAKING RESETS HOW SOON HE BREAKS A SILENCE. Only typing did, and typing
     is not how everybody talks: a person using the microphone never fired the
     input event, so the ladder never went back to the bottom for them. */
  idleStep = 0;

  /* Once there is a room, everything goes through it: the line has to reach the
     other browsers, and whether the friend answers at all is decided server
     side by the room's size, not here. */
  if (SEAT) { sayInRoom(v || '(showing you this)'); return; }
  ask({ message: v || '', images: shown });
}

function sayInRoom(text) {
  thinking = true; $("sendBtn").disabled = true;
  /* Same solo-scene guard ask() uses, computed fresh here rather than
     shared, since sayInRoom() and ask() are different functions reached
     from different branches of send(). Same nextTurnSpeaker() fallback too,
     for a shared human room whose resident friend is a turnOrder duo. */
  var roomSpeakerKey = (current && current.speaker) ? current.speaker
                      : (FRIEND.companions && FRIEND.turnOrder) ? nextTurnSpeaker(FRIEND) : null;
  var roomSpeakerObj = (roomSpeakerKey && FRIEND.companions) ? FRIEND.companions[roomSpeakerKey] : null;
  fetch("/.netlify/functions/gc-room-say", {
    method: "POST", headers: { "Content-Type": "application/json" },
    /* owner_key/access_token, ADDED 2026-08-18. Dr. O, capped in her own
       shared room despite being the owner, and separately: Pookie capped
       in the same room with 260 real credits sitting untouched. Root
       cause, one and the same: this call never sent either credential, so
       neither an owner bypass nor a guest's own funded balance could ever
       apply inside a shared room -- only the room's shared free pool
       could, for everyone, always. Sent as the SENDER's own identity, not
       the friend's/room's, so gc-room-say.js can pass through whoever is
       actually typing right now.

       guest_cameo, ADDED 2026-08-19: "let's wire it into shared rooms
       too." Whoever is actually typing offers THEIR OWN built friend,
       same as solo chat -- a host and a guest could each have a
       different one, and each turn only ever offers the current
       speaker's. */
    body: JSON.stringify({
      seat_token: SEAT, message: text, owner_key: GC_ownerKey(), access_token: GC_accessToken(),
      /* tester_key, added 2026-08-29 -- this was the real gap: gc-room-say.js
         never received a tester key from any caller, solo chat's own fix
         earlier tonight only ever reached ask(), never sayInRoom(). Same
         reasoning as owner_key/access_token right above it. */
      tester_key: GC_testerKey(),
      guest_cameo: roomSpeakerObj ? null : guestCameoCandidateFor(text || ''),
      /* friend_refresh, added 2026-08-25. Dr. O: Cal had a voice in Pookie's
         own solo chat with him but never spoke in this shared room. Root
         cause -- gc-room-open.js snapshots the friend into the room ONCE,
         at creation, and nothing ever refreshes it, so a voice (or any
         other edit) added afterward stays invisible to every room already
         open. The host's own browser always holds the current copy (a
         built friend lives in that browser's localStorage, nowhere else),
         so she piggybacks it on every message and gc-room-say.js patches
         the room's stale copy back into sync. Host only, checked server
         side too -- a guest sending this could not swap the room onto a
         different friend. */
      friend_refresh: (typeof GC_BUILT !== 'undefined' && GC_BUILT && FRIEND === GC_BUILT) ? FRIEND : null,
    })
  }).then(function (r) { return r.json(); }).then(function (j) {
    thinking = false; $("sendBtn").disabled = false;
    lastSpoke = Date.now();
    /* Mine is on screen already. Claiming its id here is what stops the next
       poll drawing a second copy of it. */
    if (j && j.said && j.said.id) { seen[j.said.id] = true; MY_SEAT_ID = j.said.author_id || MY_SEAT_ID; }
    /* A null reply is correct and common in a room with several people in it.
       Nothing is rendered. The poll will bring anything he did say, and speak it. */
    if (j && j.daily_capped) showCreditsUpsell(true, j.owner_key_rejected);
    if (j && j.feelings) setFeelings(j.feelings);
    if (j && j.mood) $("gaugeLabel").textContent = j.mood;
  }).catch(function (err) {
    thinking = false; $("sendBtn").disabled = false;

  });
}

/* ── BREAKING A SILENCE ──────────────────────────────────────────────────────
   The complaint that every chat room on this campus has: nobody speaks first.
   Chat is request and response, so quiet produces nothing, and the moment
   somebody sits down not knowing how to start is exactly the moment this
   product is for.

   So the friend gets ASKED whether they want to say something. They may
   decline, and declining is normal. Backing off each time and stopping after
   a few, so an abandoned tab is not talking to an empty chair, and only while
   the tab is actually in front. */
/* HOW LONG A SILENCE HAS TO BE BEFORE IT IS ONE.

   This was 40 seconds, and Dr. O: "Arch is overdoing the me not talking, he is
   saying it every minute or so." Forty seconds is not a silence. It is less
   time than it takes to read the paragraph he just wrote, and the clock starts
   from HIS reply, so sitting and reading was enough to get asked whether you
   were still there. Being checked on that often is not company, it is being
   hovered over, and it teaches you the room cannot be sat in quietly.

   Ten minutes now, Dr. O's revised number ("5 is too soon"), then fifteen,
   then forty, then he leaves it alone. A person who has gone to make tea
   comes back to the room as they left it. Nothing here is allowed to make
   sitting quietly feel like being watched.

   If this ever needs shortening again, it probably does not; ask first. Being
   left in peace is the feature, and the nudge is only for somebody who
   genuinely does not know how to start. */
var IDLE_STEPS = [600, 900, 2400];   // seconds, then it stops
var idleStep = 0;

setInterval(function () {
  if (thinking || idleStep >= IDLE_STEPS.length) return;
  if (document.hidden) return;                       // not talking to a background tab
  if (!$("log").children.length) return;             // nobody has sat down yet
  if ((Date.now() - lastSpoke) / 1000 < IDLE_STEPS[idleStep]) return;
  idleStep += 1;
  ask({ idle: true, idleSeconds: IDLE_STEPS[idleStep - 1] });
}, 5000);

/* Anything said by anybody resets the whole ladder. */
$("say").addEventListener("input", function () { lastSpoke = Date.now(); idleStep = 0; });
$("stopBtn").addEventListener("click", hush);
$('sendBtn').addEventListener('click', send);
$('say').addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

/* A NEW TAB, NEVER THIS ONE. Dr. O: Pookie opened the photo album mid
   conversation, closed it, and the room had kicked her out.

   Navigating room.html away entirely was worse than losing her place. SEAT
   lives only as a JavaScript variable, nowhere in storage, and the polling
   interval it drives is torn down the moment the page unloads. Coming back
   was not "reload and resume", it was landing on this page as though for the
   first time, with the one thing that could get her back in, the invite
   link, already spent because invites are single use. There was no way back
   in at all, which is the shape of "kicked out".

   Fixed at the only point that matters: never leave. Opened in a new tab so
   the room, its poll, and its live SEAT are simply never touched.

   WHO= IS PASSED EXPLICITLY rather than left to sessionStorage to carry
   across, because whether a new tab opened this way inherits the opener's
   sessionStorage is genuinely inconsistent across browsers. GC_WHO is already
   resolved here; handing the same answer to the new tab in the URL makes it
   correct regardless. */
$('albumBtn').addEventListener('click', function () {
  var who = (typeof GC_WHO !== 'undefined' && GC_WHO === 'mine') ? 'mine' : currentDemoId();
  var url = 'album.html' + (who ? '?who=' + encodeURIComponent(who) : '');
  window.open(url, '_blank');
});

/* NOTHING IN THIS ROOM IS ALLOWED TO DO NOTHING. These three are real features
   with no backend yet, and a button that swallows a press is worse than one
   that admits it: the person assumes they missed, presses again, and decides
   the product is broken.

   Bring someone needs the conference-room tables ported over (invite tokens,
   seat tokens, the arrival-forward read rule). Add a memory needs the memory
   store. The mic needs speech capture. Each says so until it is built. */
/* SAID ONCE, NOT ONCE PER PRESS. Pressing the four scene slots in a row filled
   the conversation with four near-identical paragraphs, and a person poking at
   the buttons to see what they do should not have to scroll their friend back
   into view afterwards. The same notice twice running is a repeat, and a
   repeat is noise. */
var lastNotYet = '';
function notYet(what, why) {
  var msg = what + ' is not built yet. ' + why;
  if (msg === lastNotYet) return;
  lastNotYet = msg;
  post('Not wired yet', msg);
}
/* ── BRINGING SOMEBODY IN ────────────────────────────────────────────────────
   PROMOTE ON INVITE. Up to this point the conversation has been a browser and
   nothing else, which is right, because talking to your friend on your own is
   the common case and should cost no database at all. Pressing this is what
   brings a room into existence, and the whole prior thread goes up with it so
   he does not forget what you were saying the moment somebody arrives.

   Anyone in the room can do this, not only the host. A guest wanting to show
   their mum is the product spreading on its own. */

/* WHICH DEMO THE CURRENT ROOM ACTUALLY IS, BY WHO FRIEND IS, NOT BY WHICH
   OBJECT IT HAPPENS TO BE.

   The first version of this checked FRIEND === GC_DEMO, an object identity
   check, and it broke exactly the way object identity checks break: FRIEND is
   REPLACED wholesale the moment somebody joins a room, with a fresh object
   deserialised from the server's join response (see joinThenSit, "FRIEND =
   j.friend"). So the very first person in a room passed the check and their
   invite carried who=; anybody who joined THAT room and then invited a third
   person themselves held a FRIEND that was contentwise Sophia but was no
   longer literally GC_SOFIA, the check silently failed, and the link they
   sent defaulted the next arrival to Arch. Dr. O: "the link sent her to Arch
   again."

   Compared by name instead, which survives the reassignment because Sophia's
   name is always "Sophia" whichever copy of the object it lives on. The one
   real cost: somebody who builds and names their own friend "Arch" or "Sophia"
   would have their room mistaken for the demo. Accepted rather than solved,
   because solving it properly means the server telling a joiner which KIND of
   room they are in, not just which friend, and that is a larger change than
   this bug warrants. */
function currentDemoId() {
  if (typeof GC_DEMOS === 'undefined' || !FRIEND) return null;
  /* NEVER YOUR OWN BUILT FRIEND, checked by reference before any name
     match, added 2026-08-27 alongside "make a demo yours" (claimBtn below).
     That feature deliberately makes a friend named identically to a demo --
     Arch stays "Arch" once bought -- which the name-only match below could
     not tell apart from the free demo itself. Without this, a paid, owned
     copy would be treated as the free demo forever: wrong credit pool,
     wrong paid gate, wrong everything downstream of is_demo. This is also
     the general fix for the coincidental case this function's own old
     comment already flagged and accepted (a user naming their OWN built
     friend "Arch" by chance) -- reference equality settles both at once. */
  if (typeof GC_BUILT !== 'undefined' && GC_BUILT && FRIEND === GC_BUILT) return null;
  for (var id in GC_DEMOS) {
    if (GC_DEMOS[id] && GC_DEMOS[id].name === FRIEND.name) return id;
  }
  return null;
}

function inviteLink(token) {
  var url = location.origin + location.pathname + "?join=" + encodeURIComponent(token);
  var demoId = currentDemoId();
  if (demoId) url += '&who=' + encodeURIComponent(demoId);
  return url;
}

function showInvite(token) {
  var url = inviteLink(token);
  /* INSTRUMENTED 2026-08-28, per the distribution question raised about this
     exact loop: invites sent per active user, and guest-to-return rate,
     needed real numbers before either could be answered. This is the send
     side; gc_guest_joined below (joinThenSit) is the arrival side. Return
     rate is NOT covered by either of these two events alone -- see that
     event's own comment for what it would actually take to measure. */
  if (typeof gtag === 'function') gtag('event', 'gc_invite_shown');
  /* SAYS IT IS SINGLE USE, because it is, and nothing said so. One link lets in
     one person and is then spent, so testing your own link burns it and two
     people sent the same one means the second is turned away. That was being
     discovered by being turned away. */
  post("Bring someone", "Send them this. They tap it once and they are in the room with you, " +
       "no sign in and no account. It lets in one person and is then used up, so do not open it " +
       "yourself to test it. Press this again for another. They will see the conversation from " +
       "the moment they arrive, not before it.");
  var box = document.createElement("div");
  box.className = "msg";
  var a = document.createElement("input");
  a.type = "text"; a.readOnly = true; a.value = url;
  a.style.cssText = "width:100%;font:inherit;font-size:13px;padding:.4rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px";
  a.addEventListener("focus", function () { this.select(); });
  box.appendChild(a);
  var copy = document.createElement("button");
  copy.className = "btn"; copy.style.marginTop = ".45rem"; copy.textContent = "Copy the link";
  copy.addEventListener("click", function () {
    navigator.clipboard.writeText(url).then(function () { copy.textContent = "Copied"; })
      .catch(function () { a.focus(); });
  });
  box.appendChild(copy);
  $("log").appendChild(box);
  $("log").scrollTop = $("log").scrollHeight;
}

/* ── MAKE A DEMO YOURS ────────────────────────────────────────────────────
   Added 2026-08-27 per Dr. O direct: a house demo was free-to-sample and
   then credits-metered forever, never actually ownable the way a built or
   catalog-started companion is. This makes a full copy of the demo's whole
   canon, deep-cloned so the shared GC_DEMOS object itself is never mutated.
   No paid field set any more (Dr. O, same day, second instruction: "there
   is never an unlock everywhere") -- opening the copy's room is free, same
   as every other companion; talking to it costs real credits the same way
   it already does everywhere else. user is cleared, same reasoning as
   catalog.html's startWith(): it describes the person who built the
   ORIGINAL, never the person claiming a copy now, and a demo has no user
   field in the first place.

   PULLED OUT INTO ITS OWN FUNCTION, 2026-08-30, so the buy buttons on the
   daily-cap gate (see showCreditsUpsell above) can get an owned copy the
   same way claimBtn always has, rather than requiring a person to claim
   first and find the real buy button on a second screen after that. `silent`
   skips the confirm dialog: clicking claimBtn is the only explicit yes
   needed there, but clicking "$9.99/mo" is already just as explicit, and
   asking again on top of it would be a second, redundant confirmation for
   the same decision. */
function getOrClaimDemoCopy(silent) {
  var demoId = currentDemoId();
  if (!demoId || typeof GC_DEMOS === 'undefined' || !GC_DEMOS[demoId]) return null;
  var demo = GC_DEMOS[demoId];
  /* ONE COPY PER DEMO PER BROWSER, added 2026-08-28, same fix and same
     reason as catalog.html's own startWith() -- five Isabelles piled up
     from pressing a start button more than once with no way to recognize
     an existing copy. claimedDemoId, the demo's own id (e.g. "arch"),
     plays the same role catalogSourceId does there. */
  var already = (typeof GC_ALL_BUILT !== 'undefined' ? GC_ALL_BUILT : []).filter(function (f) {
    return f && f.claimedDemoId === demoId;
  })[0];
  if (already) return already;
  if (!silent) {
    var ok = confirm('Make your own copy of ' + demo.name + '? Same portrait, same scenes, same ' +
      'personality, yours to keep, edit, and talk with any time.');
    if (!ok) return null;
  }
  var mine;
  try { mine = JSON.parse(JSON.stringify(demo)); } catch (e) { mine = null; }
  if (!mine) return null;
  mine.claimedDemoId = demoId;
  mine.id = GC_newFriendId();
  mine.createdAt = new Date().toISOString();
  mine.user = { call: '', want: [], about: '' };
  try { GC_saveFriend(mine); } catch (e) {}
  return mine;
}
$('claimBtn').addEventListener('click', function () {
