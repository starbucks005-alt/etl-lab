<title>Good Company</title>

<!-- Who is in the room, then the skin they bring, then the paint. Both before
     the stylesheet so nobody eats a flash of the wrong room. GC_SKIN resolves
     an explicit choice first, then the friend's own room, then the system
     preference. That chain is what replaced the light/dark toggle: nobody has
     to know the words "light" and "dark" to get the brightness they wanted. -->
<script src="gc-friend.js"></script>
<script src="gc-skin.js"></script>
<script src="gc-you.js"></script>
<!-- Only needed by a Vimeo-hosted scene (see play()'s scene.vimeoId branch),
     but loaded unconditionally rather than injected on demand: it is small,
     it does nothing until a Vimeo.Player is actually constructed, and a
     friend with no such scene never triggers that construction at all. -->
<script src="https://player.vimeo.com/api/player.js"></script>
<link rel="stylesheet" href="gc-skin.css">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   LAYOUT IS M.E.'s, SKIN SYSTEM IS FOUNDER STUDIO's.

   Layout: two columns on a laptop, one on a phone. The video sizes the left
   column and everything in it inherits that width. The conversation takes the
   rest. Those are M.E.'s hard-won shapes, inherited rather than re-derived.

   Skins: gc-skin.css and gc-skin.js, shared with every other page. Adding one
   is a block there plus an entry in GC_SKINS. Nothing changes here.

   THE RULE FOUNDER STUDIO WROTE IN ITS OWN MARGIN, applied to what matters
   here: a skin dresses the ROOM. It never touches the friend and it never
   touches whether the conversation can be read.
     * The video is never tinted, filtered, overlaid or bordered by a skin.
       Nothing goes on top of that face.
     * Chat text keeps its contrast floor in every skin. These readers are
       mostly older, and a pretty palette that costs legibility is not pretty.
   Both are enforced by the variables the protected rules are allowed to use,
   not by remembering.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Palette, base body and shared primitives now live in gc-skin.css, linked
   above. Only the room's own layout is below. */

/* html and body need a height here that gc-skin.css does not set, because
   this page is a full-viewport room rather than a scrolling document. */
html,body{ height:100%; }
/* Dr. O, 2026-08-18: "the screen 10% smaller, it fits perfectly at 90%."
   zoom rather than transform:scale, so the layout itself recalculates at
   the smaller size (no leftover blank space transform would leave behind)
   and it still respects height:100% above. Chrome/Edge only, but that is
   what this was tested in. */
html{ zoom:90%; }
/* ── the room ────────────────────────────────────────────────────────────── */
.room{ height:100vh; display:grid; grid-template-columns:auto 1fr; grid-template-rows:1fr; }
.stage{ display:flex; flex-direction:column; width:min(58vw, calc(52vh * 16 / 9)); min-width:0; }

.topline{ display:flex; align-items:center; gap:.8rem; padding:.5rem .6rem; }
.brandbar{ display:flex; justify-content:center; padding:.4rem .2rem; }
/* The real mark replaces the GC placeholder circle. Sized by height because a
   wordmark is wide: a 52px round slot was shaped for two letters and would
   crush it. The ink swap by skin is in gc-skin.css and applies here too. */
.brandbar .mark{ flex:none; }
/* THE ICON ALONE IN A NARROW SLOT. Dr. O: when the space is like this, use
   the two people part. A wordmark squeezed into the corner of a column sized
   by a video reads as a squashed wordmark; the two figures read as a mark. The
   full lockup stays on the pages that have width for it. */
/* SIZE ONLY, NEVER display. gc-skin.css decides WHICH ink shows, and setting
   display here ties on specificity and wins on source order, so both inks
   rendered at once. Same bug as the wordmark, reintroduced by me two hours
   later. Size is safe; visibility is not ours to set. */
.brandbar .logo{ height:34px; width:34px; }
.gauge-wrap{ flex:1; min-width:0; }

/* ── the feeling scale ───────────────────────────────────────────────────── */
/* ink-dim, not accent, added 2026-09-01 -- Viv's room on the Copper skin:
   Copper's own --accent (#522C1F) sits almost on top of its --panel
   (#3D1F14), a 1.24 contrast ratio, effectively invisible text. --ink-dim
   is what .gauge-sub right below already uses successfully on every skin
   including this one, so this borrows a token already proven legible here
   rather than touching --accent itself, which still has to work as a
   button fill elsewhere. */
.gauge-title{ font-family:var(--mono); font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-dim); margin-bottom:.45rem; }
.gauge-head{ display:flex; align-items:center; gap:.5rem; }
.gauge-emoji{ font-size:19px; }
.gauge-label{ font-family:var(--mono); font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-dim); }
.gauge-sub{ font-size:12px; color:var(--ink-dim); margin:.2rem 0 .5rem; }
.gauge-clock{ font-family:var(--mono); font-size:11px; letter-spacing:.04em;
  color:var(--ink-dim); margin:-.2rem 0 .5rem; }
.gauge-row{ display:flex; align-items:center; gap:.6rem; margin-bottom:3px; }
.gauge-row-label{ font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-dim); width:66px; flex:none; }
.gauge-bar-track{ flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
.gauge-bar-fill{ height:100%; border-radius:2px; transition:width .5s ease; }
.f-happy{background:var(--happy);} .f-sad{background:var(--sad);} .f-fear{background:var(--fear);}
.f-disgust{background:var(--disgust);} .f-anger{background:var(--anger);}
.f-surprise{background:var(--surprise);} .f-curious{background:var(--curious);}

/* ── the face ────────────────────────────────────────────────────────────────
   PROTECTED. No skin variable appears in this block and none may be added.
   No tint, no filter, no overlay, no border, no radius.

   And no image, ever: no poster attribute, no still underneath, no CSS
   background standing in while it loads. A fallback image under a video loads
   first, the swap reads as a jump, and the video gets blamed for a bug the
   image caused. If a clip is missing the box names the file and stays black. */
.portrait{ position:relative; background:#000; width:100%; aspect-ratio:16/9; overflow:hidden; }
.portrait video{ display:block; width:100%; height:100%; object-fit:cover; }
.portrait .missing{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center;
  padding:1rem; font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:#9A8A78;
}

/* A scene that has no film of it yet. Not layered over the video: the video is
   emptied and taken out of the layout before this goes in. See showStill. */
.portrait .still{ position:absolute; inset:0; }
.portrait .still img{ width:100%; height:100%; object-fit:cover; display:block; }

/* THE MIRROR'S OWN MOMENT, added 2026-08-31 -- see play()'s own note on
   why this is the one scene on this campus that gets a special effect.
   A slow, breathing glow ring in the mirror's own blue, plus whatever is
   actually showing (still image or, now that a real clip exists, the
   Vimeo iframe itself) given a faint answering pulse rather than sitting
   dead still like every other scene -- reads as something quietly alive
   rather than a decoration slapped on top. Respects reduced motion. */
.portrait.mirror-active{
  box-shadow: 0 0 0 2px rgba(120,170,255,.55), 0 0 55px 14px rgba(90,140,255,.4);
  animation: mirrorBreathe 3.6s ease-in-out infinite;
}
.portrait.mirror-active .still img,
.portrait.mirror-active iframe{ animation: mirrorPulse 3.6s ease-in-out infinite; }
@keyframes mirrorBreathe{
  0%, 100%{ box-shadow: 0 0 0 2px rgba(120,170,255,.4), 0 0 40px 8px rgba(90,140,255,.28); }
  50%{ box-shadow: 0 0 0 3px rgba(150,190,255,.75), 0 0 70px 20px rgba(90,140,255,.55); }
}
@keyframes mirrorPulse{
  0%, 100%{ filter: brightness(1) saturate(1); }
  50%{ filter: brightness(1.08) saturate(1.15); }
}
@media (prefers-reduced-motion: reduce){
  .portrait.mirror-active{ animation:none; box-shadow: 0 0 0 2px rgba(120,170,255,.55), 0 0 55px 14px rgba(90,140,255,.4); }
  .portrait.mirror-active .still img,
  .portrait.mirror-active iframe{ animation:none; }
}
.portrait .still-say{
  position:absolute; left:0; right:0; bottom:0; padding:.45rem .6rem;
  background:rgba(0,0,0,.62); color:#F0E7DA;
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
}

/* ── scenes ──────────────────────────────────────────────────────────────── */
/* REVERTED TO flex-wrap, 2026-08-21. The horizontal-scroll version (2026-08-20)
   was solving a problem that turned out not to exist: Reggie and Tansy looked
   like "only one or two scenes" on Dr. O's phone because her device was
   showing a stale cached page, not because rows were wrapping below the
   fold -- she confirmed the real cause and fixed it herself the next morning.
   The scrollbar this introduced was never wanted on its own merits. */
.scene-bar{ display:flex; flex-wrap:wrap; gap:.55rem; padding:.65rem .6rem .8rem; }
/* BIGGER, WITH A CLIP IN EACH, per Dr. O 2026-08-18: "there is room, can you
   make the scene boxes bigger? easier to read, a scene clip in each one."
   Grown from a plain text pill to a small card: fixed size so a row of them
   stays tidy, position:relative so the video and label can layer inside it. */
.scene-chip{
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); background:#000; border:1px solid var(--line);
  border-radius:5px; cursor:pointer; padding:0; overflow:hidden;
  position:relative; width:132px; height:82px; flex:0 0 auto;
}
.scene-chip:hover{ color:var(--accent); border-color:var(--accent); }
.scene-chip.on{ color:var(--accent); border-color:var(--accent); }
/* The clip itself, muted and looping, sized to fill the card. Scenes with no
   film yet (src:null) get no <video> at all, just the plain dark card. */
.scene-chip video, .scene-chip img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
/* The label sits over the clip rather than beside it, same layering as
   .portrait .still-say, so the card stays a fixed size whether or not the
   scene has film. */
.scene-chip span{
  position:absolute; left:0; right:0; bottom:0; padding:.3rem .45rem;
  background:linear-gradient(transparent, rgba(0,0,0,.78) 65%);
  color:#F0E7DA; text-align:left; line-height:1.25;
}
.scene-chip.on span{ color:var(--accent); }

/* A SCENE THAT COULD EXIST AND DOES NOT YET. Dimmed and dashed, so it reads as
   an empty slot rather than a button that is broken, and it carries a plus so
   the state is not being signalled by colour alone. Still pressable: it has to
   be, because pressing it is how you find out what it costs. */
.scene-chip.locked{ border-style:dashed; opacity:.62; }
.scene-chip.locked:hover{ opacity:1; color:var(--accent); border-color:var(--accent); }
.scene-chip.locked span{ position:static; background:none; padding:.4rem .5rem; }

/* REMOVE, added 2026-08-20. Dr. O had to be handed a console snippet to
   get rid of a scene that arrived wrong -- real friction, and the second
   time she needed exactly the same thing done. Only ever on a DELIVERED
   scene (key starts "added-", see the add-scene link handler that mints
   that prefix), never on the original or any house-authored scene: those
   are not this friend's to lose by an accidental tap. Faint until
   hovered, same instinct as .scene-chip.locked's own opacity, so the grid
   is not covered in little ×s at a glance. */
.scene-remove{
  position:absolute; top:3px; right:3px; z-index:1; width:18px; height:18px;
  border-radius:50%; border:none; background:rgba(0,0,0,.55); color:#F0E7DA;
  font-size:12px; line-height:18px; text-align:center; padding:0; cursor:pointer;
  opacity:.45;
}
.scene-chip:hover .scene-remove{ opacity:1; }
.scene-remove:hover{ background:#B3261E; color:#fff; }

/* WATCH, added 2026-08-18: "just videos for the users enjoyment," not a
   place to sit and talk, so a visually separate row from the scene picker
   above rather than another entry inside it — same chip shape, plus a
   centered play glyph so it reads as "opens a video," and a label ("For
   watching") so the distinction is not carried by position alone. */
.watch-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:.55rem; padding:0 .6rem .8rem; }
.watch-bar-label{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-dim); flex:0 0 100%; margin:0 0 -.15rem; }
.watch-chip{
  display:block; text-decoration:none;
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); background:#000; border:1px solid var(--line);
  border-radius:5px; cursor:pointer; padding:0; overflow:hidden;
  position:relative; width:132px; height:82px; flex:0 0 auto;
}
.watch-chip:hover{ color:var(--accent); border-color:var(--accent); }
.watch-chip img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.watch-chip span{
  position:absolute; left:0; right:0; bottom:0; padding:.3rem .45rem;
  background:linear-gradient(transparent, rgba(0,0,0,.78) 65%);
  color:#F0E7DA; text-align:left; line-height:1.25;
}
.watch-chip .play-glyph{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:34px; height:34px; border-radius:999px; background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.55); color:#F0E7DA;
  display:flex; align-items:center; justify-content:center; font-size:13px; padding:0;
}
.watch-chip:hover .play-glyph{ border-color:var(--accent); color:var(--accent); }

/* ── the conversation ────────────────────────────────────────────────────── */
/* THE COLUMN DOES NOT SCROLL. THE TRANSCRIPT DOES.
   This was the wrong way round and it showed: .side scrolled the whole column
   including the input row, .log was overflow:visible, so a long conversation
   ran straight underneath the text box with no way to reach it. 2732px of talk
   in a 749px window and nothing to drag.

   The input row and the tools have to stay put. Only the conversation moves. */
.side{
  min-height:0; overflow:hidden; display:flex; flex-direction:column;
  border-left:1px solid var(--line);
}

/* THE CHROME FLOATS OVER THIS COLUMN, so the conversation has to start below
   it or the first thing the friend ever says sits underneath three buttons.
   Caught by testing whether the chrome's box intersects any message, not by
   looking: at 1440 it was covering Arch's opening line.

   --chrome-h is MEASURED at runtime, never a number typed here. The buttons
   carry labels that change length ("Fullscreen" becomes "Exit fullscreen") and
   the row wraps on narrow windows, so any constant I wrote would be wrong the
   first time a label changed. Same lesson M.E. learned when three hand-computed
   right offsets started landing on top of each other. */
.log{
  flex:1; min-height:0;
  overflow-y:auto;                     /* the one thing in this column that moves */
  padding:calc(var(--chrome-h, 51px) + 1.4rem) 1rem .5rem;
}
/* A VISIBLE SCROLLBAR, deliberately. M.E. hides its bar because a grey track
   is browser furniture in a built room, and that was right for a page you
   read. This is a conversation that grows past the window, and somebody who
   cannot see that there is more above has simply lost it. Slim and skinned,
   but present. */
.log{ scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.log::-webkit-scrollbar{ width:10px; }
.log::-webkit-scrollbar-track{ background:transparent; }
.log::-webkit-scrollbar-thumb{
  background:var(--line); border-radius:6px;
  border:3px solid transparent; background-clip:content-box;
}
.log::-webkit-scrollbar-thumb:hover{ background:var(--ink-dim); background-clip:content-box; }

/* ── the sound ───────────────────────────────────────────────────────────────
   The room has a fire in it, and birds, and a kettle. None of it was audible
   because the clip is muted, and it is muted because no browser will autoplay
   a video with sound. So it starts silent and one tap turns the room on. */
/* ICON-ONLY, changed 2026-08-30, Dr. O direct: "change this to a mic and
   if mic is crossed out then muted, if not it is on," then "no text,"
   then "make the mic bigger and in the right corner." Small circle, same
   visual language as .fav-star elsewhere on this campus, rather than the
   wide text pill this used to be -- a crossed-out mic already says the
   state, a label next to it would be saying the same thing twice.
   TOP-right rather than bottom-right on purpose: .cast-btn already owns
   bottom-right (see its own comment on staying clear of this button),
   and moving here instead of on top of it is what "right corner" means
   without colliding with something already there. */
.sound-on{
  position:absolute; top:14px; right:14px; z-index:3;
  width:2.6rem; height:2.6rem; display:flex; align-items:center; justify-content:center;
  color:#F4ECE0; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.28);
  border-radius:999px; padding:0; cursor:pointer; backdrop-filter:blur(2px);
}
.sound-on:hover{ background:rgba(0,0,0,.72); border-color:rgba(255,255,255,.5); }
.sound-on svg{ width:22px; height:22px; }
/* ── casting to a TV ─────────────────────────────────────────────────────────
   Standards-based Remote Playback API (video.remote), not a Cast SDK or a
   receiver app -- works with Chromecast and most smart TVs' built-in cast
   support already, at no cost to build. Only ever shown for a real <video>
   scene: a Vimeo scene is a cross-origin iframe this code cannot drive, and
   AirPlay already works there for free on Safari/iOS with no button at all.
   Bottom-right so it never collides with the sound button, which stays
   bottom-centre. */
.cast-btn{
  position:absolute; right:14px; bottom:14px; z-index:3;
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:#F4ECE0; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.28);
  border-radius:999px; padding:.5rem .9rem; cursor:pointer; backdrop-filter:blur(2px);
  display:none;
}
.cast-btn:hover{ background:rgba(0,0,0,.72); border-color:rgba(255,255,255,.5); }
/* PROTECTED. Chat text is --ink on --panel in every skin, and that pair is
   contrast-checked per skin rather than eyeballed. No skin may give this rule
   a softer color: a dimmed message is where a palette starts costing reading. */
/* 52ch -> 94%, 2026-08-18: Dr. O in fullscreen, "remove all the padding on
   the right so text can go further right." The 52ch cap was never padding,
   it was a fixed reading-measure clamp that stopped mattering once the
   column got wide (fullscreen, a big monitor) and just left dead space
   instead. Percentage-based so it still leaves room for .msg.mine to sit
   right-aligned rather than edge to edge. */
.msg{ border:1px solid var(--line); background:var(--panel); color:var(--ink);
  padding:.55rem .8rem .7rem; margin-bottom:.55rem; max-width:94%; }
.msg .who{ display:block; font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-dim); margin-bottom:.15rem; }
.msg.mine{ margin-left:auto; border-color:var(--accent); }
/* REPLAY, sits under the line rather than inline with it: text wraps to
   several lines often enough that an inline button would land somewhere
   mid-sentence depending on line length. */
.replay-btn{
  display:block; margin-top:.4rem; font-family:var(--mono); font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim);
  background:transparent; border:1px solid var(--line); border-radius:3px;
  padding:.22rem .5rem; cursor:pointer;
}
.replay-btn:hover{ color:var(--accent); border-color:var(--accent); }

.row{ display:flex; gap:.45rem; padding:.5rem 1rem; align-items:center; }
/* The occasional controls, small and wrapping rather than stacked full-width. */
.row.tools{ flex-wrap:wrap; padding-top:0; }
.row.tools .btn{ flex:0 0 auto; font-size:10.5px; padding:.45rem .6rem; }

/* FIRST-VISIT INTRO, added 2026-08-30, see its own HTML comment for why.
   Sits directly under the composer row it is pointing at, using --accent
   (the one color already reserved for "the thing to press" on this page,
   see .btn.go) rather than a new color, so it reads as an instruction and
   not a warning or an error. */
.intro-tip{
  display:flex; align-items:center; gap:.5rem;
  margin:0 1rem .6rem; padding:.5rem .7rem;
  background:color-mix(in srgb, var(--accent) 12%, transparent);
  border:1px solid var(--accent); border-radius:5px;
}
.intro-tip-arrow{
  color:var(--accent); font-size:1.1rem; line-height:1; flex:0 0 auto;
  transform:translateY(-.5rem); animation:intro-tip-bob 1.4s ease-in-out infinite;
}
@keyframes intro-tip-bob{
  0%, 100%{ transform:translateY(-.5rem); }
  50%{ transform:translateY(-.1rem); }
}
@media (prefers-reduced-motion: reduce){
  .intro-tip-arrow{ animation:none; }
}
.intro-tip-text{ flex:1; font-size:13px; color:var(--ink); line-height:1.4; }
.intro-tip-close{
  flex:0 0 auto; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--accent); background:transparent;
  border:1px solid var(--accent); border-radius:3px; padding:.35rem .6rem; cursor:pointer;
}
.intro-tip-close:hover{ color:var(--accent-ink); background:var(--accent); }
/* THE AUDIO TOGGLE ITSELF GETS THE SAME TREATMENT, added 2026-08-30. The
   words alone ("tap Text below") ask somebody to find one button among
   eight in a row that wraps; a glow on the actual button removes the
   search. Same --accent as the rest of this intro, same reduced-motion
   guard as the arrow above. */
#replyBtn.intro-highlight{
  border-color:var(--accent); color:var(--accent);
  animation:intro-tip-glow 1.4s ease-in-out infinite;
}
@keyframes intro-tip-glow{
  0%, 100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
  50%{ box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 0%, transparent); }
}
@media (prefers-reduced-motion: reduce){
  #replyBtn.intro-highlight{ animation:none; box-shadow:0 0 0 2px var(--accent); }
}

/* The doorstep. Scrolls on its own so a long panel never traps the button. */
.gate{ padding:1rem 1rem 1.4rem; overflow-y:auto; }
.gate h3{ font-family:Georgia,serif; font-weight:400; font-size:1.6rem; margin:0 0 .4rem; }
/* 14.5px -> 19px, 2026-08-18: Dr. O, looking at how much unused width the
   doorstep has once it is the only thing on screen (fullscreen, or a wide
   window): "let's make the font bigger to make sure people see it." Both
   this and the premise line below share the same room to grow into. */
.gate-say{ color:var(--ink-dim); font-size:19px; margin:0 0 .8rem; line-height:1.5; }
/* THE PREMISE, added 2026-08-18. Dr. O: a stranger's first line from Tansy
   ("I suppose I can spare a moment") reads as just standoffish without
   knowing she is playing a part. Shown only when a friend has one written
   (FRIEND.premise), so a built friend's doorstep is unaffected. */
.gate-premise{ font-style:italic; color:var(--ink-dim); font-size:19px; margin:0 0 1rem; line-height:1.55; }
/* THE VALUE LINE inside the credits upsell bubble in the chat log (see
   showCreditsUpsell() in the script below) -- not part of the gate itself,
   just placed near it in the stylesheet since both are small supporting
   lines of copy. */
.upsell-note{ color:var(--ink-dim); font-size:13.5px; margin:.35rem 0 0; }
/* BIO CLIP AND TALKING POINTS, added 2026-08-26. Small and quiet on
   purpose: the premise above already does the main introducing, these are
   an optional assist for somebody who wants to hear a voice first or
   does not know what to open with. */
#gateBioPlay{ margin-bottom:1rem; }
#gateTalkingPoints{ margin-bottom:1rem; }
.gate-talking-label{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); margin:0 0 .5rem;
}
.gate .you-panel{ border-top:none; padding-left:0; padding-right:0; }
.chat{ display:flex; flex-direction:column; min-height:0; flex:1; }
/* DEAD DUPLICATE REMOVED 2026-08-18: an identical .gate/.gate h3/.gate-say/
   .gate .you-panel/.chat block used to sit right here, verbatim, at the old
   14.5px size. Being LAST in source order it silently won the cascade over
   the real block above every time — the doorstep font-size bump right next
   to this comment would have done nothing at all without removing it. */
.row.tight{ padding-top:0; }
.btn{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); background:transparent; border:1px solid var(--line);
  border-radius:3px; padding:.55rem .8rem; cursor:pointer;
}
.btn:hover{ color:var(--accent); border-color:var(--accent); }
.btn.wide{ flex:1; }
.btn.go{ color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
.btn.go:hover{ background:var(--accent-hover); border-color:var(--accent-hover); color:var(--accent-ink); }
#say{
  flex:1; min-width:0; font:inherit; font-size:16px;
  color:var(--ink); background:var(--paper);
  border:1px solid var(--line); border-radius:3px; padding:.6rem .7rem;
}
#say:focus{ outline:none; border-color:var(--accent); }
.hint{ padding:0 1rem .7rem; font-size:12px; color:var(--ink-dim); }

/* ── chrome ──────────────────────────────────────────────────────────────── */
.chrome{ position:fixed; top:16px; right:16px; z-index:20;
  display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.chrome .btn{ background:var(--chrome); }

/* ── phone ───────────────────────────────────────────────────────────────────
   HAS TO SIT LAST. On M.E. this block lived earlier in the file, tied on
   specificity, lost on source order, and left the phone broken while the media
   query matched perfectly. */
@media (max-width:820px){
  .room{ grid-template-columns:1fr; grid-template-rows:auto auto; height:100vh; overflow-y:auto;
         -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .room::-webkit-scrollbar{ width:0; }
  .stage{ width:100%; }
  .side{ overflow:visible; min-height:auto; border-left:none; border-top:1px solid var(--line); }
  /* Chrome moves to the bottom on a phone, so the clearance moves with it. */
  .log{ padding-top:1rem; }
  .side{ padding-bottom:calc(var(--chrome-h, 51px) + 1.4rem); }
  .chrome{ top:auto; bottom:12px; right:12px; }
  .skins{ top:auto; bottom:calc(100% + 6px); }
}
</style>
</head>

<body>

<div class="chrome">
  <div class="picker" id="picker">
    <button class="btn" id="skinBtn" type="button">&#127912; Palette</button>
  </div>
  <button class="btn" id="fsBtn" type="button">&#9974; Fullscreen</button>
  <button class="btn" id="closeBtn" type="button">&times; Close</button>
</div>

<div class="room">

  <div class="stage">
    <div class="topline">
      <div class="brandbar">
        <a class="mark" href="index.html" title="Good Company">
          <img class="logo logo-dark-ink"  src="brand/icon-dark-ink.png"  alt="Good Company" width="122" height="122">
          <img class="logo logo-light-ink" src="brand/icon-light-ink.png" alt="Good Company" width="123" height="123">
        </a>
      </div>

      <div class="gauge-wrap">
        <!-- NAMED, NEVER PRONOUNED. The friend is whoever the user built, so
             the title is written from their name at runtime. -->
        <div class="gauge-title" id="gaugeTitle">How they are feeling right now</div>
        <div class="gauge-head">
          <div class="gauge-emoji" id="gaugeEmoji">&#128522;</div>
          <div class="gauge-label" id="gaugeLabel">&nbsp;</div>
        </div>
        <div class="gauge-sub">Shifts with what you say, and with the time of day</div>
        <div class="gauge-clock" id="gaugeClock"></div>

        <div class="gauge-row"><div class="gauge-row-label">Happy</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-happy" style="width:62%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Sad</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-sad" style="width:14%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Fear</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-fear" style="width:8%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Disgust</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-disgust" style="width:5%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Anger</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-anger" style="width:6%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Surprise</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-surprise" style="width:22%"></div></div></div>
        <div class="gauge-row"><div class="gauge-row-label">Curious</div><div class="gauge-bar-track"><div class="gauge-bar-fill f-curious" style="width:58%"></div></div></div>
      </div>
    </div>

    <div class="portrait" id="portrait">
      <video id="loop" muted loop playsinline autoplay preload="auto"></video>
      <button class="sound-on" id="soundBtn" type="button" aria-label="Video sound off"></button>
      <button class="cast-btn" id="castBtn" type="button">&#128250; Cast to TV</button>
    </div>

    <div class="scene-bar" id="sceneBar"></div>
    <div class="watch-bar" id="watchBar" style="display:none"></div>
  </div>

  <!-- FULL-SCREEN WATCH VIEWER, restored 2026-08-21. A real <video>, not the
       player.vimeo.com iframe the 2026-08-18 version of this used -- that
       embed's volume was broken regardless of window size, which is the
       whole reason these left the app in the first place. A native <video>
       element has no such bridge to break, and it is the only thing the
       Cast button below can actually attach to. -->
  <div id="watchViewer" style="display:none; position:fixed; inset:0; z-index:100; background:#000;">
    <button class="btn" id="watchCloseBtn" style="position:absolute; top:16px; right:16px; z-index:2; background:rgba(0,0,0,.62);">&times; Close</button>
    <button class="btn" id="watchCastBtn" style="position:absolute; top:16px; right:110px; z-index:2; background:rgba(0,0,0,.62); display:none;">&#128250; Cast to TV</button>
    <video id="watchVideo" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain;"
      controls playsinline></video>
  </div>

  <div class="side">

    <!-- THE DOORSTEP. Who you are is asked once, here, not from six stacked
         bars inside the conversation. Same reason M.E. has a gate: the chat
         column has to hold a conversation, and every permanent control parked
         in it is a line of talk you cannot see. -->
    <div class="gate" id="gate">
      <h3 id="gateTitle">Before you sit down</h3>
      <p class="gate-premise" id="gatePremise" style="display:none"></p>
      <!-- BIO CLIP AND TALKING POINTS ON THE DOORSTEP, added 2026-08-26 per
           Dr. O direct: the bio clip only lived on the homepage card before
           this, so anyone arriving straight at a room (a shared link, a
           bookmark) never heard it and had nothing to open with. Same
           reasoning as the premise right above: give a first-time visitor
           what they need before their first line, not mid-conversation. -->
      <button type="button" id="gateBioPlay" class="btn" style="display:none"></button>
      <div id="gateTalkingPoints" style="display:none">
        <p class="gate-talking-label">Ask about:</p>
        <div class="chips"></div>
      </div>
      <p class="gate-say" id="gateSay"></p>
      <div id="youPanel"></div>
      <!-- Shares the doorstep rather than adding a surface, the same way Who
           you are does: the chat column has to hold a conversation. -->
      <div id="memPanel" style="display:none"></div>
      <!-- Same shared-doorstep reasoning as memPanel above, added 2026-08-19
           per Dr. O directly after a real bug reached her only because she
           happened to be the one it happened to. See renderHelp() and
           gc-contact.js. -->
      <div id="helpPanel" style="display:none"></div>
      <div class="row tight"><button class="btn go wide" id="startBtn">Sit down</button></div>
    </div>

    <div class="chat" id="chat" style="display:none">
      <div class="log" id="log"></div>

      <div class="row">
        <button class="btn" id="micBtn" title="Speak instead of typing">&#127908;</button>
        <!-- Show them something. Hidden file input, because the styled button
             next to it belongs with the others and a raw file input does not. -->
        <button class="btn" id="showBtn" title="Show them a picture">&#128247;</button>
        <input type="file" id="pickPic" accept="image/*" multiple style="display:none">
        <input type="text" id="say" placeholder="Say whatever's on your mind&hellip;" autocomplete="off">
        <button class="btn" id="stopBtn" type="button" style="display:none" title="Stop him talking">&#9209;</button>
        <button class="btn go" id="sendBtn">Send</button>
      </div>

      <!-- FIRST-VISIT INTRO, added 2026-08-30. David sat down, saw the video's
           own Sound/Cast buttons at the top of the screen, and clicked those
           looking for a way to talk -- there was nothing pointing at the
           actual composer right here. Shown once, ever, across every
           companion (gcSeenComposerIntro() below), not once per room: the
           thing being taught is "there is a text box, type in it," which is
           equally true the first time somebody sits down with anybody. Goes
           away the moment they dismiss it OR the moment they actually send a
           first message, whichever comes first -- someone who already
           figured it out on their own does not need to be told twice. -->
      <div class="intro-tip" id="introTip" style="display:none">
        <span class="intro-tip-arrow">&#8593;</span>
        <span class="intro-tip-text">Type here and hit Send, or tap &#127908; to speak out loud. To hear them talk back, tap &#127911; Hear them talk below.</span>
        <button type="button" class="intro-tip-close" id="introTipClose">Got it</button>
      </div>

      <!-- ONE ROW, SMALL, WRAPPING. These are reached for occasionally; the
           conversation is what the column is for. -->
      <div class="row tools">
        <button class="btn" id="bringBtn">&#128100; Bring someone</button>
        <!-- ONLY A HOUSE DEMO, hidden by default (see the display:none toggle
             near nameEverything()), added 2026-08-27 per Dr. O direct: a
             way to actually own one of the demo cast rather than only ever
             sampling them free-then-credits. Makes a full copy, free to
             open like every other built or catalog-started friend -- see
             the click handler below and currentDemoId()'s own comment on
             why the name-collision it would otherwise cause resolves
             correctly. -->
        <button class="btn" id="claimBtn" style="display:none"></button>
        <!-- ONLY YOUR OWN BUILT FRIEND, hidden by default (see the display:none
             toggle near nameEverything()) since a house demo has nothing to
             carry and a guest sitting with someone else's friend should not be
             offered a copy of it. -->
        <button class="btn" id="syncBtn" style="display:none">&#128241; Other device</button>
        <button class="btn" id="replyBtn">&#127911; Audio Off</button>
        <!-- SPECTATOR MODE, added 2026-09-03, named by Dr. O. Only where there is
             somebody in the room to talk to (a turnOrder room, a friend with
             companions, or one with spectateWith): the people go quiet and the
             companions carry on between themselves, a beat at a time, until
             somebody types or presses it again. Hidden everywhere else and in
             a shared room, where turns go through the room, not this button. -->
        <button class="btn" id="spectateBtn" style="display:none">&#128065; Spectate</button>
        <button class="btn" id="albumBtn">&#128247; Photos</button>
        <button class="btn" id="memBtn">&#128206; Memory</button>
        <button class="btn" id="creditsBtn">&#128176; Credits</button>
        <button class="btn" id="youBtn">&#128100; You</button>
        <button class="btn" id="helpBtn">&#128226; Help</button>
        <!-- Only shown when there is somebody to swap to. Hidden by default so
             a person with one friend never sees a control about having two. -->
        <button class="btn" id="swapBtn" style="display:none"></button>
      </div>
      <div class="hint" id="earHint" style="display:none"></div>
      <div style="height:.8rem"></div>
    </div>
  </div>

</div>

<script>
/* ── the friend ────────────────────────────────────────────────────────────
   Arch and the loader now live in gc-friend.js, shared with album.html, so his
   canon exists in exactly one file. Which friend this is, demo or built, is
   decided there too and answers to ?who=. */
var FRIEND = GC_FRIEND;

/* COMPUTED EARLY, ON PURPOSE. Dr. O: "I sent pookie an invite to Isabelle
   and she is being sent to Arch." Real cause, found by tracing the render
   order rather than guessing: gc-friend.js resolves ?join= to 'arch' as a
   placeholder, with its own comment promising "the room's real friend
   arrives with the join response and replaces this" -- true for the gate's
   title, message, and button (see the PENDING_INVITE block far below),
   false for everything else. nameEverything() and renderScenes() both run
   unconditionally at the top of this script, minting Arch's mood-gauge
   title, Arch's premise, and Arch's own first scene on the main stage,
   ALL before that block even runs. A guest arriving on an invite saw
   Arch's actual face and mood next to a sidebar saying "you have been
   invited" -- which reads exactly like being sent to the wrong person,
   because functionally it was.

   ARRIVING_ON_INVITE has to exist this early, before either of those
   functions run, so they can be skipped rather than patched after the
   fact. The real friend's data still populates everything once
   gc-room-join.js answers (see joinThenSit(), which already calls both
   functions again) -- this only stops the placeholder from being shown
   as though it were the answer. */
var ARRIVING_ON_INVITE = !!(new URLSearchParams(location.search).get('join'));

/* NO PAID GATE HERE ANY MORE, removed 2026-08-27, Dr. O direct: "there is
   never an unlock everywhere." A room used to redirect back to build.html
   for anyone with paid === false; it does not any more. Opening a room is
   free for everyone, whether reached from build.html, a shared link, or
   anywhere else. Actually talking still costs real credits, checked live
   by gc-chat.js on every message, same as it always was, just without a
   separate charge in front of the room itself. */

/* "MINE" MEANS "WHOEVER WAS LAST SAT WITH", so it has to be stamped
   somewhere, and here, when a built friend's room actually opens, is the one
   place that is true regardless of how the room was reached. */
if (typeof GC_touchFriend === 'function' && typeof GC_BUILT !== 'undefined' && GC_BUILT && FRIEND === GC_BUILT) {
  GC_touchFriend(GC_BUILT.id);
}

/* THE WAY BACK TO ARCH. Building somebody used to hide the demo permanently,
   with no control anywhere to return, so the only way back was clearing site
   data. This appears only when there is actually somebody to move between,
   and it names the one you would be going to rather than saying "switch".

   MORE THAN ONE BUILT FRIEND breaks the old two-way toggle: "the other one"
   stopped meaning anything specific once there could be several. With
   exactly one built friend the button still behaves exactly as before, a
   plain toggle. With two or more it becomes a small picker instead, listing
   the house demos and every built friend, current one marked, so switching
   is a click rather than a guess about which "other" person the button
   would have taken you to. */
if (typeof GC_ALL_BUILT !== 'undefined' && GC_ALL_BUILT.length) {
  var swap = document.getElementById('swapBtn');
  swap.style.display = 'inline-block';

  if (GC_ALL_BUILT.length === 1 && GC_BUILT) {
    var goingToDemo = (GC_WHO === 'mine' || GC_WHO === GC_BUILT.id);
    swap.textContent = goingToDemo ? '⇄ ' + GC_DEMO.name : '⇄ ' + GC_BUILT.name;
    swap.title = goingToDemo
      ? 'Sit with ' + GC_DEMO.name + ' instead. ' + GC_BUILT.name + ' stays exactly as they are.'
      : 'Back to ' + GC_BUILT.name + '.';
    swap.addEventListener('click', function () {
      location.href = 'room.html?who=' + (goingToDemo ? GC_DEMO_ID : GC_BUILT.id);
    });
  } else {
    swap.textContent = '⇄ Switch';
    swap.title = 'Sit with someone else.';

    var wrap = document.createElement('span');
    wrap.style.cssText = 'position:relative; display:inline-block;';
    swap.parentNode.insertBefore(wrap, swap);
    wrap.appendChild(swap);

    var menu = document.createElement('div');
    menu.style.cssText = 'display:none; position:absolute; left:0; bottom:100%; z-index:50; ' +
      'background:var(--panel); border:1px solid var(--accent); border-radius:4px; ' +
      'padding:.3rem; margin-bottom:.3rem; white-space:nowrap;';
    function swapItem(label, id, current) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.style.cssText = 'display:block; width:100%; text-align:left; margin:.1rem 0;';
      b.textContent = (current ? '● ' : '') + label;
      if (current) { b.disabled = true; } else {
        b.addEventListener('click', function () { location.href = 'room.html?who=' + encodeURIComponent(id); });
      }
      menu.appendChild(b);
    }
    GC_DEMO_IDS.forEach(function (id) {
      var d = GC_DEMOS[id];
      if (d) swapItem(d.name, id, GC_WHO === id);
    });
    GC_ALL_BUILT.forEach(function (f) { swapItem(f.name, f.id, FRIEND === f); });
    wrap.appendChild(menu);

    swap.addEventListener('click', function (e) {
      menu.style.display = (menu.style.display === 'none') ? 'block' : 'none';
      e.stopPropagation();
    });
    document.addEventListener('click', function () { menu.style.display = 'none'; });
  }
}

var $ = function (id) { return document.getElementById(id); };

/* The friend's name, written into every place the room says it, from the one
   source. Never a hardcoded name and never a pronoun: this product makes a
   different person for everybody. */
/* Called again when a guest arrives, because they are handed the host's friend
   and everything named after them has to catch up. */
/* THE FRIEND'S OWN CLOCK, VISIBLE, added 2026-08-21. Pookie: the companion needs a clock
   "so we know what time it is where they are" -- a real, different ask from the one just
   fixed in _gc-when.js. That fix was about the MODEL knowing the hour and phrasing around
   it; this is about the PERSON seeing it. A friend's timezone was already a real field
   (gc-friend.js, one per demo, same DEFAULT_TIMEZONE server-side default for a built friend
   with none set) and was never shown anywhere. Same bucketing as _gc-when.js's timeOfDay()
   on purpose, so what somebody reads here never contradicts what the friend just said. */
var GC_DEFAULT_TZ = 'America/New_York';
function gcTimeOfDay(hour) {
  if (hour < 5) return 'night';
  if (hour < 12) return 'morning';
  if (hour < 17) return 'afternoon';
  if (hour < 21) return 'evening';
  return 'night';
}
function updateFriendClock() {
  var el = $('gaugeClock');
  if (!el || !FRIEND) return;
  var tz = FRIEND.timezone || GC_DEFAULT_TZ;
  try {
    var now = new Date();
    var clock = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' }).format(now);
    var hour = Number(new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', hour12: false }).format(now)) % 24;
    el.textContent = clock + ', ' + gcTimeOfDay(hour) + ' where ' + FRIEND.name + ' is';
  } catch (e) {
    el.textContent = '';
  }
}
setInterval(updateFriendClock, 60000);

function nameEverything() {
  /* THE PAGE TITLE, added 2026-08-30. Every room shared the same static
     "Good Company" title, so GA's own Views-by-page-title report, the
     first thing anyone checks, could not tell Arch's room from Dario's
     room from any of the other nineteen -- all 21 rooms plus build.html
     folded into one 530-view bucket. The room_view custom event (below,
     unchanged) already gave per-room numbers a different way, but this is
     the report people actually open first. */
  document.title = 'Good Company: ' + FRIEND.name;
  $('gaugeTitle').textContent = 'How ' + FRIEND.name + ' is feeling right now';
  $('gaugeLabel').textContent = FRIEND.mood || 'Easy, glad you came by';
  /* THE GAUGE'S STARTING POINT, added 2026-08-26 per Dr. O direct ("did you
     attach the emotion scale?"). Once a conversation starts, setFeelings()
     already gets real numbers back from the model every reply (see the
     comment on setFeelings itself) -- but before that first reply, the bars
     were just the same hardcoded happy-and-curious HTML default for every
     friend, A.L.I.C.E. included, which reads wrong for someone whose whole
     canon is quiet loneliness. FRIEND.baselineFeelings is optional; a
     friend without one just keeps the original static default. */
  if (FRIEND.baselineFeelings) setFeelings(FRIEND.baselineFeelings);
  $('gaugeEmoji').innerHTML = FRIEND.moodEmoji || '&#128522;';
  updateFriendClock();
  $('syncBtn').style.display =
    (typeof GC_BUILT !== 'undefined' && GC_BUILT && FRIEND === GC_BUILT) ? '' : 'none';
  var claimDemoId = currentDemoId();
  $('claimBtn').style.display = claimDemoId ? '' : 'none';
  if (claimDemoId) $('claimBtn').innerHTML = '&#11088; Make ' + FRIEND.name + ' yours';
  /* THE PREMISE, so a first-time visitor has it before her first line lands. */
  if (FRIEND.premise) { $('gatePremise').textContent = FRIEND.premise; $('gatePremise').style.display = ''; }
  else { $('gatePremise').style.display = 'none'; }
  /* THE BIO CLIP, same file every homepage card already points at (see
     index.html's own .demo-card-play buttons) -- one field, two places it
     gets played from, never two different clips to keep in sync. */
  var bioBtn = $('gateBioPlay');
  if (FRIEND.bioAudio) {
    bioBtn.setAttribute('data-audio', FRIEND.bioAudio);
    bioBtn.innerHTML = '&#128264; Hear ' + FRIEND.name;
    bioBtn.style.display = '';
  } else {
    bioBtn.removeAttribute('data-audio');
    bioBtn.style.display = 'none';
  }
  /* TALKING POINTS, a way in for somebody staring at a blank message box
     with no idea what to say first.

     FIXED 2026-08-26 per Dr. O direct: "the ask me abouts are not wired
     up, you cannot click on them to actually ask." They used to fill
     $('say'), which lives inside #chat -- still display:none at this
     point, since the gate is still showing. Filling a hidden box did
     nothing a visitor could see, which reads as broken because it is.
     Now a click sits the visitor down (same commit-then-sitDown/
     joinThenSit path the Sit down button itself uses) and asks it for
     them, GATE_PENDING_ASK carrying the line across that transition and
     picked up once inside sitDown(). */
  var tpWrap = $('gateTalkingPoints');
  var tpChips = tpWrap.querySelector('.chips');
  tpChips.innerHTML = '';
  if (FRIEND.talkingPoints && FRIEND.talkingPoints.length) {
    FRIEND.talkingPoints.forEach(function (tp) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = tp;
      chip.addEventListener('click', function () {
        GATE_PENDING_ASK = tp;
        var p = $('youPanel');
        if (p.gcCommit) YOU = p.gcCommit();
        if (PENDING_INVITE) joinThenSit(); else sitDown();
      });
      tpChips.appendChild(chip);
    });
    tpWrap.style.display = '';
  } else {
    tpWrap.style.display = 'none';
  }
  /* The wake word hint used to be written here, describing a feature that does
     not exist and telling the reader their audio was being sent away while it
     did not exist. Removed rather than reworded: the button says what it is. */
  $('gateSay').textContent = 'Tell ' + FRIEND.name + ' who you are. You only do this once.';
  $('startBtn').textContent = 'Sit down with ' + FRIEND.name;
}

/* THE BIO CLIP'S PLAY BUTTON, wired once, not inside nameEverything() which
   runs on every friend swap. Same stop/swap shape as the homepage's own
   .demo-card-play buttons (see index.html) -- one clip playing at a time,
   clicking the same one again just stops it. */
(function () {
  var current = null;
  var btn = $('gateBioPlay');
  /* Label swap rather than a CSS .playing state: this button is a full .btn,
     not the homepage's small round icon, so text is the reliable signal
     regardless of which skin is active. */
  function stopCurrent() {
    if (current) { current.pause(); current.currentTime = 0; }
    if (FRIEND) btn.innerHTML = '&#128264; Hear ' + FRIEND.name;
    current = null;
  }
  btn.addEventListener('click', function () {
    var src = btn.getAttribute('data-audio');
    if (!src) return;
    var wasPlaying = !!current;
    stopCurrent();
    if (wasPlaying) return;
    var audio = new Audio(src);
    audio.addEventListener('ended', stopCurrent);
    audio.play().catch(function () {});
    btn.innerHTML = '&#9209; Stop';
    current = audio;
  });
})();
/* SKIPPED HERE ON PURPOSE when arriving on an invite -- see
   ARRIVING_ON_INVITE's own comment. The PENDING_INVITE block further down
   already writes its own honest, nobody-specific gate text; calling this
   first would mint Arch's mood-gauge title and Arch's premise before that
   block ever runs, and joinThenSit() calls this again with the real friend
   once gc-room-join.js answers. */
if (!ARRIVING_ON_INVITE) nameEverything();

/* room_view, added 2026-08-30, Dr. O direct: "can you set up on GA so we
   can see which rooms are visited most often." A plain pageview already
   logs page_location with the ?who= query string, but that is not a
   report GA surfaces cleanly on its own, and it goes empty the moment a
   visit is session-remembered rather than a fresh ?who= link. This fires
   a real, explicit event instead: GC_WHO is the resolved room id
   (survives a remembered session, a built friend, an alias like
   ?who=jacob resolving to grimms), FRIEND.name is there for a
   human-readable label in the same report. Skipped on an invite arrival,
   same reasoning as nameEverything() just above -- the real friend is not
   known yet, and joinThenSit() logs its own once it is. */
if (!ARRIVING_ON_INVITE && typeof gtag === 'function') {
  gtag('event', 'room_view', { room_id: GC_WHO, room_name: FRIEND.name });
}

/* Skins: resolution and the picker both live in gc-skin.js, shared with every
   other page, so these four surfaces cannot drift apart. */
gcMountSkinPicker(document.getElementById("picker"), document.getElementById("skinBtn"));

/* Publishes the chrome's real height so the conversation can clear it. Re-run
   on resize and whenever a label changes, because both change the box. */
function fitChrome() {
  var c = document.querySelector('.chrome');
  document.documentElement.style.setProperty('--chrome-h', c.offsetHeight + 'px');
}
window.addEventListener('resize', fitChrome);
fitChrome();

/* ── fullscreen ──────────────────────────────────────────────────────────── */
$('fsBtn').addEventListener('click', function () {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function () {});
});
document.addEventListener('fullscreenchange', function () {
  $('fsBtn').innerHTML = document.fullscreenElement ? '&#9974; Exit fullscreen' : '&#9974; Fullscreen';
  fitChrome();   // the label just changed length, so the row may have rewrapped
});

/* ── scenes ──────────────────────────────────────────────────────────────────
   A MISSING CLIP SAYS WHICH CLIP IS MISSING. No poster, no still, no stand-in.
   A placeholder that looks deliberate is how a broken asset reaches production. */
var bar = $('sceneBar'), video = $('loop'), portrait = $('portrait'), current = null;
/* THE STAGE'S OWN SHAPE, added 2026-08-30 alongside the landscape/portrait
   scene option (see gc-scene.js's own note on why forcing every scene
   into 16:9 was the bug in the first place). .stage's width formula and
   .portrait's aspect-ratio are both fixed to 16:9 in CSS; play() below
   overrides both inline for a 9:16 scene and clears the override for
   everything else, so a scene with no aspect at all -- every one made
   before today -- renders exactly as it always has. */
var stageEl = document.querySelector('.stage');
var watchBar = $('watchBar'), watchViewer = $('watchViewer'), watchVideo = $('watchVideo');

/* Declared here, not down with the button: play() reads it, and relying on var
   hoisting to make that undefined-but-falsy is luck rather than intent. */
var wantSound = false;

/* Is there a generation API behind this page? False on the deployed campus
   copy, true when running against the local server with a key. Asked once,
   and any failure at all means no. */
var CAN_GENERATE = false;
fetch('/api/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
  .then(function (r) { return r.ok ? r.json() : null; })
  .then(function (j) {
    CAN_GENERATE = !!(j && j.configured);
    if (CAN_GENERATE && current) { var m = portrait.querySelector('.missing'); if (m) showMissing(current.src); }
  })
  .catch(function () { CAN_GENERATE = false; });

function showMissing(src) {
  var old = portrait.querySelector('.missing');
  if (old) old.remove();
  var n = document.createElement('div');
  n.className = 'missing';

  var line = document.createElement('div');
  line.textContent = 'missing: ' + src;
  n.appendChild(line);

  /* MAKE IT, FROM HERE, BUT ONLY WHERE THERE IS SOMETHING TO MAKE IT WITH.
     The generation API is a local Node server; the deployed campus copy has no
     /api at all. So the button appears only once CAN_GENERATE has come back
     true. A dead button on a live page is worse than no button, and this is
     the same file in both places rather than two that drift.

     Every press spends real money, so the server holds the ceilings and
     nothing here retries on its own. A retry loop on a per-second bill is how
     a bounded feature becomes an overnight one. */
  if (CAN_GENERATE) {
    var make = document.createElement('button');
    make.className = 'btn';
    make.style.marginTop = '.9rem';
    make.textContent = 'Make this scene';
    make.addEventListener('click', function () { makeScene(current, make, line); });
    n.appendChild(make);
  }

  portrait.appendChild(n);
  console.warn('[good-company] scene clip not found: ' + src);
}

/* Start, then poll. Veo takes minutes and a serverless function has ten
   seconds, so the browser waits rather than the server. */
function makeScene(scene, btn, line) {
  if (!scene) return;
  btn.disabled = true;
  btn.textContent = 'Starting';

  var name = scene.src.replace(/^video\//, '').replace(/\.mp4$/, '');

  /* THEY HAVE TO LOOK UP. THIS IS THE WHOLE DIFFERENCE BETWEEN A COMPANION
     SCENE AND A NICE CLIP.

     Dr. O made a clip of Arch doing woodwork, meant as one of his scenes, and
     it could not be used: "he never looked up. I could not have that for a
     companion video." A person absorbed in a task is footage of somebody who
     does not know you are there, and this room is supposed to be somebody
     sitting with you. The clip went to the photo album, where not looking up
     is fine, because an album is a thing you look AT.

     Written into the request so it is not relearned one expensive generation
     at a time, and so the paid scene add-on cannot quietly produce clips
     nobody can sit with. */
  var where = (FRIEND.name + ' at ' + scene.label.toLowerCase() +
               (FRIEND.been ? '. ' + FRIEND.been : '') +
               '. They are facing the camera and looking at it, present with the ' +
               'person watching, as though sitting with them. Not absorbed in a task, ' +
               'not looking down, not looking away. Small natural movement, breathing, ' +
               'blinking, occasional shifts. They are keeping somebody company.');

  fetch('/api/scene/start', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: FRIEND.portrait, description: where })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) { fail(j); return; }
    line.textContent = 'making it, this takes a few minutes';
    poll(j.operation, 0);
  }).catch(fail);

  function poll(op, n) {
    btn.textContent = 'Working (' + (n * 15) + 's)';
    fetch('/api/scene/poll', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operation: op, name: name })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) { fail(j); return; }
      if (!j.done) {
        if (n > 40) { fail({ error: 'gave up waiting' }); return; }  // ~10 min, then stop
        setTimeout(function () { poll(op, n + 1); }, 15000);
        return;
      }
      play(scene);          // the file is now exactly where the room looks for it
    }).catch(fail);
  }

  function fail(j) {
    btn.disabled = false;
    btn.textContent = 'Try again';
    line.textContent = 'could not make it: ' + (j && (j.error || j.message) || 'unknown');
    console.warn('[good-company] scene generation failed', j);
  }
}

/* ── A SCENE WITH NO FILM OF IT YET ──────────────────────────────────────────
   NOT A BREACH OF "NO IMAGES UNDER VIDEO", AND THE DIFFERENCE IS THE WHOLE
   POINT OF THIS COMMENT.

   That rule exists because a still placed behind, over or as the poster of a
   video hides the video failing, and a hidden video failure has cost weeks
   more than once. Every part of it still holds: where a scene HAS a source and
   that source breaks, this room shows "missing: <file>" and never a picture,
   exactly as before.

   This is the other case. A friend somebody built has scenes with no source at
   all, because scene generation is not built, so there is no film to hide and
   no failure to mask. There is no video element in play here either: it is
   emptied and taken out of the layout, and what shows is the portrait they
   chose, with a line saying plainly that the moving scene is not made yet.

   Until now that case put up a black rectangle reading "missing:
   video/kitchen.mp4" for every friend anybody built. Cal held a real
   conversation from behind it. */
function showStill(scene) {
  var n = document.createElement('div');
  n.className = 'still';

  /* WHO THIS STILL IS ACTUALLY OF, added 2026-08-29 for a companion with no
     video of their own (Eli's puppet family: Nell, Jem, Wren each have a
     real photo but no clip yet). Without this, a solo scene with no source
     fell back to FRIEND.portrait/name unconditionally -- correct for the
     host friend, wrong for a companion's own scene, where it would show
     the host's face and name during someone else's turn. scene.speaker
     names who this scene is actually of (same key ask() already reads,
     see nextTurnSpeaker()/current.speaker), looked up against
     FRIEND.companions for their own name and, now, their own still. */
  var who = (scene.speaker && FRIEND.companions && FRIEND.companions[scene.speaker]) || FRIEND;

  /* portraitWide, added 2026-08-26. This box is 16/9 (see .portrait above)
     and object-fit:cover on a tall portrait crops in tight, throwing away
     whatever else was in the shot -- fine for a plain headshot, a real loss
     for a scene-rich image (a window, a skyline, a piano). Optional and
     read first on purpose: most friends only have the one portrait and
     that stays exactly as it worked before.

     scene.still, added the same day as scene.speaker just above: a
     companion's own photo for THIS scene specifically, read before falling
     back to the host's portrait at all. */
  var stillImg = scene.still || who.portraitWide || who.portrait || FRIEND.portraitWide || FRIEND.portrait;
  if (stillImg) {
    var im = document.createElement('img');
    im.src = stillImg;
    im.alt = who.name;
    n.appendChild(im);
  }

  var line = document.createElement('div');
  line.className = 'still-say';
  /* SAYS WHAT IT IS rather than letting a still pass for a scene. If there is
     no picture either, it says that too, instead of dropping to initials in a
     box and letting a missing image go unnoticed.

     With one scene, "no film of the original yet" reads like a fault. It is
     not one: a still picture is what this friend comes with. */
  line.textContent = !stillImg
    ? 'No picture of ' + who.name + ' yet'
    : (FRIEND.scenes.length > 1
        ? 'No film of ' + scene.label.toLowerCase() + ' yet'
        : 'A still picture of ' + who.name);
  n.appendChild(line);

  portrait.appendChild(n);
}

/* A VIMEO-HOSTED SCENE, added 2026-08-18. Dr. O, after a spa clip came in
   at 19.6MB against every other scene's ~2.5MB: "let me upload it to
   vimeo... because I know netlify has limits." Right call — a repo full of
   git-committed video is exactly what runs a static host's storage and
   bandwidth up, and Vimeo is built to serve video cheaply where Netlify is
   not. scene.vimeoId is the numeric id from the embed Dr. O pastes in
   (player.vimeo.com/video/<id>); scene.src stays how every other scene
   works and the two are mutually exclusive per scene, never both. */
var vimeoFrame = null, vimeoPlayer = null;
function playVimeo(id) {
  if (!vimeoFrame) {
    vimeoFrame = document.createElement('iframe');
    vimeoFrame.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
    vimeoFrame.allow = 'autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share';
    vimeoFrame.referrerPolicy = 'strict-origin-when-cross-origin';
    portrait.insertBefore(vimeoFrame, portrait.firstChild);
  }
  vimeoFrame.style.display = '';
  /* muted=1 always on the URL itself: browsers block autoplay-with-sound
     regardless of what is asked for, so it always starts muted and the
     Sound button (via vimeoPlayer.setMuted) is what can actually turn it
     on afterward, a real user gesture having already happened by then. */
  /* controls=0, added 2026-08-30: Vimeo's own player chrome (including its
     own "Unmute" button) was rendering on top of this site's own Sound
     button -- two different systems both prompting for the same thing,
     stacked on the same video. David saw both and had no way to know they
     did the same thing. This is the site's own video now, controls come
     from the site's own buttons only. */
  vimeoFrame.src = 'https://player.vimeo.com/video/' + encodeURIComponent(id) +
    '?badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1&muted=1&loop=1&controls=0';
  /* RECONSTRUCTED ON EVERY LOAD rather than reused across scene changes:
     reassigning an iframe's src out from under an existing Vimeo.Player
     does not reliably keep that player bound to the new video, and there
     is currently exactly one Vimeo scene on the whole site, so the cost of
     a fresh Player object per scene change is nothing to optimise yet. */
  try {
    vimeoPlayer = new Vimeo.Player(vimeoFrame);
    vimeoPlayer.setMuted(!wantSound);
  } catch (e) { vimeoPlayer = null; }
}
function hushVimeo() { if (vimeoFrame) vimeoFrame.style.display = 'none'; }

/* NOT ACTUALLY A LOOP BUG, added 2026-08-31 -- Dr. O: "the mirror is not
   looping." Checked the live player directly: loop was already true, it
   was still mid-playback, nothing was broken. What actually happened is
   that Vimeo pauses its own iframe whenever the TAB goes hidden (switch
   tabs, minimize, phone screen locks) to save bandwidth, and never
   resumes on its own -- confirmed live, document.visibilityState flips
   to "hidden" and the player's getPaused() flips to true soon after, with
   nothing here ever telling it to resume. Any visit long enough to look
   away and back would come home to a frozen frame that reads exactly
   like "stopped looping," because it did stop, just not by reaching its
   own end. */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && vimeoPlayer) {
    try { vimeoPlayer.play().catch(function () {}); } catch (e) {}
  }
});

function play(scene) {
  /* CAPTURED BEFORE current MOVES, added 2026-08-31 for the mirror
     encounter below -- the only way to tell "just arrived at this scene"
     from "still sitting on it" is comparing against what current was a
     moment ago, so this has to happen before the reassignment on the
     next line touches it. */
  var enteringMirror = scene && scene.special === 'mirror' && (!current || current.key !== scene.key);
  /* A SPECTATOR SCENE, added 2026-09-03. Dr. O: "a spectator scene? A room
     where the user can go in and just listen?" Yes: a scene with
     spectate:true starts Spectator Mode the moment it is on screen and the
     chat is open, and walking to any other scene ends it. Same button,
     same beats, same ceiling; the scene is just a door that opens onto
     them already talking. Nothing happens on the doorstep (the gate is up)
     or in a shared room (turns go through the room there). */
  var wasSpectateScene = !!(current && current.spectate);
  current = scene;
  if (typeof stopSpectating === 'function') {
    var chatOpen = $('chat') && $('chat').style.display !== 'none';
    if (scene && scene.spectate && chatOpen && !SEAT) { if (!spectating) startSpectating(); }
    else if (wasSpectateScene && !(scene && scene.spectate)) stopSpectating();
  }
  var old = portrait.querySelector('.missing');
  if (old) old.remove();
  var oldStill = portrait.querySelector('.still');
  if (oldStill) oldStill.remove();

  /* THE STAGE CHANGES SHAPE FOR A PORTRAIT SCENE, added 2026-08-30. See
     stageEl's own declaration above for why this only ever touches inline
     style, never the CSS class: every scene without scene.aspect (which
     is every scene made before today) clears both overrides and falls
     straight back to the room's own normal 16:9 look. */
  if (scene.aspect === '9:16' && stageEl) {
    /* NOT ON A PHONE, added the same day: the room's own @media (max-width:
       820px) rule already sets .stage to width:100% there, a single
       narrow column, and an inline min(30vw, ...) would override that
       media query (inline always beats it) and squeeze a portrait scene
       down to a sliver on the one layout where 100% width is already the
       right, natural shape for something tall. */
    if (window.innerWidth > 820) stageEl.style.width = 'min(30vw, calc(72vh * 9 / 16))';
    portrait.style.aspectRatio = '9/16';
  } else if (stageEl) {
    stageEl.style.width = '';
    portrait.style.aspectRatio = '';
  }

  /* THE MIRROR'S OWN MOMENT, added 2026-08-31, Dr. O direct on Larkmere's
     mirror scene specifically: "it should be special, like specifically
     when it is on something should change for the UX." Nothing else on
     this campus sets scene.special, and nothing else should -- a glowing,
     slowly breathing ring belongs to the one scene that is actually
     supposed to feel like something is looking back, not a general-
     purpose effect any future scene could opt into by accident. Toggled
     on .portrait itself so it never has to be cleared anywhere but here:
     every scene change passes through play(), so leaving this scene
     always removes it, same as the aspect override just above. */
  portrait.classList.toggle('mirror-active', scene.special === 'mirror');

  if (scene.vimeoId) {
    video.removeAttribute('src');
    try { video.load(); } catch (e) {}
    video.style.display = 'none';
    playVimeo(scene.vimeoId);
  } else if (!scene.src) {
    /* Emptied and hidden, so nothing is layered over anything. */
    hushVimeo();
    video.removeAttribute('src');
    try { video.load(); } catch (e) {}
    video.style.display = 'none';
    showStill(scene);
  } else {
    hushVimeo();
    video.style.display = '';
    video.src = scene.src;
    video.muted = !wantSound;      // the choice survives changing rooms
    /* scene.speed, added 2026-08-19: Poppy's and Blue's real clips slowed
       to half rate per Dr. O directly. Set via the video element's own
       playbackRate rather than a re-encoded file -- no ffmpeg on this
       machine, and this gets the identical slow-motion result with no
       quality loss. Reset to 1 for every scene without one, so a slowed
       clip never leaks its rate into the next scene played after it. */
    video.playbackRate = scene.speed || 1;
    video.play().catch(function () {});
  }

  Array.prototype.forEach.call(bar.children, function (chip) {
    chip.classList.toggle('on', chip.dataset.key === scene.key);
  });

  /* A SCENE CAN LIFT THE GAUGE, added 2026-08-26 per Dr. O direct: A.L.I.C.E. visibly
     lights up around Cat, and the gauge should show that rather than sitting frozen at
     her sad-leaning baseline the whole time she is in that scene. Optional on any
     scene -- one without scene.feelings falls back to the friend's own baseline, same
     as before scenes could override anything. Reverts the moment somebody actually
     says something, since setFeelings() from a real model reply always wins after that;
     this only covers the quiet stretch before anyone has spoken. Also has to revert on
     its own when LEAVING a lit-up scene, or Cat's brightness would wrongly follow the
     visitor into every other scene afterward. */
  if (scene.feelings) setFeelings(scene.feelings);
  else if (FRIEND.baselineFeelings) setFeelings(FRIEND.baselineFeelings);
  $('gaugeLabel').textContent = scene.mood || FRIEND.mood || 'Easy, glad you came by';
  $('gaugeEmoji').innerHTML = scene.moodEmoji || FRIEND.moodEmoji || '&#128522;';

  updateCastVisibility();
  /* THE ENCOUNTER ITSELF, added 2026-08-31, Dr. O direct: "when this scene
     is up we need something to happen for the user... a commanding voice
     to let the user be faced with a fear and be sorted to a house." Fires
     once per arrival at the mirror scene (enteringMirror, captured before
     current moved at the top of this function), not on every call to
     play() -- re-selecting the same scene should not re-trigger it. */
  if (enteringMirror && typeof mirrorEncounter === 'function') mirrorEncounter();
}
/* THE MIRROR ENCOUNTER, added 2026-08-31. Dr. O direct: "when this scene
   is up we need something to happen for the user, like a commanding
   voice to let the user be faced with a fear and be sorted to a house."
   Two named voices, both hers: Tarquin (the headmaster, sets up the
   ritual) and Cassius (the mirror itself, speaks the fear and the
   verdict). Reaction maps to house using real tree fact/folklore, not
   arbitrary color-coding -- see LARKMERE_HOUSES' own notes on each. */
var LARKMERE_HOUSES = {
  calm: { name: 'Ash', color: '#AEC9B8',
    line: 'You did not flinch. That is rarer than it sounds, and the glass remembers it.',
    audio: 'audio/larkmere-cassius-ash.mp3' },
  /* Yew is the tree English longbows were made from -- a real fact, not
     invented lore, which is why FIGHT maps here rather than to anything
     more generically "fierce." */
  fight: { name: 'Yew', color: '#C9483D',
    line: 'You did not run. Yew does not either. It is the oldest tree in most ' +
          'English churchyards, and the only wood anyone ever trusted for a longbow.',
    audio: 'audio/larkmere-cassius-yew.mp3' },
  comfort: { name: 'Elder', color: '#8B6FB3',
    line: 'You reached outward instead of in. Elder has always been the tree people ' +
          'left something for, the one that is said to look after you back.',
    audio: 'audio/larkmere-cassius-elder.mp3' },
  retreat: { name: 'Hazel', color: '#D19A4B',
    line: 'You stepped back to think first. Hazel is the diviner\x27s wood. Looking ' +
          'away is not the same thing as looking at nothing.',
    audio: 'audio/larkmere-cassius-hazel.mp3' },
};
function addStaticPlayButton(bubble, src) {
  if (!bubble) return;
  var btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'replay-btn';
  btn.innerHTML = '&#128266; Play';
  var audio = null;
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (audio && !audio.paused) { audio.pause(); btn.innerHTML = '&#128266; Play'; return; }
    audio = new Audio(src);
    audio.addEventListener('ended', function () { btn.innerHTML = '&#128266; Play'; });
    audio.play().catch(function () {});
    btn.innerHTML = '&#9209; Stop';
  });
  bubble.appendChild(btn);
}
function mirrorEncounter() {
  addStaticPlayButton(
    post('Tarquin', "Go on then. Sit. And do look at it properly, mind. It hasn't the patience for a glance."),
    'audio/larkmere-tarquin-intro.mp3'
  );
  addStaticPlayButton(
    post('Cassius', 'In a moment, you shall see the thing you have not spoken aloud in rather a ' +
      'long time. The one that still catches when the room falls quiet. When you do, you will ' +
      'do one of four things. Stand your ground. Push back. Reach for someone. Or look away. ' +
      'There is no wrong answer. Only the true one.'),
    'audio/larkmere-cassius-mirror.mp3'
  );

  var chooser = document.createElement('div');
  chooser.className = 'mirror-choice';
  chooser.style.cssText = 'display:flex; flex-wrap:wrap; gap:.5rem; margin:.6rem 0 1rem;';
  [
    { key: 'calm', label: 'Stand still and face it' },
    { key: 'fight', label: 'Push back at it' },
    { key: 'comfort', label: 'Reach for someone' },
    { key: 'retreat', label: 'Look away' },
  ].forEach(function (c) {
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'btn';
    btn.textContent = c.label;
    btn.addEventListener('click', function () {
      Array.prototype.forEach.call(chooser.children, function (b) { b.disabled = true; });
      post(YOU.name || 'You', c.label, true);
      var house = LARKMERE_HOUSES[c.key];
      setTimeout(function () {
        var verdict = post('Cassius', 'The glass answers. ' + house.name + '. ' + house.line);
        var who = verdict.querySelector('.who');
        if (who) who.style.color = house.color;
        /* MISSING UNTIL 2026-08-31, Dr. O: "some things are audio and some
           are not." Tarquin's line and Cassius's own fear-prompt both got a
           real Play button when this was built; the payoff line, the one
           actually naming the house, never did -- a plain gap, not a
           playback bug. */
        if (house.audio) addStaticPlayButton(verdict, house.audio);
      }, 650);
    });
    chooser.appendChild(btn);
  });
  $('log').appendChild(chooser);
  $('log').scrollTop = $('log').scrollHeight;
}

/* Only where a source was actually asked for. Emptying the element to get it
   out of the way fires this too, and a scene with no film is not a failure. */
video.addEventListener('error', function () { if (current && current.src) showMissing(current.src); });

/* SOUND. Starts off because no browser will autoplay audio, and stays off
   until somebody asks for it. Once on it stays on across scene changes, so
   walking from the fire to the porch does not silence the room.

   AN EAR, NOT A MIC, corrected the same day: "it is good except not a
   mic because the videos do not talk, it should be a ear (hearing)."
   Right call -- this is ambient room sound (a fire, birds, a kettle),
   nobody in the clip is speaking into anything, so a microphone implied
   the wrong direction entirely. Crossed out when muted, same convention
   as the mic version it replaced. Icon alone says the state; aria-label
   carries the same words for anyone not seeing it. */
  var EAR_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6' +
    '-6 10a3.5 3.5 0 1 1-7 0"></path><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4">' +
    '</path></svg>';
  var EAR_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6' +
    '-6 10a3.5 3.5 0 1 1-7 0"></path><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4">' +
    '</path><line x1="2" y1="2" x2="22" y2="22"></line></svg>';
  function paintSoundBtn() {
    $('soundBtn').innerHTML = wantSound ? EAR_ON : EAR_OFF;
    $('soundBtn').setAttribute('aria-label', wantSound ? 'Video sound on' : 'Video sound off');
  }
  paintSoundBtn();
$('soundBtn').addEventListener('click', function () {
  wantSound = !wantSound;
  video.muted = !wantSound;
  if (wantSound) video.play().catch(function () {});
  if (vimeoPlayer) { try { vimeoPlayer.setMuted(!wantSound); } catch (e) {} }
  paintSoundBtn();
});

/* CAST TO A TV, added 2026-08-21 (the ask from earlier in this same session
   that got set aside mid-build). video.remote is the standards-based Remote
   Playback API: no SDK, no receiver app, and it already works with
   Chromecast and most smart TVs. Only shown for a real <video> scene --
   current.vimeoId means the visible surface is a cross-origin iframe this
   code has no way to drive, and a still has nothing playing to cast at all. */
var castBtn = $('castBtn');
var castSupported = !!(video.remote && typeof video.remote.prompt === 'function');
var castAvailable = false;
function updateCastVisibility() {
  castBtn.style.display = (castSupported && castAvailable && current && current.src && !current.vimeoId) ? '' : 'none';
}
if (castSupported) {
  /* watchAvailability itself can reject on a browser that only partially
     implements the API; treated as "assume available" rather than hiding a
     button that would otherwise have worked, since prompt() still fails
     safely on its own if there is truly nothing to cast to. */
  video.remote.watchAvailability(function (available) {
    castAvailable = available;
    updateCastVisibility();
  }).catch(function () {
    castAvailable = true;
    updateCastVisibility();
  });
}
castBtn.addEventListener('click', function () {
  if (!castSupported) return;
  video.remote.prompt().catch(function () {});
});

/* MOVING THE ROOM, FOR EVERYONE IN IT, NOT JUST THIS BROWSER.
   ─────────────────────────────────────────────────────────────────────────
   This used to be play(scene) and nothing else: local, silent, forgotten by
   the next poll. gc-room-poll has always carried the comment "the host moves
   and everyone follows", and it was only ever half true, because nothing told
   the server a room's scene had changed. Every poll kept re-asserting the
   scene the room was BORN with, snapping everyone back to it, which is what
   Dr. O hit: Pookie was on some other scene, Terry's join triggered a poll,
