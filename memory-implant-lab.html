<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Memory Implant Lab · ETL Internal</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400&family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --blue:#5c8ab5; --gold:#c6a667; --ink:#c8bfa8; --dim:#7a6e5c; --faint:#5a5040; --line:rgba(92,138,181,0.15); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0d0b08; color:var(--ink); font-family:'Public Sans',sans-serif; font-size:14px; line-height:1.7; padding:40px 5vw 120px; }
  h1 { font-family:'Spectral',serif; font-weight:300; font-size:clamp(26px,3vw,38px); color:#fff; margin:6px 0 4px; }
  .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--blue); }
  .sub { color:var(--dim); max-width:640px; margin-bottom:32px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:16px 0 10px; border-top:1px solid var(--line); }
  .notes-row { padding:0 0 16px; border-bottom:1px solid var(--line); margin-bottom:28px; }
  input, select, textarea, button { font-family:'IBM Plex Mono',monospace; font-size:12px; background:#151209; color:var(--ink); border:1px solid var(--line); padding:8px 12px; }
  textarea { width:100%; font-family:'Public Sans',sans-serif; font-size:13px; line-height:1.6; }
  button { cursor:pointer; letter-spacing:1.5px; text-transform:uppercase; font-size:10px; transition:border-color .15s,color .15s; }
  button:hover { border-color:var(--blue); color:#8ab4d8; }
  button.primary { border-color:rgba(198,166,103,0.5); color:var(--gold); }
  button:disabled { opacity:.4; cursor:wait; }
  .agent-block { margin-bottom:36px; }
  .agent-name { font-family:'Spectral',serif; font-size:20px; color:#fff; border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:12px; }
  .mem { border:1px solid var(--line); padding:14px 16px; margin-bottom:10px; }
  .mem.canon { border-left:3px solid var(--gold); }
  .mem.draft { border-left:3px solid var(--blue); }
  .mem.retired { opacity:.45; }
  .mem-meta { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--faint); margin-bottom:6px; display:flex; gap:14px; flex-wrap:wrap; }
  .mem-meta .k { color:var(--blue); }
  .mem-meta .s-canon { color:var(--gold); }
  .mem-text { color:var(--ink); }
  .tells { font-size:12px; color:var(--dim); margin-top:6px; }
  .mem-actions { margin-top:10px; display:flex; gap:8px; }
  #status { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); margin-left:auto; }
  .count-pill { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--faint); }
</style>
</head>
<body>

<div style="margin-bottom:20px; font-family:'IBM Plex Mono',monospace; font-size:11px;">
  <a href="/build-your-own-agent" style="color:var(--dim); text-decoration:none; margin-right:18px;" onmouseover="this.style.color='#8ab4d8'" onmouseout="this.style.color='#7a6e5c'">&larr; Agent Workshop</a>
  <a href="/" style="color:var(--dim); text-decoration:none;" onmouseover="this.style.color='#8ab4d8'" onmouseout="this.style.color='#7a6e5c'">ETL campus</a>
</div>
<div class="eyebrow">ETL Internal · Editorial Console</div>
<h1>Memory Implant Lab</h1>
<p class="sub">Fabricate, review, and canonize lived memories and current moods for the cast. Everything generates as a draft. Nothing enters an agent's head until you approve it. The cast never knows.</p>

<div class="bar">
  <input id="owner-key" type="password" placeholder="owner key" style="width:160px;">
  <select id="mode"><option value="memories" selected>Memories</option><option value="emotions">Emotions</option></select>
  <select id="agent-select" style="min-width:240px;"><option>loading roster...</option></select>
  <select id="pack-count"><option value="9" selected>9 memories</option><option value="6">6 memories</option><option value="12">12 memories</option></select>
  <button id="gen-btn" class="primary">Generate implant pack</button>
  <button id="refresh-btn">Refresh</button>
  <select id="status-filter"><option value="">all statuses</option><option value="draft">drafts</option><option value="canon">canon</option><option value="retired">retired</option></select>
  <span id="status"></span>
</div>
<div class="notes-row">
  <textarea id="canon-notes" rows="2" placeholder="Canon notes for this generation (locked facts that override the dossier): e.g. sister Tessa away at college; loves jasmine tea; no children; Devon Sloane is he/him"></textarea>
</div>

<div id="list"></div>

<script>
(function () {
  var keyEl = document.getElementById('owner-key');
  keyEl.value = localStorage.getItem('etl_owner_key') || '';
  keyEl.addEventListener('change', function () { localStorage.setItem('etl_owner_key', keyEl.value.trim()); });

  var statusEl = document.getElementById('status');
  function say(msg) { statusEl.textContent = msg; }
  function mode() { return document.getElementById('mode').value; }

  function api(fn, payload) {
    return fetch('/.netlify/functions/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Owner-Key': keyEl.value.trim() },
      body: JSON.stringify(payload),
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); });
  }

  // Roster dropdown
  fetch('/roster.json').then(function (r) { return r.json(); }).then(function (data) {
    var list = Array.isArray(data) ? data : (data.agents || []);
    var names = list.map(function (a) { return a.name; }).filter(Boolean).sort();
    var sel = document.getElementById('agent-select');
    sel.innerHTML = '<option value="">choose an agent (' + names.length + ')</option>';
    names.forEach(function (n) {
      var o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o);
    });
  }).catch(function () { document.getElementById('agent-select').innerHTML = '<option value="">roster unavailable</option>'; });

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  function cardHTML(m) {
    var meta, text, tells = '';
    if (mode() === 'memories') {
      meta = '<span class="k">' + esc(m.kind) + '</span><span>' + esc(m.title || '') + '</span>' +
             '<span>' + esc(m.happened_at || '') + '</span><span>weight ' + esc(m.weight) + '</span>';
      text = esc(m.memory);
    } else {
      meta = '<span class="k">' + esc(m.mood) + ' · ' + esc(m.intensity) + '/5</span>' +
             '<span>lasts: ' + esc(m.lasts || '?') + '</span>';
      text = esc(m.cause);
      if (m.tells && m.tells.length) tells = '<div class="tells">tells: ' + m.tells.map(esc).join(' · ') + '</div>';
    }
    return '<div class="mem ' + esc(m.status) + '" data-id="' + esc(m.id) + '">' +
      '<div class="mem-meta">' + meta + '<span class="s-' + esc(m.status) + '">' + esc(m.status) + '</span></div>' +
      '<div class="mem-text">' + text + '</div>' + tells +
      '<div class="mem-actions">' +
      (m.status === 'draft' ? '<button data-act="approve">Approve to canon</button>' : '') +
      '<button data-act="edit">Edit</button>' +
      (m.status !== 'retired' ? '<button data-act="retire">Retire</button>' : '') +
      '<button data-act="delete">Delete</button>' +
      '</div></div>';
  }

  function render(rows) {
    var byAgent = {};
    rows.forEach(function (m) { (byAgent[m.agent_name] = byAgent[m.agent_name] || []).push(m); });
    var out = '';
    Object.keys(byAgent).sort().forEach(function (agent) {
      var ms = byAgent[agent];
      var canon = ms.filter(function (m) { return m.status === 'canon'; }).length;
      var draft = ms.filter(function (m) { return m.status === 'draft'; }).length;
      out += '<div class="agent-block"><div class="agent-name">' + esc(agent) +
        ' <span class="count-pill">' + canon + ' canon · ' + draft + ' draft</span></div>' +
        ms.map(cardHTML).join('') + '</div>';
    });
    document.getElementById('list').innerHTML = out ||
      '<p style="color:var(--faint);">Nothing here yet. Pick an agent and generate.</p>';
  }

  function refresh() {
    say('loading...');
    var payload = { action: 'list', target: mode() };
    var agent = document.getElementById('agent-select').value;
    var st = document.getElementById('status-filter').value;
    if (agent) payload.agent_name = agent;
    if (st) payload.status = st;
    api('memory-implant-admin', payload).then(function (res) {
      if (!res.ok) { say(res.j.error || 'error'); return; }
      render(res.j.rows || []);
      say((res.j.rows || []).length + ' ' + mode());
    });
  }

  function syncModeUI() {
    var mem = mode() === 'memories';
    document.getElementById('pack-count').style.display = mem ? '' : 'none';
    document.getElementById('gen-btn').textContent = mem ? 'Generate implant pack' : 'Generate current mood';
    refresh();
  }

  document.getElementById('refresh-btn').addEventListener('click', refresh);
  document.getElementById('status-filter').addEventListener('change', refresh);
  document.getElementById('agent-select').addEventListener('change', refresh);
  document.getElementById('mode').addEventListener('change', syncModeUI);

  document.getElementById('gen-btn').addEventListener('click', function () {
    var agent = document.getElementById('agent-select').value;
    if (!agent) { say('pick an agent first'); return; }
    var btn = this; btn.disabled = true;
    var notes = document.getElementById('canon-notes').value.trim();
    var mem = mode() === 'memories';
    say((mem ? 'fabricating memories for ' : 'reading the mood of ') + agent + '...');
    var payload = { agent_name: agent, canon_notes: notes };
    if (mem) payload.count = parseInt(document.getElementById('pack-count').value, 10);
    api(mem ? 'memory-implant-generate' : 'memory-implant-emotions', payload).then(function (res) {
      btn.disabled = false;
      if (!res.ok) { say(res.j.error || 'generation failed'); return; }
      say(mem ? (res.j.inserted + ' drafts fabricated') : ('mood drafted: ' + (res.j.emotion && res.j.emotion.mood)));
      refresh();
    }).catch(function () { btn.disabled = false; say('network error'); });
  });

  document.getElementById('list').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var card = btn.closest('.mem');
    var id = card.getAttribute('data-id');
    var act = btn.getAttribute('data-act');

    if (act === 'edit') {
      var textEl = card.querySelector('.mem-text');
      if (card.querySelector('textarea')) return;
      var ta = document.createElement('textarea');
      ta.value = textEl.textContent; ta.rows = 4;
      textEl.replaceWith(ta);
      var save = document.createElement('button');
      save.textContent = 'Save'; save.className = 'primary';
      btn.replaceWith(save);
      var field = mode() === 'memories' ? 'memory' : 'cause';
      save.addEventListener('click', function () {
        say('saving...');
        var payload = { action: 'edit', id: id, target: mode() };
        payload[field] = ta.value;
        api('memory-implant-admin', payload).then(function (res) {
          say(res.ok ? 'saved' : (res.j.error || 'error')); refresh();
        });
      });
      return;
    }

    if (act === 'delete' && !confirm('Hard delete this ' + (mode() === 'memories' ? 'memory' : 'mood') + '?')) return;
    say(act + '...');
    api('memory-implant-admin', { action: act, id: id, target: mode() }).then(function (res) {
      say(res.ok ? 'done' : (res.j.error || 'error')); refresh();
    });
  });

  // Deep link: /memory-implant-lab?mode=emotions opens the Emotion Engine view
  try {
    var m = new URLSearchParams(location.search).get('mode');
    if (m === 'emotions') document.getElementById('mode').value = 'emotions';
  } catch (_) {}
  var memNow = mode() === 'memories';
  document.getElementById('pack-count').style.display = memNow ? '' : 'none';
  document.getElementById('gen-btn').textContent = memNow ? 'Generate implant pack' : 'Generate current mood';

  if (keyEl.value) refresh();
})();
</script>

</body>
</html>
