function astar(s,e){
  if(s===e)return[s];
  const h=(a,b)=>Math.hypot(N[a][0]-N[b][0],N[a][1]-N[b][1]);
  const open=[{n:s,g:0,f:h(s,e),p:[s]}],cl=new Set();
  while(open.length){
    open.sort((a,b)=>a.f-b.f);
    const cur=open.shift();
    if(cur.n===e)return cur.p;
    if(cl.has(cur.n))continue;
    cl.add(cur.n);
    for(const[nb,cost]of ADJ[cur.n]){
      if(!cl.has(nb)){
        const g=cur.g+cost;
        open.push({n:nb,g,f:g+h(nb,e),p:[...cur.p,nb]});
      }
    }
  }
  return[s,e];
}

// ── FLOATING EMOJI EVENTS ────────────────────────────────────────────────────
const emojiEvents = [];
function spawnEmoji(emoji, x, y, vx=0, vy=-0.028, dur=2000){
  emojiEvents.push({emoji, x, y, vx, vy, born: performance.now(), dur});
}
function drawEmojiEvents(){
  const now = performance.now();
  for(let i=emojiEvents.length-1;i>=0;i--){
    const e=emojiEvents[i];
    const age=now-e.born;
    if(age>e.dur){ emojiEvents.splice(i,1); continue; }
    const t=age/e.dur;
    const alpha=t<0.18?(t/0.18):(1-((t-0.18)/0.82));
    e.x+=e.vx; e.y+=e.vy;
    ctx.save();
    ctx.globalAlpha=Math.max(0,alpha);
    ctx.font='20px serif';
    ctx.textAlign='center';
    ctx.fillText(e.emoji, e.x, e.y);
    ctx.restore();
  }
}

  const now=Date.now();
  if(now-lastStateWrite<3000) return;
  lastStateWrite=now;
  fetch('/.netlify/functions/etl-map-state',{
    method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ts:now,agents:snapshotAgents()})
  }).catch(function(){});
}
function startMirrorPoll(){
  fetch('/.netlify/functions/etl-map-state',{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.agents) return;
      d.agents.forEach(function(snap){
        var a=agents.find(function(ag){return ag.name===snap.n;});
        if(!a) return;
        a.x=snap.x; a.y=snap.y; a.state=snap.s; a.node=snap.nd;
      });
    })
    .catch(function(){})
    .finally(function(){setTimeout(startMirrorPoll,2500);});
}

function getETHour(){
  var et = new Date(new Date().toLocaleString('en-US', {timeZone:'America/New_York'}));
  return et.getHours() + et.getMinutes()/60;
}
function getTimeMode(){
  var h = getETHour();
  var isWknd = ['Sat','Sun'].includes(new Date().toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short'}));
  if(h >= 12 && h < 13) return 'lunch';
  if(isWknd && h >= 9 && h < 20) return 'weekend';
  if(h >= 8  && h < 17) return 'work';
  if(h >= 17 && h < 21) return 'evening';
  if(h >= 7  && h < 8)  return 'morning';
  return 'night';
}

// ── INIT AGENTS ──────────────────────────────────────────────────────────────
const agents = ADAT.map(([name,plat,r,mcp])=>{
  const hn = HOME_OVERRIDE[name] || HOME[plat] || 20;
  const [hx,hy] = N[hn];
  const _da=Math.random()*Math.PI*2, _dd=8+Math.random()*22;
  const [nox,noy] = NAMED_OFFSET[name] || [0,0];
  const dox=Math.cos(_da)*_dd+nox, doy=Math.sin(_da)*_dd+noy;
  return {
    name,plat,r,mcp:!!mcp,color:PC[plat],
    x: hx+dox, y: hy+doy, dox, doy,
    state:ST.W, timer:Math.random()*15000, dur:15000+Math.random()*20000,
    node:hn, tnode:hn, path:[], pi:0,
    partner:-1, mx:0, my:0,
    phase:Math.random()*Math.PI*2,
    wdx:0, wdy:0,
    paceDir:-1, pacePhase:0,
    romancePending:false,
    inHub:false
  };
});

// ── BEHAVIOR ─────────────────────────────────────────────────────────────────
const TICK = 1800; // evaluate state every 1.8s
let lastTick = 0;

// Neighbour nodes (1-hop) for realistic short trips
function nearbyNode(a){
  const nbrs = ADJ[a.node].map(([n])=>n);
  return nbrs[Math.floor(Math.random()*nbrs.length)];
}
// Target selection: mostly home, occasionally nearby, rarely far
function pickTarget(a){
  const r=Math.random();
  const mode=getTimeMode();
  // Dr. O AI Twin: morning = full tour; work = ETL Building with one campus lap ~per hour
  if(a.plat==='DR'){
    const allHomes=Object.values(HOME);
    if(mode==='work'){
      const now=Date.now();
      if(now-drOLastRoam > 55*60*1000 && r<.12){
        drOLastRoam=now;
        return allHomes[Math.floor(Math.random()*allHomes.length)];
      }
      return 14; // stay at ETL Building
    }
    if(mode==='weekend'){
      const now=Date.now();
      if(now-drOLastRoam > 90*60*1000 && r<.15){
        drOLastRoam=now;
        return allHomes[Math.floor(Math.random()*allHomes.length)];
      }
      // Weekend: splits time between her office, courtyard, and campus visits
      return r<.45 ? 14 : r<.60 ? YARD_NODE : allHomes[Math.floor(Math.random()*allHomes.length)];
    }
    return r<.35 ? 14 : allHomes[Math.floor(Math.random()*allHomes.length)];
  }
  // All other agents — time-of-day behavior
  if(mode==='work'){
    const homeNode = HOME_OVERRIDE[a.name] || HOME[a.plat] || HUB;
    const dist = Math.hypot(a.x - N[homeNode][0], a.y - N[homeNode][1]);
    // GP/NW/CG stay tight to their building — 100px keeps Greylander out of
    // Newswire and city-gov (incl. Roz) anchored at City Govt.
    // FS gets 84px: Build Your Agent (node 22) is only 87px from Founder Studio
    // (node 18), so without a tighter radius FS agents cluster at the wrong building.
    const pullDist = ['GP','NW','CG','HC'].includes(a.plat) ? 100 : a.plat==='FS' ? 55 : 200;
    if(dist > pullDist) return homeNode;
    if(r<.72) return homeNode;             // at their post
    if(r<.92) return nearbyNode(a);        // short hop nearby
    return HUB;                            // rare DeskWorks visit
  }
  if(mode==='lunch'){
    if(a.plat!=='DR' && r<.15) return YARD_NODE;  // pull ~15% to courtyard at lunch
    if(r<.50) return HOME[a.plat]||HUB;
    if(r<.80) return nearbyNode(a);
    return HUB;
  }
  if(mode==='weekend'){
    // Saturday/Sunday: social campus, some still working
    const cyZone=Math.random()<.5?YARD_NODE:11; // spread courtyard across outer quad too
    if(a.plat!=='DR' && r<.12) return cyZone;                              // 12% courtyard zone
    if(a.plat!=='DR' && r<.19) return 6;                                   //  7% Gym
    if(a.plat!=='DR' && r<.24) return 5;                                   //  5% Dose
    if(a.plat!=='DR'&&a.plat!=='OG'&&r<.28) return 2;                     //  4% Gauntlet spectating
    if(a.plat!=='DR'&&a.plat!=='CG'&&r<.31) return 26;                    //  3% Court (watch Judge Roz)
    if(r<.65) return HOME_OVERRIDE[a.name]||HOME[a.plat]||HUB;            // 34% at home/working
    if(r<.83) return nearbyNode(a);                                        // 18% nearby
    if(r<.88) return HUB;                                                  //  5% DeskWorks cafe
    let n; do{n=Math.floor(Math.random()*N.length)}while(n===a.node||n===BRIDGE_NODE||(n===1&&a.plat!=='OG')); return n;
  }
  // morning / evening / night — original behavior
  if(r<.45) return HOME_OVERRIDE[a.name]||HOME[a.plat]||HUB;
  if(r<.70) return nearbyNode(a);
  if(r<.77) return HUB;
  let n; do{n=Math.floor(Math.random()*N.length)}while(n===a.node||n===BRIDGE_NODE||(n===1&&a.plat!=='OG')); return n;
}
function pickPairPartner(a,i){
  for(let j=0;j<agents.length;j++){
    if(j===i)continue;
    const b=agents[j];
    if(b.partner>=0)continue;
    if(b.state!==ST.W&&b.state!==ST.P)continue;
    if(Math.hypot(a.x-b.x,a.y-b.y)<180)return j;
  }
  return -1;
}

function setWalk(a){
  const wm=getTimeMode();
  const dur=wm==='work'?45000+Math.random()*35000:wm==='weekend'?22000+Math.random()*28000:12000+Math.random()*18000;
  a.state=ST.W; a.dur=dur; a.timer=0; a.partner=-1;
  a.paceDir=-1; a.pacePhase=0; a.romancePending=false;
}
function setPause(a){
  const wm=getTimeMode();
  const dur=wm==='work'?50000+Math.random()*40000:wm==='weekend'?30000+Math.random()*35000:10000+Math.random()*20000;
  a.state=ST.P; a.dur=dur; a.timer=0;
}
function setGuide(a,t){
  a.tnode=t; a.path=astar(a.node,t); a.pi=1;
  a.state=ST.G; a.timer=0;
  // duration = generous upper bound; arrival triggers transition
  a.dur=60000;
}
function setChat(a,b){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  [a,b].forEach(ag=>{ ag.state=ST.C; ag.timer=0; ag.dur=12000+Math.random()*16000; ag.mx=mx; ag.my=my; });
  a.partner=agents.indexOf(b); b.partner=agents.indexOf(a);
  spawnEmoji('💬', mx, Math.min(a.y,b.y)-22, 0, -0.02, 2400);
}
function setRomance(a,b,mx,my){
  [a,b].forEach((ag,i)=>{
    ag.state=ST.R; ag.timer=0; ag.dur=300000;
    ag.mx=mx+(i===0?-6:6); ag.my=my; ag.partner=agents.indexOf(i===0?b:a);
  });
}

function tick(ts){
  const tmode=getTimeMode();
  agents.forEach((a,i)=>{
    a.timer+=TICK;
    a.inHub = Math.hypot(a.x-N[HUB][0],a.y-N[HUB][1]) < HUB_R;
    const exp = a.timer>=a.dur;

    const hubChance = tmode==='work' ? .04 : tmode==='weekend' ? .06 : .15;
    if(a.inHub && a.state===ST.W && Math.random()<hubChance){
      a.state=ST.H; a.dur=20000+Math.random()*25000; a.timer=0;
    }

    switch(a.state){
      case ST.W:
        if(exp){
          const r=Math.random();
          const moveRate = tmode==='work' ? 0.08 : tmode==='weekend' ? 0.20 : 0.35;
          if(r<moveRate){
            const t=pickTarget(a);
            // no pair-walking during work hours — agents go alone
            if(a.partner<0&&Math.random()<.80&&tmode!=='work'){
              const j=pickPairPartner(a,i);
              if(j>=0){ setGuide(a,t); setGuide(agents[j],t); a.partner=j; agents[j].partner=i; }
              else setGuide(a,t);
            } else setGuide(a,t);
          }
          else if(r<.65) setPause(a);
          else setWalk(a);
        }
        // Chat on proximity — low probability per tick; halved during work hours
        const chatP = tmode==='work' ? (a.inHub?.02:.004) : (a.inHub?.06:.015);
        if(Math.random()<chatP){
          for(let j=0;j<agents.length;j++){
            if(j===i)continue; const b=agents[j];
            if(b.state!==ST.W&&b.state!==ST.P&&b.state!==ST.H)continue;
            if(b.partner>=0)continue;
            if(Math.hypot(a.x-b.x,a.y-b.y)<45){ setChat(a,b); break; }
          }
        }
        break;
      case ST.G:
        // Arrival handled in move(); timeout fallback
        if(exp){ a.node=a.tnode; if(a.partner>=0&&agents[a.partner])agents[a.partner].partner=-1; setWalk(a); }
        break;
      case ST.P:
        if(exp) setWalk(a);
        break;
      case ST.C:
        if(exp){
          spawnEmoji('👋', a.x-10, a.y-20, -0.025, -0.03, 1400);
          const cp=a.partner>=0?agents[a.partner]:null;
          if(cp){ spawnEmoji('👋', cp.x+10, cp.y-20, 0.025, -0.03, 1400); setWalk(cp); }
          setWalk(a);
        }
        break;
      case ST.R:
        if(exp){ setWalk(a); if(a.partner>=0&&agents[a.partner]) setWalk(agents[a.partner]); }
        break;
      case ST.H:
        if(exp||!a.inHub){ Math.random()<.5?setGuide(a,HOME[a.plat]||HUB):setWalk(a); }
        if(Math.random()<.08){
          for(let j=0;j<agents.length;j++){
            if(j===i)continue; const b=agents[j];
            if(b.partner>=0)continue;
            if((b.state===ST.H||b.state===ST.W)&&Math.hypot(a.x-b.x,a.y-b.y)<75){ setChat(a,b); break; }
          }
        }
        break;
    }
  });
  // Romance spawner — disabled during work hours; active at lunch and evening
  const romanceP = tmode==='work' ? 0 : (tmode==='lunch'||tmode==='evening'||tmode==='weekend') ? 0.18 : 0.08;
  if(Math.random() < romanceP){
    const bridge = BRIDGES[Math.floor(Math.random()*BRIDGES.length)];
    const mx = bridge.mx;
    const my = bridge.my;
    // Allow paired walkers and solo walkers — just not agents already romancing or chatting
    const pool = agents.filter(a=>a.state!==ST.R&&a.state!==ST.C&&a.state!==ST.H&&!a.romancePending);
    if(pool.length>=2){
      const ai = Math.floor(Math.random()*pool.length);
      let bi; do{ bi=Math.floor(Math.random()*pool.length); }while(bi===ai);
      const ag=pool[ai], bg=pool[bi];
      // Break up any existing walk partnerships first
      if(ag.partner>=0&&agents[ag.partner]) agents[ag.partner].partner=-1;
      if(bg.partner>=0&&agents[bg.partner]) agents[bg.partner].partner=-1;
      // Route both to bridge via the path graph — they walk there naturally
      ag.partner=agents.indexOf(bg); bg.partner=agents.indexOf(ag);
      ag.romancePending=true; bg.romancePending=true;
      setGuide(ag,BRIDGE_NODE); setGuide(bg,BRIDGE_NODE);
    }
  }
  // ambient floating emojis
  agents.forEach(a=>{
    if((a.state===ST.W||a.state===ST.P)&&Math.random()<0.003)
      spawnEmoji('💡', a.x, a.y-22, (Math.random()-.5)*0.015, -0.025, 2200);
    if(a.inHub&&a.state===ST.H&&Math.random()<0.007)
      spawnEmoji('☕', a.x+(Math.random()-.5)*14, a.y-18, 0, -0.018, 2400);
    if(a.node===6&&(a.state===ST.W||a.state===ST.H)&&Math.random()<0.008)
      spawnEmoji('🎵', a.x+(Math.random()-.5)*18, a.y-18, (Math.random()-.5)*0.025, -0.022, 2600);
    if(a.node===YARD_NODE&&(a.state===ST.W||a.state===ST.H)&&Math.random()<0.006)
      spawnEmoji('🌿', a.x+(Math.random()-.5)*14, a.y-16, (Math.random()-.5)*0.018, -0.022, 2400);
  });
  lastTick=ts;
}

// ── MOVEMENT ─────────────────────────────────────────────────────────────────
// All speeds are px/ms, multiplied by dt so framerate doesn't matter.
// GSPD 0.025 px/ms = ~1.5px/s at 60fps. A 300px path takes ~12 seconds.

function move(a, dt){
  a.phase += dt * .0015;

  switch(a.state){
    case ST.W: case ST.H: {
      const [nx,ny]=N[a.node];
      a.x += (nx+a.dox-a.x)*0.08;
      a.y += (ny+a.doy-a.y)*0.08;
      const j=WDRIFT*dt*0.4;
      a.x += (Math.random()-.5)*j;
      a.y += (Math.random()-.5)*j;
      break;
    }
    case ST.G: {
      if(a.pi < a.path.length){
        const [tx,ty]=N[a.path[a.pi]], dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy);
        if(d < 5){ a.node=a.path[a.pi]; a.pi++; }
        else { a.x += (dx/d)*GSPD*dt; a.y += (dy/d)*GSPD*dt; }
      } else {
        // Arrived
        const arrivedAt = a.tnode;
        a.node = a.tnode;
        // Romance pair arrived at bridge — trigger romance if partner is here or waiting
        if(a.romancePending && arrivedAt===BRIDGE_NODE){
          a.romancePending=false;
          const partner=a.partner>=0?agents[a.partner]:null;
          if(partner && !partner.romancePending && partner.state===ST.P && partner.node===BRIDGE_NODE){
            // Partner arrived first and is waiting at the bridge — both here, start romance
            const[bx,by]=N[BRIDGE_NODE];
            setRomance(a,partner,bx,by);
          } else {
            // First to arrive — pause at bridge and wait up to 12s for partner
            a.state=ST.P; a.dur=12000; a.timer=0;
          }
        } else {
          if(a.partner>=0&&agents[a.partner])agents[a.partner].partner=-1;
          if(arrivedAt===2)  spawnEmoji('🏆', a.x, a.y-28, 0, -0.035, 2600);
          if(arrivedAt===12) spawnEmoji('📰', a.x+(Math.random()-.5)*14, a.y-20, (Math.random()-.5)*0.02, -0.022, 2200);
          if(arrivedAt===5)  spawnEmoji('💊', a.x, a.y-22, 0, -0.025, 2000);
          if(arrivedAt===23) spawnEmoji('🕊️', a.x, a.y-24, (Math.random()-.5)*0.03, -0.03, 2400);
          setWalk(a);
        }
      }
      break;
    }
    case ST.C: {
      const dx=a.mx-a.x, dy=a.my-a.y, d=Math.hypot(dx,dy);
      if(d > 8){ a.x += (dx/d)*GSPD*dt*.4; a.y += (dy/d)*GSPD*dt*.4; }
      else {
        // Standing and talking — tiny sway
        a.x += (Math.random()-.5) * WDRIFT * dt * .5;
        a.y += (Math.random()-.5) * WDRIFT * dt * .5;
      }
      break;
    }
    case ST.P:
      // Paused — almost completely still, breathing-level micro-movement
      a.x += (Math.random()-.5) * WDRIFT * dt * .3;
      a.y += (Math.random()-.5) * WDRIFT * dt * .3;
      break;
    case ST.R: {
      // Walk slowly to the bridge midpoint, then barely sway
      const dx=a.mx-a.x, dy=a.my-a.y, d=Math.hypot(dx,dy);
      if(d > 6){ a.x += (dx/d)*GSPD*dt*.55; a.y += (dy/d)*GSPD*dt*.55; }
      else {
        a.x += (Math.random()-.5)*WDRIFT*dt*.15;
        a.y += (Math.random()-.5)*WDRIFT*dt*.15;
      }
      break;
    }

  a.x = Math.max(18, Math.min(W-18, a.x));
  a.y = Math.max(32, Math.min(H-18, a.y));
  }   // close switch
}     // close move()

// ── DRAW BACKGROUND ──────────────────────────────────────────────────────────
function drawBG(){
  ctx.fillStyle='#080f1c'; ctx.fillRect(0,0,W,H);
  // Topographic waves
  ctx.save(); ctx.strokeStyle='#0d1e33'; ctx.lineWidth=1;
  for(let i=0;i<9;i++){
    const cy=80+i*100;
    ctx.beginPath(); ctx.moveTo(0,cy);
    for(let x=0;x<=W;x+=20) ctx.lineTo(x, cy+Math.sin(x*.013+i*.7)*16+Math.cos(x*.007+i*.4)*9);
    ctx.stroke();
  }
  ctx.restore();
  // Subtle grid
  ctx.save(); ctx.strokeStyle='rgba(12,28,52,0.7)'; ctx.lineWidth=.4;
  for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
}

// ── DRAW PATHS ───────────────────────────────────────────────────────────────
const dashOff = {v:0};
function drawPaths(){
  dashOff.v=(dashOff.v+0.35)%24;
  EDGES.forEach(([a,b])=>{
    const [ax,ay]=N[a],[bx,by]=N[b];
    // outer aura
    ctx.save(); ctx.shadowColor='#005fa0'; ctx.shadowBlur=22;
    ctx.strokeStyle='rgba(0,110,180,0.10)'; ctx.lineWidth=7;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.restore();
    // mid glow
    ctx.save(); ctx.shadowColor='#0090d0'; ctx.shadowBlur=12;
    ctx.strokeStyle='rgba(0,155,220,0.32)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.restore();
    // bright crisp core
    ctx.save(); ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(0,220,255,0.78)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.restore();
    // animated pulse
    ctx.save(); ctx.strokeStyle='rgba(0,255,220,0.30)'; ctx.lineWidth=1.2;
    ctx.setLineDash([5,19]); ctx.lineDashOffset=-dashOff.v;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.restore();
  });
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function drawBuildings(){
  BLDGS.forEach(([bx,by,bw,bh,label,ac,comingSoon])=>{
    ctx.save();
    ctx.shadowColor=ac; ctx.shadowBlur=12;
    ctx.fillStyle='#0b1a2c'; ctx.strokeStyle=ac; ctx.lineWidth=1;
    rr(bx,by,bw,bh,4); ctx.fill(); ctx.stroke();
    ctx.restore();

    const lines=label.split('\n');
    const cx=bx+bw/2;
    ctx.save();
    ctx.textAlign='center'; ctx.font='8px "Courier New",monospace';
    const yBase = comingSoon
      ? by+bh/2-5
      : by+bh/2-(lines.length-1)*5.5;

    lines.forEach((ln,i)=>{
      ctx.fillStyle='#ffffff';
      ctx.fillText(ln, cx, yBase+i*11+(lines.length===1?3:0));
    });
    if(comingSoon){
      ctx.fillStyle='rgba(245,166,35,0.9)';
      ctx.font='bold 7px "Courier New",monospace';
      ctx.fillText('COMING SOON', cx, by+bh/2+8);
    }
    ctx.restore();
  });

  // DeskWorks extra border
  ctx.save();
  ctx.strokeStyle='rgba(255,68,85,0.45)'; ctx.lineWidth=2;
  ctx.setLineDash([3,4]);
  rr(848,578,124,54,6); ctx.stroke();
  ctx.restore();
}

function drawYardGlow(){
  const [yx,yy]=N[YARD_NODE];
  const p=.5+.5*Math.sin(Date.now()*.0012+0.5);
  const g=ctx.createRadialGradient(yx,yy,0,yx,yy,62);
  g.addColorStop(0,`rgba(50,160,80,${.05+p*.04})`);
  g.addColorStop(.6,`rgba(30,120,50,${.02+p*.02})`);
  g.addColorStop(1,'rgba(30,120,50,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(yx,yy,62,0,Math.PI*2); ctx.fill();
}

// ── HUB GLOW ────────────────────────────────────────────────────────────────
function drawHubGlow(){
  const [hx,hy]=N[HUB];
  const p=.5+.5*Math.sin(Date.now()*.0018);
  const g=ctx.createRadialGradient(hx,hy,0,hx,hy,HUB_R);
  g.addColorStop(0,`rgba(255,68,85,${.06+p*.07})`);
  g.addColorStop(.6,`rgba(255,68,85,${.02+p*.02})`);
  g.addColorStop(1,'rgba(255,68,85,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(hx,hy,HUB_R,0,Math.PI*2); ctx.fill();
}

// ── DR. O GLOW — gold pulse, PI's Studio ────────────────────────────────────
function drawDrOGlow(){
  const [hx,hy]=N[DR_O];
  const p=.5+.5*Math.sin(Date.now()*.0014+1.2);
  const g=ctx.createRadialGradient(hx,hy,0,hx,hy,DR_O_R);
  g.addColorStop(0,`rgba(245,200,35,${.10+p*.10})`);
  g.addColorStop(.5,`rgba(245,180,20,${.04+p*.04})`);
  g.addColorStop(1,'rgba(245,180,20,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(hx,hy,DR_O_R,0,Math.PI*2); ctx.fill();
  // crisp gold ring
  ctx.save();
  ctx.strokeStyle=`rgba(245,200,35,${.35+p*.25})`; ctx.lineWidth=1.2;
  ctx.setLineDash([4,5]);
  ctx.beginPath(); ctx.arc(hx,hy,DR_O_R*.65,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

// ── HEART ────────────────────────────────────────────────────────────────────
function drawHeart(cx, cy, r, alpha){
  ctx.save();
  ctx.shadowBlur=0;
  ctx.fillStyle=`rgba(255,110,160,${alpha})`;
  ctx.beginPath();
  ctx.moveTo(cx, cy+r*0.5);
  ctx.bezierCurveTo(cx, cy-r*0.2, cx-r*1.3, cy-r*0.2, cx-r*1.3, cy-r*0.7);
  ctx.bezierCurveTo(cx-r*1.3, cy-r*1.5, cx, cy-r*1.5, cx, cy-r*0.7);
  ctx.bezierCurveTo(cx, cy-r*1.5, cx+r*1.3, cy-r*1.5, cx+r*1.3, cy-r*0.7);
  ctx.bezierCurveTo(cx+r*1.3, cy-r*0.2, cx, cy-r*0.2, cx, cy+r*0.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ── PAIR SIDE-BY-SIDE OFFSET ─────────────────────────────────────────────────
// Returns [ox, oy] perpendicular offset for agents walking in pairs on a path.
function pairOff(a){
  if(a.partner<0||a.state!==ST.G||a.pi>=a.path.length) return [0,0];
  const[tx,ty]=N[a.path[a.pi]], dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy);
  if(d<1) return [0,0];
  const side=agents.indexOf(a)<a.partner?1:-1;
  return [-dy/d*8*side, dx/d*8*side];
}

// ── DRAW AGENTS ──────────────────────────────────────────────────────────────
function drawAgents(){
  // Pair-walk connection lines (drawn under dots, using offset positions)
  agents.forEach((a,i)=>{
    if(a.state===ST.G&&a.partner>=0&&i<a.partner){
      const b=agents[a.partner];
      if(b&&b.state===ST.G){
        const[aox,aoy]=pairOff(a), [box,boy]=pairOff(b);
        ctx.save();
        ctx.strokeStyle='rgba(255,255,255,0.10)';
        ctx.lineWidth=1; ctx.setLineDash([3,7]);
        ctx.beginPath(); ctx.moveTo(a.x+aox,a.y+aoy); ctx.lineTo(b.x+box,b.y+boy); ctx.stroke();
        ctx.restore();
      }
    }
  });
  agents.forEach(a=>{
    const[ox,oy]=pairOff(a);
    const ax=a.x+ox, ay=a.y+oy;
    const p=.5+.5*Math.sin(a.phase);

    ctx.save();
    ctx.shadowBlur=0;
    if(a.mcp){
      ctx.strokeStyle=`rgba(255,255,255,${.5+p*.2})`;
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(ax,ay,DOT_R+2.5,0,Math.PI*2); ctx.stroke();
    }
    ctx.fillStyle=a.color;
    ctx.beginPath(); ctx.arc(ax,ay,DOT_R,0,Math.PI*2); ctx.fill();
    if(a.state===ST.C||a.state===ST.H){
      ctx.strokeStyle=`rgba(255,255,255,${.2+p*.28})`;
      ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.arc(ax,ay,DOT_R+(a.state===ST.C?4:3)+p*2,0,Math.PI*2); ctx.stroke();
    }
    if(a.state===ST.R){
      ctx.strokeStyle=`rgba(255,130,170,${.3+p*.3})`;
      ctx.lineWidth=0.9;
      ctx.beginPath(); ctx.arc(ax,ay,DOT_R+3+p*2,0,Math.PI*2); ctx.stroke();
      const b=agents[a.partner];
      if(b&&b.state===ST.R&&agents.indexOf(a)<a.partner){
        ctx.save();
        ctx.strokeStyle=`rgba(255,120,160,${0.25+p*0.2})`;
        ctx.lineWidth=1; ctx.setLineDash([3,6]);
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(b.x,b.y); ctx.stroke();
        ctx.restore();
        const hx=(ax+b.x)/2, hy=(ay+b.y)/2-18-p*6;
        ctx.save();
        ctx.shadowColor='rgba(255,80,140,0.9)'; ctx.shadowBlur=18;
        drawHeart(hx, hy, 7+p*4, 0.8+p*0.2);
        ctx.restore();
        ctx.save();
        ctx.fillStyle=`rgba(255,140,180,${0.55+p*0.3})`;
        ctx.font='bold 7px "Courier New",monospace';
        ctx.textAlign='center';
        ctx.fillText('♥ ON THE BRIDGE', hx, hy+22);
        ctx.restore();
      }
    }
    if(a.plat==='DR'){
      ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1;
      ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.arc(ax,ay,DOT_R+5,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font='bold 9px "Courier New",monospace';
      ctx.textAlign='center';
      ctx.fillStyle='#c0c0c0';
      ctx.fillText('ETL', ax, ay-DOT_R-8);
    }
    ctx.restore();
  });
}

// ── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD(){
  const active=agents.filter(a=>a.state!==ST.P).length;
  const chatting=Math.floor(agents.filter(a=>a.state===ST.C).length/2);
  const atHub=agents.filter(a=>a.inHub).length;
  const enRoute=agents.filter(a=>a.state===ST.G).length;
  const pairs=Math.floor(agents.filter(a=>a.partner>=0&&a.state===ST.G).length/2);

  // Top bar — 38px tall
  ctx.save();
  ctx.fillStyle='rgba(4,10,20,0.92)'; ctx.fillRect(0,0,W,38);
  ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,38); ctx.lineTo(W,38); ctx.stroke();
  ctx.fillStyle='#00c8ff'; ctx.font='bold 15px "Courier New",monospace';
  ctx.textAlign='left'; ctx.fillText('ETL NEIGHBORHOOD  ◆  LIVE CAMPUS', 16, 24);
  ctx.fillStyle='#4080a0'; ctx.textAlign='right'; ctx.font='13px "Courier New",monospace';
  ctx.fillText(`AGENTS ${agents.length}  ·  ACTIVE ${active}  ·  CHATTING ${chatting}  ·  AT DESKWORKS ${atHub}`, W-16, 24);
  ctx.restore();

  // ── DATA panel (top-right) ────────────────────────────────────────────────
  {
    const pw=175, px=W-pw-16, py=44, ph=148, rowH=15;
    ctx.save();
    ctx.fillStyle='rgba(4,10,20,0.88)'; ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1;
    rr(px,py,pw,ph,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#00c8ff'; ctx.font='bold 12px "Courier New",monospace'; ctx.textAlign='left';
    ctx.fillText('DATA', px+10, py+17);
    ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=.5;
    ctx.beginPath(); ctx.moveTo(px+10,py+22); ctx.lineTo(px+pw-10,py+22); ctx.stroke();
    const rows=[['AGENTS',agents.length],['BACKPACKS','85  (68%)'],['ACTIVE',active],['EN ROUTE',enRoute],['CHATTING',chatting],['AT HUB',atHub],['PAIRS',pairs]];
    ctx.font='11px "Courier New",monospace';
    rows.forEach(([lbl,val],i)=>{
      ctx.fillStyle='#4080a0'; ctx.textAlign='left';  ctx.fillText(lbl, px+10, py+36+i*rowH);
      ctx.fillStyle='#00c8ff'; ctx.textAlign='right'; ctx.fillText(val, px+pw-10, py+36+i*rowH);
    });
    ctx.restore();
  }

  // ── Compass ───────────────────────────────────────────────────────────────
  const cx=52, cy=82;
  ctx.save();
  ctx.fillStyle='rgba(5,14,28,.88)'; ctx.beginPath(); ctx.arc(cx,cy,34,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,34,0,Math.PI*2); ctx.stroke();
  [['N',0,-20,'#00d4ff'],['S',0,25,'#2a4060'],['W',-23,4,'#2a4060'],['E',21,4,'#2a4060']].forEach(([l,dx,dy,c])=>{
    ctx.fillStyle=c; ctx.font='bold 13px "Courier New",monospace'; ctx.textAlign='center'; ctx.fillText(l,cx+dx,cy+dy);
  });
  ctx.strokeStyle='#00d4ff'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx,cy-15); ctx.lineTo(cx,cy+15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-15,cy); ctx.lineTo(cx+15,cy); ctx.stroke();
  ctx.restore();

  // ── SYSTEM panel (below compass) ─────────────────────────────────────────
  {
    const pw=160, px=14, py=128, ph=100, rowH=15;
    ctx.save();
    ctx.fillStyle='rgba(4,10,20,0.88)'; ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1;
    rr(px,py,pw,ph,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#00c8ff'; ctx.font='bold 12px "Courier New",monospace'; ctx.textAlign='left';
    ctx.fillText('SYSTEM', px+10, py+17);
    ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=.5;
    ctx.beginPath(); ctx.moveTo(px+10,py+22); ctx.lineTo(px+pw-10,py+22); ctx.stroke();
    const rows=[['NODES',N.length],['LINKS',EDGES.length],['PLATFORMS',Object.keys(PC).length],['AGENTS',agents.length],['STATUS','ONLINE']];
    ctx.font='11px "Courier New",monospace';
    rows.forEach(([lbl,val],i)=>{
      ctx.fillStyle='#4080a0'; ctx.textAlign='left';  ctx.fillText(lbl, px+10, py+36+i*rowH);
      ctx.fillStyle=i===4?'#22d47a':'#6090b0'; ctx.textAlign='right'; ctx.fillText(val, px+pw-10, py+36+i*rowH);
    });
    ctx.restore();
  }

  // ── HARVEST CIRCUIT panel (right side, below DATA) ─────────────────────────
  {
    const pw=175, px=W-pw-16, py=200, ph=145, rowH=15;
    const mode=getTimeMode();
    const inService=mode==='lunch'||mode==='evening';
    const hcStaff=agents.filter(a=>a.plat==='HC').length;
    ctx.save();
    ctx.fillStyle='rgba(18,8,2,0.92)'; ctx.strokeStyle='#7a4520'; ctx.lineWidth=1;
    ctx.shadowColor='rgba(232,152,74,0.25)'; ctx.shadowBlur=6;
    rr(px,py,pw,ph,4); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#e8984a'; ctx.font='bold 11px "Courier New",monospace'; ctx.textAlign='left';
    ctx.fillText('HARVEST CIRCUIT', px+10, py+17);
    ctx.strokeStyle='#5a3010'; ctx.lineWidth=.5;
    ctx.beginPath(); ctx.moveTo(px+10,py+22); ctx.lineTo(px+pw-10,py+22); ctx.stroke();
    const sRows=[
      ['STATUS', inService?'IN SERVICE':'CLOSED'],
      ['STAFF',  hcStaff],
      ['GUESTS', 0],
    ];
    ctx.font='11px "Courier New",monospace';
    sRows.forEach(([lbl,val],i)=>{
      ctx.fillStyle='#7a5030'; ctx.textAlign='left';  ctx.fillText(lbl, px+10, py+36+i*rowH);
      ctx.fillStyle=i===0&&inService?'#e8984a':'#c07840';
      ctx.textAlign='right'; ctx.fillText(val, px+pw-10, py+36+i*rowH);
    });
    ctx.strokeStyle='#5a3010'; ctx.lineWidth=.5;
    ctx.beginPath(); ctx.moveTo(px+10,py+82); ctx.lineTo(px+pw-10,py+82); ctx.stroke();
    const hrRows=[['LUNCH','12PM – 1PM'],['DINNER','5PM – 9PM']];
    hrRows.forEach(([lbl,val],i)=>{
      ctx.fillStyle='#5a3010'; ctx.textAlign='left';  ctx.fillText(lbl, px+10, py+97+i*rowH);
      ctx.fillStyle='#906040'; ctx.textAlign='right'; ctx.fillText(val, px+pw-10, py+97+i*rowH);
    });
    if(inService){
      ctx.fillStyle='rgba(232,152,74,0.75)'; ctx.textAlign='center'; ctx.font='bold 8px "Courier New",monospace';
      ctx.fillText('◆ '+(mode==='evening'?'DINNER':'LUNCH')+' SERVICE ACTIVE', px+pw/2, py+137);
    }
    ctx.restore();
  }

  // Hub marker
  const [hx,hy]=N[HUB];
  ctx.save();
  ctx.fillStyle='rgba(255,68,85,0.85)'; ctx.font='bold 12px "Courier New",monospace'; ctx.textAlign='center';
  ctx.fillText('◆ HUB', hx, hy-24);
  ctx.restore();

  // Courtyard marker
  const [yx2,yy2]=N[YARD_NODE];
  const yp=.5+.5*Math.sin(Date.now()*.0012+0.5);
  ctx.save();
  ctx.fillStyle=`rgba(60,180,80,${.55+yp*.25})`; ctx.font='bold 11px "Courier New",monospace'; ctx.textAlign='center';
  ctx.shadowColor='rgba(50,160,80,0.5)'; ctx.shadowBlur=6;
  ctx.fillText('◆ YARD', yx2, yy2-22);
  ctx.restore();

  // Dr. O Studio marker
  const [dx,dy]=N[DR_O];
  const dp=.5+.5*Math.sin(Date.now()*.0014+1.2);
  ctx.save();
  ctx.fillStyle=`rgba(245,200,35,${.7+dp*.3})`; ctx.font='bold 12px "Courier New",monospace'; ctx.textAlign='center';
  ctx.shadowColor='rgba(245,200,35,0.7)'; ctx.shadowBlur=8;
  ctx.fillText('◆ DR. O', dx, dy-28);
  ctx.restore();

  // Border
  ctx.save(); ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=2; ctx.strokeRect(1,1,W-2,H-2); ctx.restore();
}

// ── TOOLTIP ──────────────────────────────────────────────────────────────────
const tip=document.getElementById('tooltip');
const stMap={walk:'Working',guide:'En route',pause:'Paused',chat:'Chatting',hub:'At DeskWorks'};

canvasFG.style.pointerEvents='auto';
canvasFG.addEventListener('mousemove',e=>{
  const r=canvasFG.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
  let found=null;
  for(const a of agents){ if(Math.hypot(a.x-mx,a.y-my)<DOT_R+7){found=a;break;} }
  if(found){
    document.getElementById('tt-name').textContent=found.name;
    document.getElementById('tt-sub').textContent=PL[found.plat]+(found.mcp?' · Backpack Agent':'');
    document.getElementById('tt-state').textContent='◉ '+(stMap[found.state]||found.state);
    tip.style.display='block';
    tip.style.left=(e.clientX-r.left+16)+'px';
    tip.style.top=(e.clientY-r.top-8)+'px';
  } else tip.style.display='none';
});
canvasFG.addEventListener('mouseleave',()=>tip.style.display='none');

// ── LOOP ─────────────────────────────────────────────────────────────────────
let last=0;
function loop(ts){
  const dt=Math.min(ts-last,50); last=ts;
  if(!MIRROR_MODE){ if(ts-lastTick>TICK){ tick(ts); writeState(); } agents.forEach(a=>move(a,dt)); }
  ctx = ctxBG;
  drawBG(); drawHubGlow(); drawDrOGlow(); drawYardGlow(); drawPaths(); drawBridges();

  ctx = ctxFG;
  ctxFG.clearRect(0,0,W,H);
  drawAgents(); drawHUD(); drawEmojiEvents();

  // update stats bar below map
  const _active=agents.filter(a=>a.state!==ST.P).length;
  const _chat=agents.filter(a=>a.state===ST.C).length;
  const _hub=agents.filter(a=>a.inHub).length;
  const _route=agents.filter(a=>a.state===ST.G).length;
  const _pairs=Math.floor(agents.filter(a=>a.partner>=0&&a.state===ST.G).length/2);
  document.getElementById('s-total').textContent=agents.length;
  document.getElementById('s-active').textContent=_active;
  document.getElementById('s-enroute').textContent=_route;
  document.getElementById('s-chatting').textContent=_chat;
  document.getElementById('s-hub').textContent=_hub;
  document.getElementById('s-pairs').textContent=_pairs;
  const _hcMode=getTimeMode();
  document.getElementById('s-hc-status').textContent=(_hcMode==='lunch'||_hcMode==='evening')?'OPEN':'--';
  document.getElementById('s-hc-staff').textContent=agents.filter(a=>a.plat==='HC').length;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if(MIRROR_MODE) startMirrorPoll();

// ── LEGEND MODAL — populate from PC/PL ───────────────────────────────────────
(function(){
  const rows = document.getElementById('lm-rows');
  Object.keys(PL).forEach(k=>{
    const div = document.createElement('div');
    div.className = 'lm-row';
    div.innerHTML = `<span class="lm-dot" style="background:${PC[k]}"></span><span>${PL[k]}</span>`;
    rows.appendChild(div);
  });
  document.addEventListener('click', e=>{
    const modal = document.getElementById('legend-modal');
    const btn   = document.getElementById('legend-btn');
    if(!modal.contains(e.target) && e.target !== btn) modal.classList.remove('open');
  });
})();
</script>
