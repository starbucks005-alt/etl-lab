[[headers]]
  for = "/app.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Agent portraits and other campus assets get overwritten in place at the
# same filename/URL whenever Dr. O swaps a portrait, so a long-lived cache
# meant every update needed a hard refresh to actually show up. max-age=0,
# must-revalidate (headers confirmed correct via curl, ETag present) should
# have forced a conditional check on every load, but a plain reload still
# wasn't reliably showing new images. no-store removes the ambiguity
# entirely: no caching at all, no revalidation logic to get wrong, every
# request is a fresh fetch. These are small images on a low-traffic site,
# the bandwidth cost is negligible against actually seeing your own edits.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/agents/*"
  [headers.values]
    Cache-Control = "no-store"

# The pages themselves, not just their images, were also being served
# stale: no-store on /assets/* and /agents/* alone didn't stop hard-refresh
# being needed, because the HTML document was the thing cached. Same
# no-store treatment for every actively-iterated Classrooms page.

# Everly Castle, added 2026-08-09 for exactly the reason above and then
# demonstrated the hard way. During a live beta the backend was updated many
# times while the tester's browser held an old copy of the page, and the two
# then disagreed about what a reply MEANT: the new backend sends picture
# names, the old page printed whatever it was handed, so a four-year-old's
# screen showed the words "owl" and "sprout" where an owl and a sprout should
# have been. Every server-side fix landed and not one of them could be seen.
# A stale page here is not a cosmetic lag, it is a different product talking
# to the same API.
[[headers]]
  for = "/everly-castle.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/everly-castle-wing.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/classrooms.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/kronborg.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/kronborg-agent.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/kronborg-room.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/bespoke-quote.html"
  [headers.values]
    Cache-Control = "no-store"

# Social post engine. Voice profiles (voice corpus, required hashtags,
# site presets, closers) live in data/voice-profiles/ so the engine itself
# carries no owner. Bundle them or every caller silently falls back to the
# generic voice, which is the failure that looks like nothing is wrong.
[functions."studio-social-generate"]
  included_files = ["data/voice-profiles/*.json"]

# ETL Design relay. The fonts MUST be bundled: Netlify's Lambda image has none,
# and librsvg draws every glyph as a box without them. The renderer points
# FONTCONFIG_PATH at this directory before sharp loads.
[functions."etl-design-background"]
  included_files = ["netlify/functions/fonts/**"]

# Starting a Veo render is a sub-second call and polling is quick, but the poll
# that finds the job finished also downloads the mp4 and writes it to Blobs.
[functions."gc-scene"]
  timeout = 60

# Takes a portrait (about a megabyte of base64) and writes it to Blobs. No
# model call, so this is quick, but the upload itself wants room.
[functions."gc-scene-order"]
  timeout = 30

# Two Stripe round trips, one to create a session and one to read it back.
[functions."gc-scene-checkout"]
  timeout = 30

# Two Stripe round trips (read the session, then refund the payment intent).
[functions."gc-scene-refund"]
  timeout = 30

# Five image generations in sequence, most of them refused instantly.
[functions."gemini-aspect-probe"]
  timeout = 120
