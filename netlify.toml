[build]
  functions = "netlify/functions"

[functions]
  external_node_modules = ["@supabase/supabase-js", "@netlify/blobs"]

[functions."proxy-ai"]
  timeout = 60

[functions."carol-channel"]
  timeout = 26

[functions."carol-channel-audio"]
  timeout = 26

# Scheduled functions. The exports.config.schedule syntax inside the function
# files does not always register; declaring the schedule here is the reliable
# pattern. Cron in UTC.
[functions."newswire-daily-news-cron"]
  schedule = "0 9 * * *"

[functions."newswire-briefing-cron"]
  schedule = "0 10 * * *"

# Weekly regen of Watercooler kickoff topics per staff member. Mondays
# at 11:00 UTC (~6am ET in standard time, ~7am ET during DST). Reads
# data/etl-agents-roster.json + writes to the `watercooler` blob store.
# included_files bundles the roster JSON with the function so fs.readFileSync
# can find it in the Netlify runtime (default function bundling doesn't ship
# the data/ dir; without this we get roster_not_found).
[functions."studio-topic-generator"]
  schedule = "0 11 * * 1"
  included_files = ["data/etl-agents-roster.json"]

# studio-floor-render also reads the roster JSON to build the cast personas.
# Same bundling fix so the locked-directive injection (lead + topic + cast)
# can find the per-week topic pools.
[functions."studio-floor-render"]
  included_files = ["data/etl-agents-roster.json", "data/team_dynamics.json"]

# Auggie's Routines tick. Every 15 minutes the cron sweeps the
# auggie_routines blob, finds every routine whose next_fire <= now,
# and dispatches each one to its whitelisted endpoint. The whitelist
# lives in data/auggie-routine-targets.json (~12 known MCP actions
# for v1). Phase 2 opens arbitrary intent.
[functions."studio-routine-tick"]
  schedule = "*/15 * * * *"
  included_files = ["data/auggie-routine-targets.json"]

# studio-routine-create and studio-routine-list also read the whitelist.
[functions."studio-routine-create"]
  included_files = ["data/auggie-routine-targets.json"]
[functions."studio-routine-list"]
  included_files = ["data/auggie-routine-targets.json"]

# Bradley Cooper-Smith's CFO backpack — reference template for the 29 C Suite
# seats. Reads CCW's full backpack config from data/csuite-backpacks.json.
[functions."csuite-bradley-background"]
  included_files = ["data/csuite-backpacks.json"]

# Benjamin Reed's CISO backpack. InfraGard authority + AI vendor-risk watch.
[functions."csuite-benjamin-background"]
  included_files = ["data/csuite-backpacks.json"]

# Fiona Gallagher's GC/CCO backpack. Regulatory posture + risk exposure.
# NOTE: Research-grade, not legal advice. UI surfaces this prominently.
[functions."csuite-fiona-background"]
  included_files = ["data/csuite-backpacks.json"]

# Alistair Montgomery's CSO backpack. Market direction + competitive intel.
[functions."csuite-alistair-background"]
  included_files = ["data/csuite-backpacks.json"]

# Reid Callum's marketing backpack. Campaign / messaging / positioning /
# competitor intel, lane-separated from Jax (SEO). Loads CCW's config so
# fs.readFileSync finds it in the Netlify runtime. LIVE tool: web_search;
# GDELT/Reddit/Meta/Trends/fetch/data-analysis phase in as APIs+tokens connect.
[functions."studio-reid-background"]
  included_files = ["data/reid-backpack-config.json"]

# Delia Marsh's Development & Sponsorships backpack. Loads CCW's spec (with
# the InfraGard/INMA/DSAC domain knowledge). LIVE custom tools: ProPublica
# Nonprofits + USAspending (both free, no key). SEC EDGAR/SAM.gov/fetch/
# data-analysis pending.
[functions."specialist-delia-background"]
  included_files = ["data/delia-backpack-config.json"]

# Reid's tailored-slick generator. Bundles CCW's slick template so the
# generator can fill it server-side in the Netlify runtime.
[functions."studio-reid-slick-background"]
  included_files = ["data/founder-studio-slick-template.html"]

# Chris's tailor shop: outfit variants of agent portraits via gpt-image-1
# images/edits (reference-anchored so the face holds). Bundles the curated
# outfit catalog AND the full roster (?agent= path reads the persona and
# Chris writes the closet themself).
[functions."studio-chris-wardrobe-background"]
  included_files = ["data/pa-wardrobe.json", "roster.json"]

# Per-user Studio config lookup. Reads the generic provisioning map
# (data/provisioned-clients.json: email -> fixture) plus the bespoke client
# fixtures (Caroline donated, Vikram paid) when a provisioned user signs in.
# Self-serve buyers come from their per-user blob, not these files.
[functions."studio-config-get"]
  included_files = [
    "data/provisioned-clients.json",
    "data/caroline-inma-company.json",
    "data/vikram-sethi-company.json",
    "data/pa_pool.json"
  ]

# ─── Reid slick viewer ────────────────────────────────────────────────────
# Pretty URL for a generated tailored slick. Owner shares /slick/<slug>;
# the page is public (no auth) and prints to PDF.
[[redirects]]
  from = "/slick/*"
  to = "/.netlify/functions/studio-slick-view?slug=:splat"
  status = 200

# ─── Press Hub redirects ──────────────────────────────────────────────────
# Pretty URLs over the Netlify Functions that render the press hub.
# Order matters within this file: more specific rules first. The sitemap
# rule and the per-slug rule both come before /press itself.
[[redirects]]
  from = "/press-sitemap.xml"
  to = "/.netlify/functions/press-sitemap"
  status = 200

[[redirects]]
  from = "/press-image/:slug"
  to = "/.netlify/functions/press-image?slug=:slug"
  status = 200

[[redirects]]
  from = "/press/careers"
  to = "/press-careers.html"
  status = 200

[[redirects]]
  from = "/press/above-the-fold/embed"
  to = "/press-above-the-fold-embed.html"
  status = 200

[[redirects]]
  from = "/press/deskline"
  to = "/press-deskline.html"
  status = 200

[[redirects]]
  from = "/deskline-puzzle"
  to = "/.netlify/functions/deskline-puzzle"
  status = 200

[[redirects]]
  from = "/deskline-submit"
  to = "/.netlify/functions/deskline-submit"
  status = 200

[[redirects]]
  from = "/press/above-the-fold.xml"
  to = "/.netlify/functions/newswire-podcast-rss"
  status = 200

[[redirects]]
  from = "/press/reporter/:slug"
  to = "/.netlify/functions/newswire-reporter?slug=:slug"
  status = 200

# /press exact-match goes to the wire index. This MUST come BEFORE the
# splat catch-all below, or the splat eats /press itself and routes the
# wire to press-piece with an empty slug.
[[redirects]]
  from = "/press"
  to = "/.netlify/functions/press-index"
  status = 200

# Catch-all for individual pieces. Splat (*) is more reliable than :slug
# placeholder when the slug needs to be interpolated into a query string.
# Comes AFTER /press and AFTER every more-specific /press/X rule above,
# so those win first.
[[redirects]]
  from = "/press/*"
  to = "/.netlify/functions/press-piece?slug=:splat"
  status = 200

[[redirects]]
  from = "/press-admin"
  to = "/.netlify/functions/press-admin"
  status = 200

[[redirects]]
  from = "/press-admin/submissions"
  to = "/.netlify/functions/press-submissions"
  status = 200

[[redirects]]
  from = "/press.rss"
  to = "/.netlify/functions/press-rss"
  status = 200

[[redirects]]
  from = "/press-about"
  to = "/.netlify/functions/press-about"
  status = 200

[[redirects]]
  from = "/newswire-latest"
  to = "/.netlify/functions/newswire-latest"
  status = 200

[[redirects]]
  from = "/newswire-briefing-latest"
  to = "/.netlify/functions/newswire-briefing-latest"
  status = 200

[[redirects]]
  from = "/newswire-briefing-audio"
  to = "/.netlify/functions/newswire-briefing-audio"
  status = 200

[[redirects]]
  from = "/prep-room"
  to = "/prep-room.html"
  status = 200

[[redirects]]
  from = "/office-hours"
  to = "/office-hours.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/carols-office"
  to = "/carols-office.html"
  status = 200

[[headers]]
  for = "/app.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
