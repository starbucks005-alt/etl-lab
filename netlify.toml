[build]
  functions = "netlify/functions"

  # Rebuild what is derived from roster.json, on every deploy.
  #
  # roster.json is the cast. data/agents.generated.json is an index built from
  # it and read by index, investors and the neighbourhood map. Keeping the two
  # in step by hand is what failed for months: the copy carried "do not
  # hand-edit" and pointed at a spreadsheet that had stopped being updated, so
  # every attempt to reconcile it by hand was editing a build output and could
  # not hold. Now the deploy rebuilds it and the question does not arise.
  #
  # It does NOT touch data/etl-agents-roster.json. That file looks like a copy
  # and is not: it carries consent records and six people who exist nowhere
  # else, Dr. O among them. See CAST.md.
  #
  # WHEN THIS FAILS THE DEPLOY, and it can: only on a fault in roster.json that
  # no script can fix. A portrait that 404s, two characters wearing one face, a
  # duplicate name, mis-encoded text. Those are the faults that have shipped
  # unnoticed here before, because nothing about them looks broken on the page.
  # A stale index does NOT fail the build, because it was just rebuilt.
  #
  # No publish directory is set here on purpose: that is configured in the
  # Netlify UI and adding it here would silently override it.
  command = "node tools/cast-sync.js --write"

[functions]
  # sharp is a NATIVE module (libvips). esbuild cannot bundle it, so it must
  # be external or every function that requires it throws at module load. It
  # also has to be a real dependency in package.json, or Netlify never installs
  # it at all: that is what killed the first ETL Design render, silently, before
  # the relay wrote a single line of state (2026-07-30).
  external_node_modules = ["@supabase/supabase-js", "@netlify/blobs", "sharp"]

[functions."proxy-ai"]
  timeout = 60

# GOOD COMPANY. A friend answering is a full Sonnet turn with a long system
# prompt behind it, and the default ten seconds is not enough: it surfaced in
# the room as "Could not reach Arch. Failed to fetch", intermittently, on the
# longer replies. gc-room-say is worse, because it calls gc-chat and waits on it.
[functions."gc-chat"]
  timeout = 60

[functions."gc-room-say"]
  timeout = 60

[functions."gc-voice"]
  timeout = 30

# One face per invocation, deliberately: the browser fires four of these at
# once rather than asking one function to await four image generations, which
# would sit on the platform's real synchronous ceiling described further down.
[functions."gc-face"]
  timeout = 60

[functions."carol-channel"]
  timeout = 60

[functions."carol-channel-audio"]
  timeout = 60

# The Kronborg Table's per-beat cascade (director pick -> visitor-memory
# fetch -> agent turn, possibly with a tool call -> visitor-memory save,
# each awaited in sequence, up to CASCADE_CAP beats) measured at 15-20s for a
# single reply on the live site, which kept exceeding this platform's real
# ceiling for synchronous functions no matter what timeout was declared here,
# causing the "table lost connection" error visitors were hitting. Fixed by
# splitting into kronborg-room.js (thin dispatcher, no longer needs an
# extended timeout) + kronborg-room-background.js (does the actual cascade,
# gets its execution budget from the "-background" filename suffix, no
# netlify.toml entry needed, same as agent-background/heidi-background above).

# Scheduled functions. The exports.config.schedule syntax inside the function
# files does not always register; declaring the schedule here is the reliable
# pattern. Cron in UTC.
[functions."newswire-daily-news-cron"]
  schedule = "0 9 * * *"

[functions."newswire-briefing-cron"]
  schedule = "0 10 * * *"

# Weekly regen of Watercooler kickoff topics per staff member. Mondays
# at 11:00 UTC (~6am ET in standard time, ~7am ET during DST). Reads
# data/etl-agents-roster.json + writes to the `watercooler` blob store.
# included_files bundles the roster JSON with the function so fs.readFileSync
# can find it in the Netlify runtime (default function bundling doesn't ship
# the data/ dir; without this we get roster_not_found).
[functions."studio-topic-generator"]
  schedule = "0 11 * * 1"
  included_files = ["data/etl-agents-roster.json"]

# studio-floor-render also reads the roster JSON to build the cast personas.
# Same bundling fix so the locked-directive injection (lead + topic + cast)
# can find the per-week topic pools.
[functions."studio-floor-render"]
  included_files = ["data/etl-agents-roster.json", "data/team_dynamics.json"]

# Auggie's Routines tick. Every 15 minutes the cron sweeps the
# auggie_routines blob, finds every routine whose next_fire <= now,
# and dispatches each one to its whitelisted endpoint. The whitelist
# lives in data/auggie-routine-targets.json (~12 known MCP actions
# for v1). Phase 2 opens arbitrary intent.
[functions."studio-routine-tick"]
  schedule = "*/15 * * * *"
  included_files = ["data/auggie-routine-targets.json"]

# Agency floor live banter. Fires every 1 minute, generates 3 short
# messages per fire in parallel (agents pre-picked in JS, plain-text
# output). broadcast.html polls etl-banter-feed every 10 s.
# Dr. O checks in ~1 in 15 fires. Haiku runs in ~2s; timeout = 26 is headroom.
[functions."etl-banter-cron"]
  schedule = "*/1 * * * *"
  included_files = ["data/dr-o-notes.json"]
  timeout = 60

# studio-routine-create and studio-routine-list also read the whitelist.
[functions."studio-routine-create"]
  included_files = ["data/auggie-routine-targets.json"]
[functions."studio-routine-list"]
  included_files = ["data/auggie-routine-targets.json"]

# Bradley Cooper-Smith's CFO backpack — reference template for the 29 C Suite
# seats. Reads CCW's full backpack config from data/csuite-backpacks.json.
[functions."csuite-bradley-background"]
  included_files = ["data/csuite-backpacks.json"]

# Benjamin Reed's CISO backpack. InfraGard authority + AI vendor-risk watch.
[functions."csuite-benjamin-background"]
  included_files = ["data/csuite-backpacks.json"]

# Fiona Gallagher's GC/CCO backpack. Regulatory posture + risk exposure.
# NOTE: Research-grade, not legal advice. UI surfaces this prominently.
[functions."csuite-fiona-background"]
  included_files = ["data/csuite-backpacks.json"]

# Alistair Montgomery's CSO backpack. Market direction + competitive intel.
[functions."csuite-alistair-background"]
  included_files = ["data/csuite-backpacks.json"]

# Reid Callum's marketing backpack. Campaign / messaging / positioning /
# competitor intel, lane-separated from Jax (SEO). Loads CCW's config so
# fs.readFileSync finds it in the Netlify runtime. LIVE tool: web_search;
# GDELT/Reddit/Meta/Trends/fetch/data-analysis phase in as APIs+tokens connect.
[functions."studio-reid-background"]
  included_files = ["data/reid-backpack-config.json"]

# Delia Marsh's Development & Sponsorships backpack. Loads CCW's spec (with
# the InfraGard/INMA/DSAC domain knowledge). LIVE custom tools: ProPublica
# Nonprofits + USAspending (both free, no key). SEC EDGAR/SAM.gov/fetch/
# data-analysis pending.
[functions."specialist-delia-background"]
  included_files = ["data/delia-backpack-config.json"]

# Reid's tailored-slick generator. Bundles CCW's slick template so the
# generator can fill it server-side in the Netlify runtime.
[functions."studio-reid-slick-background"]
  included_files = ["data/founder-studio-slick-template.html"]

# Yuki Mendel's brand direction generator. Fetches owner's site + runs
# Yuki's Anthropic analysis. No data files needed; brief + URL from request.
[functions."studio-yuki-background"]

# Generic staff dispatch stack. Bundles the staff registry so the background
# function can load personas in the Netlify runtime without a network fetch.
[functions."studio-staff-background"]
  included_files = ["data/studio-staff-registry.json"]

# studio-auggie-chat also needs the registry for inline dispatch detection.
[functions."studio-auggie-chat"]
  included_files = ["data/studio-staff-registry.json"]

# Auggie's daily morning brief. Fires at 11:00 UTC (7am ET DST / 6am ET EST).
# Triggers studio-auggie-brief-background which gathers web findings, reads
# the stored calendar ICS, generates Auggie's monologue, and renders audio.
[functions."studio-auggie-brief-cron"]
  schedule = "0 11 * * *"

# Chris's tailor shop: outfit variants of agent portraits via gpt-image-1
# images/edits (reference-anchored so the face holds). Bundles the curated
# outfit catalog AND the full roster (?agent= path reads the persona and
# Chris writes the closet themself).
[functions."studio-chris-wardrobe-background"]
  included_files = ["data/pa-wardrobe.json", "roster.json"]

# Generic agent runner (the "Take Your Agent Anywhere" export system).
# Bundles roster.json so _agent-registry.js can build the persona in the
# Netlify runtime without a network fetch.
[functions."agent-background"]
  included_files = ["roster.json"]

# Per-user Studio config lookup. Reads the generic provisioning map
# (data/provisioned-clients.json: email -> fixture) plus the bespoke client
# fixtures (Caroline donated, Vikram paid) when a provisioned user signs in.
# Self-serve buyers come from their per-user blob, not these files.
[functions."studio-config-get"]
  included_files = [
    "data/provisioned-clients.json",
    "data/terry-oroszi-company.json",
    "data/caroline-inma-company.json",
    "data/vikram-sethi-company.json",
    "data/pa_pool.json"
  ]

# studio-list (the /studios landlord directory) enumerates every studio from
# the same provisioning map + fixtures studio-config-get reads. Default function
# bundling does not ship the data/ dir, so without this the directory only sees
# self-serve buyers (from the blob store) and drops the fixture studios (Dr. O,
# Caroline). Same files as studio-config-get, minus pa_pool (not read here).
[functions."studio-list"]
  included_files = [
    "data/provisioned-clients.json",
    "data/terry-oroszi-company.json",
    "data/caroline-inma-company.json",
    "data/vikram-sethi-company.json"
  ]

# ─── Reid slick viewer ────────────────────────────────────────────────────
# Pretty URL for a generated tailored slick. Owner shares /slick/<slug>;
# the page is public (no auth) and prints to PDF.
[[redirects]]
  from = "/slick/*"
  to = "/.netlify/functions/studio-slick-view?slug=:splat"
  status = 200

# ─── Press Hub redirects ──────────────────────────────────────────────────
