<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig for the ETL Design renderer.

     Netlify's Lambda image ships with NO font files. librsvg renders text
     through pango/fontconfig, so with nothing installed every glyph came out
     as a missing-glyph box: the piece rendered, the artwork was correct, and
     not one letter was readable (2026-07-30).

     These four faces travel with the function. FONTCONFIG_PATH is pointed at
     this directory by _design-render.js before sharp is loaded.

     Inter and Source Serif Pro are both SIL Open Font License 1.1, which
     permits bundling and redistribution. -->
<fontconfig>
  <dir>/var/task/netlify/functions/fonts</dir>
  <dir>/var/task/fonts</dir>
  <dir prefix="cwd">netlify/functions/fonts</dir>
  <dir prefix="cwd">fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>

  <!-- Generic families must resolve, since every font-family in a generated
       SVG is rewritten to end in one of these. -->
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Source Serif Pro</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Georgia</family><prefer><family>Source Serif Pro</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Source Serif Pro</family></prefer></alias>
</fontconfig>
