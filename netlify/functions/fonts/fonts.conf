<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig for the ETL Design renderer.

     Netlify's Lambda image ships with NO font files. librsvg renders text
     through pango/fontconfig, so with nothing installed every glyph came out
     as a missing-glyph box: the piece rendered, the artwork was correct, and
     not one letter was readable (2026-07-30).

     THE HOUSE FACES NOW TRAVEL WITH THE FUNCTION (2026-08-02). Until today
     only Inter and Source Serif were bundled, so every other family fell back
     silently. A brand sheet saying "IBM Plex Mono for display, Public Sans
     for body", as the Gauntlet piece did, named typefaces the piece was not
     actually set in: the sheet said one thing and the render did another.

     Yuki's own portfolio is the source of truth for the house system:
     Spectral for display, Public Sans for body, IBM Plex Mono for data
     readouts only. All three are here now, so a piece is set in them rather
     than approximately.

     Licences, all permitting bundling and redistribution:
       Inter, Source Serif Pro, Spectral, IBM Plex Mono, Public Sans
       SIL Open Font License 1.1

     FONTCONFIG_PATH is pointed at this directory by _design-render.js before
     sharp is loaded, which is the only moment it can be set. -->
<fontconfig>
  <dir>/var/task/netlify/functions/fonts</dir>
  <dir>/var/task/fonts</dir>
  <dir prefix="cwd">netlify/functions/fonts</dir>
  <dir prefix="cwd">fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>

  <!-- Generic families must resolve, since every font-family in a generated
       SVG is rewritten to end in one of these. The house faces lead now, with
       the originals kept as second choice so a missing file degrades rather
       than fails. -->
  <alias><family>sans-serif</family><prefer><family>Public Sans</family><family>Inter</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Spectral</family><family>Source Serif Pro</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>IBM Plex Mono</family><family>Inter</family></prefer></alias>

  <!-- Names a model reaches for, mapped to what we actually have, so a
       generated SVG asking for Helvetica gets the house sans rather than a
       fallback nobody chose. -->
  <alias><family>Helvetica</family><prefer><family>Public Sans</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Public Sans</family></prefer></alias>
  <alias><family>Georgia</family><prefer><family>Spectral</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Spectral</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>IBM Plex Mono</family></prefer></alias>
  <alias><family>DejaVu Sans</family><prefer><family>Public Sans</family></prefer></alias>
  <alias><family>DejaVu Serif</family><prefer><family>Spectral</family></prefer></alias>
  <alias><family>DejaVu Sans Mono</family><prefer><family>IBM Plex Mono</family></prefer></alias>
</fontconfig>
