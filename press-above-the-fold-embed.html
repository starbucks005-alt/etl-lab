<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Above the Fold | ETL Newswire</title>
<meta name="description" content="Above the Fold - the daily multi-voice audio briefing from ETL Newswire. Marcus Reyes anchors; each reporter speaks their own story.">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/etl-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Cormorant Garamond',Georgia,serif;background:#f4ebd6;color:#0e0c08;display:flex;align-items:center;justify-content:center;padding:14px 18px;}
  .embed-card{width:100%;max-width:680px;background:#f4ebd6;border:1px solid #b8922a;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;}
  @media (max-width:520px){.embed-card{grid-template-columns:1fr;}}
  .embed-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#8a6a1c;margin-bottom:4px;}
  .embed-eyebrow a{color:#8a6a1c;text-decoration:underline;}
  .embed-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;line-height:1.15;color:#0e0c08;margin-bottom:2px;}
  .embed-sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:#5a5240;font-size:13px;}
  .embed-audio audio{width:300px;max-width:100%;height:36px;}
  .embed-pending{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#5a5240;text-align:center;padding:18px 8px;}
  .credit{position:fixed;right:8px;bottom:6px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#a89c88;}
  .credit a{color:#a89c88;text-decoration:none;border-bottom:1px solid rgba(168,156,136,0.4);}
</style>
</head>
<body>
<section class="embed-card" id="embed-card" aria-label="Above the Fold audio briefing">
  <div>
    <div class="embed-eyebrow">Above the Fold &middot; <a href="https://emerging-tech-lab.com/press" target="_blank" rel="noopener">ETL Newswire</a></div>
    <div class="embed-title">Today's top stories, above the fold.</div>
    <div class="embed-sub" id="embed-sub">Loading the briefing...</div>
  </div>
  <div class="embed-audio">
    <audio id="embed-audio" controls preload="none"></audio>
  </div>
</section>
<div class="credit"><a href="https://emerging-tech-lab.com/press" target="_blank" rel="noopener">emerging-tech-lab.com/press</a></div>
<script>
(function(){
  fetch('https://emerging-tech-lab.com/.netlify/functions/newswire-briefing-latest', { credentials: 'omit' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(meta){
      var sub = document.getElementById('embed-sub');
      var audio = document.getElementById('embed-audio');
      if (!meta || !meta.available || !meta.audio_url) {
        if (sub) sub.textContent = 'Briefing is currently being prepared. Check back shortly.';
        if (audio) audio.style.display = 'none';
        return;
      }
      audio.src = 'https://emerging-tech-lab.com' + meta.audio_url;
      if (meta.generated_at) {
        try {
          var dt = new Date(meta.generated_at);
          sub.textContent = 'Recorded ' + dt.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'}) + ' at ' + dt.toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'});
        } catch(_) { sub.textContent = ''; }
      }
    })
    .catch(function(){ var sub = document.getElementById('embed-sub'); if (sub) sub.textContent = 'Unable to load the briefing right now.'; });
})();
</script>
</body>
</html>
