<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Table · Emerging Technologies Laboratory</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,300&family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/table.css">
</head>
<body data-page="table">
<div class="topbar"><div class="wrap">
  <a href="https://emerging-tech-lab.com">Emerging Technologies Laboratory</a>
  <a href="index.html"><svg class="mark" width="18" height="18" viewBox="0 0 64 64" aria-hidden="true"><rect class="b" x="6" y="42" width="36" height="11"/><rect class="b" x="14" y="26" width="36" height="11"/><rect class="t" x="22" y="10" width="36" height="11"/></svg><span data-site-title>THE TABLE</span></a>
  <a href="board.html">The board</a>
</div></div>

<main class="wrap">
  <p class="eyebrow" style="margin-top:28px">Tonight's topic</p>
  <h1 id="topicName"></h1>
  <div class="card-note" id="openingCard"></div>

  <!-- The frame. The tag sits in the bar BELOW it, never over it. -->
  <div class="stage" id="stage"></div>
  <div class="lowerthird">
    <span class="host" id="lowerThirdHost"></span>
    <span id="lowerThirdTag"></span>
  </div>

  <p class="status" id="seatCount"></p>
  <p><a class="btn" id="beginBtn" href="#" aria-disabled="true">Begin round</a></p>

  <div class="picker">
    <h2>Who sits at the table</h2>
    <div id="chips"></div>
  </div>

  <h2>The round</h2>
  <ol class="segments" id="segments"></ol>

  <p id="loadError" class="status" hidden></p>
</main>

<footer><div class="wrap">Emerging Technologies Laboratory</div></footer>
<script src="js/table.js"></script>
</body>
</html>
